# VERIFICHE AUTOMATICHE — partono a ogni push e a ogni pull request su GitHub (scheda «Actions» del repo).
# Se qualcosa si rompe, GitHub segna il commit con una X rossa e manda una mail.
# Il gioco non cambia: questi strumenti servono solo a controllarlo.
name: Verifiche
on:
  push:
    branches: [main]   # su main a ogni push; sugli altri rami bastano le pull request (niente doppioni)
  pull_request:
  workflow_dispatch:   # pulsante «Run workflow» per lanciarle a mano

concurrency:           # un nuovo push annulla il giro ancora in corso sullo stesso ramo
  group: verifiche-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regole-e-coerenza:
    name: Regole, lint e coerenza
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:regole
      - run: npm run lint
      - run: npm run coerenza

  browser:
    name: Browser (fumo, bilanciamento, Sciamano, combattimento)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Server locale
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      # ogni caso fallito diventa un'annotazione rossa nella pagina del giro (si legge senza aprire il registro)
      - name: Test nel browser
        run: |
          esito=0
          prova() { "$@" 2>&1 | tee out.txt; r=${PIPESTATUS[0]}
            awk '/^(ERRORE|KO) /{n=$0; getline m; gsub(/^ +/, "", m); print "::error title=" FILENAME_T "::" n " " m}' FILENAME_T="$*" out.txt
            [ $r -eq 0 ] || esito=1; }
          prova node tests/fumo.browser.js
          prova node tests/bilanciamento.browser.js
          prova node tests/sciamano.browser.js
          for p in 1/3 2/3 3/3; do PARTE=$p prova node tests/combattimento.browser.js; done
          exit $esito
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report-fumo, path: tests/fumo_report.json }

  firestore:
    name: Regole di sicurezza Firestore (emulatore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:firestore
