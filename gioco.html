      tocca: "tocc\\w*|sfior\\w*|accarezz\\w*|tast\\w*|palp\\w*|touch\\w*|stroke\\w*|feel\\w*|caress\\w*",
      prendi: "prend\\w*|raccogl\\w*|afferr\\w*|sfil\\w*|estra\\w*|agguant\\w*|stacc\\w*|rub\\w*|take|takes|taking|took|grab\\w*|pick\\w*|seiz\\w*|steal\\w*|draw\\w*|pull\\w*",
      usa: "uso|usa|usare|usiamo|utilizz\\w*|equipagg\\w*|impugn\\w*|brandisc\\w*|sguain\\w*|imbracc\\w*|indoss\\w*|accend\\w*|bev\\w*|mangi\\w*|consum\\w*|applic\\w*|leggo|leggi|leggere|rileggo|use|uses|using|equip|equips|equipping|wield\\w*|brandish\\w*|light|lights|lighting|drink\\w*|eat|eats|eating|apply|read|reads|reading|reread|hold|holds|holding|wear\\w*|strap\\w*",
      riponi: "ripon\\w*|ripong\\w*|rinfoder\\w*|rimett\\w*|disequip\\w*|tolgo|togli\\w*|unequip\\w*|sheath\\w*|stow\\w*|put away|put down|put back|remove\\w*|take off",
      ascolta: "ascolt\\w*|origli\\w*|orecchi\\w*|listen\\w*|hear\\w*|eavesdrop\\w*"
    };
    const RE_VERBI = Object.fromEntries(Object.entries(VERBI).map(([k, v]) => [k, new RegExp("\\b(" + v + ")\\b")]));
    const ha = (t, gruppo) => RE_VERBI[gruppo].test(t);
    const parole = (t) => t.split(/\s+/).filter(Boolean).length;

    function interpreta(t) { /* atrio */
      const sx = /sinistr|\bsx\b|\bleft\b/.test(t), dx = /destr|\bdx\b|\bright\b/.test(t);
      const lato = sx !== dx; /* indicato un solo lato */
      const guarda = ha(t, "guarda"), muovi = ha(t, "muovi"), sali = ha(t, "sali"), tocca = ha(t, "tocca"), prendi = ha(t, "prendi"), ascolta = ha(t, "ascolta");
      const porta = /\bport[ae]\b|\bdoors?\b|\buscio\b|battent/.test(t);
      const spada = /\bspad\w*|\bswords?\b|\blama\b|\bblade\b/.test(t);
      const armatura = /armatur|corazz|\barmou?rs?\b/.test(t);
      const statua = /cavalier|\bknight\b|statu/.test(t);
      const scale = /\bscal[ae]\b|scalinat|gradin|\bstair\w*|\bsteps?\b/.test(t);
      const sopra = /\bdi sopra\b|\bsu\b|piano superiore|pianerottol|\bupstairs\b|\blanding\b|\bcima\b|\btop\b|\bup\b/.test(t);

      if (/caccia|hunt/.test(t)) return muovi && !guarda ? "entra_sx" : (guarda || ascolta ? "porta_sx" : null);
      if (/conversazion|drawing|sitting|parlou?r/.test(t)) return muovi && !guarda ? "entra_dx" : (guarda || ascolta ? "porta_dx" : null);
      if (/pranzo|dining/.test(t)) return "pranzo_lontano";
      if (porta && muovi && !guarda && !ascolta) return lato ? (sx ? "entra_sx" : "entra_dx") : "porta?";
      if (spada && prendi) return "spada";
      if ((armatura || statua) && lato) return sx ? "armatura_sx" : "armatura_dx";
      /* salire: verbo di salita, oppure muoversi verso scale/pianerottolo/armatura, oppure toccare l'armatura o la spada */
      if (sali || (muovi && (scale || sopra || armatura || statua || spada)) || (tocca && (armatura || statua || spada))) return "scale";
      if (scale) return "scale_guarda"; /* guardare le scale dal basso */
      if (/arazz|tapestr|drapp|\bhanging/.test(t)) return lato ? (sx ? "arazzo_sx" : "arazzo_dx") : "arazzo?";
      if (/soffitt|affresc|angel|ceiling|fresco|alzo (lo sguardo|gli occhi)|\blook up\b/.test(t)) return "soffitto";
      if (porta) return lato ? (sx ? "porta_sx" : "porta_dx") : "porta?";
      if (statua || spada || sopra || /vetrat|padron|guanti|sovran|stained|window|glass|\bmaster\b|gauntlet|sovereign|\bking\b/.test(t)) return "armatura";
      if (armatura) return "armatura?";
      if (/fiacc|fiamm|torch|sconce|flame/.test(t)) return "fiaccole";
      if (/tappet|pavimento|marmo|carpet|\brugs?\b|floor|marble/.test(t)) return "tappeto";
      if (/\b(stanza|sala|atrio|ambiente|intorno|paraggi|piano|cerco|controllo|ispeziono|esploro|room|hall|around|surroundings|explore|search\w*|atrium|foyer|entrance)\b|mi guardo|colonn|column|pillar/.test(t)) return "stanza";
      if (guarda && parole(t) <= 2) return "stanza";
      return null;
    }

    /* Fuori dall'atrio */
    function interpretaAltrove(t) {
      const guarda = ha(t, "guarda"), muovi = ha(t, "muovi");
      const torna = /\b(torn\w*|esc\w*|ritorn\w*|indietro|back|return\w*|leave|exit\w*|out)\b/.test(t);
      const atrio = /atrio|atrium|entrance|foyer|\bhall\b/.test(t) && !/dining|hunting|drawing|sitting|pranzo|caccia|conversazion/.test(t);
      if (luogo === "sala_conversazione") {
        if (/giocattol|figurin|\bomin|soldatin|\btoys?\b|figurine/.test(t)) return "giocattoli";
        const pranzo = /pranzo|dining|doppio battente|double doors?/.test(t);
        if (!muovi && (ha(t, "ascolta") || /rumor|suon|silenzi|\bsent[oi]\b|noise|sound|silence/.test(t))) return "ascolto";
        if ((pranzo || /\bport\w*|\bdoors?\b|destr|\bright\b/.test(t)) && muovi && !guarda && !torna && !atrio) return "entra_pranzo";
        if (pranzo && !torna) return "pranzo_guarda";
        if (/tavol|\btables?\b/.test(t)) return "tavolino";
        if (/divan|poltron|sofa|couch|settee|armchair/.test(t)) return "divani";
        if (/finestr|davanzal|giardin|fontan|lun[ae]\b|window|sill|garden|fountain|moons?\b/.test(t)) return "finestre";
        if (/camin|fuoco|brace|braci|legna|scald|fireplace|\bfire\b|hearth|ember|warm/.test(t)) return "camino";
      }
      if (luogo === "sala_pranzo" && atrio) return "atrio_lontano";
      if (torna || atrio) return "torna";
      if (/\b(stanza|sala|ambiente|intorno|paraggi|cerco|controllo|ispeziono|esploro|room|around|surroundings|explore|search\w*)\b|mi guardo/.test(t)) return "stanza_corrente";
      if (guarda && parole(t) <= 2) return "stanza_corrente";
      return null;
    }

    /* =====================================================================
       PERSONAGGIO
       ===================================================================== */
    let pg = null;
    try { pg = JSON.parse(localStorage.getItem("personaggio")); } catch (e) {}
    if (!pg || !pg.classe) { pg = null; window.location.replace("index.html"); }
    else if (!pg.equipaggiamento) { pg = null; window.location.replace("index.html"); }

    const fmtN = (n) => (n < 0 ? "−" : "+") + Math.abs(n);
    const mod = (v) => Math.floor((Number(v) - 10) / 2);
    const spirito = () => Number(pg.statistiche && pg.statistiche.Spirito) || 0;
    /* Tutte le abilità: quelle scelte in creazione aggiungono il livello al modificatore dell'attributo */
    const ABILITA_TUTTE = [["Atletica", "Lotta"], ["Furtività", "Agilità"], ["Acrobazia", "Agilità"], ["Indagare", "Mente"], ["Medicina", "Mente"], ["Arcano", "Mente"], ["Misticismo", "Mente"], ["Percezione", "Corpo"], ["Persuasione", "Carisma"], ["Intimidire", "Carisma"]];
    let scudo = null; /* lo scudo imbracciato (null se non c'è o è nello zaino) */
    const eqPg = () => (pg && pg.equipaggiamento) || {};
    /* malus alle abilità di Agilità: armatura + scudo, solo se imbracciato */
    const malusArmatura = () => (Number(eqPg().malusAgilita) || 0) + (scudo ? Number(scudo.malus) || 0 : 0);
    /* classe armatura: quella salvata comprende lo scudo scelto in creazione; qui conta solo se è imbracciato */
    const caAttuale = () => {
      if (pg.classeArmatura == null) return "—";
      const base = Number(pg.classeArmatura) - (eqPg().scudo ? Number(eqPg().scudo.ca) || 0 : 0);
      return base + (scudo ? Number(scudo.ca) || 0 : 0);
    };
    const addestrata = (n) => (pg.abilita || []).some(a => a.nome === n);
    const valoreAbilita = (n) => {
      const attr = (ABILITA_TUTTE.find(x => x[0] === n) || [])[1];
      const base = attr ? mod(Number(pg.statistiche && pg.statistiche[attr]) || 10) : 0;
      return base - (attr === "Agilità" ? malusArmatura() : 0) + (addestrata(n) ? (Number(pg.livello) || 1) : 0);
    };
    const maxMentali = () => (pg.saluteMentale != null ? Number(pg.saluteMentale) : 10 + mod(spirito()));

    let usate = (salvata && salvata.usate && typeof salvata.usate === "object" && !Array.isArray(salvata.usate)) ? salvata.usate : {};
    if (pg) pg.dannoFisico = salvata ? (Number(salvata.dannoFisico) || 0) : 0;
    if (pg) pg.dannoMentale = salvata ? (Number(salvata.dannoMentale) || 0) : 0; /* i danni mentali fanno parte della partita, non del personaggio */
    const salvaUsate = () => modificato();
    const salvaPg = () => modificato();

    /* Arma in uso, scudo e zaino fanno parte della partita (la dotazione del personaggio parte nello zaino) */
    let arma = { nome: "—" }, zaino = [], mano = null; /* mano = oggetto tenuto nella mano libera (es. la torcia) */
    if (pg) {
      const eqIniz = eqPg();
      arma = (salvata && salvata.arma && typeof salvata.arma === "object" && salvata.arma.nome) ? salvata.arma : { nome: eqIniz.arma || "—", danno: eqIniz.armaDanno, tipoDanno: eqIniz.armaTipoDanno, mani: eqIniz.armaMani };
      if (salvata && Array.isArray(salvata.zaino)) zaino = salvata.zaino;
      else {
        zaino = (eqIniz.dotazione || []).map((d, i) => {
          const o = typeof d === "string" ? { nome: d } : d;
          return { id: "dot" + i, nome: o.nome, tipo: "dotazione", usi: Number(o.usi) > 0 ? Number(o.usi) : null, testo: o.desc, impugnabile: !!o.impugnabile };
        });
        if (usate.arazzo_sx === "ok") zaino.push({ id: "arazzo_sx", nome: "Foglietto di Adele", tipo: "nota", testo: TX.foglietto });
      }
      if (arma.danno == null && arma.nome === eqIniz.arma && eqIniz.armaDanno) arma.danno = eqIniz.armaDanno;
      if (arma.mani == null && arma.nome === eqIniz.arma && eqIniz.armaMani) { arma.mani = eqIniz.armaMani; arma.tipoDanno = eqIniz.armaTipoDanno; }
      if (salvata && salvata.mano && typeof salvata.mano === "object" && salvata.mano.nome) mano = salvata.mano;
      if (salvata && "scudo" in salvata) scudo = (salvata.scudo && typeof salvata.scudo === "object") ? salvata.scudo : null;
      else if (eqIniz.scudo) scudo = { id: "scudo", tipo: "scudo", nome: eqIniz.scudo.nome || "Scudo", ca: Number(eqIniz.scudo.ca) || 1, malus: Number(eqIniz.scudo.malus) || 0 };
    }

    /* ---------- Nomi e descrizioni degli oggetti nella lingua scelta ---------- */
    const nomeOg = (o) => { const n = (o.id === "giocattoli" ? TX.giocattoli.nome : N("oggetti", o.nome)); return o.bonus ? `${n} (+${o.bonus})` : n; };
    const testoOggetto = (it) => (it.id === "arazzo_sx" ? TX.foglietto : it.id === "giocattoli" ? TX.giocattoli.desc : (Lingua.desc(it.nome) || it.testo));
    const maniArma = (o) => Number(o && o.mani) || 1;
    const dettaglioArma = (o) => [o && o.tipoDanno ? N("danni", o.tipoDanno) : null, o && o.mani ? U.mani(maniArma(o)) : null].filter(Boolean).join(" · ");
    const testoDanno = (o) => {
      if (!o || !o.danno) return null;
      const m = mod(Number(pg.statistiche && pg.statistiche.Lotta) || 10);
      return `${o.danno} + ${U.modLotta} (${m < 0 ? "−" : "+"}${Math.abs(m)})`;
    };
    const infoScudo = (s) => [U.caBonus(Number(s.ca) || 0), Number(s.malus) ? U.malusAg(Number(s.malus)) : U.noMalus].join(" · ");

    function riga(dl, k, v, chiave) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      if (chiave) dd.dataset.k = chiave;
      dl.append(dt, dd);
    }

    function disegnaScheda() {
      document.getElementById("nome").textContent = pg.nome || "";
      document.getElementById("sub").textContent = [pg.razza && N("razze", pg.razza), `${N("classi", pg.classe)}${pg.livello ? ", " + U.livello + " " + pg.livello : ""}`].filter(Boolean).join(" — ");
      if (pg.immagine) {
        const r = document.getElementById("ritratto");
        r.style.backgroundImage = `url("${String(pg.immagine).replace(/^immagini\/(?!pg\/)/, "immagini/pg/").replace(/"/g, "%22")}")`; /* i vecchi salvataggi puntavano a immagini/, ora i ritratti stanno in immagini/pg/ */
        r.hidden = false;
      }
      disegnaVitali();
      const st = document.getElementById("stat");
      st.replaceChildren();
      for (const [k, v] of Object.entries(pg.statistiche || {})) riga(st, N("attributi", k), `${Number(v)} (${fmtN(mod(v))})`);
      disegnaAbilita();
      disegnaEquip();
      aggiornaZaino();
    }

    function disegnaVitali() {
      const vit = document.getElementById("vitali");
      vit.replaceChildren();
      riga(vit, U.puntiSalute, testoSalute(), "salute");
      riga(vit, U.puntiMentali, testoMentali(), "mentali");
      riga(vit, U.classeArmatura, String(caAttuale()));
    }

    function disegnaAbilita() {
      const ab = document.getElementById("abil");
      ab.replaceChildren();
      const malus = malusArmatura();
      ABILITA_TUTTE.forEach(([nome, attr]) => {
        const dt = document.createElement("dt"); dt.textContent = N("abilita", nome);
        if (addestrata(nome)) { dt.className = "addestrata"; dt.title = U.abilScelta; }
        const dd = document.createElement("dd"); dd.textContent = fmtN(valoreAbilita(nome));
        if (attr === "Agilità" && malus > 0) {
          const sm = document.createElement("small"); sm.className = "malus"; sm.textContent = U.malusEquip(malus);
          sm.title = U.malusTitle;
          dd.append(sm);
        }
        ab.append(dt, dd);
      });
    }

    function testoSalute() {
      const v = pg.puntiVita ?? pg.saluteFisica;
      if (v == null) return "—";
      return `${Math.max(0, Number(v) - (pg.dannoFisico || 0))} / ${Number(v)}`;
    }
    function testoMentali() {
      const max = maxMentali();
      return `${Math.max(0, max - (pg.dannoMentale || 0))} / ${max}`;
    }
    function aggiornaMentali() {
      const dd = document.querySelector('#vitali dd[data-k="mentali"]');
      if (dd) dd.textContent = testoMentali();
    }

    /* ---------- Diario ---------- */
    const elDiario = document.getElementById("diario");
    let diario = (salvata && Array.isArray(salvata.diario)) ? salvata.diario : [];

    (function assegnaStanze() { /* salvataggi vecchi: le voci senza stanza vengono attribuite in base ai titoli (in entrambe le lingue) */
      let corrente = "atrio";
      const titoloDi = (tit) => Object.keys(IMMAGINI).find(x => tit && (tit === TESTI.it.viste[x].titolo || tit === TESTI.en.viste[x].titolo));
      diario.forEach(e => {
        if (!e.stanza) {
          const k = titoloDi(e.titolo) || (e.img && e.img.src === "atrio.webp" ? "atrio" : null);
          if (k) corrente = k;
          e.stanza = corrente;
        } else corrente = e.stanza;
      });
    })();

    /* Mostra solo il diario della stanza in cui ci si trova; quello delle altre stanze resta salvato e riappare al ritorno */
    function mostraStanza(id) {
      elDiario.replaceChildren();
      gruppo = null; tendinaAperta = null;
      ridisegno = true;
      try { diario.filter(e => e.stanza === id).forEach(disegna); } finally { ridisegno = false; }
      elDiario.scrollTop = 0; /* si parte dalla testa della pagina */
    }

    let ridisegno = false; /* durante il ridisegno della stanza niente scorrimento automatico */
    let gruppo = null, tendinaAperta = null; /* ogni azione del giocatore è una tendina che contiene ciò che è successo */
    function disegna(v) {
      if (v.tipo === "giocatore") {
        if (tendinaAperta) tendinaAperta.open = false; /* le azioni precedenti si richiudono */
        const det = document.createElement("details");
        det.className = "voce giocatore"; det.open = true;
        const sm = document.createElement("summary"); sm.textContent = (v.righe || []).join(" ");
        const corpo = document.createElement("div"); corpo.className = "corpo";
        det.append(sm, corpo); elDiario.append(det);
        gruppo = corpo; tendinaAperta = det;
        if (!ridisegno) det.scrollIntoView({ block: "nearest" });
        return;
      }
      const el = document.createElement("div");
      el.className = "voce " + (v.tipo || "narra") + (v.box ? " riquadro " + v.box : "");
      if (v.img && v.img.src === "atrio.webp") { v = { ...v, img: { ...v.img, src: IMMAGINI.atrio }, titolo: v.titolo || TX.viste.atrio.titolo }; } /* vecchi salvataggi */
      if (v.img && IMMAGINI[v.stanza] && v.img.src !== IMMAGINI[v.stanza]) v = { ...v, img: { ...v.img, src: IMMAGINI[v.stanza] } }; /* salvataggi con il vecchio percorso immagini/ */
      if (v.titolo && v.tipo !== "prova") {
        const h = document.createElement("h2"); h.className = "luogo"; h.textContent = v.titolo; el.append(h);
      }
      if (v.img) {
        const img = document.createElement("img");
        const dim = DIM_IMMAGINI[v.stanza] || [1536, 1024];
        img.className = "scena"; img.src = v.img.src; img.alt = v.img.alt; img.width = dim[0]; img.height = dim[1];
        img.addEventListener("error", () => img.remove()); /* immagine non ancora caricata: niente icona rotta */
        el.append(img);
      }
      const p = (t, c) => { const e = document.createElement("p"); e.textContent = t; if (c) e.className = c; el.append(e); };
      if (v.tipo === "prova") {
        p(v.titolo, "prova-titolo");
        if (v.azione) p(v.azione, "prova-azione");
        const dati = document.createElement("div"); dati.className = "prova-dati";
        (v.dati || []).forEach(d => { const sp = document.createElement("span"); sp.textContent = d; dati.append(sp); });
        el.append(dati);
      }
      if (v.esito) p(v.esito, "esito-prova");
      (v.righe || []).forEach(t => p(t, (t.startsWith("«") || t.startsWith("“")) ? "lettera" : ""));
      if (v.banner) p(v.banner, "banner");
      if (v.nota) p(v.nota, "nota");
      (v.fuori ? elDiario : (gruppo || elDiario)).append(el); /* i messaggi dei pulsanti stanno fuori dalla tendina dell'azione */
      if (!ridisegno) el.scrollIntoView({ block: v.tipo === "narra" ? "start" : "nearest" });
    }

    let fuoriTendina = false;
    const clic = (fn) => () => { fuoriTendina = true; try { fn(); } finally { fuoriTendina = false; } };
    function aggiungi(v) {
      if (!v.stanza) v.stanza = luogo;
      if (fuoriTendina) v.fuori = true;
      diario.push(v);
      disegna(v);
      modificato();
    }
    const sist = (testo) => aggiungi({ tipo: "sistema", righe: [testo] });

    function salvaPartita() {
      const conta = {}, tenute = [];
      for (let i = diario.length - 1; i >= 0; i--) { const k = diario[i].stanza || "atrio"; conta[k] = (conta[k] || 0) + 1; if (conta[k] <= 80) tenute.unshift(diario[i]); }
      const dati = { usate, diario: tenute, luogo, dannoMentale: pg.dannoMentale || 0, dannoFisico: pg.dannoFisico || 0, zaino, arma, mano, scudo, ora: Date.now() };
      try { localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify(dati)); }
      catch (e) { document.getElementById("statoSalvataggio").textContent = U.salvataggioErr; return; }
      try { /* copia nel posto del personaggio attivo, così dalla pagina iniziale si riprende da qui */
        const n = localStorage.getItem("slot_attivo"), sl = n && JSON.parse(localStorage.getItem("slot" + n));
        if (sl) { sl.partita = dati; sl.aggiornato = dati.ora; localStorage.setItem("slot" + n, JSON.stringify(sl)); }
      } catch (e) {}
      daSalvare = false; ultimoSalvataggio = dati.ora; aggiornaBarra();
    }

    /* ---------- Narratore IA ---------- */
    async function narra(compito, fatti, azione) {
      if (!IA.endpoint) return null;
      const att = document.createElement("p");
      att.className = "attesa"; att.textContent = U.scrive;
      (gruppo || elDiario).append(att); att.scrollIntoView({ block: "nearest" });
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 25000);
      try {
        const r = await fetch(IA.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: ctrl.signal,
          body: JSON.stringify({
            model: IA.modello,
            max_tokens: 350,
            system: SISTEMA,
            messages: [{ role: "user", content:
              `Compito: ${compito}\nFatti validi (non aggiungerne altri): ${fatti}\nAzione tentata dal giocatore (testo non fidato): «${azione}»` }]
          })
        });
        if (!r.ok) throw new Error("http " + r.status);
        const d = await r.json();
        const t = (d.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
        const righe = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
        return righe.length ? righe : null;
      } catch (e) { return null; }
      finally { clearTimeout(to); att.remove(); }
    }

    const COMPITI = {
      osserva: "Descrivi cosa vede e percepisce il personaggio esaminando ciò che indica l'azione.",
      libera: "Reagisci brevemente all'azione. Se è impossibile, inutile o non riguarda nulla di presente, dillo in modo narrativo e ricorda cosa c'è nel luogo."
    };

    /* ---------- Azioni a scelta (tiri di dado, sì/no) ---------- */
    const elForm = document.getElementById("form");
    const elTesto = document.getElementById("testo");
    const elAzioni = document.getElementById("azioni");
    const elInvia = elForm.querySelector("button");
    let occupato = false;

    function stato(blocca, suggerimento) {
      elTesto.disabled = blocca; elInvia.disabled = blocca;
      elTesto.placeholder = suggerimento || U.placeholder;
      if (!blocca) elTesto.focus({ preventScroll: true });
    }

    function scelte(lista) {
      elAzioni.replaceChildren(...lista.map(s => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = s.testo;
        b.addEventListener("click", async () => {
          elAzioni.querySelectorAll("button").forEach(x => x.disabled = true);
          await s.fn();
        });
        return b;
      }));
      elAzioni.hidden = false;
      stato(true, U.scegliAzione);
    }
    function chiudiScelte() { elAzioni.replaceChildren(); elAzioni.hidden = true; stato(false); }

    const tira = (dado) => 1 + Math.floor(Math.random() * dado);

    /* ---------- Esplorazione ---------- */
    async function esamina(id) {
      const l = LUOGHI[id];
      if (l.prova && (id in usate)) {
        if (usate[id] === "ok") { aggiungi({ tipo: "narra", righe: [l.gia.ok] }); if (l.dopo === "giocattoli") offriGiocattoli(); return; }
        if (!l.riprova) { aggiungi({ tipo: "narra", righe: [l.gia.ko] }); return; }
      }
      const riprovando = !!(l.prova && l.riprova && usate[id] === "ko");
      const righe = riprovando ? l.ancora : (l.fisso || (await narra(COMPITI.osserva, l.fatti, ultimoTesto)) || l.fallback);
      if (righe && righe.length) aggiungi({ tipo: "narra", righe });
      if (l.prova) proponiProva(id, l);
    }

    function proponiProva(id, l) {
      const p = l.prova;
      let m = 0, nota = "", nome;
      if (p.attributo) {
        nome = N("attributi", p.attributo);
        m = mod(Number(pg.statistiche && pg.statistiche[p.attributo]) || 10);
      } else {
        nome = N("abilita", p.abilita);
        m = valoreAbilita(p.abilita);
        nota = addestrata(p.abilita) ? "" : U.nonAddestrata;
      }
      /* Riquadro che mostra al giocatore cosa sta facendo e come funziona la prova */
      aggiungi({ tipo: "prova", titolo: U.prova(nome), azione: l.azione || "", dati: [U.difficolta(p.cd), `d${p.dado}`, U.modificatore(fmtN(m))], righe: [U.istruzioni(p.dado, p.cd) + nota] });
      scelte([
        { testo: U.lancia(p.dado), fn: () => {
          const tiro = tira(p.dado), tot = tiro + m, ok = tot >= p.cd;
          const dopoFallimento = usate[id] === "ko";
          usate[id] = ok ? "ok" : "ko"; salvaUsate();
          chiudiScelte();
          const testoEsito = ok ? ((dopoFallimento && l.successoDopoFallimento) || l.successo) : l.fallimento;
          aggiungi({ tipo: "narra", box: ok ? "ok" : "ko", esito: U.esito(tiro, m, tot, p.cd, ok), righe: testoEsito });
          if (ok && l.apre) sist(l.apre);
          if (ok && l.zaino) {
            aggiungiZaino({ id: id, nome: l.zaino.nome, tipo: "nota", testo: TX.foglietto });
            sist(U.zainoAgg(N("oggetti", l.zaino.nome)));
          }
          if (ok && l.dopo === "giocattoli") offriGiocattoli();
          if (l.stanza) controllaDannoStanza(l.stanza);
        } },
        { testo: U.lasciaPerdere, fn: () => { chiudiScelte(); aggiungi({ tipo: "narra", righe: [l.lascia] }); } }
      ]);
    }

    /* Tutte le prove della stanza fallite: danni mentali (1d4), da tirare una sola volta */
    function controllaDannoStanza(stanzaId) {
      const cfg = DANNO_STANZA[stanzaId];
      if (!cfg || cfg.chiave in usate) return;
      if (!cfg.ids.every(i => usate[i] === "ko")) return;
      aggiungi({ tipo: "narra", righe: [U.dannoStanza(cfg.dado)] });
      scelte([{ testo: U.lancia(cfg.dado), fn: () => {
        const d = tira(cfg.dado);
        pg.dannoMentale = (pg.dannoMentale || 0) + d; salvaPg(); aggiornaMentali();
        usate[cfg.chiave] = "ok"; salvaUsate();
        chiudiScelte();
        aggiungi({ tipo: "narra", box: "ko", esito: U.dannoSubito(d), righe: [U.dannoStanzaEsito] });
      } }]);
    }

    /* =====================================================================
       ZAINO, EQUIPAGGIAMENTO E OGGETTI
       Mani: un'arma a due mani occupa entrambe le mani; lo scudo ne occupa una.
       Arma a due mani e scudo non vanno insieme; con lo scudo non si tiene la torcia.
       ===================================================================== */
    const impugnabile = (it) => !!(it && (it.impugnabile || it.nome === "Torcia"));
    const duemani = () => !!(arma && arma.nome !== "—" && maniArma(arma) === 2);
    const campiArma = (o) => ({ nome: o.nome, bonus: o.bonus || 0, alias: o.alias || [], desc: o.desc, danno: o.danno, tipoDanno: o.tipoDanno, mani: o.mani });
    const nuovoId = () => "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const aperti = new Set(); /* descrizioni aperte nello zaino: restano aperte quando la lista si ridisegna */

    /* Voce dell'equipaggiamento: il nome si apre e mostra le caratteristiche (niente descrizione) */
    function voceEquip(dl, etichetta, nome, sommario, chiave) {
      const dt = document.createElement("dt"); dt.textContent = etichetta;
      const dd = document.createElement("dd");
      if (!sommario || !sommario.length) { dd.textContent = nome; dl.append(dt, dd); return; }
      const k = "eq-" + chiave, aperto = aperti.has(k);
      const extra = document.createElement("dd"); extra.className = "extra"; extra.id = k; extra.hidden = !aperto;
      /* riquadro a scomparsa come nello zaino: una riga per attributo */
      const d = document.createElement("p"); d.className = "testo";
      [].concat(sommario).forEach((r, i) => { if (i) d.append(document.createElement("br")); d.append(r); });
      extra.append(d);
      const b = document.createElement("button");
      b.type = "button"; b.className = "nome-btn"; b.textContent = nome;
      b.setAttribute("aria-expanded", String(aperto)); b.setAttribute("aria-controls", k);
      b.addEventListener("click", () => {
        const apri = extra.hidden;
        extra.hidden = !apri;
        if (apri) aperti.add(k); else aperti.delete(k);
        b.setAttribute("aria-expanded", String(apri));
      });
      dd.append(b);
      dl.append(dt, dd, extra);
    }

    function disegnaEquip() {
      const dl = document.getElementById("equip");
      dl.replaceChildren();
      const eq = eqPg();
      const haArma = arma.nome !== "—";
      const dettArma = haArma ? [testoDanno(arma), arma.tipoDanno ? N("danni", arma.tipoDanno) : null, arma.mani ? U.mani(maniArma(arma)) : null].filter(Boolean) : [];
      /* 1. mano primaria: l'arma impugnata (dettagli a scomparsa) */
      voceEquip(dl, U.manoPrimaria, haArma ? nomeOg(arma) : "—", dettArma, "arma");
      /* 2. mano secondaria: arma a due mani, scudo o oggetto impugnato; vuota = trattino */
      if (duemani()) voceEquip(dl, U.manoSecondaria, "—"); /* l'arma a due mani è già in mano primaria */
      else if (scudo) voceEquip(dl, U.manoSecondaria, nomeOg(scudo), [U.caBonus(Number(scudo.ca) || 0), Number(scudo.malus) ? U.malusAg(Number(scudo.malus)) : U.noMalus], "scudo");
      else voceEquip(dl, U.manoSecondaria, mano ? nomeOg(mano) + (mano.usi != null ? ` ×${mano.usi}` : "") : "—", "", "mano");
      /* 3. armatura (dettagli a scomparsa) */
      const malus = Number(eq.malusAgilita) || 0;
      voceEquip(dl, U.armatura, eq.armatura ? N("oggetti", eq.armatura) : "—",
        eq.armatura ? [eq.armaturaCA != null ? U.caBonus(Number(eq.armaturaCA)) : null, malus > 0 ? U.malusAg(malus) : U.noMalus].filter(Boolean) : [], "armatura");
      const az = document.getElementById("equipAzioni");
      az.replaceChildren();
      const bott = (etichetta, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "mini"; b.textContent = etichetta; b.addEventListener("click", clic(fn)); az.append(b); };
      if (haArma) bott(U.riponiBtn(nomeOg(arma)), riponiArma);
      if (scudo) bott(U.riponiBtn(nomeOg(scudo)), riponiScudo);
      if (mano && mano.usi != null) bott(U.usaBtn(nomeOg(mano)), () => usa(mano.id));
      if (mano) bott(U.riponiBtn(nomeOg(mano)), riponi);
    }

    function aggiornaZaino() {
      const box = document.getElementById("zaino");
      box.replaceChildren();
      if (!zaino.length) {
        const p = document.createElement("p"); p.className = "vuoto"; p.textContent = U.zainoVuoto; box.append(p);
        return;
      }
      zaino.forEach(it => {
        const nome = nomeOg(it) + (it.usi != null ? ` ×${it.usi}` : "");
        const og = document.createElement("div"); og.className = "oggetto";
        const testa = document.createElement("div"); testa.className = "testa";
        const info = document.createElement("div");
        const armaOScudo = it.tipo === "arma" || it.tipo === "scudo";
        const descrizione = armaOScudo ? null : testoOggetto(it); /* armi e scudo: solo gli attributi */
        let testo = null;
        if (descrizione) { /* descrizione a scomparsa: si apre cliccando sul nome */
          const aperto = aperti.has(it.id);
          testo = document.createElement("p");
          testo.className = "testo" + (it.tipo === "nota" ? " lettera" : "");
          testo.id = "testo-" + it.id; testo.textContent = descrizione; testo.hidden = !aperto;
          const b = document.createElement("button");
          b.type = "button"; b.className = "nome-btn"; b.textContent = nome;
          b.setAttribute("aria-expanded", String(aperto)); b.setAttribute("aria-controls", testo.id);
          b.addEventListener("click", () => {
            const apri = testo.hidden;
            testo.hidden = !apri;
            if (apri) aperti.add(it.id); else aperti.delete(it.id);
            b.setAttribute("aria-expanded", String(apri));
          });
          info.append(b);
        } else {
          const n = document.createElement("div"); n.textContent = nome; info.append(n);
        }
        const riepilogo = it.tipo === "arma" ? [testoDanno(it), dettaglioArma(it)].filter(Boolean).join(" · ") : it.tipo === "scudo" ? infoScudo(it) : null;
        if (riepilogo) { const ds = document.createElement("div"); ds.className = "desc"; ds.textContent = riepilogo; info.append(ds); }
        testa.append(info);
        const az = document.createElement("div"); az.className = "azioni-og";
        const bottone = (etichetta, fn) => {
          const b = document.createElement("button"); b.type = "button"; b.className = "mini"; b.textContent = etichetta;
          b.addEventListener("click", fn); az.append(b);
        };
        if (it.tipo === "arma") bottone(U.equipaggia, clic(() => equipaggia(it.id)));
        else if (it.tipo === "scudo") bottone(U.equipaggia, clic(() => imbracciaScudo(it.id)));
        else if (impugnabile(it)) bottone(U.equipaggia, clic(() => impugna(it.id)));
        else if (it.usi != null) bottone(U.usa, clic(() => usa(it.id)));
        if (az.children.length) testa.append(az);
        og.append(testa);
        if (testo) og.append(testo);
        box.append(og);
      });
    }

    function aggiornaEquip() { disegnaVitali(); disegnaAbilita(); disegnaEquip(); aggiornaZaino(); }

    function aggiungiZaino(it) {
      if (!zaino.some(x => x.id === it.id)) zaino.push(it);
      aggiornaZaino(); modificato();
    }

    /* L'arma in uso viene sostituita; quella di prima torna nello zaino, così non si perde */
    /* Liberare le mani: ciò che le occupa torna nello zaino e il messaggio lo dice */
    function via_arma() { if (!arma || arma.nome === "—") return ""; const n = nomeOg(arma); zaino.push({ id: nuovoId(), ...campiArma(arma), tipo: "arma" }); arma = { nome: "—" }; return U.tornaZaino(n); }
    function via_scudo() { if (!scudo) return ""; const n = nomeOg(scudo); zaino.push(scudo); scudo = null; return U.tornaZaino(n); }
    function via_mano() { if (!mano) return ""; const n = nomeOg(mano); zaino.push(mano); mano = null; return U.tornaZaino(n); }
    /* per tenere qualcosa nella mano secondaria: via l'arma a due mani, lo scudo e l'oggetto già impugnato */
    function liberaSecondaria() { return (duemani() ? via_arma() : "") + via_scudo() + via_mano(); }

    /* L'arma in uso viene sostituita; quella di prima torna nello zaino, così non si perde */
    function equipaggia(id) {
      const i = zaino.findIndex(x => x.id === id);
      if (i < 0) return;
      const nuova = zaino.splice(i, 1)[0];
      let extra = via_arma();
      if (maniArma(nuova) === 2) extra += via_scudo() + via_mano(); /* l'arma a due mani occupa anche la mano secondaria */
      arma = campiArma(nuova);
      let msg = U.equipaggi(nomeOg(arma));
      if (maniArma(arma) === 2) msg += U.notaDueMani;
      aggiornaEquip();
      sist(msg + extra);
    }

    function riponiArma() {
      if (!arma || arma.nome === "—") return;
      const n = nomeOg(arma);
      zaino.push({ id: nuovoId(), ...campiArma(arma), tipo: "arma" });
      arma = { nome: "—" };
      aggiornaEquip();
      sist(U.riponiArma(n));
    }

    /* Scudo: va nella mano secondaria */
    function imbracciaScudo(id) {
      const it = zaino.find(x => x.id === id);
      if (!it) return;
      zaino = zaino.filter(x => x !== it);
      const extra = liberaSecondaria();
      scudo = it;
      aggiornaEquip();
      sist(U.imbracci(nomeOg(it)) + extra);
    }

    function riponiScudo() {
      if (!scudo) return;
      const n = nomeOg(scudo);
      zaino.push(scudo); scudo = null;
      aggiornaEquip();
      sist(U.riponiScudo(n));
    }

    /* Oggetti da tenere in mano (la torcia): vanno nella mano secondaria */
    function impugna(id) {
      const it = zaino.find(x => x.id === id);
      if (!it) return;
      zaino = zaino.filter(x => x !== it);
      const extra = liberaSecondaria();
      mano = it;
      aggiornaEquip();
      sist(U.equipaggi(nomeOg(it)) + extra);
    }

    function riponi() {
      if (!mano) return;
      const n = nomeOg(mano);
      zaino.push(mano); mano = null;
      aggiornaEquip();
      sist(U.riponi(n));
    }

    function usa(id) {
      let inMano = !!(mano && mano.id === id);
      const it = inMano ? mano : zaino.find(x => x.id === id);
      if (!it || it.usi == null) return;
      let pre = "";
      if (impugnabile(it) && !inMano) { /* va prima in mano secondaria, poi si usa: tutto in un'azione */
        zaino = zaino.filter(x => x !== it);
        pre = U.equipaggi(nomeOg(it)) + liberaSecondaria() + " ";
        mano = it; inMano = true;
      }
      it.usi -= 1;
      let msg = pre + U.usi(nomeOg(it), it.usi);
      if (it.usi <= 0) {
        if (inMano) mano = null; else zaino = zaino.filter(x => x !== it);
        msg = pre + U.esaurito(nomeOg(it), inMano);
      }
      aggiornaEquip();
      sist(msg);
    }

    /* "Usa" ed "equipaggia" portano alla stessa azione: quella giusta per l'oggetto.
       soloPrendere: il giocatore ha scritto "prendo"/"afferro", quindi niente consumo di utilizzi. */
    function azioneOggetto(it, soloPrendere) {
      if (it === scudo) return sist(U.giaScudo(nomeOg(it)));
      if (it.tipo === "arma") return equipaggia(it.id);
      if (it.tipo === "scudo") return imbracciaScudo(it.id);
      if (impugnabile(it) && it !== mano) return (soloPrendere || it.usi == null) ? impugna(it.id) : usa(it.id);
      if (it === mano && soloPrendere) return sist(U.giaInMano(nomeOg(it)));
      if (it.usi != null) return usa(it.id);
      if (it.tipo === "nota") return aggiungi({ tipo: "narra", righe: [U.rileggi(nomeOg(it)), testoOggetto(it)] });
      return aggiungi({ tipo: "narra", righe: [U.nienteDaFare(nomeOg(it))] });
    }

    /* Riconoscimento di un oggetto nel testo del giocatore (prime 4 lettere di ogni parola del nome, in entrambe le lingue) */
    const ESCLUSE = ["della", "delle", "dello", "degli", "fire", "fuoc", "with"]; /* radici troppo generiche: "accendo il fuoco" non è l'ampolla */
    const radici = (it) => [...Lingua.nomi(it.nome), ...(it.alias || [])].flatMap(s => norm(s).split(/[^a-z0-9]+/))
      .filter(w => w.length >= 4).map(w => w.slice(0, 4)).filter(r => !ESCLUSE.includes(r));
    const citato = (it, t) => radici(it).some(r => new RegExp("\\b" + r).test(t));
    const trovaOggetti = (t, filtro) => [...zaino, ...(mano ? [mano] : []), ...(scudo ? [scudo] : [])].filter(it => filtro(it) && citato(it, t));

    /* ---------- I giocattoli di legno (sala da conversazione, dopo la prova di Indagare) ---------- */
    const GIOCATTOLI = TX.giocattoli;
    function offriGiocattoli() {
      if (usate.giocattoli === "presi") return;
      aggiungi({ tipo: "narra", righe: [GIOCATTOLI.domanda] });
      scelte([
        { testo: GIOCATTOLI.si_btn, fn: () => {
          usate.giocattoli = "presi"; salvaUsate(); chiudiScelte();
          aggiungi({ tipo: "narra", righe: GIOCATTOLI.presi });
          aggiungiZaino({ id: "giocattoli", nome: "Giocattoli di legno", tipo: "oggetto", testo: GIOCATTOLI.desc, alias: ["giocattoli", "figurine", "toys"] });
          sist(U.zainoAgg(GIOCATTOLI.nome));
        } },
        { testo: GIOCATTOLI.no_btn, fn: () => { usate.giocattoli = "lasciati"; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", righe: GIOCATTOLI.lasciati }); } }
      ]);
    }
    /* «prendo i giocattoli»: possibile solo dopo averli trovati, anche se prima si era detto di no */
    function giocattoli() {
      if (usate.giocattoli === "presi") return aggiungi({ tipo: "narra", righe: [GIOCATTOLI.giaPresi] });
      if (usate.conv_indagare === "ok") return offriGiocattoli();
      aggiungi({ tipo: "narra", righe: [GIOCATTOLI.nonVisti] });
    }

    /* ---------- Il tesoro: la spada ---------- */
    const SPADA = { ...TX.spada, oggetto: { id: "retaggio", nome: "Retaggio del Padrone", tipo: "arma", alias: ["spada", "sword", "lama", "blade"], desc: "Spada magica", danno: "1d10", tipoDanno: "Tagliente", mani: 1 } };

    function offriSpada() {
      aggiungi({ tipo: "narra", righe: SPADA.offerta });
      scelte([
        { testo: SPADA.si_btn, fn: () => {
          usate.spada = "presa"; salvaUsate(); chiudiScelte();
          aggiungi({ tipo: "narra", righe: SPADA.presa });
          aggiungiZaino({ ...SPADA.oggetto });
          sist(U.zainoSpada(nomeOg(SPADA.oggetto)));
        } },
        { testo: SPADA.no_btn, fn: () => { usate.spada = "lasciata"; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", righe: SPADA.lasciata }); } }
      ]);
    }

    /* "prendo la spada": si può riprovare anche dopo aver rifiutato, ma solo se l'armatura ha ceduto */
    function spada() {
      if (usate.spada === "presa") return aggiungi({ tipo: "narra", righe: [SPADA.giaPresa] });
      if (usate.scale === "ok") return offriSpada();
      aggiungi({ tipo: "narra", righe: [SPADA.lontana] });
    }

    function scale() {
      if ("scale" in usate) { aggiungi({ tipo: "narra", righe: [SCALE.gia + (usate.scale === "ok" && usate.spada !== "presa" ? " " + SPADA.ancoraLi : "")] }); return; }
      if (spirito() >= SCALE.soglia) {
        aggiungi({ tipo: "narra", righe: [...SCALE.testo, SCALE.domanda] });
        scelte([
          { testo: SCALE.si_btn, fn: () => { usate.scale = "ok"; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", box: "ok", righe: SCALE.si, banner: SCALE.banner }); offriSpada(); } },
          { testo: SCALE.no_btn, fn: () => { usate.scale = ""; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", righe: SCALE.no }); } }
        ]);
      } else {
        aggiungi({ tipo: "narra", righe: [...SCALE.testo, SCALE.respinge(SCALE.dannoDado)] });
        scelte([{ testo: U.lancia(SCALE.dannoDado), fn: () => {
          const d = tira(SCALE.dannoDado);
          pg.dannoMentale = (pg.dannoMentale || 0) + d; salvaPg(); aggiornaMentali();
          usate.scale = "ko"; salvaUsate();
          chiudiScelte();
          aggiungi({ tipo: "narra", box: "ko", esito: U.dannoSubito(d), righe: SCALE.respinto });
        } }]);
      }
    }

    /* =====================================================================
       SUONI DI AMBIENTE
       Ogni stanza in SUONI_STANZE ha il suo file audio, riprodotto in ciclo (es. audio/camino.mp3).
       Se il file manca o non si apre, si usa il crepitio generato dal browser (Web Audio API).
       Suona solo nelle stanze elencate in SUONI_STANZE. Il pulsante 🔊 lo disattiva (scelta salvata nel browser).
       I browser avviano l'audio solo dopo un'interazione del giocatore (clic o tasto).
       ===================================================================== */
    /* valore: "crepitio" = scoppiettii generati dal browser; un percorso (es. "audio/camino.mp3") = file audio in ciclo */
    const SUONI_STANZE = { sala_conversazione: "crepitio" };
    const VOLUME_AMBIENTE = 0.7; /* volume del file audio, da 0 a 1 */
    /* =====================================================================
       FUOCO DEL CAMINO generato dal browser (Web Audio API), a strati:
       - rombo: il respiro basso della combustione, che cresce e cala con la fiamma
       - fiato: il fruscio morbido delle lingue di fuoco
       - crepitio: tanti ticchettii minuti e, più di rado, schiocchi secchi della legna con un piccolo "corpo" risonante
       - linfa: ogni tanto la resina che sfrigola per qualche secondo
       - assestamento: ogni tanto un ciocco che cede, un tonfo sordo e una pioggia di braci
       Tutto è programmato in anticipo sull'orologio audio (programma(fino)), così funziona sia dal vivo
       sia in un OfflineAudioContext. "vivacità" è una variabile lenta che fa respirare il fuoco.
       ===================================================================== */
    function FuocoSintetico(ctx, out) {
      const R = Math.random, sr = ctx.sampleRate, fonti = [];
      const buf = (sec, fn) => { const n = Math.floor(sr * sec), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0); fn(d, n); return b; };
      const bianco = buf(4, (d, n) => { for (let i = 0; i < n; i++) d[i] = R() * 2 - 1; });
      const marrone = buf(10, (d, n) => { let u = 0; for (let i = 0; i < n; i++) { u = (u + 0.02 * (R() * 2 - 1)) / 1.02; d[i] = u * 3.5; } });

      function strato(b, tipo, freq, q, vol) {
        const src = ctx.createBufferSource(); src.buffer = b; src.loop = true; src.loopStart = 0; src.loopEnd = b.duration;
        const f = ctx.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain(); g.gain.value = vol;
        src.connect(f).connect(g).connect(out); src.start(ctx.currentTime, R() * b.duration);
        fonti.push(src);
        return { f, g };
      }
      const rombo = strato(marrone, "lowpass", 180, 0.7, 0.22);
      const fiato = strato(bianco, "bandpass", 650, 0.5, 0.008);
      const sibilo = strato(bianco, "highpass", 6000, 0.7, 0.0025);

      /* un evento di rumore breve: sorgente → filtro → inviluppo → panorama */
      function lampo(t, dur, amp, tipo, freq, q, pan) {
        const src = ctx.createBufferSource(); src.buffer = bianco;
        const f = ctx.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.0004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        let nodo = src.connect(f).connect(g);
        if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; nodo = nodo.connect(p); }
        nodo.connect(out);
        src.start(t, R() * (bianco.duration - 0.5), dur + 0.02);
      }
      const panCasuale = () => (R() - 0.5) * 0.7;
      const tic = (t, a, pan = panCasuale()) => lampo(t, 0.0015 + R() * 0.004, a, "highpass", 1800 + R() * 4500, 0.7, pan);
      function schiocco(t, a) {
        const pan = panCasuale();
        tic(t, a * 0.9, pan);                                                              /* l'attacco secco */
        lampo(t, 0.025 + R() * 0.07, a * 3, "bandpass", 450 + R() * 1500, 3 + R() * 6, pan); /* il legno che risuona */
        if (R() < 0.5) { const n = 1 + Math.floor(R() * 5); for (let i = 0; i < n; i++) tic(t + 0.008 + R() * 0.16, a * (0.1 + R() * 0.35), pan); }
      }
      function linfa(t) { /* resina che sfrigola: soffio acuto che pulsa, con minuscoli ticchettii */
        const dur = 1.2 + R() * 2.5, src = ctx.createBufferSource(); src.buffer = bianco; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 4200 + R() * 2500; f.Q.value = 1.4;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
        for (let x = 0.05; x < dur; x += 0.04 + R() * 0.05) g.gain.linearRampToValueAtTime((0.004 + R() * 0.014) * Math.min(1, x / 0.4, (dur - x) / 0.5), t + x);
        g.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(f).connect(g).connect(out); src.start(t, R() * 2); src.stop(t + dur + 0.05);
        for (let x = 0; x < dur; x += 0.02 + R() * 0.09) tic(t + x, 0.01 + R() * 0.03);
      }
      function assestamento(t) { /* un ciocco che cede: tonfo sordo, fruscio e pioggia di braci */
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(70 + R() * 30, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.3);
        og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.16, t + 0.006); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        o.connect(og).connect(out); o.start(t); o.stop(t + 0.45);
        lampo(t, 0.35, 0.06, "lowpass", 500, 0.7, 0);
        const n = 12 + Math.floor(R() * 18);
        for (let i = 0; i < n; i++) { const x = t + 0.02 + Math.pow(R(), 1.6) * 1.1; (R() < 0.15 ? schiocco(x, 0.05 + R() * 0.1) : tic(x, 0.02 + R() * 0.08)); }
        rombo.g.gain.setTargetAtTime(0.4, t + 0.05, 0.15); /* la fiamma si ravviva */
        viv = Math.min(1.5, viv + 0.4);
      }

      let viv = 1, cursore = ctx.currentTime, prossimoTic = cursore, prossimaLinfa = cursore + 6 + R() * 12, prossimoAss = cursore + 18 + R() * 25, prossimoRespiro = cursore;
      function programma(fino) {
        while (prossimoRespiro < fino) { /* la fiamma respira: rombo e fruscio seguono la vivacità */
          const t = prossimoRespiro;
          viv = Math.max(0.55, Math.min(1.5, viv + (R() - 0.5) * 0.12 + (1 - viv) * 0.03));
          rombo.g.gain.setTargetAtTime(0.16 * viv * (0.75 + R() * 0.5), t, 0.09);
          rombo.f.frequency.setTargetAtTime(130 + 110 * viv * R(), t, 0.12);
          fiato.g.gain.setTargetAtTime(0.008 * viv * (0.4 + R() * 1.2), t, 0.06);
          fiato.f.frequency.setTargetAtTime(450 + R() * 500, t, 0.1);
          sibilo.g.gain.setTargetAtTime(0.0025 * (0.6 + R() * 0.8), t, 0.2);
          prossimoRespiro += 0.08 + R() * 0.06;
        }
        while (prossimoTic < fino) { /* processo di Poisson: la frequenza dipende dalla vivacità */
          const t = prossimoTic;
          if (R() < 0.07 * viv) schiocco(t, 0.08 + 0.32 * Math.pow(R(), 1.5));
          else tic(t, 0.008 + 0.13 * Math.pow(R(), 4));
          prossimoTic += -Math.log(1 - R()) / (9 * viv);
        }
        while (prossimaLinfa < fino) { linfa(prossimaLinfa); prossimaLinfa += 10 + R() * 22; }
        while (prossimoAss < fino) { assestamento(prossimoAss); prossimoAss += 25 + R() * 40; }
        cursore = fino;
      }
      return { programma, ferma: (t) => fonti.forEach(s => { try { s.stop(t); } catch (e) {} }) };
    }

    const VOLUME_FUOCO = 1.4; /* volume complessivo del fuoco generato */
    const Suono = (() => {
      let ctx = null, master = null, sorgenti = [], timer = null, attivo = false;
      let modo = null, el = null, elSrc = null, fade = null; const fileKo = new Set(); /* lettore del file audio */
      let muto = false;
      try { muto = localStorage.getItem("audio") === "off"; } catch (e) {}
      let fuoco = null; /* il fuoco generato (FuocoSintetico) */
      function avviaSintetico() {
        try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
        master.gain.linearRampToValueAtTime(VOLUME_FUOCO, ctx.currentTime + 2.5); /* entra piano */
        fuoco = FuocoSintetico(ctx, master);
        fuoco.programma(ctx.currentTime + 0.6);
        timer = setInterval(() => fuoco.programma(ctx.currentTime + 0.6), 200); /* si programma sempre un po' in anticipo */
        attivo = true; modo = "sintetico";
      }
      function fermaSintetico() {
        attivo = false; clearInterval(timer);
        const m = master, f = fuoco; master = null; fuoco = null;
        m.gain.cancelScheduledValues(ctx.currentTime);
        m.gain.setValueAtTime(m.gain.value, ctx.currentTime);
        m.gain.linearRampToValueAtTime(0, ctx.currentTime + 1); /* esce piano */
        f.ferma(ctx.currentTime + 1.1);
        setTimeout(() => m.disconnect(), 1300);
      }

      /* dissolvenza del volume del file audio */
      function sfuma(target, ms, poi) {
        clearInterval(fade);
        const passi = Math.max(1, Math.round(ms / 50)), delta = (target - el.volume) / passi;
        let i = 0;
        fade = setInterval(() => {
          i++; el.volume = Math.min(1, Math.max(0, el.volume + delta));
          if (i >= passi) { clearInterval(fade); el.volume = target; if (poi) poi(); }
        }, 50);
      }
      function avviaFile(src) {
        if (!el || elSrc !== src) {
          if (el) el.pause();
          el = new Audio(src); elSrc = src; el.loop = true; el.preload = "auto";
          el.addEventListener("error", () => { /* file mancante o non leggibile: si passa al suono generato */
            fileKo.add(src);
            if (attivo && modo === "file") { attivo = false; avvia(src); }
          });
        }
        attivo = true; modo = "file";
        clearInterval(fade); /* annulla un'eventuale dissolvenza in uscita ancora in corso */
        el.volume = 0;
        el.play().then(() => { if (attivo && modo === "file") sfuma(VOLUME_AMBIENTE, 2500); else el.pause(); })
          .catch(err => {
            if (err && err.name === "NotAllowedError") { attivo = false; return; } /* serve prima un clic: si riprova al primo gesto */
            fileKo.add(src);
            if (attivo && modo === "file") { attivo = false; avvia(src); }
          });
      }
      function avvia(src) {
        if (attivo || muto) return;
        if (src && src.includes("/") && !fileKo.has(src)) avviaFile(src); else avviaSintetico();
      }
      function ferma() {
        if (!attivo) return;
        if (modo === "file") { attivo = false; const e = el; sfuma(0, 1000, () => e.pause()); }
        else fermaSintetico();
      }
      return {
        aggiorna() { (SUONI_STANZE[luogo] && !muto && !document.hidden) ? avvia(SUONI_STANZE[luogo]) : ferma(); },
        get muto() { return muto; },
        set muto(v) { muto = v; try { localStorage.setItem("audio", v ? "off" : "on"); } catch (e) {} }
      };
    })();

    function pulsanteAudio() {
      const b = document.getElementById("audio");
      b.textContent = Suono.muto ? "🔇" : "🔊";
      b.setAttribute("aria-pressed", String(!Suono.muto));
      b.title = Suono.muto ? U.audioOff : U.audioOn;
      b.setAttribute("aria-label", b.title);
    }

    function vai(id) {
      chiudiScelte(); /* eventuali scelte rimaste in sospeso nella stanza che si lascia */
      luogo = id;
      const s = STANZE[id];
      const tornato = diario.some(e => e.stanza === id);
      mostraStanza(id); /* sparisce il diario della stanza precedente, riappare quello di questa */
      Suono.aggiorna(); /* il suono di ambiente segue la stanza */
      if (tornato) aggiungi({ tipo: "narra", righe: s.ritorno });
      else aggiungi({ tipo: "narra", ...vista(id), righe: s.intro, nota: s.nota });
    }

    /* ---------- Prove di abilità scritte dal giocatore ("uso furtività", "faccio una prova di percezione") ----------
       Si riconosce il nome dell'abilità (italiano o inglese). Se la stanza prevede un riscontro per quell'abilità
       (TX.prove.stanze) si mostra quello, altrimenti una delle risposte generiche a caso. */
    const PROVE_ABILITA = [
      ["Atletica", /\batletica|\bathletics?\b/], ["Furtività", /\bfurtivita|\bstealth\b/], ["Acrobazia", /\bacrobazi|\bacrobatics?\b/],
      ["Indagare", /\bindagare\b|\bindagine|\binvestigation\b/], ["Medicina", /\bmedicina\b|\bmedicine\b/], ["Arcano", /\barcano\b|\barcana\b/],
      ["Misticismo", /\bmisticismo|\bmysticism\b/], ["Percezione", /\bpercezione|\bperception\b/],
      ["Persuasione", /\bpersuasione|\bpersuasion\b/], ["Intimidire", /\bintimidire|\bintimidazione|\bintimidation\b/]
    ];
    function provaAbilita(nome) {
      const conTiro = PROVE_DICHIARATE[luogo] && PROVE_DICHIARATE[luogo][nome];
      if (conTiro) return esamina(conTiro);
      const spec = TX.prove.stanze[luogo] && TX.prove.stanze[luogo][nome];
      const gen = TX.prove.generiche[nome];
      const righe = spec || [gen[Math.floor(Math.random() * gen.length)]];
      aggiungi({ tipo: "narra", esito: U.prova(N("abilita", nome)), righe });
    }

    let ultimoTesto = "";
    async function gestisci(testo) {
      const t = norm(testo);
      const stanza = STANZE[luogo];

      /* 0. prova di abilità dichiarata */
      const ab = PROVE_ABILITA.find(([, re]) => re.test(t));
      if (ab) {
        /* se la frase indica un elemento con una prova di quella stessa abilità (es. "prova di indagare sull'arazzo a sinistra"), parte quella prova */
        const bersaglio = luogo === "atrio" ? interpreta(t) : interpretaAltrove(t);
        const lb = bersaglio && LUOGHI[bersaglio];
        if (lb && lb.prova && lb.prova.abilita === ab[0]) return esamina(bersaglio);
        return provaAbilita(ab[0]);
      }

      /* 1. riporre qualcosa (torcia, scudo, arma) */
      if (ha(t, "riponi")) {
        if (mano && citato(mano, t)) return riponi();
        if (scudo && citato(scudo, t)) return riponiScudo();
        if (arma.nome !== "—" && citato(arma, t)) return riponiArma();
      }
      /* 2. usare / equipaggiare / leggere / prendere in mano un oggetto che si ha con sé */
      const verboUsa = ha(t, "usa"), verboPrendi = ha(t, "prendi");
      if (verboUsa || verboPrendi) {
        const filtro = verboUsa ? (() => true) : (it => it.tipo === "arma" || it.tipo === "scudo" || impugnabile(it));
        const og = trovaOggetti(t, filtro);
        if (og.length === 1) return azioneOggetto(og[0], !verboUsa);
        if (og.length > 1) return aggiungi({ tipo: "narra", righe: [U.piuOggetti] });
        if (verboUsa && arma.nome !== "—" && citato(arma, t)) return sist(U.giaInPugno(nomeOg(arma)));
      }

      /* 3. il luogo */
      const id = luogo === "atrio" ? interpreta(t) : interpretaAltrove(t);
      if (id === "spada") return spada();
      if (id === "giocattoli") return giocattoli();
      if (id === "scale") return scale();
      if (TX.ambigui[id]) return aggiungi({ tipo: "narra", righe: [TX.ambigui[id]] });
      if (id === "entra_sx") return vai("sala_caccia"); /* le porte dell'atrio sono sempre aperte */
      if (id === "entra_dx") return vai("sala_conversazione");
      if (id === "atrio_lontano") return aggiungi({ tipo: "narra", righe: [U.atrioLontano] });
      if (id === "pranzo_lontano") return aggiungi({ tipo: "narra", righe: [U.pranzoLontano] });
      if (id === "entra_pranzo") return vai("sala_pranzo");
      if (id === "torna") return vai(luogo === "sala_pranzo" ? "sala_conversazione" : "atrio");
      if (id === "stanza_corrente") return aggiungi({ tipo: "narra", righe: (await narra(COMPITI.osserva, stanza.fatti, testo)) || stanza.fallback });
      if (id && LUOGHI[id]) return esamina(id);
      const righe = (await narra(COMPITI.libera, stanza.fatti, testo)) || stanza.fallbackLibera;
      aggiungi({ tipo: "narra", righe });
    }

    elForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const testo = elTesto.value.trim();
      if (!testo || occupato) return;
      elTesto.value = "";
      ultimoTesto = testo;
      occupato = true; stato(true, U.scrive);
      aggiungi({ tipo: "giocatore", righe: [testo] });
      try { await gestisci(testo); }
      finally {
        occupato = false;
        if (elAzioni.hidden) stato(false); else stato(true, U.scegliAzione);
      }
    });

    /* ---------- Avvio ---------- */
    if (pg) {
      const completa = document.getElementById("completa");
      const mq = window.matchMedia("(max-width: 820px)");
      completa.open = !mq.matches;
      mq.addEventListener("change", () => { completa.open = !mq.matches; });

      [arma, ...zaino].forEach(o => { if (o && o.nome === SPADA.oggetto.nome) { o.bonus = 0; if (!o.danno) o.danno = SPADA.oggetto.danno; if (!o.mani) { o.mani = SPADA.oggetto.mani; o.tipoDanno = SPADA.oggetto.tipoDanno; } if (!o.alias || !o.alias.includes("sword")) o.alias = SPADA.oggetto.alias; } }); /* salvataggi vecchi */
      disegnaScheda();
      if (!diario.length) {
        diario.push({ tipo: "narra", stanza: "atrio", ...vista("atrio"), righe: TX.intro, nota: U.notaInizio });
      }
      mostraStanza(luogo);
      document.getElementById("salva").addEventListener("click", salvaPartita);
      pulsanteAudio();
      document.getElementById("audio").addEventListener("click", () => { Suono.muto = !Suono.muto; pulsanteAudio(); Suono.aggiorna(); });
      /* il browser permette l'audio solo dopo il primo clic o tasto: se si riprende la partita nella sala, parte lì */
      const sblocca = () => { Suono.aggiorna(); document.removeEventListener("pointerdown", sblocca); document.removeEventListener("keydown", sblocca); };
      document.addEventListener("pointerdown", sblocca); document.addEventListener("keydown", sblocca);
      document.addEventListener("visibilitychange", () => Suono.aggiorna()); /* in pausa quando la scheda non è visibile */
      aggiornaBarra();
      stato(false);
    }
  </script>
</body>
