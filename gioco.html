         e non vengono rimessi a posto. Poi la torcia si spegne e diventa inutile: sparisce e la mano resta libera. */
      if (mano === it) mano = null; else zaino = zaino.filter(x => x !== it);
      const extra = liberaSecondaria();
      aggiornaEquip();
      luceNelBuio(EST.luceTorcia, EST.sistTorciaSpenta + extra, true);
    }

    function lanciaLuce() {
      const inc = incantesimoLuce();
      if (!inc) return aggiungi({ tipo: "narra", righe: [EST.nessunIncantesimo], nota: notaBuio() });
      const costo = Number(inc.costo) || 1;
      if (manaMax() != null) {
        if (manaAttuale() < costo) return aggiungi({ tipo: "narra", righe: [EST.pocoMana(costo, manaAttuale())], nota: notaBuio() });
        pg.manaUsato = (pg.manaUsato || 0) + costo; disegnaVitali(); modificato();
      }
      luceNelBuio(EST.luceIncantesimo, EST.incantesimoUsato(costo, manaMax() != null ? manaAttuale() : "—"));
    }

    /* Pulsante «Lancia» nella scheda: per ora ha effetto solo Luce nel buio della grotta */
    function lanciaIncantesimo(inc) {
      if (occupato || !elAzioni.hidden) return; /* niente lanci durante una scelta in sospeso */
      const luce = inc === incantesimoLuce();
      if (luce && luogo === "buio") return lanciaLuce();
      if (luce && luogo === "foresta") return aggiungi({ tipo: "narra", righe: [EST.entraConLuce] });
      aggiungi({ tipo: "narra", righe: [EST.incInutile(nomeInc(inc))] });
    }

    async function gestisciForesta(t, testo) {
      const id = interpretaForesta(t);
      if (id === "entra_dungeon") return entraBuio();
      if (id === "prendi_torcia") return prendiTorcia();
      if (id === "torcia_fuori") return aggiungi({ tipo: "narra", righe: [EST.torciaFuori] });
      if (id === "luce_fuori") return aggiungi({ tipo: "narra", righe: [EST.entraConLuce] });
      if (id && LUOGHI[id]) return esamina(id);
      if (id === "stanza_corrente") return aggiungi({ tipo: "narra", righe: (await narra(COMPITI.osserva, STANZE.foresta.fatti, testo)) || STANZE.foresta.intro });
      return false; /* non riguarda la foresta: prove di abilità, oggetti, ecc. */
    }

    function gestisciBuio(t) {
      const id = interpretaBuio(t);
      if (id === "accendi_torcia") return accendiTorcia();
      if (id === "lancia_luce") return lanciaLuce();
      if (id === "esci") return vai("foresta");
      /* riporre o equipaggiare oggetti resta possibile anche al buio */
      if (ha(t, "riponi") || ha(t, "usa") || ha(t, "prendi")) return false;
      return buio();
    }

    /* =====================================================================
       SUONI DI AMBIENTE
       Ogni stanza in SUONI_STANZE ha il suo file audio, riprodotto in ciclo (es. audio/camino.mp3).
       Se il file manca o non si apre, si usa il crepitio generato dal browser (Web Audio API).
       Suona solo nelle stanze elencate in SUONI_STANZE. Il pulsante 🔊 lo disattiva (scelta salvata nel browser).
       I browser avviano l'audio solo dopo un'interazione del giocatore (clic o tasto).
       ===================================================================== */
    /* valore: "crepitio" = scoppiettii generati dal browser; un percorso (es. "audio/camino.mp3") = file audio in ciclo */
    const SUONI_STANZE = { foresta: "audio/Foresta.mp3", sala_conversazione: "audio/sala_conversazione.mp3" }; /* se il file manca si usa il crepitio generato */
    const VOLUME_AMBIENTE = 0.7; /* volume del file audio, da 0 a 1 */
    /* =====================================================================
       FUOCO DEL CAMINO generato dal browser (Web Audio API), a strati:
       - rombo: il respiro basso della combustione, che cresce e cala con la fiamma
       - fiato: il fruscio morbido delle lingue di fuoco
       - crepitio: tanti ticchettii minuti e, più di rado, schiocchi secchi della legna con un piccolo "corpo" risonante
       - linfa: ogni tanto la resina che sfrigola per qualche secondo
       - assestamento: ogni tanto un ciocco che cede, un tonfo sordo e una pioggia di braci
       Tutto è programmato in anticipo sull'orologio audio (programma(fino)), così funziona sia dal vivo
       sia in un OfflineAudioContext. "vivacità" è una variabile lenta che fa respirare il fuoco.
       ===================================================================== */
    function FuocoSintetico(ctx, out) {
      const R = Math.random, sr = ctx.sampleRate, fonti = [];
      const buf = (sec, fn) => { const n = Math.floor(sr * sec), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0); fn(d, n); return b; };
      const bianco = buf(4, (d, n) => { for (let i = 0; i < n; i++) d[i] = R() * 2 - 1; });
      const marrone = buf(10, (d, n) => { let u = 0; for (let i = 0; i < n; i++) { u = (u + 0.02 * (R() * 2 - 1)) / 1.02; d[i] = u * 3.5; } });

      function strato(b, tipo, freq, q, vol) {
        const src = ctx.createBufferSource(); src.buffer = b; src.loop = true; src.loopStart = 0; src.loopEnd = b.duration;
        const f = ctx.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain(); g.gain.value = vol;
        src.connect(f).connect(g).connect(out); src.start(ctx.currentTime, R() * b.duration);
        fonti.push(src);
        return { f, g };
      }
      const rombo = strato(marrone, "lowpass", 180, 0.7, 0.22);
      const fiato = strato(bianco, "bandpass", 650, 0.5, 0.0055); /* fruscio: abbassato */
      const sibilo = strato(bianco, "highpass", 6000, 0.7, 0.0016);

      /* un evento di rumore breve: sorgente → filtro → inviluppo → panorama */
      function lampo(t, dur, amp, tipo, freq, q, pan) {
        const src = ctx.createBufferSource(); src.buffer = bianco;
        const f = ctx.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.0004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        let nodo = src.connect(f).connect(g);
        if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; nodo = nodo.connect(p); }
        nodo.connect(out);
        src.start(t, R() * (bianco.duration - 0.5), dur + 0.02);
      }
      const panCasuale = () => (R() - 0.5) * 0.7;
      const tic = (t, a, pan = panCasuale()) => lampo(t, 0.0015 + R() * 0.004, a, "highpass", 1800 + R() * 4500, 0.7, pan);
      function schiocco(t, a) {
        const pan = panCasuale();
        tic(t, a * 0.9, pan);                                                              /* l'attacco secco */
        lampo(t, 0.025 + R() * 0.07, a * 3, "bandpass", 450 + R() * 1500, 3 + R() * 6, pan); /* il legno che risuona */
        if (R() < 0.5) { const n = 1 + Math.floor(R() * 5); for (let i = 0; i < n; i++) tic(t + 0.008 + R() * 0.16, a * (0.1 + R() * 0.35), pan); }
      }
      function linfa(t) { /* resina che sfrigola: soffio acuto che pulsa, con minuscoli ticchettii */
        const dur = 1.2 + R() * 2.5, src = ctx.createBufferSource(); src.buffer = bianco; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 4200 + R() * 2500; f.Q.value = 1.4;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
        for (let x = 0.05; x < dur; x += 0.04 + R() * 0.05) g.gain.linearRampToValueAtTime((0.004 + R() * 0.014) * Math.min(1, x / 0.4, (dur - x) / 0.5), t + x);
        g.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(f).connect(g).connect(out); src.start(t, R() * 2); src.stop(t + dur + 0.05);
        for (let x = 0; x < dur; x += 0.02 + R() * 0.09) tic(t + x, 0.01 + R() * 0.03);
      }
      function assestamento(t) { /* un ciocco che cede: tonfo sordo, fruscio e pioggia di braci */
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(70 + R() * 30, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.3);
        og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.16, t + 0.006); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        o.connect(og).connect(out); o.start(t); o.stop(t + 0.45);
        lampo(t, 0.35, 0.06, "lowpass", 500, 0.7, 0);
        const n = 12 + Math.floor(R() * 18);
        for (let i = 0; i < n; i++) { const x = t + 0.02 + Math.pow(R(), 1.6) * 1.1; (R() < 0.15 ? schiocco(x, 0.05 + R() * 0.1) : tic(x, 0.02 + R() * 0.08)); }
        rombo.g.gain.setTargetAtTime(0.4, t + 0.05, 0.15); /* la fiamma si ravviva */
        viv = Math.min(1.5, viv + 0.4);
      }

      let viv = 1, cursore = ctx.currentTime, prossimoTic = cursore, prossimaLinfa = cursore + 6 + R() * 12, prossimoAss = cursore + 18 + R() * 25, prossimoRespiro = cursore;
      function programma(fino) {
        while (prossimoRespiro < fino) { /* la fiamma respira: rombo e fruscio seguono la vivacità */
          const t = prossimoRespiro;
          viv = Math.max(0.55, Math.min(1.5, viv + (R() - 0.5) * 0.12 + (1 - viv) * 0.03));
          rombo.g.gain.setTargetAtTime(0.16 * viv * (0.75 + R() * 0.5), t, 0.09);
          rombo.f.frequency.setTargetAtTime(130 + 110 * viv * R(), t, 0.12);
          fiato.g.gain.setTargetAtTime(0.0055 * viv * (0.4 + R() * 1.2), t, 0.06);
          fiato.f.frequency.setTargetAtTime(450 + R() * 500, t, 0.1);
          sibilo.g.gain.setTargetAtTime(0.0016 * (0.6 + R() * 0.8), t, 0.2);
          prossimoRespiro += 0.08 + R() * 0.06;
        }
        while (prossimoTic < fino) { /* processo di Poisson: la frequenza dipende dalla vivacità */
          const t = prossimoTic;
          if (R() < 0.07 * viv) schiocco(t, 0.08 + 0.32 * Math.pow(R(), 1.5));
          else tic(t, 0.008 + 0.13 * Math.pow(R(), 4));
          prossimoTic += -Math.log(1 - R()) / (9 * viv);
        }
        while (prossimaLinfa < fino) { linfa(prossimaLinfa); prossimaLinfa += 10 + R() * 22; }
        while (prossimoAss < fino) { assestamento(prossimoAss); prossimoAss += 25 + R() * 40; }
        cursore = fino;
      }
      return { programma, ferma: (t) => fonti.forEach(s => { try { s.stop(t); } catch (e) {} }) };
    }

    const VOLUME_FUOCO = 1.4; /* volume complessivo del fuoco generato */
    const Suono = (() => {
      let ctx = null, master = null, sorgenti = [], timer = null, attivo = false;
      let modo = null, el = null, elSrc = null, fade = null; const fileKo = new Set(); /* lettore del file audio */
      let fuoco = null; /* il fuoco generato (FuocoSintetico) */
      function avviaSintetico() {
        try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
        master.gain.linearRampToValueAtTime(VOLUME_FUOCO * Volume.livello, ctx.currentTime + 2.5); /* entra piano */
        fuoco = FuocoSintetico(ctx, master);
        fuoco.programma(ctx.currentTime + 0.6);
        timer = setInterval(() => fuoco.programma(ctx.currentTime + 0.6), 200); /* si programma sempre un po' in anticipo */
        attivo = true; modo = "sintetico";
      }
      function fermaSintetico() {
        attivo = false; clearInterval(timer);
        const m = master, f = fuoco; master = null; fuoco = null;
        m.gain.cancelScheduledValues(ctx.currentTime);
        m.gain.setValueAtTime(m.gain.value, ctx.currentTime);
        m.gain.linearRampToValueAtTime(0, ctx.currentTime + 1); /* esce piano */
        f.ferma(ctx.currentTime + 1.1);
        setTimeout(() => m.disconnect(), 1300);
      }

      /* dissolvenza del volume del file audio */
      function sfuma(target, ms, poi) {
        clearInterval(fade);
        const passi = Math.max(1, Math.round(ms / 50)), delta = (target - el.volume) / passi;
        let i = 0;
        fade = setInterval(() => {
          i++; el.volume = Math.min(1, Math.max(0, el.volume + delta));
          if (i >= passi) { clearInterval(fade); el.volume = target; if (poi) poi(); }
        }, 50);
      }
      function avviaFile(src) {
        if (!el || elSrc !== src) {
          if (el) el.pause();
          el = new Audio(src); elSrc = src; el.loop = true; el.preload = "auto";
          el.addEventListener("error", () => { /* file mancante o non leggibile: si passa al suono generato */
            fileKo.add(src);
            if (attivo && modo === "file") { attivo = false; avvia(src); }
          });
        }
        attivo = true; modo = "file";
        clearInterval(fade); /* annulla un'eventuale dissolvenza in uscita ancora in corso */
        el.volume = 0;
        el.play().then(() => { if (attivo && modo === "file") sfuma(VOLUME_AMBIENTE * Volume.livello, 800); else el.pause(); })
          .catch(err => {
            if (err && err.name === "NotAllowedError") { attivo = false; return; } /* serve prima un clic: si riprova al primo gesto */
            fileKo.add(src);
            if (attivo && modo === "file") { attivo = false; avvia(src); }
          });
      }
      function avvia(src) {
        if (attivo || Volume.muto || Volume.livello === 0) return;
        if (src && src.includes("/") && !fileKo.has(src)) avviaFile(src); else avviaSintetico();
      }
      function ferma() {
        if (!attivo) return;
        if (modo === "file") { attivo = false; const e = el; sfuma(0, 1000, () => e.pause()); }
        else fermaSintetico();
      }
      return {
        aggiorna() { (SUONI_STANZE[luogo] && !Volume.muto && Volume.livello > 0 && !document.hidden) ? avvia(SUONI_STANZE[luogo]) : ferma(); },
        /* il giocatore ha spostato il cursore del volume: si adegua il suono in corso */
        volume() {
          const l = Volume.livello;
          if (attivo && modo === "sintetico" && master) master.gain.setTargetAtTime(VOLUME_FUOCO * l, ctx.currentTime, 0.08);
          if (attivo && modo === "file" && el) { clearInterval(fade); el.volume = Math.min(1, VOLUME_AMBIENTE * l); }
        }
      };
    })();

    /* pulsante del volume: cursore e silenziamento (volume.js) */
    function pulsanteAudio() {
      Volume.monta(document.getElementById("audio"));
      Volume.onCambio(() => { Suono.volume(); Suono.aggiorna(); });
    }

    function vai(id) {
      chiudiScelte(); /* eventuali scelte rimaste in sospeso nella stanza che si lascia */
      luogo = id;
      const s = STANZE[id];
      const tornato = diario.some(e => e.stanza === id);
      mostraStanza(id); /* sparisce il diario della stanza precedente, riappare quello di questa */
      disegnaMissioni();
      Suono.aggiorna(); /* il suono di ambiente segue la stanza */
      if (tornato && id === "foresta") aggiungi({ tipo: "narra", ...vista(id), anim: "esce", righe: s.ritorno }); /* zoom indietro dal buio alla foresta */
      else if (tornato && id === "cucina" && usate.portaCucina !== "aperta") aggiungi({ tipo: "narra", ...vista(id), righe: s.ritorno });
      else if (tornato) aggiungi({ tipo: "narra", righe: s.ritorno });
      else aggiungi({ tipo: "narra", ...vista(id), righe: s.intro, nota: s.nota });
      riprendiDialoghi();
      if (id === "cucina" && usate.q1 === "scaletta" && usate.portaCucina === "aperta") avviaDialogo("quest1_fine"); /* torni con la scaletta */
    }

    /* ---------- Prove di abilità scritte dal giocatore ("uso furtività", "faccio una prova di percezione") ----------
       Si riconosce il nome dell'abilità (italiano o inglese). Se la stanza prevede un riscontro per quell'abilità
       (TX.prove.stanze) si mostra quello, altrimenti una delle risposte generiche a caso. */
    const PROVE_ABILITA = [
      ["Atletica", /\batletica|\bathletics?\b/], ["Furtività", /\bfurtivita|\bstealth\b/], ["Acrobazia", /\bacrobazi|\bacrobatics?\b/],
      ["Indagare", /\bindagare\b|\bindagine|\binvestigation\b/], ["Medicina", /\bmedicina\b|\bmedicine\b/], ["Arcano", /\barcano\b|\barcana\b/],
      ["Misticismo", /\bmisticismo|\bmysticism\b/], ["Percezione", /\bpercezione|\bperception\b/],
      ["Persuasione", /\bpersuasione|\bpersuasion\b/], ["Intimidire", /\bintimidire|\bintimidazione|\bintimidation\b/]
    ];
    function provaAbilita(nome) {
      const conTiro = PROVE_DICHIARATE[luogo] && PROVE_DICHIARATE[luogo][nome];
      if (conTiro === "VUOTA") return aggiungi({ tipo: "narra", righe: ["PROVA VUOTA"] });
      if (conTiro && !LUOGHI[conTiro].prova) return aggiungi({ tipo: "narra", esito: U.prova(N("abilita", nome)), righe: LUOGHI[conTiro].fisso });
      if (conTiro) return esamina(conTiro);
      const spec = TX.prove.stanze[luogo] && TX.prove.stanze[luogo][nome];
      const gen = TX.prove.generiche[nome];
      const righe = spec || [gen[Math.floor(Math.random() * gen.length)]];
      aggiungi({ tipo: "narra", esito: U.prova(N("abilita", nome)), righe });
    }

    let ultimoTesto = "";
    async function gestisci(testo) {
      const t = norm(testo);
      const stanza = STANZE[luogo];
      const fuori = luogo === "foresta" || luogo === "buio"; /* fuori dalla dimora: niente atrio né altre stanze */

      /* foresta e buio hanno le loro regole; ciò che non riguarda il luogo (oggetti, prove) prosegue qui sotto */
      if (luogo === "buio" && gestisciBuio(t) !== false) return;
      if (luogo === "foresta" && (await gestisciForesta(t, testo)) !== false) return;

      /* incantesimo lanciato fuori dal buio: per ora nessun effetto e nessun costo */
      if (/incantesim|\bspell\b|\bcast\w*|\blanci[oa]\b|\bevoc\w*/.test(t)) {
        const citatoInc = listaIncantesimi().find(inc => nomiInc(inc).some(v => t.includes(norm(v))));
        if (citatoInc) return aggiungi({ tipo: "narra", righe: [EST.incInutile(nomeInc(citatoInc))] });
        if (/incantesim|\bspell\b/.test(t)) return aggiungi({ tipo: "narra", righe: [EST.incSconosciuto] });
      }

      /* 0. prova di abilità dichiarata */
      const ab = PROVE_ABILITA.find(([, re]) => re.test(t));
      if (ab) {
        /* se la frase indica un elemento con una prova di quella stessa abilità (es. "prova di indagare sull'arazzo a sinistra"), parte quella prova */
        const bersaglio = fuori ? null : luogo === "atrio" ? interpreta(t) : interpretaAltrove(t);
        const lb = bersaglio && LUOGHI[bersaglio];
        if (lb && lb.prova && lb.prova.abilita === ab[0]) return esamina(bersaglio);
        return provaAbilita(ab[0]);
      }

      /* riposo accanto a un fuoco caldo */
      if (/\bripos[oai]\w*|\bdorm\w*|\bmi (stendo|sdraio|addormento)|\brest\b|\bresting\b|\bsleep\w*|\bnap\b/.test(t)) return riposa();

      /* 1. riporre qualcosa (torcia, scudo, arma) */
      if (ha(t, "riponi")) {
        if (mano && citato(mano, t)) return riponi();
        if (scudo && citato(scudo, t)) return riponiScudo();
        if (arma.nome !== "—" && citato(arma, t)) return riponiArma();
      }
      /* 2. usare / equipaggiare / leggere / prendere in mano un oggetto che si ha con sé */
      const verboUsa = ha(t, "usa"), verboPrendi = ha(t, "prendi");
      if (verboUsa || verboPrendi) {
        const filtro = verboUsa ? (() => true) : (it => it.tipo === "arma" || it.tipo === "scudo" || impugnabile(it));
        const og = trovaOggetti(t, filtro);
        if (og.length === 1) return azioneOggetto(og[0], !verboUsa);
        if (og.length > 1) return aggiungi({ tipo: "narra", righe: [U.piuOggetti] });
        if (verboUsa && arma.nome !== "—" && citato(arma, t)) return sist(U.giaInPugno(nomeOg(arma)));
      }

      /* 3. il luogo */
      if (luogo === "buio") return buio();
      if (luogo === "foresta") return aggiungi({ tipo: "narra", righe: (await narra(COMPITI.libera, stanza.fatti, testo)) || stanza.fallbackLibera });
      /* missione 3: il riquadro sul camino della sala da conversazione */
      if (luogo === "sala_conversazione" && usate.q3 === "blasone" && /blason|stemma|riquadr|incastr|\bcrest\b|\bslot\b|\bfit\b/.test(t)) return inserisciBlasone();
      const id = luogo === "atrio" ? interpreta(t) : interpretaAltrove(t);
      if (id === "portone_chiuso") return aggiungi({ tipo: "narra", righe: EST.portoneChiuso });
      if (id === "spada") return spada();
      if (id === "giocattoli") return giocattoli();
      if (id === "scale") return scale();
      if (TX.ambigui[id]) return aggiungi({ tipo: "narra", righe: [TX.ambigui[id]] });
      if (id === "entra_sx") return portaChiusa(true); /* chiusa a chiave per ora (prima: vai("sala_caccia")) */
      if (id === "entra_dx") return vai("sala_conversazione");
      if (id === "atrio_lontano") return aggiungi({ tipo: "narra", righe: [U.atrioLontano] });
      if (id === "pranzo_lontano") return aggiungi({ tipo: "narra", righe: [U.pranzoLontano] });
      if (id === "entra_pranzo") return vai("sala_pranzo");
      if (id === "torna") return vai(luogo === "cantina" ? "cucina" : luogo === "cucina" ? "corridoio" : luogo === "corridoio" ? "sala_pranzo" : luogo === "sala_pranzo" ? "sala_conversazione" : "atrio");
      if (id === "corr_apri") return vai("cucina"); /* la porta del corridoio porta in cucina */
      if (id === "cucina_lontano") return aggiungi({ tipo: "narra", righe: [TX.esterno.cucinaLontano] });
      if (id === "entra_cantina") return entraCantina();
      if (id === "parla_guendalina") return parlaGuendalina();
      if (id === "cantina_corri") { aggiungi({ tipo: "narra", righe: Q.cantina.corri }); return guardiani(6, true); }
      if (id === "cantina_vuota") return aggiungi({ tipo: "narra", righe: Q.cantina.vuota });
      if (id === "fuoco_freddo" || (id === "camino" && usate.fuoco_sala_conversazione === "spento")) return aggiungi({ tipo: "narra", righe: Q.riposo.caminoFreddo });
      if (id === "entra_corridoio") return vai("corridoio");
      if (id === "corr_lontano") return aggiungi({ tipo: "narra", righe: [TX.esterno.corrLontano] });
      if (id === "pranzo_camino") return aggiungi({ tipo: "narra", righe: [TX.esterno.caminoPranzo[Math.floor(Math.random() * TX.esterno.caminoPranzo.length)]] });
      if (id === "stanza_corrente") return aggiungi({ tipo: "narra", righe: (await narra(COMPITI.osserva, stanza.fatti, testo)) || stanza.fallback });
      if (id === "porta_sx") return portaChiusa(false);
      if (id && LUOGHI[id]) return esamina(id);
      const righe = (await narra(COMPITI.libera, stanza.fatti, testo)) || stanza.fallbackLibera;
      aggiungi({ tipo: "narra", righe });
    }

    elForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const testo = elTesto.value.trim();
      if (!testo || occupato) return;
      elTesto.value = "";
      ultimoTesto = testo;
      vistaFissa = false;
      occupato = true; stato(true, U.scrive);
      aggiungi({ tipo: "giocatore", righe: [testo] });
      const inCucina = luogo === "cucina";
      try { await gestisci(testo); }
      finally {
        occupato = false;
        if (elAzioni.hidden) stato(false); else stato(true, U.scegliAzione);
        if (inCucina && luogo === "cucina") programmaGuendalina(); /* prima azione in cucina: tra 5 secondi arriva Guendalina */
      }
    });

    /* ---------- Avvio ---------- */
    if (pg) {
      const completa = document.getElementById("completa");
      const mq = window.matchMedia("(max-width: 820px)");
      completa.open = !mq.matches;
      mq.addEventListener("change", () => { completa.open = !mq.matches; });

      [arma, ...zaino].forEach(o => { if (o && o.nome === SPADA.oggetto.nome) { o.bonus = 0; if (!o.danno) o.danno = SPADA.oggetto.danno; if (!o.mani) { o.mani = SPADA.oggetto.mani; o.tipoDanno = SPADA.oggetto.tipoDanno; } if (!o.alias || !o.alias.includes("sword")) o.alias = SPADA.oggetto.alias; } }); /* salvataggi vecchi */
      disegnaScheda();
      if (!diario.length) { /* nuova partita: si comincia all'accampamento, fuori dal dungeon */
        luogo = "foresta";
        diario.push({ tipo: "narra", stanza: "foresta", ...vista("foresta"), righe: STANZE.foresta.intro });
      }
      mostraStanza(luogo);
      riprendiDialoghi();
      document.getElementById("salva").addEventListener("click", salvaPartita);
      pulsanteAudio();
      /* il browser permette l'audio solo dopo il primo clic o tasto: se si riprende la partita nella sala, parte lì */
      /* si prova a partire subito (di solito il browser lo permette, perché si arriva qui con un clic dalla pagina precedente);
         intanto il file inizia a scaricarsi. Se il browser blocca l'audio, parte al primo clic, tocco o tasto. */
      Suono.aggiorna();
      const GESTI = ["pointerdown", "keydown", "touchstart", "click"];
      const sblocca = () => { Suono.aggiorna(); GESTI.forEach(g => document.removeEventListener(g, sblocca, true)); };
      GESTI.forEach(g => document.addEventListener(g, sblocca, true));
      document.addEventListener("visibilitychange", () => Suono.aggiorna()); /* in pausa quando la scheda non è visibile */
      aggiornaBarra();
      stato(false);
    }
  </script>
</body>
