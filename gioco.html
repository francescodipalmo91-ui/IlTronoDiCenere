<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il dungeon</title>
  <script src="lingua.js"></script>
  <script src="volume.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --text: #1d2733;
      --muted: #5b6675;
      --line: #c9d1db;
      --accent: #2f6fed;
      --ok-bg: #e7f3ea;
      --ok-line: #a3cbab;
      --ko-bg: #f8e8e8;
      --ko-line: #dcaaaa;
      --tip-bg: #e9f0fd;
      --tip-line: #b4c9f2;
      --ok: #23824a; --ko: #c0392b;
      --dlg: #7a4fb5; --dlg-bg: #f2ecfa; --dlg-line: #cdb8ea; /* dialoghi */
      --cap: #9a5b0c; --cap-bg: #fbf1e1; --cap-line: #e5c48f; /* capacità sbloccate (ambra) */
      --mis: #12706f; --mis-bg: #e2f3f2; --mis-line: #9ccfcc; /* missioni (verde acqua) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22;
        --text: #e8edf3;
        --muted: #9aa5b4;
        --line: #2f3844;
        --accent: #5b92ff;
        --ok-bg: #1d2c23;
        --ok-line: #3f6b4c;
        --ko-bg: #2f2022;
        --ko-line: #7b4549;
        --tip-bg: #1e2a3f;
        --tip-line: #38527d;
        --ok: #6fd39a; --ko: #ff7b6b;
        --dlg: #bb9cf0; --dlg-bg: #2a2238; --dlg-line: #5b4880;
        --cap: #f0b45c; --cap-bg: #2e2416; --cap-line: #6f5328;
        --mis: #5fd0c8; --mis-bg: #162b2a; --mis-line: #2f6461;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ---------- Struttura: scheda | linea | gioco ---------- */
    .app { display: grid; grid-template-columns: 20rem 1px minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .divisore {
      background: linear-gradient(to bottom, transparent, var(--line) 14%, var(--line) 86%, transparent);
    }

    /* ---------- Scheda personaggio ---------- */
    .scheda { overflow-y: auto; padding: 1.75rem 1.5rem; }
    .pg { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; text-align: center; }
    #ritratto {
      width: 12rem; aspect-ratio: 900 / 1122; flex: none; border-radius: 0.6rem; /* forma originale dei ritratti */
      border: 3px solid var(--accent); background-size: cover; background-position: 50% 0;
    }
    #nome { font-size: 1.4rem; font-weight: 600; line-height: 1.2; }
    #sub { color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem; }
    .scheda h2 { font-size: 1rem; font-weight: 600; margin: 1.6rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); }
    .scheda dl { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; margin: 0; font-size: 0.97rem; }
    .scheda dt { color: var(--muted); }
    .scheda dd { margin: 0; text-align: right; }
    .scheda #vitali { margin-top: 1.25rem; }
    .scheda details.sez { margin-top: 1rem; }
    .scheda details.sez > summary { font-size: 1rem; font-weight: 600; cursor: pointer; list-style: none; padding: 0.3rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
    .scheda details.sez > summary::-webkit-details-marker { display: none; }
    .scheda details.sez > summary::after { content: "▾"; color: var(--muted); }
    .scheda details.sez[open] > summary::after { content: "▴"; }
    .scheda details.sez > :not(summary) { margin-top: 0.6rem; }
    .scheda dd.extra { grid-column: 1 / -1; text-align: left; margin-top: -0.15rem; }
    #equip .extra .desc { margin: 0; }
    .scheda dt.addestrata { color: var(--text); font-weight: 600; }
    #completa > summary { display: none; }
    #zaino .oggetto { margin: 0.45rem 0; font-size: 0.97rem; }
    #zaino .testa { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    #zaino .nome-btn, #equip .nome-btn { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted var(--muted); text-underline-offset: 0.25rem; }
    #equip .nome-btn { text-align: right; }
    #zaino .desc, #zaino .vuoto, #equip .desc { color: var(--muted); font-size: 0.88rem; margin: 0; }
    #zaino .testo, #equip .testo { margin: 0.4rem 0 0; padding: 0.6rem 0.8rem; background: var(--tip-bg); border: 1px solid var(--tip-line); border-radius: 0.5rem; font-size: 0.9rem; line-height: 1.5; }
    #zaino .testo.lettera { font-style: italic; }
    #zaino .azioni-og { display: flex; gap: 0.4rem; flex: none; }
    #equipAzioni { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0; }
    #equipAzioni:empty { display: none; }
    #zaino .mini, #equipAzioni .mini {
      font: inherit; font-size: 0.85rem; padding: 0.25rem 0.65rem; border-radius: 0.4rem; cursor: pointer;
      background: transparent; color: var(--text); border: 1px solid var(--accent);
    }
    #zaino .mini:hover, #equipAzioni .mini:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .scheda small.malus { color: var(--muted); font-size: 0.85rem; }
    .colpito { animation: scuoti 0.35s ease-in-out; }
    @keyframes scuoti { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    /* ---------- Gioco ---------- */
    .gioco { display: flex; flex-direction: column; min-height: 0; }
    .barra {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.75rem max(1.5rem, calc((100% - 62rem) / 2)); border-bottom: 1px solid var(--line);
    }
    #statoSalvataggio { color: var(--muted); font-size: 0.97rem; }
    #statoSalvataggio.da-salvare { color: var(--text); font-weight: 600; }
    #salva {
      font: inherit; font-size: 1rem; font-weight: 600; padding: 0.55rem 1.2rem; border-radius: 0.5rem; cursor: pointer;
      background: var(--accent); color: var(--bg); border: 2px solid var(--accent); flex: none;
    }
    #salva:hover { filter: brightness(1.1); }
    .barra-dx { display: flex; align-items: center; gap: 0.6rem; flex: none; }
    #audio {
      font: inherit; font-size: 1.05rem; line-height: 1; padding: 0.5rem 0.7rem; border-radius: 0.5rem; cursor: pointer;
      background: transparent; color: var(--text); border: 2px solid var(--line);
    }
    #audio:hover { border-color: var(--accent); }
    #home {
      font: inherit; font-size: 1.05rem; line-height: 1; padding: 0.5rem 0.7rem; border-radius: 0.5rem;
      background: transparent; color: var(--text); border: 2px solid var(--line); text-decoration: none;
      display: inline-flex; align-items: center;
    }
    #audio { display: inline-flex; align-items: center; }
    #home:hover { border-color: var(--accent); }
    #home:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #diario {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: 2rem max(1.5rem, calc((100% - 62rem) / 2)) 1rem;
    }
    .voce { margin: 0 0 1.5rem; }
    .voce p { font-size: 1.12rem; line-height: 1.75; margin: 0 0 1.1rem; }
    .voce p:last-child { margin-bottom: 0; }
    .voce h2.luogo { margin: 0 0 0.9rem; font-size: 1.6rem; font-weight: 600; letter-spacing: 0.04em; }
    /* l'immagine entra sempre intera nello schermo, sotto il titolo della stanza */
    .voce .cornice { position: relative; overflow: hidden; border-radius: 0.5rem; margin: 0 auto 1.5rem; background: #000; width: fit-content; max-width: 100%; }
    .voce img.scena { max-height: calc(100vh - 19rem); max-height: calc(100dvh - 19rem); width: auto; max-width: 100%; }
    @media (max-width: 820px) { .voce img.scena { max-height: none; width: 100%; } }
    .voce img.scena { display: block; width: 100%; height: auto; }
    /* entrando nella grotta: zoom dentro l'ingresso fino al nero; uscendo: zoom indietro fino alla foresta */
    .voce img.scena.nera, .voce img.scena.esce { transform-origin: 51% 55%; }
    .voce img.scena.nera { transform: scale(2.6); filter: brightness(0); animation: dentro 2.6s cubic-bezier(0.55, 0, 0.75, 0.45) both; }
    .voce img.scena.esce { animation: fuori 2.6s cubic-bezier(0.2, 0.6, 0.3, 1) both; }
    .voce img.scena.subito { animation: none; }
    @keyframes dentro { from { transform: scale(1); filter: brightness(1); } 55% { filter: brightness(0.45); } to { transform: scale(2.6); filter: brightness(0); } }
    @keyframes fuori { from { transform: scale(2.6); filter: brightness(0); } 45% { filter: brightness(0.4); } to { transform: scale(1); filter: brightness(1); } }
    @media (prefers-reduced-motion: reduce) {
      @keyframes dentro { from { filter: brightness(1); } to { transform: scale(2.6); filter: brightness(0); } }
      @keyframes fuori { from { filter: brightness(0); } to { filter: brightness(1); } }
    }
    #incantesimi .oggetto { margin: 0.45rem 0; font-size: 0.97rem; }
    #incantesimi .testa { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
    #incantesimi .nome-btn { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted var(--muted); text-underline-offset: 0.25rem; }
    #incantesimi .costo { color: var(--muted); font-size: 0.88rem; flex: none; }
    #incantesimi .testa { align-items: center; }
    #incantesimi .azioni-inc { display: flex; align-items: center; gap: 0.5rem; flex: none; }
    #incantesimi .mini { font: inherit; font-size: 0.85rem; padding: 0.25rem 0.65rem; border-radius: 0.4rem; cursor: pointer; background: transparent; color: var(--text); border: 1px solid var(--accent); }
    #incantesimi .mini:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    #incantesimi .testo { margin: 0.4rem 0 0; padding: 0.6rem 0.8rem; background: var(--tip-bg); border: 1px solid var(--tip-line); border-radius: 0.5rem; font-size: 0.9rem; line-height: 1.5; }
    details.voce.giocatore > summary {
      display: flex; align-items: baseline; gap: 0.6rem; cursor: pointer; list-style: none;
      color: var(--muted); font-style: italic; font-size: 1.12rem; line-height: 1.75;
      padding-left: 1rem; border-left: 2px solid var(--accent);
    }
    details.voce.giocatore > summary::-webkit-details-marker { display: none; }
    details.voce.giocatore > summary::before { content: "▸"; flex: none; font-style: normal; color: var(--accent); }
    details.voce.giocatore[open] > summary::before { content: "▾"; }
    details.voce.giocatore > .corpo { margin-top: 1.25rem; }
    details.voce.giocatore > .corpo > .voce:last-child { margin-bottom: 0; }
    /* tendine come nel tutorial: blu di base, verde se contiene una prova superata, rossa se fallita */
    details.voce.giocatore { padding: 0.75rem 1rem; border: 1px solid var(--tip-line); border-radius: 0.5rem; background: var(--tip-bg); }
    details.voce.giocatore.t-ok { background: var(--ok-bg); border-color: var(--ok-line); }
    details.voce.giocatore.t-ko { background: var(--ko-bg); border-color: var(--ko-line); }
    details.voce.giocatore.t-ok > summary { border-left-color: var(--ok); color: var(--ok); }
    details.voce.giocatore.t-ko > summary { border-left-color: var(--ko); color: var(--ko); }
    details.voce.giocatore.t-ok > summary::before { color: var(--ok); }
    details.voce.giocatore.t-ko > summary::before { color: var(--ko); }
    .voce.prova { padding: 1rem 1.25rem; border: 1px solid var(--accent); border-radius: 0.5rem; background: rgba(91,146,255,0.07); }
    .voce.prova p { margin: 0 0 0.5rem; }
    .voce.prova p.prova-titolo { font-weight: 700; font-size: 1.15rem; color: var(--accent); letter-spacing: 0.03em; }
    .voce.prova p.prova-azione { font-style: italic; }
    .voce.prova .prova-dati { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.25rem 0 0.75rem; }
    .voce.prova .prova-dati span { border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.8rem; font-size: 0.95rem; }
    .voce.prova p:last-child { margin-bottom: 0; color: var(--muted); font-size: 1rem; }
    .voce.sistema p { color: var(--muted); font-size: 1rem; margin: 0; }
    .voce p.esito-prova { font-weight: 600; color: var(--accent); }
    .voce p.lettera { font-style: italic; padding-left: 1.25rem; }
    /* DIALOGHI: tendina viola per domanda e risposta; le parole dei personaggi in corsivo, le descrizioni normali */
    details.voce.giocatore.t-dlg { background: var(--dlg-bg); border-color: var(--dlg-line); }
    details.voce.giocatore.t-dlg > summary { border-left-color: var(--dlg); color: var(--dlg); }
    details.voce.giocatore.t-dlg > summary::before { color: var(--dlg); }
    .voce.dialogo p.chi { margin: 0 0 0.35rem; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dlg); }
    .voce.dialogo p.battuta { font-style: italic; }
    .voce.dialogo p.battuta.scrive::after { content: "▌"; margin-left: 1px; font-style: normal; animation: cursore 0.9s steps(1) infinite; color: var(--muted); }
    @keyframes cursore { 50% { opacity: 0; } }
    /* sblocchi (capacità, missioni): riquadro viola come i dialoghi */
    .voce.riquadro.cap, .voce.riquadro.mis { border-width: 1px; }
    .voce.riquadro.cap { border-color: var(--cap-line); background: var(--cap-bg); }
    .voce.riquadro.mis { border-color: var(--mis-line); background: var(--mis-bg); }
    .voce.cap p, .voce.mis p { margin: 0 0 0.5rem; color: var(--text); }
    .voce.cap > p:first-child { font-weight: 700; color: var(--cap); letter-spacing: 0.02em; }
    .voce.mis > p:first-child { font-weight: 700; color: var(--mis); letter-spacing: 0.02em; }
    .voce.cap p:last-child, .voce.mis p:last-child { margin-bottom: 0; }
    /* riquadro «Missioni sbloccate»: una scheda per missione, con Accetta / Rifiuta */
    .voce.mis details.proposta { margin-top: 0.6rem; border: 1px solid var(--mis-line); border-radius: 0.45rem; background: color-mix(in srgb, var(--bg) 55%, transparent); }
    .voce.mis details.proposta > summary { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.9rem; cursor: pointer; list-style: none; }
    .voce.mis details.proposta > summary::-webkit-details-marker { display: none; }
    .voce.mis details.proposta > summary::before { content: "▸"; color: var(--mis); flex: none; }
    .voce.mis details.proposta[open] > summary::before { content: "▾"; }
    .voce.mis .proposta .p-nome { font-weight: 600; flex: 1; }
    .voce.mis .proposta .p-badge { flex: none; font-size: 0.8rem; color: var(--mis); border: 1px solid var(--mis-line); border-radius: 999px; padding: 0 0.55rem; white-space: nowrap; }
    .voce.mis .proposta .p-badge.deciso { color: var(--muted); border-color: var(--line); }
    .voce.mis .proposta .p-corpo { padding: 0.2rem 0.9rem 0.9rem 2rem; }
    .voce.mis .proposta .p-da { color: var(--muted); font-size: 0.95rem; }
    .voce.mis .p-nota { color: var(--muted); font-size: 0.92rem; margin-top: 0.75rem; }
    .voce.mis .proposta .p-chi { margin: 0.6rem 0 0.25rem; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dlg); }
    .voce.mis .proposta .p-parla { font-style: italic; }
    .voce.mis .proposta .p-stato { color: var(--mis); font-style: italic; margin-top: 0.4rem; }
    .voce.mis .p-btn { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.6rem; }
    .voce.mis .p-btn button { font: inherit; font-size: 1rem; padding: 0.4rem 1.1rem; border-radius: 0.45rem; cursor: pointer; background: transparent; color: var(--text); border: 1px solid var(--mis); }
    .voce.mis .p-btn button.si { background: var(--mis); color: var(--bg); }
    .voce.mis .p-btn button:hover { filter: brightness(1.08); }
    /* dialoghi fuori dalle tendine: stesso riquadro viola delle tendine dei dialoghi */
    .voce.dialogo .dlg-box { margin-top: 1.1rem; padding: 0.9rem 1.1rem; border: 1px solid var(--dlg-line); border-radius: 0.5rem; background: var(--dlg-bg); }
    .voce.dialogo .dlg-box p:last-child { margin-bottom: 0; }
    .voce.dialogo > .dlg-box:first-child { margin-top: 0; }
    /* scheda: missioni e capacità */
    .missione { margin: 0.5rem 0 0.9rem; font-size: 0.95rem; }
    .missione p { margin: 0 0 0.25rem; }
    .missione .m-nome { font-weight: 600; }
    .missione .m-stato { font-weight: 400; font-size: 0.8rem; color: var(--mis); border: 1px solid var(--mis-line); border-radius: 999px; padding: 0 0.5rem; margin-left: 0.25rem; white-space: nowrap; }
    .missione .m-stato.fatta { color: var(--ok); border-color: var(--ok-line); }
    .missione .m-da { color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
    .missione ul { margin: 0.3rem 0 0.4rem; padding-left: 0.2rem; list-style: none; }
    .missione li { margin: 0.15rem 0; line-height: 1.4; }
    .missione li.fatto { color: var(--muted); text-decoration: line-through; }
    .missione .nome-btn { font: inherit; font-weight: 600; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted var(--muted); text-underline-offset: 0.25rem; }
    .missione .testa { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    .missione .testo { margin: 0.4rem 0 0; padding: 0.6rem 0.8rem; background: var(--tip-bg); border: 1px solid var(--tip-line); border-radius: 0.5rem; font-size: 0.9rem; line-height: 1.5; }
    .missione .mini { font: inherit; font-size: 0.85rem; padding: 0.25rem 0.75rem; border-radius: 0.4rem; cursor: pointer; background: transparent; color: var(--text); border: 1px solid var(--accent); margin-top: 0.25rem; }
    .missione .mini:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .voce p.banner { font-weight: 700; font-size: 1.25rem; text-align: center; margin-top: 1.5rem; }
    .voce p.nota { color: var(--muted); }
    .voce.riquadro { padding: 1.25rem 1.5rem; border: 2px solid; border-radius: 0.5rem; }
    .voce.riquadro p.esito-prova { color: var(--text); }
    .voce.ok { background: var(--ok-bg); border-color: var(--ok-line); }
    .voce.ko { background: var(--ko-bg); border-color: var(--ko-line); }
    .attesa { color: var(--muted); font-style: italic; margin: 0 0 1.5rem; }

    .comandi { border-top: 1px solid var(--line); padding: 1rem max(1.5rem, calc((100% - 62rem) / 2)) 1.25rem; }
    #azioni { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.9rem; }
    #azioni button, #form button {
      font: inherit; font-size: 1.05rem; padding: 0.7rem 1.1rem; border-radius: 0.5rem; cursor: pointer;
      background: transparent; color: var(--text); border: 2px solid var(--accent);
    }
    #azioni button:hover:not(:disabled), #form button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    #azioni button:disabled, #form button:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--line); }
    #form { display: flex; gap: 0.75rem; }
    #testo {
      flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 0.7rem 1rem;
      border-radius: 0.5rem; border: 2px solid var(--line); background: transparent; color: var(--text);
    }
    #testo::placeholder { color: var(--muted); }
    #testo:disabled { opacity: 0.6; }
    #testo:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* ---------- Schermi stretti ---------- */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1px minmax(0, 1fr); }
      .divisore { background: linear-gradient(to right, transparent, var(--line) 14%, var(--line) 86%, transparent); }
      .scheda { overflow-y: visible; padding: 1rem 1.25rem; max-height: 55vh; overflow-y: auto; }
      .pg { flex-direction: row; text-align: left; gap: 1rem; }
      #ritratto { width: 6rem; }
      #completa > summary { display: block; cursor: pointer; color: var(--muted); margin-top: 0.75rem; }
      .scheda #vitali { margin-top: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="scheda" data-t-aria="schedaPg">
      <div class="pg">
        <div id="ritratto" hidden></div>
        <div>
          <div id="nome"></div>
          <div id="sub"></div>
        </div>
      </div>
      <dl id="vitali"></dl>
      <details id="completa" open>
        <summary data-t="completa">Scheda completa</summary>
        <details class="sez"><summary data-t="caratteristiche">Caratteristiche</summary><dl id="stat"></dl></details>
        <details class="sez"><summary data-t="abilita">Abilità</summary><dl id="abil"></dl></details>
        <details class="sez"><summary data-t="equipaggiamento">Equipaggiamento</summary><dl id="equip"></dl><div id="equipAzioni"></div></details>
        <details class="sez" id="zainoBox"><summary data-t="zaino">Zaino</summary><div id="zaino"></div></details>

  <script>
    /* =====================================================================
       LINGUA
       La lingua si sceglie nella pagina iniziale. Tutti i testi del gioco stanno in TESTI.it e TESTI.en;
       regole, prove e dadi stanno nel codice e sono uguali per le due lingue.
       Il riconoscimento di ciò che scrive il giocatore capisce sia l'italiano sia l'inglese.
       ===================================================================== */
    const LINGUA = Lingua.get();
    const N = Lingua.nome;

    const TESTI = {};

    /* ------------------------------ ITALIANO ------------------------------ */
    TESTI.it = (() => {
      const FOGLIETTO = "«Mi chiamo Adele, sono la moglie di Rodolfo. Ormai non puoi più scappare fintanto che lui non sarà morto. Se hai trovato questo biglietto è perché di Guendalina ci si può fidare. Io sono tenuta prigioniera in una camera da letto, ma tra le tante presenti in questa dimora non saprei dirti quale sia. Aiutami, ti prego.»";
      const ASCOLTO = ["Ti fermi per un istante e trattieni il respiro, lasciando che il silenzio della dimora ti avvolga come un sudario. All'inizio percepisci soltanto il crepitio sommesso delle fiamme nel camino, il legno che si spezza lentamente tra braci rossastre e ombre danzanti.", "Poi, qualcosa cambia.", "Un suono appena percettibile si insinua nel silenzio. Metallico. Breve.", "Il tuo corpo reagisce prima ancora della mente. Ti volti di scatto verso la sala da pranzo, aspettandoti di scorgere qualcuno nell'oscurità. Ma la stanza è deserta. Le sedie sono immobili, il lungo tavolo giace avvolto nella penombra e nessuna presenza si manifesta davanti ai tuoi occhi.", "Eppure quel rumore c'è stato.", "Ascolti di nuovo.", "Clink...", "Questa volta ne individui l'origine. Non proviene dalla sala, bensì dalle porte chiuse alle spalle del tavolo. Oltre quel legno consumato, qualcosa si è mosso. Qualcosa di pesante. Qualcosa che ha urtato il metallo nel tentativo di non farsi sentire."];
      const DIVANI = ["Ti muovi con cautela tra i divani mentre perdi la cognizione del tempo. Tasti la stoffa spessa e sorprendentemente calda, cercando una cucitura allentata, uno strappo o una vecchia macchia di sangue. Niente. Il tessuto è intatto e perfetto, un dettaglio che in questo posto ti mette solo addosso una gran paranoia."];
      const QUADRI = ["I tuoi occhi scorrono lungo la parete tappezzata di quadri. Ti avvicini e ne sposti qualcuno quel tanto che basta per sbirciare dietro le cornici, nella speranza di trovare un vano nascosto o qualche indizio. Ma non trovi nulla.", "La tua attenzione si sposta allora sulle immagini raffigurate. Sono i paesaggi a incuriosirti più di ogni altra cosa. Li studi attentamente, aspettandoti di riconoscere montagne, boschi o vallate vicine alla grotta dalla quale sei entrato.", "Eppure non riconosci nessun luogo.", "Le tele mostrano montagne dalle forme insolite, laghi immobili e terre che sembrano appartenere a regioni lontanissime, forse persino a un altro mondo.", "Con quel pensiero che continua a tormentarti, ti avvicini a una finestra. All'esterno si estende un elegante giardino nobiliare: basse siepi perfettamente curate, alberi secolari e una grande fontana dalla quale sgorga acqua cristallina.", "Sollevando lo sguardo oltre il giardino, il paesaggio torna invece familiare. Le colline e i boschi all'orizzonte assomigliano alle terre che conosci.", "Corrughi la fronte.", "Fuori dalla finestra c'è il tuo mondo. Nei quadri no.", "E per qualche ragione, la discrepanza ti lascia addosso una sottile e inspiegabile inquietudine."];
      const ORECCHIO_OK = ["Ti avvicini con cautela e appoggi l'orecchio alla superficie lignea. Rimani immobile per alcuni istanti, trattenendo persino il respiro. Dall'altra parte non giungono né voci, né passi, né il più piccolo rumore."];
      const ORECCHIO_KO = ["Ti avvicini alla porta e tendi l'orecchio, ma non senti nulla. Non sai dire se sia davvero silenzio o se qualcosa ti sfugga."];
      const ORECCHIO_GIA = "Hai già teso l'orecchio a quella porta: dall'altra parte non si sente nulla.";
      const LASCIA_SALA = "Lasci perdere e ti rimetti dritto, in mezzo alla sala.";
      return {
        foglietto: FOGLIETTO,
        luoghi: {
          porta_sx: {
            fisso: ["La porta domina la parete come l'ingresso a un luogo importante. È realizzata in legno scuro e pregiato, decorata da raffinati intarsi che rappresentano intricati motivi floreali ormai consumati dal tempo. Ai suoi lati, due fiaccole gettano una luce tremolante sulle venature del legno. Le fiamme oscillano lentamente, come se da qualche parte filtrasse una lieve corrente d'aria proveniente dall'altro lato.", "La porta è chiusa. Poggi la mano sul pomello: gira libero, a vuoto, senza far scattare nulla."]
          },
          porta_dx: {
            fisso: ["Una massiccia porta di legno pregiato occupa la parete destra. La superficie è ricoperta da elaborati intarsi che raffigurano scene di caccia e simboli nobiliari ormai consumati dal tempo.", "Le due fiaccole poste ai lati diffondono una luce instabile e le loro fiamme ondeggiano lievemente, come se oltre quella soglia vi fosse spazio sufficiente a generare un impercettibile movimento d'aria.", "La porta è già aperta: puoi attraversarla quando vuoi."],
            azione: "Appoggi l'orecchio alla porta di destra, cercando di capire cosa si nasconda dall'altra parte.",
            successo: ORECCHIO_OK, fallimento: ORECCHIO_KO, gia: { ok: ORECCHIO_GIA, ko: ORECCHIO_GIA }, lascia: "Ti allontani dalla porta senza insistere."
          },
          ascolto: {
            azione: "Resti in silenzio e tendi l'orecchio, cercando di cogliere ogni rumore nella dimora.", fisso: ASCOLTO,
            successo: ASCOLTO, fallimento: ASCOLTO, /* stessa descrizione di successo e fallimento */
            gia: { ok: "Hai già ascoltato con attenzione: non senti altro che il crepitio del camino.", ko: "Hai già ascoltato con attenzione: non senti altro che il crepitio del camino." }, lascia: LASCIA_SALA
          },
          divani: {
            azione: "Ti muovi con cautela tra i divani mentre perdi la cognizione del tempo. Tasti la stoffa spessa e sorprendentemente calda, cercando una cucitura allentata, uno strappo o una vecchia macchia di sangue.", fisso: [],
            successo: ["La suola s'inchioda con un sordo scricchiolio tra il divano e le finestre. Sotto il tuo peso: figurine di legno intagliato, piccoli omini rigidi e scheggiati, null'altro che giocattoli."],
            fallimento: ["Niente. Il tessuto è intatto e perfetto, un dettaglio che in questo posto ti mette solo addosso una gran paranoia."],
            gia: { ok: "Hai già frugato ovunque tra divani e tavolino: oltre ai giocattoli di legno non c'è altro da trovare.", ko: "Hai già frugato ovunque tra divani e tavolino: non c'è altro da trovare." }, lascia: LASCIA_SALA
          },
          quadri: {
            azione: "Studi i quadri alle pareti e guardi fuori dalla finestra, cercando qualcosa che non torni.", fisso: QUADRI,
            successo: QUADRI, fallimento: QUADRI,
            gia: { ok: "Hai già riflettuto su quadri e finestra: non ti viene in mente altro.", ko: "Hai già riflettuto su quadri e finestra: non ti viene in mente altro." }, lascia: LASCIA_SALA
          },
          camino: {
            azione: "Esamini da vicino il camino e le sculture della sua cornice.", fisso: [],
            successo: ["Ti avvicini al braciere, attirato dal vivido scoppiettìo del fuoco. Esaminando le sculture incise nella pietra della cornice, noti al centro dei bassorilievi una forma circolare sigillata: sembra uno stemma di famiglia privo di blasone."],
            fallimento: ["Ti avvicini al fuoco scoppiettante, passando le dita sulla cornice di pietra nel tentativo di decifrarne i dettagli. Le sculture in rilievo sono un groviglio di forme confuse ed erose dal tempo; tra i bassorilievi scorgi un tondo di pietra, ma non riesci a capire se sia un antico stemma o solo un ornamento incompiuto.", "Ti si annebbia la vista e un dolore sordo ti martella alla base del cranio: la frustrazione di non capire ti morde la mente."], fittaNelTesto: true,
            gia: { ok: "Hai già esaminato il camino: al centro dei bassorilievi c'è quella forma circolare sigillata, uno stemma senza blasone.", ko: "Hai già esaminato il camino, senza notare nulla di particolare." }, lascia: LASCIA_SALA
          },
          fiori: { fisso: ["Ti avvicini al tavolino posizionato tra le due poltrone. Il vaso ospita una composizione di fiori dai colori cupi e fin troppo vividi: al tatto i petali risultano freddi e leggermente rigidi."] },
          tavolino: { fisso: ["Passi la mano sul tavolino e ti guardi le dita controluce: neanche un granello di polvere. Sembra quasi che qualcuno pulisca la casa regolarmente. Fai scorrere le dita sotto la superficie, cercando a tentoni un cassetto nascosto, una leva o un meccanismo segreto. Ma tocchi soltanto legno liscio e freddo. Nessuna traccia."] },
          finestre: {
            azione: "Ti avvicini e pianti le mani sul davanzale. Fuori, diversi globi lunari squarciano il cielo: non sei decisamente a casa. Il giardino sotto di te è pietrificato, immobile e privo di vento, eppure, poco più in là, una fontana continua a zampillare acqua viva. Un contrasto assurdo che ti fa salire i brividi.", fisso: [],
            successo: [], fallimento: [], /* frasi standard: esito del tiro e, se fallita, la fitta alla mente */
            gia: { ok: "Hai già guardato fuori dalle finestre: non vuoi rivedere quel cielo.", ko: "Hai già guardato fuori dalle finestre: non vuoi rivedere quel cielo." }, lascia: LASCIA_SALA
          },
          arazzo_sx: {
            fisso: ["L'arazzo che ricopre la parete sinistra è imponente, tanto da sfiorare il pavimento con le sue pesanti pieghe. Fili scuri e dorati si intrecciano in un raffinato ricamo che raffigura un maestoso cervo dai palchi imponenti, ritratto con l'eleganza di una creatura regale.", "Osservandolo più attentamente, qualcosa attira la tua attenzione: la parte inferiore dell'arazzo appare leggermente più rigonfia rispetto al resto del tessuto, come se dietro quella piega si celasse qualcosa."],
            azione: "Esamini da vicino l'arazzo di sinistra, cercando cosa nasconda la piega rigonfia.",
            successo: ["Con delicatezza scosti il pesante drappo. Quando sollevi la piega inferiore, un piccolo oggetto scivola fuori e cade sul pavimento con un lieve fruscio.", "È un foglietto ingiallito dal tempo, ripiegato più volte.", "Lo raccogli e lo apri con cautela. L'inchiostro è sbiadito, ma la calligrafia rimane leggibile.", FOGLIETTO, "Le ultime parole sembrano tracciate da una mano tremante, in preda alla paura o alla disperazione.", "Per un momento il silenzio della sala si fa più pesante. Mentre richiudi il foglietto, hai la sensazione che quel fragile pezzo di carta porti con sé un fardello ben più grande del proprio peso."],
            fallimento: ["Scosti il pesante drappo e ne tasti la piega inferiore, ma non riesci a capire cosa ci sia dietro quel rigonfiamento. Dopo un po' ti arrendi e lasci ricadere il tessuto."], /* PROVVISORIO: da riscrivere */
            gia: { ok: "Dietro l'arazzo di sinistra non c'è altro: il foglietto di Adele è già nel tuo zaino.", ko: "Hai già provato con l'arazzo di sinistra e non riesci a cavarne altro." },
            lascia: "Lasci ricadere il pesante tessuto e fai un passo indietro. Qualunque cosa ci fosse, per ora resta dov'è."
          },
          arazzo_dx: { fisso: ["L'arazzo che ricopre la parete destra è grande e pesante quanto il suo gemello dall'altro lato della sala. Fili neri, cremisi e dorati compongono l'immagine di un possente leone dall'espressione fiera e dominante.", "Il ricamo è straordinariamente dettagliato: gli occhi sembrano quasi seguire i movimenti di chi passa davanti alla parete. Nonostante il trascorrere degli anni, il re delle bestie conserva tutta la propria imponenza."] },
          armatura_sx: { fisso: ["Accanto alla base della scalinata si erge un'armatura completa di ferro. Lucidata con cura, riflette la luce delle fiaccole in bagliori opachi. Sebbene sia chiaramente esposta come elemento decorativo, la fattura appare sorprendentemente solida.", "Hai visto cavalieri affrontare battaglie con equipaggiamenti ben peggiori di questo.", "Per un istante, osservando la visiera immobile, non puoi fare a meno di chiederti da quanto tempo sia lì a vegliare silenziosamente sulla sala."] },
          armatura_dx: { fisso: ["Sul lato opposto della scalinata, una seconda armatura monta una guardia silenziosa. Le placche di ferro sono assemblate con precisione e mostrano pochi segni di usura. Alla luce tremolante delle fiaccole sembra quasi che la figura metallica possa muoversi da un momento all'altro.", "Pur essendo soltanto ornamentale, appare robusta e affidabile.", "In verità, hai visto guerrieri entrare in guerra con protezioni decisamente meno convincenti."] },
          armatura: { fallback: ["In cima alla scalinata l'armatura scintilla sotto i riflessi della vetrata. I suoi guanti sorreggono una lunga spada dalla fattura impeccabile, come se attendessero il ritorno del loro proprietario. Alle sue spalle, l'uomo della vetrata ti fissa con la stessa armatura e la stessa spada. Non servono presentazioni: è il padrone di casa."] },
          soffitto: { fallback: ["Alzi lo sguardo. Il soffitto è un'opera d'arte straordinaria: splendidi affreschi angelici si susseguono sopra di te, dipinti con una maestria tale da sembrare quasi vivi. I colori sono vivaci, privi di qualsiasi segno del tempo, come se qualcuno se ne prendesse cura ogni singolo giorno."] },
          fiaccole: { fallback: ["Sfiori una delle fiaccole fissate alla parete, ma ti accorgi subito che non emana alcun calore. La fiamma continua a tremare, indifferente."] },
          tappeto: { fallback: ["Il marmo bianco è lucidissimo, quasi uno specchio. Sul pavimento si stendono tappeti preziosi: il più grande domina il centro della sala, senza una macchia, senza un filo fuori posto."] },
          stanza: { fallback: ["Ti guardi intorno senza fretta: il marmo lucido, gli arazzi alle pareti, le due porte ai lati e la scalinata che sale verso l'armatura. Tutto è curato come se nessuno avesse mai smesso di abitare qui."] },
          /* PROVVISORIO: guardare le scale dal basso (diverso da salirle) */
          scale_guarda: { fisso: ["Ti fermi ai piedi della scalinata e ne segui con lo sguardo l'ampia salita. I gradini di marmo sono lucidi come se nessuno li avesse mai calpestati, e il lungo tappeto cremisi li ricopre fino al pianerottolo.", "Ai lati del primo gradino, le due armature decorative vegliano immobili. Più in alto, la luce della vetrata scende lungo la scala come un velo colorato, e l'armatura sul pianerottolo sembra attendere che qualcuno si decida a salire."] },
          /* PROVVISORIO: guardare la sala da pranzo dalla soglia (diverso da entrarci) */
          pranzo_guarda: { fisso: ["Dalla soglia della porta a doppio battente lanci uno sguardo nella sala accanto. Intravedi il bordo di un lungo tavolo di legno scuro e il bagliore freddo dell'argenteria sotto la luce azzurra delle fiaccole.", "Il resto della stanza si perde nella penombra: per vederla davvero dovresti entrare."] },
          /* prove dichiarate dal giocatore nella sala da conversazione («faccio una prova di percezione») */
          pranzo_percezione: {
            fisso: [],
            azione: "Avanzi con cautela tra il tavolo e le finestre, percependo un'anomalia nell'aria. Il camino accoglie un fuoco che danza vivido, eppure non ne proviene alcun crepitio: brucia in un silenzio innaturale. Fuori, oltre i vetri, la vista del giardino si ripete in modo inquietante, identica a quella della stanza appena lasciata. Avvicinandoti al focolare, noti lo stemma di famiglia che domina solenne la cornice di pietra e, poco oltre l'angolo a sinistra, una porta chiusa.",
            /* PROVVISORIO: testi di esito scritti da me */
            successo: ["Ti fermi e trattieni il fiato. Da dietro la porta chiusa giunge un rumore ben distinguibile: il tintinnio di stoviglie, piatti posati uno sull'altro, il cozzare leggero di posate raccolte in fretta."],
            fallimento: ["Tendi l'orecchio, ma la sala ti restituisce soltanto silenzio. Un silenzio denso, assoluto, che sembra assorbire perfino il suono del tuo respiro e dei tuoi passi sul pavimento. Il fuoco danza muto nel camino, le sedie restano immobili attorno al tavolo e, più a lungo ascolti, più quel nulla ti preme sulle orecchie come acqua profonda."],
            gia: { ok: "Hai già teso l'orecchio: dalla porta chiusa giunge ancora, a tratti, il tintinnio delle stoviglie.", ko: "Hai già teso l'orecchio: la sala resta immersa nel suo silenzio innaturale." },
            lascia: "Lasci perdere e ti rimetti in mezzo alla sala."
          },
          credenza: { fisso: ["Avanzi tra il tavolo e la credenza, sfiorando la superficie liscia e levigata del legno. Apri i battenti del mobile in cerca di un indizio, ma l'interno custodisce soltanto corredi di casa: tovaglie pregiate, piatti di porcellana e posate disposte con ordine, tutto l'occorrente per apparecchiare una tavola formale."] },
          pranzo_niente: { fisso: ["Osservi con attenzione, ma non noti nulla che la sala non ti abbia già mostrato."] }, /* PROVVISORIO */
          pranzo_porta: { fisso: ["Poco oltre l'angolo a sinistra del camino si apre una porta di legno scuro, sobria rispetto al resto della sala. Il pomello è freddo, ma gira senza opporre resistenza."] }, /* PROVVISORIO */
          /* corridoio – anticamera */
          corr_percezione: {
            fisso: [], azione: "Ti fermi in mezzo al corridoio, trattieni il respiro e tendi ogni senso verso l'unica porta che vi si affaccia, sulla sinistra.", fittaNelTesto: true,
            successo: ["Il rumore proviene distintamente dalla porta alla tua sinistra, attualmente chiusa. Oltre la superficie intagliata, distingui chiaramente il tintinnìo rapido di pentole e il ticchettìo incalzante di tacchi femminili che si muovono a passo svelto all'interno della stanza adiacente."],
            fallimento: ["Spingi i tuoi sensi oltre il limite nel tentativo di cogliere un movimento o un respiro, ma la tua mente è troppo tesa per decifrare l'oscurità. L'aria nel corridoio è gelida e immobile, satura di un odore polveroso che ti secca la gola.", "Appoggi delicatamente l'orecchio alla porta nel vano tentativo di ascoltare al di là, ma il silenzio è così sordo e pressante da far risuonare nella tua testa soltanto il battito del tuo stesso cuore: un ritmo accelerato, martellante, che tradisce l'ansia strisciante pronta ad arrampicarsi lungo la schiena. Un nodo di pura paranoia ti serra il petto, soffocandoti il fiato mentre ti lasci sopraffare dall'incertezza totale su cosa possa celarsi al di là di quell'ombra sorda."],
            gia: { ok: "Hai già teso l'orecchio: dalla porta a sinistra giungono ancora pentole e passi svelti di tacchi.", ko: "Hai già teso l'orecchio, ma il silenzio del corridoio non ti restituisce nulla." },
            lascia: "Lasci perdere e ti rimetti in cammino lungo il corridoio."
          },
          corr_porte: { fisso: ["Ti avvicini alla porta sulla sinistra, l'unica presente nel corridoio. È chiusa, ma quando appoggi la mano sul pomello senti che gira libero: non c'è serratura a trattenerla, basterebbe spingere per aprirla."] },
          corr_apri: { fisso: ["Stringi il pomello e lo senti girare libero sotto le dita: la porta è pronta ad aprirsi. Ma per ora esiti, la mano ferma sul legno intagliato."] }, /* non più usata: la porta ora porta in cucina */
          corr_niente: { fisso: ["Osservi con attenzione, ma il corridoio non ha nulla di utile da offrirti: solo pannelli scuri, fiamme azzurre e il riflesso freddo del pavimento."] }, /* PROVVISORIO */
          /* atrio: prove dichiarate con tiro (d20 + abilità, soglia 10) */
          atrio_percezione: {
            fisso: [], azione: "Ti fermi al centro dell'atrio e tendi ogni senso.", fittaNelTesto: true,
            successo: ["Il tuo sguardo viene immediatamente rapito dall'imponente vetrata di fronte a te: vi è raffigurato con maestria il padrone di casa, dietro ad una sua antica armatura. Poi l'udito cattura il chiaro crepitìo di un fuoco acceso provenire dalla porta alla tua destra; infine distingui un penetrante odore stantio di legna bruciata e cenere, che però non riesci ad associare alla legna che arde, quanto piuttosto a un fuoco spento."],
            fallimento: ["Tenti di aguzzare i sensi, ma lo sconcerto rallenta i tuoi riflessi. I tuoi occhi spaziano febbrili nell'ambiente senza riuscire a cogliere un solo dettaglio utile; le orecchie lottano contro un silenzio denso e innaturale, mentre le narici sono ancora saturate dallo stantìo odore di sottobosco e terra umida dell'esterno."],
            gia: { ok: "Hai già teso i sensi nell'atrio: la vetrata, il crepitio oltre la porta di destra, quell'odore di cenere.", ko: "Hai già provato a tendere i sensi, ma sei ancora troppo frastornato." },
            lascia: "Lasci perdere e ti guardi intorno."
          },
          atrio_indagare: {

            fallimento: ["Nothing. The upholstery is intact and flawless, a detail that in this place only fills you with deep paranoia."],
            gia: { ok: "You have already searched every inch of the sofas and the table: beyond the wooden toys there is nothing more to find.", ko: "You have already searched every inch of the sofas and the table: there is nothing more to find." }, lascia: LASCIA_SALA
          },
          quadri: {
            azione: "You study the paintings on the walls and look out of the window, searching for something that doesn't add up.", fisso: QUADRI,
            successo: QUADRI, fallimento: QUADRI,
            gia: { ok: "You have already pondered the paintings and the window: nothing else comes to mind.", ko: "You have already pondered the paintings and the window: nothing else comes to mind." }, lascia: LASCIA_SALA
          },
          camino: {
            azione: "You take a close look at the fireplace and the carvings on its mantel.", fisso: [],
            successo: ["You approach the hearth, drawn by the lively crackle of the fire. Examining the carvings cut into the stone of the mantel, you notice a sealed circular shape at the centre of the reliefs: it looks like a family crest with no coat of arms."],
            fallimento: ["You approach the crackling fire, running your fingers over the stone mantel as you try to make out its details. The carvings are a tangle of shapes, blurred and worn by time; among the reliefs you glimpse a stone roundel, but you cannot tell whether it is an ancient crest or merely an unfinished ornament.", "Your sight blurs and a dull pain hammers at the base of your skull: the frustration of not understanding gnaws at your mind."], fittaNelTesto: true,
            gia: { ok: "You have already examined the fireplace: at the centre of the reliefs there is that sealed circular shape, a crest without a coat of arms.", ko: "You have already examined the fireplace without noticing anything in particular." }, lascia: LASCIA_SALA
          },
          fiori: { fisso: ["You step over to the low table set between the two armchairs. The vase holds an arrangement of flowers in dark, all too vivid colours: to the touch the petals feel cold and slightly stiff."] },
          tavolino: { fisso: ["You run your hand over the low table and look at your fingers against the light: not a single speck of dust. It almost seems as if someone cleans the house regularly. You slide your fingers under the surface, groping for a hidden drawer, a lever or a secret mechanism. But you touch only smooth, cold wood. No trace."] },
          finestre: {
            azione: "You step closer and plant your hands on the windowsill. Outside, several moons tear through the sky: you are definitely not at home. The garden below is petrified, motionless and without a breath of wind, and yet, a little further on, a fountain keeps spouting living water. An absurd contrast that sends shivers through you.", fisso: [],
            successo: [], fallimento: [],
            gia: { ok: "You have already looked out of the windows: you do not want to see that sky again.", ko: "You have already looked out of the windows: you do not want to see that sky again." }, lascia: LASCIA_SALA
          },
          arazzo_sx: {
            fisso: ["The tapestry covering the left-hand wall is imposing, so large that its heavy folds brush the floor. Dark and golden threads intertwine in a refined embroidery depicting a majestic stag with towering antlers, portrayed with the elegance of a regal creature.", "Looking more closely, something catches your eye: the lower part of the tapestry seems slightly more swollen than the rest of the fabric, as if something were hidden behind that fold."],
            azione: "You examine the left-hand tapestry up close, trying to find what the bulging fold conceals.",
            successo: ["You gently draw the heavy hanging aside. As you lift the lower fold, a small object slips out and falls to the floor with a faint rustle.", "It is a slip of paper yellowed with age, folded several times.", "You pick it up and open it carefully. The ink has faded, but the handwriting is still legible.", FOGLIETTO, "The last words seem traced by a trembling hand, in the grip of fear or despair.", "For a moment the silence of the hall grows heavier. As you fold the note again, you have the feeling that this fragile scrap of paper carries a burden far greater than its own weight."],
            fallimento: ["You draw the heavy hanging aside and feel along the lower fold, but you can't work out what lies behind that bulge. After a while you give up and let the fabric fall back."],
            gia: { ok: "There is nothing else behind the left-hand tapestry: Adele's note is already in your pack.", ko: "You have already tried the left-hand tapestry and can get nothing more out of it." },
            lascia: "You let the heavy fabric fall back and take a step away. Whatever was there, for now it stays where it is."
          },
          arazzo_dx: { fisso: ["The tapestry covering the right-hand wall is as large and heavy as its twin on the other side of the hall. Black, crimson and golden threads form the image of a mighty lion with a proud, commanding expression.", "The embroidery is extraordinarily detailed: its eyes almost seem to follow anyone who passes in front of the wall. Despite the passing years, the king of beasts keeps all of its majesty."] },
          armatura_sx: { fisso: ["Beside the foot of the staircase stands a full suit of iron armor. Carefully polished, it reflects the torchlight in dull gleams. Although it is clearly displayed as a decoration, its workmanship looks surprisingly solid.", "You have seen knights ride into battle with far worse gear than this.", "For a moment, gazing at the motionless visor, you can't help wondering how long it has stood there, silently watching over the hall."] },
          armatura_dx: { fisso: ["On the opposite side of the staircase, a second suit of armor keeps silent guard. Its iron plates are assembled with precision and show few signs of wear. In the flickering torchlight it almost seems the metal figure could move at any moment.", "Though merely ornamental, it looks sturdy and dependable.", "In truth, you have seen warriors go to war with far less convincing protection."] },
          armatura: { fallback: ["At the top of the staircase the armor gleams beneath the reflections of the window. Its gauntlets hold a long sword of flawless make, as if awaiting the return of their owner. Behind it, the man in the window stares at you wearing the same armor and the same sword. No introductions are needed: he is the master of the house."] },
          soffitto: { fallback: ["You look up. The ceiling is an extraordinary work of art: splendid angelic frescoes follow one another above you, painted with such mastery that they seem almost alive. The colours are vivid, free of any sign of age, as if someone tended them every single day."] },
          fiaccole: { fallback: ["You brush one of the torches fixed to the wall, but you notice at once that it gives off no heat. The flame keeps trembling, indifferent."] },
          tappeto: { fallback: ["The white marble is highly polished, almost a mirror. Precious carpets lie across the floor: the largest dominates the centre of the hall, without a stain, without a thread out of place."] },
          stanza: { fallback: ["You look around unhurriedly: the polished marble, the tapestries on the walls, the two doors at the sides and the staircase climbing towards the armor. Everything is kept as if no one had ever stopped living here."] },
          scale_guarda: { fisso: ["You stop at the foot of the staircase and follow its broad ascent with your eyes. The marble steps gleam as if no one had ever set foot on them, and the long crimson carpet covers them all the way up to the landing.", "On either side of the first step, the two decorative suits of armor keep their motionless watch. Higher up, the light from the window flows down the stairs like a coloured veil, and the armor on the landing seems to be waiting for someone to make up their mind and climb."] },
          pranzo_guarda: { fisso: ["From the threshold of the double door you cast a glance into the next room. You glimpse the edge of a long table of dark wood and the cold gleam of silverware under the blue light of the torches.", "The rest of the room is lost in half-light: to truly see it, you would have to go in."] },
          pranzo_percezione: {
            fisso: [],
            azione: "You move cautiously between the table and the windows, sensing something wrong in the air. The fireplace holds a fire that dances vividly, and yet no crackle comes from it: it burns in an unnatural silence. Outside, beyond the panes, the view of the garden repeats itself unsettlingly, identical to that of the room you just left. Drawing closer to the hearth, you notice the family crest presiding solemnly over the stone mantel and, just past the left-hand corner, a closed door.",
            successo: ["You stop and hold your breath. From behind the closed door comes a clearly distinguishable sound: the clink of crockery, plates set one upon another, the light clatter of cutlery gathered in haste."],
            fallimento: ["You strain your ears, but the hall gives you back nothing but silence. A dense, absolute silence that seems to swallow even the sound of your breathing and of your steps on the floor. The fire dances mutely in the hearth, the chairs stand motionless around the table and, the longer you listen, the more that nothingness presses on your ears like deep water."],
            gia: { ok: "You have already listened closely: from the closed door the clink of crockery still comes, now and then.", ko: "You have already listened closely: the hall remains sunk in its unnatural silence." },
            lascia: "You let it go and step back into the middle of the hall."
          },
          credenza: { fisso: ["You make your way between the table and the sideboard, brushing the smooth, polished surface of the wood. You open the cabinet doors in search of a clue, but inside there is only household linen: fine tablecloths, porcelain plates and neatly arranged cutlery, everything needed to lay a formal table."] },
          pranzo_niente: { fisso: ["You look closely, but you notice nothing the hall has not already shown you."] },
          pranzo_porta: { fisso: ["Just past the left-hand corner of the fireplace stands a door of dark wood, plain compared with the rest of the hall. The knob is cold, but it turns without resistance."] },
          corr_percezione: {
            fisso: [], azione: "You stop in the middle of the corridor, hold your breath and strain every sense towards the only door that opens onto it, on the left.", fittaNelTesto: true,
            successo: ["The noise comes distinctly from the door on your left, which is currently closed. Beyond its carved surface you can clearly make out the quick clatter of pans and the urgent tapping of women's heels moving briskly about the adjoining room."],
            fallimento: ["You push your senses past their limit, trying to catch a movement or a breath, but your mind is too tense to decipher the darkness. The air in the corridor is icy and still, heavy with a dusty smell that dries your throat.", "You gently press your ear to the door in a vain attempt to listen beyond it, but the silence is so dull and oppressive that the only thing echoing in your head is the beat of your own heart: a racing, hammering rhythm that betrays the creeping anxiety ready to climb up your spine. A knot of pure paranoia tightens in your chest, choking your breath as you are overwhelmed by utter uncertainty about what might lie beyond that muffled shadow."],
            gia: { ok: "You have already listened closely: pans and quick footsteps of heels still come from the door on the left.", ko: "You have already listened closely, but the silence of the corridor gives you nothing back." },
            lascia: "You let it go and set off along the corridor again."
          },
          corr_porte: { fisso: ["You approach the door on the left, the only one in the corridor. It is closed, but when you rest your hand on the knob you feel it turn freely: there is no lock holding it, a push would be enough to open it."] },
          corr_apri: { fisso: ["You grip the knob and feel it turn freely under your fingers: the door is ready to open. But for now you hesitate, your hand still on the carved wood."] },
          corr_niente: { fisso: ["You look closely, but the corridor has nothing useful to offer you: only dark panelling, blue flames and the cold gleam of the floor."] },
          atrio_percezione: {
            fisso: [], azione: "You stop in the middle of the hall and strain every sense.", fittaNelTesto: true,
            successo: ["Your gaze is immediately seized by the imposing stained-glass window before you: it masterfully depicts the master of the house, standing behind an ancient suit of his armor. Then your ears catch the clear crackle of a lit fire coming from the door on your right; finally you make out a pungent, stale smell of burnt wood and ash, which you cannot connect to burning wood so much as to a fire long dead."],
            fallimento: ["You try to sharpen your senses, but bewilderment dulls your reflexes. Your eyes roam the space feverishly without catching a single useful detail; your ears struggle against a dense, unnatural silence, while your nostrils are still full of the stale smell of undergrowth and damp earth from outside."],
            gia: { ok: "You have already strained your senses in the hall: the stained glass, the crackle beyond the right-hand door, that smell of ash.", ko: "You have already tried to strain your senses, but you are still too dazed." },
            lascia: "You let it go and look around."
          },
          atrio_indagare: {
            fisso: [], azione: "You move around the hall with a watchful eye, determined not to let a single detail escape you.",
            successo: ["You start on your right and brush the wood of a small table: the surface is oily, freshly finished. Moving towards the door, an icy draught brushes your face. You carry on to the great tapestry on the wall, dominated by the imposing effigy of a lion.", "You move to the centre of the hall, staring at the motionless suits of armor. Fearing a sudden ambush, you instinctively bring your hand to the hilt of your weapon. Your gaze is inevitably drawn to the figure at the top of the staircase; you shake your head to dispel the tension and head for the left side of the room. Inspecting the wall, you notice what looks like an unnatural bulge in the lower part of the tapestry depicting a regal stag.", "Finally you reach the door on the left and press your ear to it, trying to catch something. Nothing. Only a deathly silence."],
            fallimento: ["You start on your right and brush the wood of a small table: the surface is oily, freshly finished. You carry on to the great tapestry on the wall, dominated by the imposing effigy of a lion.", "You move to the centre of the hall, staring at the motionless suits of armor. Fearing a sudden ambush, you instinctively bring your hand to the hilt of your weapon. Your gaze is inevitably drawn to the figure at the top of the staircase; you shake your head to dispel the tension and head for the left side of the room. Inspecting the wall, you notice what looks like an unnatural bulge in the lower part of the tapestry depicting a regal stag.", "Finally you reach the door on the left and press your ear to it, trying to catch something. Nothing. Only a deathly silence."],
            gia: { ok: "You have already searched the hall from top to bottom.", ko: "You have already searched the hall from top to bottom." },
            lascia: "You give up the search."
          },
          ritratto: {
            fisso: [], azione: "You raise your eyes to the great portrait above the fireplace and study its frame, wondering whether it hides something.",
            successo: ["Rising on tiptoe, you reach the frame and try to move it. But a sharp metallic «clack», like the mechanism of a lock, rings out inside, stopping you from shifting it and confirming that there is something to unlock. You also realise you are not high enough to move the frame comfortably: you will have to find a stool or a small ladder to lift yourself up there."],
            fallimento: ["You stretch up on tiptoe, struggling to grasp the edge of the frame. You try to shift it, but the painting stays stubbornly fixed to the wall. Between the effort and your precarious position, you cannot tell whether it is simply too heavy, fastened with old rusty nails or held by something more complex."],
            fitte: [
              "A sudden anxiety grips your chest: the irrational certainty that something is about to happen, right behind you. The walls of the parlour seem to draw closer, the ceiling to sink, and for a moment the air grows so thick you can barely breathe.",
              "For a moment the portrait seems to lean towards you, and the floor sways like the deck of a ship. The noblewoman's eyes seem to move; you grip the mantelpiece as the room turns slowly around you, until everything settles, with effort, back into place."
            ],
            bassi: ["You put your height to the test, stretching up on tiptoe, but to no avail: the frame is far too high. You will have to find a stool or a small ladder to lift yourself up there."],
            gia: { ok: "You have already examined the frame: there is a mechanism to unlock, but you need a stool or a small ladder to reach it comfortably.", ko: "You have already tried to shift the frame, without making sense of it." },
            lascia: "You leave the portrait alone and look around again."

            fallimento: ["No revelation. Only the horrid crackle of the hearth devouring the wood and the obsessive shrilling of the cicadas in the darkness of the garden. A pall of silence and dread keeps smothering your every sense."],

            fallimento: ["You wander the room looking for something useful, for clues, but you are caught by the warmth of the brazier burning merrily and you hold out your hands as if to warm them. The memory of home overwhelms you and you resume your search, though for what, deep down, you don't even know."],

          foresta_falo: { fisso: ["You crouch by the campfire and hold your hands out to the flames. The wood crackles and spits sparks that rise towards the mouth of the cave, then die in the dark. It is the last warmth you will feel for a long time.", "More wood is stacked beside the fire: dry branches, a few of them straight and sturdy enough to make a torch."] },
          foresta_lanterna: { fisso: ["The lantern rests on the blanket, beside the pack. The little flame trembles behind the blackened glass: the oil is almost gone and barely lights the camp.", "It would not last ten steps in there."] },
          foresta_grotta: { fisso: ["The mouth of the cave gapes in the rock, framed by twisted roots and moss. The firelight reaches only its first few steps; beyond, the darkness is total.", "A cold, still air rises from within, smelling neither of earth nor of damp. It smells stale, like a room left barred for far too long."] },
          foresta_bosco: { fisso: ["Ancient trees crowd around the clearing, their branches knotted like gnarled fingers. Between the trunks the sky burns orange and purple, and the shadows lengthen before your eyes.", "No bird sings. Even the forest seems to hold its breath."] },
          portone: { fisso: ["Behind you, where the mouth of the cave once opened, stands an imposing entrance door of dark wood. Its leaves are finely carved: vines, crests and figures intertwining up to the lintel, so dense the eye gets lost in them.", "Of the cave and the forest, no trace remains."] },
          foresta_campo: { fisso: ["Your whole camp is right there: the striped blanket spread on the grass, the explorer's pack with its rolled bedroll, the dagger resting on a log and the sword leaning against the rock, near the fire.", "Everything is in its place, as if you had wanted to put off the moment of going in a little longer."] }
        },

          portone: "Instinctively you turn around. The mouth of the cave you came through has vanished: in its place stands an imposing door of dark wood, finely carved and sealed.",
          torciaSpenta: "At that very moment, the torch flame dies, smothered by an invisible grip. The brand is instantly cold, the pitch already turned to stone. Useless. You let it fall onto the marble with a dull thud.",

              "The knob turns and turns between your fingers, as useless as the key to a cell thrown away. You rest your forehead against the cold wood: before you a door that will not open, behind you a sealed entrance. The walls of the hall seem to close in by a step.",

          portoneChiuso: ["You grasp the handles and push the heavy leaves, then try pulling them towards you. The door does not budge an inch.", "It is locked. In the middle, among the carvings, you notice a massive keyhole: it looks like you need a key."],

        stanze: {
          foresta: {
            intro: [
              "The sun sinks behind the ancient trees, staining the sky an unnatural purple and a sickly yellow: your time is up. Your small camp at the mouth of the cave is the last fragile bulwark against the advancing darkness. The campfire crackles softly, casting long, restless shadows on the rock, while the lantern and the pack lie ready, offering a light as feeble as your courage.",
              "You grip the hilt of the weapon resting on the ground: a habitual gesture, but your hand is shaking. A gust of icy, stale air escapes from the cavern, as if to smother the flame. It is the breath of the Dwelling of Evil, as the nearby villages call it. They say its rocks swallow anyone who enters and that the darkness itself is alive.",
              "You swallow hard, your heart pounding like a drum against your ribs. You try to steel yourself, but the feeling of being watched, not by a beast but by the darkness itself, is almost paralysing. You make ready to cross the threshold of the cave, knowing that no one has ever come out of that black chasm alive."
            ],
            fallbackLibera: ["You try, but there is nothing useful out here in that regard. The campfire, the lantern, the camp and the mouth of the cave are what surround you."],
            ritorno: ["You step back outside, to the camp. The fire is still crackling, and its warmth feels like a gift after the chill of the cave."]
          },
          buio: {
            intro: ["You cross the threshold and take a few steps into the cave. Behind you the glow of the campfire fades, then vanishes altogether.", "The darkness is total: you cannot even see your own hands."],
            fallbackLibera: ["In total darkness there is nothing useful you can do."],
            ritorno: ["You cross the threshold again. The firelight dies behind you and the darkness swallows you."]
          },
          atrio: {
            fallbackLibera: ["You try, but the entrance hall offers nothing useful in that regard. The tapestries, the two doors, the frescoed ceiling and the staircase are what you can explore."],
            ritorno: ["You return to the entrance hall. The polished marble reflects the flicker of the eternal torches, while the staircase climbs silently towards the landing."]
          },
          sala_caccia: {
            intro: [
              "You cross the threshold and enter a low-ceilinged room panelled in dark wood. Along the walls hang the mounted heads of stags, boars and wolves, their glass eyes catching the uncertain torchlight. An enormous stone fireplace, cold for who knows how long, dominates the far wall; bearskins serve as rugs on the floor.",
              "A long oak table fills the middle of the room, surrounded by high-backed chairs. Spears, bows and crossbows hang on the walls in perfect order, gleaming as if someone still used them. The air smells of wood, leather and old ash."
            ],
            nota: "To go back to the entrance hall, write for example “I go back to the hall”.",
            fallbackLibera: ["You try, but the room offers nothing useful in that regard. To return to the entrance hall, just say so."],
            ritorno: ["You return to the hunting room. The glass eyes of the mounted heads still seem to follow you."]
          },
          sala_conversazione: {
            intro: [
              "You leave the door behind you, closing it with a muffled thud. All at once you are welcomed by the warmth of an elegant parlour, clearly designed for resting, receiving guests and easing conversation. The space that welcomes you exudes a lavish, decadent elegance: the air is steeped in the scent of wood and wax, while the ghostly glints of the blue torches dance across the walls. Beneath your boots, thick carpets with elaborate patterns muffle every single step, wrapping the room in an almost muffled silence.",
              "In the middle of the broad hall lies a refined gathering place: soft sofas and comfortable velvet-upholstered armchairs are arranged around a low table of fine craftsmanship. Around them, lush ornamental plants thrive in finely decorated urns, adding a touch of life to an otherwise motionless room.",
              "Before you, a majestic fireplace of finely carved stone dominates the scene, a lively fire of orange and crimson hues burning within. Towering right above the mantelpiece stands the true heart of the room: the imposing full-length portrait of a noblewoman. Her painted eyes seem to stare at you with stern rigidity, dominating the whole hall with an almost tangible presence. Surely she is the lady of the house.",
              "To your right, a wide window reveals the orderly outlines of a garden tended down to the smallest detail. Between the wall torches hang finely framed paintings of still lifes and melancholic landscapes you cannot recognise.",
              "To your right, instead, opens a large double door. From here you can only glimpse the gleam of silverware and the long tables of a vast dining hall waiting to be explored."

    /* ---------- Salvataggio manuale ----------
       Il gioco NON salva da solo: i progressi restano in memoria finché non si preme «Salva partita».
       Ricaricando la pagina si riparte dall'ultimo salvataggio (o da zero, se non ce n'è uno). */
    const CHIAVE_SALVATAGGIO = "partita";
    let salvata = null;
    try { salvata = JSON.parse(localStorage.getItem(CHIAVE_SALVATAGGIO)); } catch (e) {}
    if (!salvata || typeof salvata !== "object" || Array.isArray(salvata)) salvata = null;
    let daSalvare = false;
    let ultimoSalvataggio = salvata && salvata.ora ? Number(salvata.ora) : null;

    function aggiornaBarra() {
      const el = document.getElementById("statoSalvataggio");
      if (!el) return;
      const ora = (ms) => new Date(ms).toLocaleTimeString(Lingua.locale(), { hour: "2-digit", minute: "2-digit" });
      el.textContent = daSalvare ? U.nonSalvate : ultimoSalvataggio ? U.salvataAlle(ora(ultimoSalvataggio)) : U.nessunSalvataggio;
      el.classList.toggle("da-salvare", daSalvare);
    }
    function modificato() { daSalvare = true; aggiornaBarra(); }
    window.addEventListener("beforeunload", (e) => { if (daSalvare) { e.preventDefault(); e.returnValue = ""; } });

    const FATTI_ATRIO = "Atrio sontuoso di un dungeon: pavimento di marmo bianco lucidissimo con bei tappeti; alle pareti imponenti arazzi illuminati da fiaccole eterne, a sinistra uno con un cervo dai palchi imponenti, a destra uno con un leone; due porte di legno pregiato intarsiato, una a sinistra e una a destra, con due fiaccole ai lati; di fronte una scalinata sale al piano superiore, ai cui piedi stanno due armature decorative di ferro (una a sinistra e una a destra); sul pianerottolo riposa un'armatura scintillante con una lunga spada, davanti a una vetrata che raffigura il padrone di casa con la stessa armatura; alle spalle di chi entra un imponente portone d'ingresso finemente intagliato, chiuso a chiave (dove prima c'era l'ingresso della grotta).";

    const PROVA_INDAGARE = { abilita: "Indagare", dado: 10, cd: 8 };

    const PROVA_PERCEZIONE = { abilita: "Percezione", dado: 10, cd: 10 };

    /* Luoghi con "fisso": testi scritti a mano, uguali in ogni partita (l'IA non interviene).

    const MECCANICA = {

    /* «faccio una prova di …»: abilità che in questa stanza hanno un tiro vero; le altre danno le frasi predefinite */
    const PROVE_DICHIARATE = { sala_conversazione: { Percezione: "conv_percezione", Indagare: "ritratto" }, sala_pranzo: { Percezione: "pranzo_percezione", Indagare: "credenza" }, corridoio: { Percezione: "corr_percezione" }, atrio: { Percezione: "atrio_percezione", Indagare: "atrio_indagare" } }; /* VUOTA: da definire */
    const LUOGHI = {};
    /* cantina (missione 1): prove con un seguito (poi) */
    Object.assign(MECCANICA, {

    });
    for (const l of ["it", "en"]) Object.assign(TESTI[l].luoghi, QT[l].luoghi);

    for (const id in MECCANICA) LUOGHI[id] = { ...MECCANICA[id], ...TX.luoghi[id] };

    const STANZE_FATTI = {
      foresta: "Radura nella foresta al tramonto, cielo arancione e porpora tra alberi secolari dai rami contorti; l'ingresso di una grotta nella roccia, incorniciato da radici e muschio, buio all'interno; davanti l'accampamento del personaggio: falò crepitante con legna accatastata accanto, zaino da esploratore con giaciglio arrotolato, coperta a righe sull'erba, lanterna quasi a secco, un pugnale su un ciocco e una spada appoggiata alla roccia. Nei villaggi la grotta è detta dimora del male: nessuno ne è mai uscito vivo.",
      buio: "Appena dentro la grotta: buio totale, non si vede nulla, nemmeno le proprie mani; aria fredda e immobile; alle spalle l'uscita verso l'accampamento.",
      atrio: FATTI_ATRIO,
      sala_caccia: "Sala della caccia: soffitto basso, pannelli di legno scuro, teste imbalsamate di cervi, cinghiali e lupi con occhi di vetro, enorme camino di pietra spento sulla parete di fondo, pelli d'orso sul pavimento, lungo tavolo di quercia al centro con sedie dall'alto schienale, lance, archi e balestre appesi in ordine e ben lucidi, odore di legno, cuoio e vecchia cenere. Si torna nell'atrio dalla porta da cui si è entrati.",
      sala_conversazione: "Sala da conversazione: ampia e sfarzosa, al centro divani e poltrone attorno a un basso tavolino di pregiata fattura; di fronte all'ingresso un grande camino di pietra scolpita con fuoco vivo arancione e cremisi, calore e profumo di legna e cera; sopra il camino l'imponente ritratto a figura intera di una nobildonna dallo sguardo severo, la padrona di casa; a destra una grande vetrata su un giardino curato nei minimi dettagli; pareti con fiaccole eterne azzurre e quadri (nature morte e paesaggi lontani); spessi tappeti elaborati simili a quelli dell'atrio; molte piante ornamentali; sulla parete destra una grande porta a doppio battente spalancata da cui si intravedono una vasta sala da pranzo, lunghi tavoli e argenteria. Si torna nell'atrio dalla porta da cui si è entrati.",
      cucina: "Cucina: calore denso e profondo; impeccabile, fin troppo perfetta; imponenti credenze di legno scuro finemente intagliato alle pareti con vetrine ad arco che riflettono la luce; soffitto a cassettoni con un grande candelabro di ferro battuto a candele; al centro un'imponente isola di pietra e legno che racchiude un focolare scoppiettante; camino acceso in fondo alla stanza; pavimento di parquet lucido con ombre lunghe e danzanti; pentole che sobbollono sui fornelli senza che nessuno le mescoli; utensili appesi alle pareti in un ordine quasi maniacale; profumo di cibo che ricorda casa, ma una solennità inquietante nell'aria. Poco dopo la prima azione del giocatore in cucina, una porta in fondo si apre ed entra Guendalina, la governante: donna magra e pallida, capelli ramati raccolti striati di grigio, occhi cerchiati e sguardo fisso, abito scuro con colletto alto e grembiule chiaro, mani giunte davanti a sé. Si torna nel corridoio dalla porta da cui si è entrati.",
      corridoio: "Corridoio – anticamera: lungo e in penombra, pannelli di legno scuro intagliati, un'unica porta massiccia sulla sinistra (l'unica del corridoio), chiusa ma non a chiave: il pomello gira libero, lesene decorate, applique a più bracci con candele dalle fiamme azzurre, soffitto a cassettoni con lampadario di cristallo dalla luce azzurra, pavimento lucido che riflette le fiamme, basse credenze intagliate. Dalla porta a sinistra possono giungere rumori di pentole e passi. Si torna nella sala da pranzo dalla porta da cui si è entrati.",
      sala_pranzo: "Sala da pranzo: sontuosa e spettrale, silenzio tombale, odore acre di vecchia cera e legno antico, quasi tutta al buio; al centro un lampadario di ferro battuto con candele dalle fiamme blu ghiaccio senza calore; in fondo un camino con fuoco di fiamme blu silenzioso su ceppi non consumati; volta a cassettoni; lunga tavola da banchetto apparecchiata per molti commensali con sedie di velluto cremisi vuote rivolte al capotavola; centrotavola di fiori secchi; a destra grandi finestre gotiche ad arco con tende di velluto rosso su un paesaggio notturno glaciale; pareti con boiserie scura intagliata, bassorilievi di figure distorte e stemmi dimenticati; a sinistra una credenza di legno massiccio; vicino al camino lo stemma di famiglia e una porta chiusa. Si torna nella sala da conversazione dalla porta da cui si è entrati."
    };
    STANZE_FATTI.cantina = QT.it.cantina.fatti;
    for (const l of ["it", "en"]) { TESTI[l].stanze.cantina = QT[l].cantina.stanza; TESTI[l].viste.cantina = QT[l].cantina.vista; }
    const STANZE = {};
    for (const id in STANZE_FATTI) {
      const s = TX.stanze[id];
      STANZE[id] = { ...s, fatti: STANZE_FATTI[id], fallback: s.intro || s.fallbackLibera };
    }

    /* il buio usa l'immagine dell'esterno, spenta fino al nero (classe "nera") */
    const IMMAGINI = { foresta: "immagini/house/esterno_dungeon.webp", buio: "immagini/house/esterno_dungeon.webp", atrio: "immagini/house/atrio.webp", sala_caccia: "immagini/house/sala_caccia.webp", sala_conversazione: "immagini/house/sala_conversazione.webp", sala_pranzo: "immagini/house/sala_pranzo.webp", corridoio: "immagini/house/corridoio.webp", cucina: "immagini/house/cucina.webp", guendalina: "immagini/house/guendalina.webp" };
    const DIM_IMMAGINI = { foresta: [1920, 1079], buio: [1920, 1079], corridoio: [1920, 1079], cucina: [1920, 1079], guendalina: [2048, 1536], atrio: [1920, 1079], sala_conversazione: [1358, 679] }; /* le altre sono 1536 × 1024 */
    const vista = (id) => ({ titolo: TX.viste[id].titolo, img: IMMAGINI[id] ? { src: IMMAGINI[id], alt: TX.viste[id].alt } : undefined }); /* la cantina è al buio: niente immagine */

    /* Una nuova partita parte dalla foresta, fuori dal dungeon; i salvataggi già esistenti riprendono dal loro luogo */
    let luogo = (salvata && Array.isArray(salvata.diario) && salvata.diario.length) ? "atrio" : "foresta";
    if (salvata && salvata.luogo && STANZE[salvata.luogo]) luogo = salvata.luogo;

    const SCALE = { ...TX.scale, soglia: 14, dannoDado: 4 };

    /* =====================================================================
       RICONOSCIMENTO DI CIÒ CHE SCRIVE IL GIOCATORE (italiano e inglese)
       I verbi sono raggruppati per intenzione: guardare non è salire, toccare non è prendere.
       ===================================================================== */
    const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g, " ");

    const VERBI = {
      guarda: "guard\\w*|osserv\\w*|esamin\\w*|scrut\\w*|fiss\\w*|ammir\\w*|contempl\\w*|studi\\w*|ispezion\\w*|analizz\\w*|descriv\\w*|vedo|noto|sbirci\\w*|occhiat\\w*|look\\w*|examin\\w*|inspect\\w*|observ\\w*|study|studies|watch\\w*|stare\\w*|gaz\\w*|check\\w*|view\\w*|describ\\w*|see|peer\\w*|glanc\\w*",
      muovi: "entr\\w*|pass\\w*|attravers\\w*|varc\\w*|oltrepass\\w*|vado|vai|andiamo|andare|raggiung\\w*|avvicin\\w*|dirig\\w*|cammin\\w*|percorr\\w*|prosegu\\w*|avanz\\w*|sposto|reco|enter\\w*|go|goes|going|walk\\w*|head\\w*|move\\w*|step\\w*|approach\\w*|cross\\w*|proceed\\w*",
      sali: "salgo|salire|sali|saliamo|salendo|climb\\w*|ascend\\w*|upstairs",
      tocca: "tocc\\w*|sfior\\w*|accarezz\\w*|tast\\w*|palp\\w*|touch\\w*|stroke\\w*|feel\\w*|caress\\w*",
      prendi: "prend\\w*|raccogl\\w*|raccolg\\w*|raccolt\\w*|afferr\\w*|sfil\\w*|estra\\w*|agguant\\w*|stacc\\w*|rub\\w*|take|takes|taking|took|grab\\w*|pick\\w*|seiz\\w*|steal\\w*|draw\\w*|pull\\w*",
      usa: "uso|usa|usare|usiamo|utilizz\\w*|equipagg\\w*|impugn\\w*|brandisc\\w*|sguain\\w*|imbracc\\w*|indoss\\w*|accend\\w*|bev\\w*|mangi\\w*|consum\\w*|applic\\w*|leggo|leggi|leggere|rileggo|use|uses|using|equip|equips|equipping|wield\\w*|brandish\\w*|light|lights|lighting|drink\\w*|eat|eats|eating|apply|read|reads|reading|reread|hold|holds|holding|wear\\w*|strap\\w*",
      riponi: "ripon\\w*|ripong\\w*|rinfoder\\w*|rimett\\w*|disequip\\w*|tolgo|togli\\w*|unequip\\w*|sheath\\w*|stow\\w*|put away|put down|put back|remove\\w*|take off",
      ascolta: "ascolt\\w*|origli\\w*|orecchi\\w*|listen\\w*|hear\\w*|eavesdrop\\w*"
    };
    const RE_VERBI = Object.fromEntries(Object.entries(VERBI).map(([k, v]) => [k, new RegExp("\\b(" + v + ")\\b")]));
