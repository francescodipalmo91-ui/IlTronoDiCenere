<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il dungeon</title>
  <script src="lingua.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --text: #1d2733;
      --muted: #5b6675;
      --line: #c9d1db;
      --accent: #2f6fed;
      --ok-bg: #e7f3ea;
      --ok-line: #a3cbab;
      --ko-bg: #f8e8e8;
      --ko-line: #dcaaaa;
      --tip-bg: #e9f0fd;
      --tip-line: #b4c9f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22;
        --text: #e8edf3;
        --muted: #9aa5b4;
        --line: #2f3844;
        --accent: #5b92ff;
        --ok-bg: #1d2c23;
        --ok-line: #3f6b4c;
        --ko-bg: #2f2022;
        --ko-line: #7b4549;
        --tip-bg: #1e2a3f;
        --tip-line: #38527d;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ---------- Struttura: scheda | linea | gioco ---------- */
    .app { display: grid; grid-template-columns: 20rem 1px minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .divisore {
      background: linear-gradient(to bottom, transparent, var(--line) 14%, var(--line) 86%, transparent);
    }

    /* ---------- Scheda personaggio ---------- */
    .scheda { overflow-y: auto; padding: 1.75rem 1.5rem; }
    .pg { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; text-align: center; }
    #ritratto {
      width: 12rem; aspect-ratio: 900 / 1122; flex: none; border-radius: 0.6rem; /* forma originale dei ritratti */
      border: 3px solid var(--accent); background-size: cover; background-position: 50% 0;
    }
    #nome { font-size: 1.4rem; font-weight: 600; line-height: 1.2; }
    #sub { color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem; }
    .scheda h2 { font-size: 1rem; font-weight: 600; margin: 1.6rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); }
    .scheda dl { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; margin: 0; font-size: 0.97rem; }
    .scheda dt { color: var(--muted); }
    .scheda dd { margin: 0; text-align: right; }
    .scheda #vitali { margin-top: 1.25rem; }
    .scheda details.sez { margin-top: 1rem; }
    .scheda details.sez > summary { font-size: 1rem; font-weight: 600; cursor: pointer; list-style: none; padding: 0.3rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
    .scheda details.sez > summary::-webkit-details-marker { display: none; }
    .scheda details.sez > summary::after { content: "▾"; color: var(--muted); }
    .scheda details.sez[open] > summary::after { content: "▴"; }
    .scheda details.sez > :not(summary) { margin-top: 0.6rem; }
    .scheda dd.extra { grid-column: 1 / -1; text-align: left; margin-top: -0.15rem; }
    #equip .extra .desc { margin: 0; }
    .scheda dt.addestrata { color: var(--text); font-weight: 600; }
    #completa > summary { display: none; }
    #zaino .oggetto { margin: 0.45rem 0; font-size: 0.97rem; }
    #zaino .testa { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    #zaino .nome-btn, #equip .nome-btn { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted var(--muted); text-underline-offset: 0.25rem; }
    #equip .nome-btn { text-align: right; }
    #zaino .desc, #zaino .vuoto, #equip .desc { color: var(--muted); font-size: 0.88rem; margin: 0; }
    #zaino .testo, #equip .testo { margin: 0.4rem 0 0; padding: 0.6rem 0.8rem; background: var(--tip-bg); border: 1px solid var(--tip-line); border-radius: 0.5rem; font-size: 0.9rem; line-height: 1.5; }
    #zaino .testo.lettera { font-style: italic; }
    #zaino .azioni-og { display: flex; gap: 0.4rem; flex: none; }
    #equipAzioni { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0; }
    #equipAzioni:empty { display: none; }
    #zaino .mini, #equipAzioni .mini {
      font: inherit; font-size: 0.85rem; padding: 0.25rem 0.65rem; border-radius: 0.4rem; cursor: pointer;
      background: transparent; color: var(--text); border: 1px solid var(--accent);
    }
    #zaino .mini:hover, #equipAzioni .mini:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .scheda small.malus { color: var(--muted); font-size: 0.85rem; }

    /* ---------- Gioco ---------- */
    .gioco { display: flex; flex-direction: column; min-height: 0; }
    .barra {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.75rem max(1.5rem, calc((100% - 62rem) / 2)); border-bottom: 1px solid var(--line);
    }
    #statoSalvataggio { color: var(--muted); font-size: 0.97rem; }
    #statoSalvataggio.da-salvare { color: var(--text); font-weight: 600; }
    #salva {
      font: inherit; font-size: 1rem; font-weight: 600; padding: 0.55rem 1.2rem; border-radius: 0.5rem; cursor: pointer;
      background: var(--accent); color: var(--bg); border: 2px solid var(--accent); flex: none;
    }
    #salva:hover { filter: brightness(1.1); }
    .barra-dx { display: flex; align-items: center; gap: 0.6rem; flex: none; }
    #audio {
      font: inherit; font-size: 1.05rem; line-height: 1; padding: 0.5rem 0.7rem; border-radius: 0.5rem; cursor: pointer;
      background: transparent; color: var(--text); border: 2px solid var(--line);
    }
    #audio:hover { border-color: var(--accent); }
    #diario {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: 2rem max(1.5rem, calc((100% - 62rem) / 2)) 1rem;
    }
    .voce { margin: 0 0 1.5rem; }
    .voce p { font-size: 1.12rem; line-height: 1.75; margin: 0 0 1.1rem; }
    .voce p:last-child { margin-bottom: 0; }
    .voce h2.luogo { margin: 0 0 0.9rem; font-size: 1.6rem; font-weight: 600; letter-spacing: 0.04em; }
    .voce img.scena { display: block; width: 100%; height: auto; border-radius: 0.5rem; margin: 0 0 1.5rem; }
    details.voce.giocatore > summary {
      display: flex; align-items: baseline; gap: 0.6rem; cursor: pointer; list-style: none;
      color: var(--muted); font-style: italic; font-size: 1.12rem; line-height: 1.75;
      padding-left: 1rem; border-left: 2px solid var(--accent);
    }
    details.voce.giocatore > summary::-webkit-details-marker { display: none; }
    details.voce.giocatore > summary::before { content: "▸"; flex: none; font-style: normal; color: var(--accent); }
    details.voce.giocatore[open] > summary::before { content: "▾"; }
    details.voce.giocatore > .corpo { margin-top: 1.25rem; }
    details.voce.giocatore > .corpo > .voce:last-child { margin-bottom: 0; }
    .voce.prova { padding: 1rem 1.25rem; border: 1px solid var(--accent); border-radius: 0.5rem; background: rgba(91,146,255,0.07); }
    .voce.prova p { margin: 0 0 0.5rem; }
    .voce.prova p.prova-titolo { font-weight: 700; font-size: 1.15rem; color: var(--accent); letter-spacing: 0.03em; }
    .voce.prova p.prova-azione { font-style: italic; }
    .voce.prova .prova-dati { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.25rem 0 0.75rem; }
    .voce.prova .prova-dati span { border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.8rem; font-size: 0.95rem; }
    .voce.prova p:last-child { margin-bottom: 0; color: var(--muted); font-size: 1rem; }
    .voce.sistema p { color: var(--muted); font-size: 1rem; margin: 0; }
    .voce p.esito-prova { font-weight: 600; color: var(--accent); }
    .voce p.lettera { font-style: italic; padding-left: 1.25rem; }
    .voce p.banner { font-weight: 700; font-size: 1.25rem; text-align: center; margin-top: 1.5rem; }
    .voce p.nota { color: var(--muted); }
    .voce.riquadro { padding: 1.25rem 1.5rem; border: 2px solid; border-radius: 0.5rem; }
    .voce.riquadro p.esito-prova { color: var(--text); }
    .voce.ok { background: var(--ok-bg); border-color: var(--ok-line); }
    .voce.ko { background: var(--ko-bg); border-color: var(--ko-line); }
    .attesa { color: var(--muted); font-style: italic; margin: 0 0 1.5rem; }

    .comandi { border-top: 1px solid var(--line); padding: 1rem max(1.5rem, calc((100% - 62rem) / 2)) 1.25rem; }
    #azioni { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.9rem; }
    #azioni button, #form button {
      font: inherit; font-size: 1.05rem; padding: 0.7rem 1.1rem; border-radius: 0.5rem; cursor: pointer;
      background: transparent; color: var(--text); border: 2px solid var(--accent);
    }
    #azioni button:hover:not(:disabled), #form button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    #azioni button:disabled, #form button:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--line); }
    #form { display: flex; gap: 0.75rem; }
    #testo {
      flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 0.7rem 1rem;
      border-radius: 0.5rem; border: 2px solid var(--line); background: transparent; color: var(--text);
    }
    #testo::placeholder { color: var(--muted); }
    #testo:disabled { opacity: 0.6; }
    #testo:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* ---------- Schermi stretti ---------- */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1px minmax(0, 1fr); }
      .divisore { background: linear-gradient(to right, transparent, var(--line) 14%, var(--line) 86%, transparent); }
      .scheda { overflow-y: visible; padding: 1rem 1.25rem; max-height: 55vh; overflow-y: auto; }
      .pg { flex-direction: row; text-align: left; gap: 1rem; }
      #ritratto { width: 6rem; }
      #completa > summary { display: block; cursor: pointer; color: var(--muted); margin-top: 0.75rem; }
      .scheda #vitali { margin-top: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="scheda" data-t-aria="schedaPg">
      <div class="pg">
        <div id="ritratto" hidden></div>
        <div>
          <div id="nome"></div>
          <div id="sub"></div>
        </div>
      </div>
      <dl id="vitali"></dl>
      <details id="completa" open>
        <summary data-t="completa">Scheda completa</summary>
        <details class="sez"><summary data-t="caratteristiche">Caratteristiche</summary><dl id="stat"></dl></details>
        <details class="sez"><summary data-t="abilita">Abilità</summary><dl id="abil"></dl></details>
        <details class="sez"><summary data-t="equipaggiamento">Equipaggiamento</summary><dl id="equip"></dl><div id="equipAzioni"></div></details>
        <details class="sez" id="zainoBox"><summary data-t="zaino">Zaino</summary><div id="zaino"></div></details>
      </details>
    </aside>

    <div class="divisore" role="presentation"></div>

    <main class="gioco">
      <div class="barra">
        <span id="statoSalvataggio" role="status"></span>
        <div class="barra-dx">
          <button type="button" id="salva" data-t="salva">Salva partita</button>
          <button type="button" id="audio" aria-pressed="true">🔊</button>
        </div>
      </div>
      <section id="diario" aria-live="polite" data-t-aria="diario"></section>
      <div class="comandi">
        <div id="azioni" hidden></div>
        <form id="form" autocomplete="off">
          <input id="testo" type="text" maxlength="200" data-t-aria="ariaTesto">
          <button type="submit" data-t="invia">Invia</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    /* =====================================================================
       LINGUA
       La lingua si sceglie nella pagina iniziale. Tutti i testi del gioco stanno in TESTI.it e TESTI.en;
       regole, prove e dadi stanno nel codice e sono uguali per le due lingue.
       Il riconoscimento di ciò che scrive il giocatore capisce sia l'italiano sia l'inglese.
       ===================================================================== */
    const LINGUA = Lingua.get();
    const N = Lingua.nome;

    const TESTI = {};

    /* ------------------------------ ITALIANO ------------------------------ */
    TESTI.it = (() => {
      const FOGLIETTO = "«Mi chiamo Adele, sono la moglie di Rodolfo. Ormai non puoi più scappare fintanto che lui non sarà morto. Se hai trovato questo biglietto è perché di Guendalina ci si può fidare. Io sono tenuta prigioniera in una camera da letto, ma tra le tante presenti in questa dimora non saprei dirti quale sia. Aiutami, ti prego.»";
      const ASCOLTO = ["Ti fermi per un istante e trattieni il respiro, lasciando che il silenzio della dimora ti avvolga come un sudario. All'inizio percepisci soltanto il crepitio sommesso delle fiamme nel camino, il legno che si spezza lentamente tra braci rossastre e ombre danzanti.", "Poi, qualcosa cambia.", "Un suono appena percettibile si insinua nel silenzio. Metallico. Breve.", "Il tuo corpo reagisce prima ancora della mente. Ti volti di scatto verso la sala da pranzo, aspettandoti di scorgere qualcuno nell'oscurità. Ma la stanza è deserta. Le sedie sono immobili, il lungo tavolo giace avvolto nella penombra e nessuna presenza si manifesta davanti ai tuoi occhi.", "Eppure quel rumore c'è stato.", "Ascolti di nuovo.", "Clink...", "Questa volta ne individui l'origine. Non proviene dalla sala, bensì dalle porte chiuse alle spalle del tavolo. Oltre quel legno consumato, qualcosa si è mosso. Qualcosa di pesante. Qualcosa che ha urtato il metallo nel tentativo di non farsi sentire."];
      const DIVANI = ["Ti muovi con cautela tra i divani mentre perdi la cognizione del tempo. Tasti la stoffa spessa e sorprendentemente calda, cercando una cucitura allentata, uno strappo o una vecchia macchia di sangue. Niente. Il tessuto è intatto e perfetto, un dettaglio che in questo posto ti mette solo addosso una gran paranoia."];
      const QUADRI = ["I tuoi occhi scorrono lungo la parete tappezzata di quadri. Ti avvicini e ne sposti qualcuno quel tanto che basta per sbirciare dietro le cornici, nella speranza di trovare un vano nascosto o qualche indizio. Ma non trovi nulla.", "La tua attenzione si sposta allora sulle immagini raffigurate. Sono i paesaggi a incuriosirti più di ogni altra cosa. Li studi attentamente, aspettandoti di riconoscere montagne, boschi o vallate vicine alla grotta dalla quale sei entrato.", "Eppure non riconosci nessun luogo.", "Le tele mostrano montagne dalle forme insolite, laghi immobili e terre che sembrano appartenere a regioni lontanissime, forse persino a un altro mondo.", "Con quel pensiero che continua a tormentarti, ti avvicini a una finestra. All'esterno si estende un elegante giardino nobiliare: basse siepi perfettamente curate, alberi secolari e una grande fontana dalla quale sgorga acqua cristallina.", "Sollevando lo sguardo oltre il giardino, il paesaggio torna invece familiare. Le colline e i boschi all'orizzonte assomigliano alle terre che conosci.", "Corrughi la fronte.", "Fuori dalla finestra c'è il tuo mondo. Nei quadri no.", "E per qualche ragione, la discrepanza ti lascia addosso una sottile e inspiegabile inquietudine."];
      const ORECCHIO_OK = ["Ti avvicini con cautela e appoggi l'orecchio alla superficie lignea. Rimani immobile per alcuni istanti, trattenendo persino il respiro. Dall'altra parte non giungono né voci, né passi, né il più piccolo rumore."];
      const ORECCHIO_KO = ["Ti avvicini alla porta e tendi l'orecchio, ma non senti nulla. Non sai dire se sia davvero silenzio o se qualcosa ti sfugga."];
      const ORECCHIO_GIA = "Hai già teso l'orecchio a quella porta: dall'altra parte non si sente nulla.";
      const LASCIA_SALA = "Lasci perdere e ti rimetti dritto, in mezzo alla sala.";
      return {
        foglietto: FOGLIETTO,
        luoghi: {
          porta_sx: {
            fisso: ["La porta domina la parete come l'ingresso a un luogo importante. È realizzata in legno scuro e pregiato, decorata da raffinati intarsi che rappresentano intricati motivi floreali ormai consumati dal tempo. Ai suoi lati, due fiaccole gettano una luce tremolante sulle venature del legno. Le fiamme oscillano lentamente, come se da qualche parte filtrasse una lieve corrente d'aria proveniente dall'altro lato.", "La porta è già aperta: puoi attraversarla quando vuoi."],
            azione: "Appoggi l'orecchio alla porta di sinistra, cercando di capire cosa si nasconda dall'altra parte.",
            successo: ORECCHIO_OK, fallimento: ORECCHIO_KO, gia: { ok: ORECCHIO_GIA, ko: ORECCHIO_GIA }, lascia: "Ti allontani dalla porta senza insistere."
          },
          porta_dx: {
            fisso: ["Una massiccia porta di legno pregiato occupa la parete destra. La superficie è ricoperta da elaborati intarsi che raffigurano scene di caccia e simboli nobiliari ormai consumati dal tempo.", "Le due fiaccole poste ai lati diffondono una luce instabile e le loro fiamme ondeggiano lievemente, come se oltre quella soglia vi fosse spazio sufficiente a generare un impercettibile movimento d'aria.", "La porta è già aperta: puoi attraversarla quando vuoi."],
            azione: "Appoggi l'orecchio alla porta di destra, cercando di capire cosa si nasconda dall'altra parte.",
            successo: ORECCHIO_OK, fallimento: ORECCHIO_KO, gia: { ok: ORECCHIO_GIA, ko: ORECCHIO_GIA }, lascia: "Ti allontani dalla porta senza insistere."
          },
          ascolto: {
            azione: "Resti in silenzio e tendi l'orecchio, cercando di cogliere ogni rumore nella dimora.", fisso: ASCOLTO,
            successo: ASCOLTO, fallimento: ASCOLTO, /* stessa descrizione di successo e fallimento */
            gia: { ok: "Hai già ascoltato con attenzione: non senti altro che il crepitio del camino.", ko: "Hai già ascoltato con attenzione: non senti altro che il crepitio del camino." }, lascia: LASCIA_SALA
          },
          divani: {
            azione: "Perlustri con cura i divani e il tavolino al centro della sala.", fisso: DIVANI,
            successo: DIVANI, fallimento: DIVANI,
            gia: { ok: "Hai già frugato ovunque tra divani e tavolino: non c'è altro da trovare.", ko: "Hai già frugato ovunque tra divani e tavolino: non c'è altro da trovare." }, lascia: LASCIA_SALA
          },
          quadri: {
            azione: "Studi i quadri alle pareti e guardi fuori dalla finestra, cercando qualcosa che non torni.", fisso: QUADRI,
            successo: QUADRI, fallimento: QUADRI,
            gia: { ok: "Hai già riflettuto su quadri e finestra: non ti viene in mente altro.", ko: "Hai già riflettuto su quadri e finestra: non ti viene in mente altro." }, lascia: LASCIA_SALA
          },
          camino: { fisso: ["Ti avvicini al braciere, dove il fuoco scoppietta vivace. Alzando la testa, ti scontri con gli occhi severi della donna nel dipinto: ti fissano con una rigidità quasi reale. Un brivido ti scorre lungo la schiena, ma ti scuoti, addossando il colpo al gioco delle ombre. Poi, sulla targhetta in bronzo leggi il nome: Regina Adele."] },
          tavolino: { fisso: ["Passi la mano sul tavolino e ti guardi le dita controluce: neanche un granello di polvere. Sembra quasi che qualcuno pulisca la casa regolarmente. Fai scorrere le dita sotto la superficie, cercando a tentoni un cassetto nascosto, una leva o un meccanismo segreto. Ma tocchi soltanto legno liscio e freddo. Nessuna traccia."] },
          finestre: { fisso: ["Ti avvicini e pianti le mani sul davanzale. Fuori, diversi globi lunari squarciano il cielo: non sei decisamente a casa. Il giardino sotto di te è pietrificato, immobile e privo di vento, eppure, poco più in là, una fontana continua a zampillare acqua viva. Un contrasto assurdo che ti fa salire i brividi."] },
          arazzo_sx: {
            fisso: ["L'arazzo che ricopre la parete sinistra è imponente, tanto da sfiorare il pavimento con le sue pesanti pieghe. Fili scuri e dorati si intrecciano in un raffinato ricamo che raffigura un maestoso cervo dai palchi imponenti, ritratto con l'eleganza di una creatura regale.", "Osservandolo più attentamente, qualcosa attira la tua attenzione: la parte inferiore dell'arazzo appare leggermente più rigonfia rispetto al resto del tessuto, come se dietro quella piega si celasse qualcosa."],
            azione: "Esamini da vicino l'arazzo di sinistra, cercando cosa nasconda la piega rigonfia.",
            successo: ["Con delicatezza scosti il pesante drappo. Quando sollevi la piega inferiore, un piccolo oggetto scivola fuori e cade sul pavimento con un lieve fruscio.", "È un foglietto ingiallito dal tempo, ripiegato più volte.", "Lo raccogli e lo apri con cautela. L'inchiostro è sbiadito, ma la calligrafia rimane leggibile.", FOGLIETTO, "Le ultime parole sembrano tracciate da una mano tremante, in preda alla paura o alla disperazione.", "Per un momento il silenzio della sala si fa più pesante. Mentre richiudi il foglietto, hai la sensazione che quel fragile pezzo di carta porti con sé un fardello ben più grande del proprio peso."],
            fallimento: ["Scosti il pesante drappo e ne tasti la piega inferiore, ma non riesci a capire cosa ci sia dietro quel rigonfiamento. Dopo un po' ti arrendi e lasci ricadere il tessuto."], /* PROVVISORIO: da riscrivere */
            gia: { ok: "Dietro l'arazzo di sinistra non c'è altro: il foglietto di Adele è già nel tuo zaino.", ko: "Hai già provato con l'arazzo di sinistra e non riesci a cavarne altro." },
            lascia: "Lasci ricadere il pesante tessuto e fai un passo indietro. Qualunque cosa ci fosse, per ora resta dov'è."
          },
          arazzo_dx: { fisso: ["L'arazzo che ricopre la parete destra è grande e pesante quanto il suo gemello dall'altro lato della sala. Fili neri, cremisi e dorati compongono l'immagine di un possente leone dall'espressione fiera e dominante.", "Il ricamo è straordinariamente dettagliato: gli occhi sembrano quasi seguire i movimenti di chi passa davanti alla parete. Nonostante il trascorrere degli anni, il re delle bestie conserva tutta la propria imponenza."] },
