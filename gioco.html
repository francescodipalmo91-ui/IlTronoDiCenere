    const ha = (t, gruppo) => RE_VERBI[gruppo].test(t);
    const parole = (t) => t.split(/\s+/).filter(Boolean).length;

    function interpreta(t) { /* atrio */
      const sx = /sinistr|\bsx\b|\bleft\b/.test(t), dx = /destr|\bdx\b|\bright\b/.test(t);
      const lato = sx !== dx; /* indicato un solo lato */
      const guarda = ha(t, "guarda"), muovi = ha(t, "muovi"), sali = ha(t, "sali"), tocca = ha(t, "tocca"), prendi = ha(t, "prendi"), ascolta = ha(t, "ascolta");
      const porta = /\bport[ae]\b|\bdoors?\b|\buscio\b|battent/.test(t);
      const spada = /\bspad\w*|\bswords?\b|\blama\b|\bblade\b/.test(t);
      const armatura = /armatur|corazz|\barmou?rs?\b/.test(t);
      const statua = /cavalier|\bknight\b|statu/.test(t);
      const scale = /\bscal[ae]\b|scalinat|gradin|\bstair\w*|\bsteps?\b/.test(t);
      const sopra = /\bdi sopra\b|\bsu\b|piano superiore|pianerottol|\bupstairs\b|\blanding\b|\bcima\b|\btop\b|\bup\b/.test(t);

      /* il portone d'ingresso alle spalle (dove c'era la grotta): chiuso a chiave */
      const apri = /\bapr\w*|\bspalanc\w*|\bsping\w*|\btir[oa]\b|\bforz\w*|\bsfond\w*|\bopen\w*|\bpush\w*|\bpull\w*|\bforce\w*|\bunlock\w*/.test(t);
      const portone = /portone|porta d\s?ingresso|porta principale|\bingresso\b|alle (mie )?spalle|dietro di me|front door|entrance door|main door|great door|behind me/.test(t);
      const uscire = /\besc[oi]\b|\buscire\b|\buscita\b|foresta|grotta|accampament|\bleave\b|\bexit\b|way out|\bforest\b|\bcave\b|\bcamp\b|\bget out\b|\bgo out\b/.test(t);
      if ((portone && (apri || muovi || uscire)) || (uscire && !/caccia|conversazion|pranzo|hunt|drawing|dining/.test(t))) return "portone_chiuso";
      if (portone) return "portone";
      if (/caccia|hunt/.test(t)) return muovi && !guarda ? "entra_sx" : (guarda || ascolta ? "porta_sx" : null);
      if (/conversazion|drawing|sitting|parlou?r/.test(t)) return muovi && !guarda ? "entra_dx" : (guarda || ascolta ? "porta_dx" : null);
      if (/pranzo|dining/.test(t)) return "pranzo_lontano";
      if (porta && muovi && !guarda && !ascolta) return lato ? (sx ? "entra_sx" : "entra_dx") : "porta?";
      if (spada && prendi) return "spada";
      if ((armatura || statua) && lato) return sx ? "armatura_sx" : "armatura_dx";
      /* salire: verbo di salita, oppure muoversi verso scale/pianerottolo/armatura, oppure toccare l'armatura o la spada */
      if (sali || (muovi && (scale || sopra || armatura || statua || spada)) || (tocca && (armatura || statua || spada))) return "scale";
      if (scale) return "scale_guarda"; /* guardare le scale dal basso */
      if (/arazz|tapestr|drapp|\bhanging/.test(t)) return lato ? (sx ? "arazzo_sx" : "arazzo_dx") : "arazzo?";
      if (/soffitt|affresc|angel|ceiling|fresco|alzo (lo sguardo|gli occhi)|\blook up\b/.test(t)) return "soffitto";
      if (porta) return lato ? (sx ? "porta_sx" : "porta_dx") : "porta?";
      if (statua || spada || sopra || /vetrat|padron|guanti|sovran|stained|window|glass|\bmaster\b|gauntlet|sovereign|\bking\b/.test(t)) return "armatura";
      if (armatura) return "armatura?";
      if (/fiacc|fiamm|torch|sconce|flame/.test(t)) return "fiaccole";
      if (/tappet|pavimento|marmo|carpet|\brugs?\b|floor|marble/.test(t)) return "tappeto";
      if (/\b(stanza|sala|atrio|ambiente|intorno|paraggi|piano|cerco|controllo|ispeziono|esploro|room|hall|around|surroundings|explore|search\w*|atrium|foyer|entrance)\b|mi guardo|colonn|column|pillar/.test(t)) return "stanza";
      if (guarda && parole(t) <= 2) return "stanza";
      return null;
    }

    /* Fuori dall'atrio */
    function interpretaAltrove(t) {
      const guarda = ha(t, "guarda"), muovi = ha(t, "muovi");
      const torna = /\b(torn\w*|esc\w*|ritorn\w*|indietro|back|return\w*|leave|exit\w*|out)\b/.test(t);
      const atrio = /atrio|atrium|entrance|foyer|\bhall\b/.test(t) && !/dining|hunting|drawing|sitting|pranzo|caccia|conversazion/.test(t);
      if (luogo === "sala_conversazione") {
        if (/giocattol|figurin|\bomin|soldatin|\btoys?\b|figurine/.test(t)) return "giocattoli";
        const pranzo = /pranzo|dining|doppio battente|double doors?/.test(t);
        if (!muovi && (ha(t, "ascolta") || /rumor|suon|silenzi|\bsent[oi]\b|noise|sound|silence/.test(t))) return "ascolto";
        if ((pranzo || /\bport\w*|\bdoors?\b|destr|\bright\b/.test(t)) && muovi && !guarda && !torna && !atrio) return "entra_pranzo";
        if (pranzo && !torna) return "pranzo_guarda";
        if (/\bfior\w*|fiorier\w*|\bpiant\w*|\bvas[oi]\b|petal\w*|\bflowers?\b|\bplants?\b|\bvases?\b|planter/.test(t)) return "fiori";
        if (/tavol|\btables?\b/.test(t)) return "tavolino";
        if (/divan|poltron|sofa|couch|settee|armchair/.test(t)) return "divani";
        if (/finestr|davanzal|giardin|fontan|lun[ae]\b|window|sill|garden|fountain|moons?\b/.test(t)) return "finestre";
        if (/ritratt|nobildonn|padrona|\bquadro\b|dipinto sopra|sopra (il|al) camin|cornice del (quadro|ritratto|dipinto)|portrait|noblewoman|above the (fire|mantel|hearth)|painting above/.test(t)) return "ritratto";
        if (/camin|fuoco|brace|braci|legna|scald|fireplace|\bfire\b|hearth|ember|warm/.test(t)) return "camino";
      }
      if (luogo === "sala_pranzo") {
        if (atrio) return "atrio_lontano";
        if (/camin|fuoco|fiamm|brace|ceppi|fireplace|\bfire\b|hearth|flames?/.test(t) && !muovi) return "pranzo_camino";
        const porta = /\bport[ae]\b|\bdoors?\b|\buscio\b/.test(t), apri = /\bapr\w*|\bopen\w*/.test(t);
        if (!torna && (/corridoi|corridor|hallway|anticamer|antechamber/.test(t) || (porta && (muovi || apri)))) return "entra_corridoio";
        if (porta && !torna) return "pranzo_porta";
        if (/credenz|mobil[ei]|\bcassett\w*|\bante\b|battent|sideboard|cabinet|cupboard|drawer/.test(t)) return "credenza";
        if (!muovi && (ha(t, "ascolta") || /rumor|suon|silenzi|noise|sound|silence/.test(t))) return "pranzo_percezione";
        if (guarda && !torna && parole(t) > 2 && !/\b(stanza|sala|ambiente|intorno|room|hall|around)\b/.test(t)) return "pranzo_niente"; /* gli altri «esamino…» non aggiungono dettagli */
      }
      if (luogo === "cantina") {
        if (/\bcorr[eio]\w*|\bcorsa\b|\bscapp\w*|\bruns?\b|\brunning\b|\bdash\w*|\bsprint\w*/.test(t)) return "cantina_corri";
        if (torna || /cucin|kitchen|\bsal[igo]\w*|upstairs|\bsu\b/.test(t)) return "torna";
        if (/scalett|ladder|avanz|\bcerc\w*|angol|fondo|silenzi|furtiv|striscio|quatto|sneak|search|corner|creep|\bfar end|rastrellier|\brack\b|liber\w*|\bfree\b/.test(t))
          return usate.q1 === "scaletta" || usate.q1 === "completata" ? "cantina_vuota" : usate.cantina_avanza === "ok" ? "cantina_libera" : "cantina_avanza";
      }
      if (luogo === "cucina") {
        if (atrio || /conversazion|drawing|sitting|pranzo|dining/.test(t)) return "cucina_lontano";
        if (/cantin|sotterrane|\bscend\w*|cellar|basement|downstairs/.test(t)) return "entra_cantina";
        if (/guendalin|governant|\bparl\w*|chiacchier|\btalk\w*|\bspeak\w*|\bchat\w*|scalett|ladder|consegn|deliver|dispens|pantry/.test(t)) return "parla_guendalina";
        if (torna || /corridoi|corridor/.test(t)) return "torna";
      }
      if (luogo === "corridoio") {
        if (atrio || /conversazion|drawing|sitting/.test(t)) return "corr_lontano";
        if (torna || /pranzo|dining/.test(t)) return "torna";
        if (/cucin|kitchen/.test(t) && !guarda) return "corr_apri";
        if (/\bport[ae]\b|\bdoors?\b|\buscio\b|pomell|\bknob/.test(t)) return (muovi || /\bapr\w*|\bsping\w*|\bopen\w*|\bpush\w*/.test(t)) && !guarda ? "corr_apri" : "corr_porte";
        if (!muovi && (ha(t, "ascolta") || /rumor|suon|silenzi|noise|sound|silence/.test(t))) return "corr_percezione";
        if (guarda && /\b(corridoio|corridor|stanza|ambiente|intorno|around)\b/.test(t)) return "stanza_corrente";
        if (guarda && parole(t) > 2 && !/\b(corridoio|corridor|stanza|ambiente|intorno|around)\b/.test(t)) return "corr_niente";
      }
      if (torna || atrio) return "torna";
      if (/\b(stanza|sala|ambiente|intorno|paraggi|cerco|controllo|ispeziono|esploro|room|around|surroundings|explore|search\w*)\b|mi guardo/.test(t)) return "stanza_corrente";
      if (guarda && parole(t) <= 2) return "stanza_corrente";
      return null;
    }

    /* Foresta, fuori dal dungeon */
    const RE_TORCIA = /\btorc\w*|\btorch\w*|\bfiaccol\w*/;
    const RE_ACCENDI = /\baccend\w*|\bappicc\w*|\bincendi\w*|\blight\w*|\bkindl\w*|\bignit\w*|\buso\b|\busa\b|\busare\b|utilizz\w*|\buse\b|\buses\b|\busing\b/;
    const RE_GROTTA = /dungeon|grott|cavern|\bcaves?\b|soglia|ingress|entrata|abisso|\bdentro\b|oscurita|\binside\b|threshold|entrance|\bmouth\b|\bgo in\b|\bwalk in\b|\bstep in\b/;
    function interpretaForesta(t) {
      const guarda = ha(t, "guarda"), muovi = ha(t, "muovi"), prendi = ha(t, "prendi");
      /* farsi una torcia: «crea torcia», «mi costruisco una torcia», «preparo una fiaccola», «raccolgo un ramo», «make a torch»… */
      const crea = /\bcre[aio]\w*|costru\w*|prepar\w*|fabbric\w*|realizz\w*|improvvis\w*|ricav\w*|assembl\w*|confezion\w*|\bfaccio\b|\bfare\b|\bfai\b|\bmi serve\b|\bcerco\b|\btrovo\b|\bvoglio\b|\bmake\b|\bmaking\b|\bcraft\w*|\bbuild\w*|\bfashion\w*|\bprepar\w*|\bimprovis\w*|\bget\b|\bneed\b|\bfind\b|\bwant\b/.test(t);
      if (RE_TORCIA.test(t) && RE_ACCENDI.test(t) && !crea && !prendi) return "torcia_fuori";
      if (RE_TORCIA.test(t) && (prendi || crea)) return "prendi_torcia";
      if ((prendi || crea) && /\brami?\b|\bramo\b|\blegn[oa]\b|bastone di legno|ciocc|tizzon|\bbranch\w*|\bstick\w*|firewood|\blog\b/.test(t)) return "prendi_torcia";
      if (RE_TORCIA.test(t)) return "torcia_fuori";
      if (/incantesim|\bspell\b|\bcast\w*|\bmagi\w*/.test(t) && /\bluce\b|\blight\b/.test(t)) return "luce_fuori";
      /* entrare: "entro nel dungeon", "avanzo nella grotta", "varco la soglia", anche solo "entro" o "avanzo" */
      if (muovi && !guarda && (RE_GROTTA.test(t) || parole(t) <= 2)) return "entra_dungeon";
      if (/fal[oò]|\bfuoco\b|fiamm|brac[ei]|legna|\brami?\b|\bfires?\b|campfire|flames?|embers?|firewood|branch\w*/.test(t)) return "foresta_falo";
      if (/lantern/.test(t)) return "foresta_lanterna";
      if (RE_GROTTA.test(t) || /roccia|radic|\brock\b|\broots?\b/.test(t)) return "foresta_grotta";
      if (/alber|bosco|forest|cielo|tramont|\bsole\b|\btrees?\b|\bwoods?\b|\bsky\b|sunset|\bsun\b/.test(t)) return "foresta_bosco";
      if (/accampament|\bcampo\b|copert|giacigli|\bspada\b|pugnal|\barmi\b|\bcamp\b|blanket|bedroll|\bswords?\b|dagger|weapons|\bpack\b|backpack|\bzaino\b/.test(t)) return "foresta_campo";
      if (/\b(intorno|paraggi|radura|mi guardo|around|surroundings|clearing)\b/.test(t) || (guarda && parole(t) <= 2)) return "stanza_corrente";
      return null;
    }

    /* Nel buio della grotta: si avanza solo con una luce */
    function interpretaBuio(t) {
      const esci = /\b(esc\w*|torn\w*|ritorn\w*|indietro|fuori|back|return\w*|leave|exit\w*|out|outside)\b|accampament|\bcamp\b/.test(t);
      if (RE_TORCIA.test(t) && RE_ACCENDI.test(t)) return "accendi_torcia";
      if (/incantesim|\bspell\b|\bcast\w*|\bmagi\w*|\blanci\w*|\bevoc\w*/.test(t) && /\bluce\b|\blight\b/.test(t)) return "lancia_luce";
      if (/^\s*(luce|light)\s*$/.test(t)) return "lancia_luce";
      if (esci) return "esci"; /* anche «esco a prendere una torcia» */
      if (RE_TORCIA.test(t)) return "accendi_torcia";
      return null;
    }

    /* =====================================================================
       PERSONAGGIO
       ===================================================================== */
    let pg = null;
    try { pg = JSON.parse(localStorage.getItem("personaggio")); } catch (e) {}
    if (!pg || !pg.classe) { pg = null; window.location.replace("index.html"); }
    else if (!pg.equipaggiamento) { pg = null; window.location.replace("index.html"); }

    const fmtN = (n) => (n < 0 ? "−" : "+") + Math.abs(n);
    const mod = (v) => Math.floor((Number(v) - 10) / 2);
    const spirito = () => Number(pg.statistiche && pg.statistiche.Spirito) || 0;
    /* Tutte le abilità: quelle scelte in creazione aggiungono il livello al modificatore dell'attributo */
    const ABILITA_TUTTE = [["Atletica", "Lotta"], ["Furtività", "Agilità"], ["Acrobazia", "Agilità"], ["Indagare", "Mente"], ["Medicina", "Mente"], ["Arcano", "Mente"], ["Misticismo", "Mente"], ["Percezione", "Corpo"], ["Persuasione", "Carisma"], ["Intimidire", "Carisma"]];
    let scudo = null; /* lo scudo imbracciato (null se non c'è o è nello zaino) */
    const eqPg = () => (pg && pg.equipaggiamento) || {};
    /* malus alle abilità di Agilità: armatura + scudo, solo se imbracciato */
    const malusArmatura = () => (Number(eqPg().malusAgilita) || 0) + (scudo ? Number(scudo.malus) || 0 : 0);
    /* classe armatura: quella salvata comprende lo scudo scelto in creazione; qui conta solo se è imbracciato */
    const caAttuale = () => {
      if (pg.classeArmatura == null) return "—";
      const base = Number(pg.classeArmatura) - (eqPg().scudo ? Number(eqPg().scudo.ca) || 0 : 0);
      return base + (scudo ? Number(scudo.ca) || 0 : 0);
    };
    const addestrata = (n) => (pg.abilita || []).some(a => a.nome === n);
    const valoreAbilita = (n) => {
      const attr = (ABILITA_TUTTE.find(x => x[0] === n) || [])[1];
      const base = attr ? mod(Number(pg.statistiche && pg.statistiche[attr]) || 10) : 0;
      return base - (attr === "Agilità" ? malusArmatura() : 0) + (addestrata(n) ? (Number(pg.livello) || 1) : 0);
    };
    const maxMentali = () => (pg.saluteMentale != null ? Number(pg.saluteMentale) : 10 + mod(spirito()));
    /* mana (Sapiente e Accolito): il massimo viene dalla creazione, quello speso fa parte della partita */
    const manaMax = () => (pg.mana != null ? Number(pg.mana) : null);
    /* incantesimi salvati in creazione: { id, nome: { it, en }, costo, desc: { it, en }, effetto } */
    const listaIncantesimi = () => [].concat(pg.incantesimi || []).filter(Boolean).map(x => typeof x === "string" ? { id: x, nome: x } : x);
    const nomeInc = (inc) => Lingua.t(inc.nome) || inc.id || "";
    const nomiInc = (inc) => (inc.nome && typeof inc.nome === "object" ? Object.values(inc.nome) : [inc.nome, inc.id]).filter(Boolean).map(String);
    const manaAttuale = () => Math.max(0, manaMax() - (pg.manaUsato || 0));

    let usate = (salvata && salvata.usate && typeof salvata.usate === "object" && !Array.isArray(salvata.usate)) ? salvata.usate : {};
    if (pg) pg.dannoFisico = salvata ? (Number(salvata.dannoFisico) || 0) : 0;
    if (pg) pg.dannoMentale = salvata ? (Number(salvata.dannoMentale) || 0) : 0;
    if (pg) pg.manaUsato = salvata ? (Number(salvata.manaUsato) || 0) : 0; /* i danni mentali fanno parte della partita, non del personaggio */
    const salvaUsate = () => modificato();
    const salvaPg = () => modificato();

    /* Arma in uso, scudo e zaino fanno parte della partita (la dotazione del personaggio parte nello zaino) */
    let arma = { nome: "—" }, zaino = [], mano = null; /* mano = oggetto tenuto nella mano libera (es. la torcia) */
    if (pg) {
      const eqIniz = eqPg();
      arma = (salvata && salvata.arma && typeof salvata.arma === "object" && salvata.arma.nome) ? salvata.arma : { nome: eqIniz.arma || "—", danno: eqIniz.armaDanno, tipoDanno: eqIniz.armaTipoDanno, mani: eqIniz.armaMani };
      if (salvata && Array.isArray(salvata.zaino)) zaino = salvata.zaino;
      else {
        zaino = (eqIniz.dotazione || []).map((d, i) => {
          const o = typeof d === "string" ? { nome: d } : d;
          return { id: "dot" + i, nome: o.nome, tipo: "dotazione", usi: Number(o.usi) > 0 ? Number(o.usi) : null, testo: o.desc, impugnabile: !!o.impugnabile };
        });
        if (usate.arazzo_sx === "ok") zaino.push({ id: "arazzo_sx", nome: "Foglietto di Adele", tipo: "nota", testo: TX.foglietto });
      }
      if (arma.danno == null && arma.nome === eqIniz.arma && eqIniz.armaDanno) arma.danno = eqIniz.armaDanno;
      if (arma.mani == null && arma.nome === eqIniz.arma && eqIniz.armaMani) { arma.mani = eqIniz.armaMani; arma.tipoDanno = eqIniz.armaTipoDanno; }
      if (salvata && salvata.mano && typeof salvata.mano === "object" && salvata.mano.nome) mano = salvata.mano;
      if (salvata && "scudo" in salvata) scudo = (salvata.scudo && typeof salvata.scudo === "object") ? salvata.scudo : null;
      else if (eqIniz.scudo) scudo = { id: "scudo", tipo: "scudo", nome: eqIniz.scudo.nome || "Scudo", ca: Number(eqIniz.scudo.ca) || 1, malus: Number(eqIniz.scudo.malus) || 0 };
    }

    /* ---------- Nomi e descrizioni degli oggetti nella lingua scelta ---------- */
    const nomeOg = (o) => { const n = (o.id === "giocattoli" ? TX.giocattoli.nome : Q.oggetti[o.id] ? Q.oggetti[o.id].nome : N("oggetti", o.nome)); return o.bonus ? `${n} (+${o.bonus})` : n; };
    const testoOggetto = (it) => (it.id === "arazzo_sx" ? TX.foglietto : it.id === "giocattoli" ? TX.giocattoli.desc : Q.oggetti[it.id] ? Q.oggetti[it.id].testo : (Lingua.desc(it.nome) || it.testo));
    const maniArma = (o) => Number(o && o.mani) || 1;
    const dettaglioArma = (o) => [o && o.tipoDanno ? N("danni", o.tipoDanno) : null, o && o.mani ? U.mani(maniArma(o)) : null].filter(Boolean).join(" · ");
    const testoDanno = (o) => {
      if (!o || !o.danno) return null;
      const m = mod(Number(pg.statistiche && pg.statistiche.Lotta) || 10);
      return `${o.danno} + ${U.modLotta} (${m < 0 ? "−" : "+"}${Math.abs(m)})`;
    };
    const infoScudo = (s) => [U.caBonus(Number(s.ca) || 0), Number(s.malus) ? U.malusAg(Number(s.malus)) : U.noMalus].join(" · ");

    function riga(dl, k, v, chiave) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      if (chiave) dd.dataset.k = chiave;
      dl.append(dt, dd);
    }

    function disegnaScheda() {
      document.getElementById("nome").textContent = pg.nome || "";
      document.getElementById("sub").textContent = [pg.razza && N("razze", pg.razza), `${N("classi", pg.classe)}${pg.livello ? ", " + U.livello + " " + pg.livello : ""}`].filter(Boolean).join(" — ");
      if (pg.immagine) {
        const r = document.getElementById("ritratto");
        r.style.backgroundImage = `url("${String(pg.immagine).replace(/^immagini\/(?!pg\/)/, "immagini/pg/").replace(/"/g, "%22")}")`; /* i vecchi salvataggi puntavano a immagini/, ora i ritratti stanno in immagini/pg/ */
        r.hidden = false;
      }
      disegnaVitali();
      const st = document.getElementById("stat");
      st.replaceChildren();
      for (const [k, v] of Object.entries(pg.statistiche || {})) riga(st, N("attributi", k), `${Number(v)} (${fmtN(mod(v))})`);
      disegnaAbilita();
      disegnaEquip();
      aggiornaZaino();
      disegnaIncantesimi();
      disegnaMissioni();
    }

    function disegnaVitali() {
      const vit = document.getElementById("vitali");
      vit.replaceChildren();
      riga(vit, U.puntiSalute, testoSalute(), "salute");
      riga(vit, U.puntiMentali, testoMentali(), "mentali");
      riga(vit, U.classeArmatura, String(caAttuale()));
      if (manaMax() != null) riga(vit, U.mana, `${manaAttuale()} / ${manaMax()}`, "mana");
    }

    /* Tendina degli incantesimi: nome (si apre la descrizione) e costo in mana */
    function disegnaIncantesimi() {
      const lista = listaIncantesimi();
      document.getElementById("incantesimiBox").hidden = !lista.length;
      const box = document.getElementById("incantesimi");
      box.replaceChildren();
      lista.forEach((inc, i) => {
        const costo = inc.costo;
        const og = document.createElement("div"); og.className = "oggetto";
        const testa = document.createElement("div"); testa.className = "testa";
        const k = "inc-" + (inc.id || i), aperto = aperti.has(k);
        const testo = document.createElement("p"); testo.className = "testo"; testo.id = k.replace(/\W+/g, "_");
        testo.textContent = [Lingua.t(inc.desc), inc.effetto ? `[${Lingua.t(inc.effetto)}]` : ""].filter(Boolean).join(" "); testo.hidden = !aperto;
        const b = document.createElement("button"); b.type = "button"; b.className = "nome-btn"; b.textContent = nomeInc(inc);
        b.setAttribute("aria-expanded", String(aperto)); b.setAttribute("aria-controls", testo.id);
        b.addEventListener("click", () => { const apri = testo.hidden; testo.hidden = !apri; if (apri) aperti.add(k); else aperti.delete(k); b.setAttribute("aria-expanded", String(apri)); });
        const c = document.createElement("span"); c.className = "costo"; c.textContent = costo != null ? `${costo} ${U.mana.toLowerCase()}` : "";
        const lancia = document.createElement("button"); lancia.type = "button"; lancia.className = "mini"; lancia.textContent = U.lanciaInc;
        lancia.addEventListener("click", clic(() => lanciaIncantesimo(inc)));
        const dx = document.createElement("span"); dx.className = "azioni-inc"; dx.append(c, lancia);
        testa.append(b, dx); og.append(testa, testo); box.append(og);
      });
    }

    function disegnaAbilita() {
      const ab = document.getElementById("abil");
      ab.replaceChildren();
      const malus = malusArmatura();
      ABILITA_TUTTE.forEach(([nome, attr]) => {
        const dt = document.createElement("dt"); dt.textContent = N("abilita", nome);
        if (addestrata(nome)) { dt.className = "addestrata"; dt.title = U.abilScelta; }
        const dd = document.createElement("dd"); dd.textContent = fmtN(valoreAbilita(nome));
        if (attr === "Agilità" && malus > 0) {
          const sm = document.createElement("small"); sm.className = "malus"; sm.textContent = U.malusEquip(malus);
          sm.title = U.malusTitle;
          dd.append(sm);
        }
        ab.append(dt, dd);
      });
    }

    function testoSalute() {
      const v = pg.puntiVita ?? pg.saluteFisica;
      if (v == null) return "—";
      return `${Math.max(0, Number(v) - (pg.dannoFisico || 0))} / ${Number(v)}`;
    }
    function testoMentali() {
      const max = maxMentali();
      return `${Math.max(0, max - (pg.dannoMentale || 0))} / ${max}`;
    }
    function scuotiScheda() { const e = document.querySelector(".scheda"); e.classList.remove("colpito"); void e.offsetWidth; e.classList.add("colpito"); }
    function aggiornaMentali() {
      const dd = document.querySelector('#vitali dd[data-k="mentali"]');
      if (dd) dd.textContent = testoMentali();
    }

    /* ---------- Diario ---------- */
    const elDiario = document.getElementById("diario");
    let diario = (salvata && Array.isArray(salvata.diario)) ? salvata.diario : [];

    (function assegnaStanze() { /* salvataggi vecchi: le voci senza stanza vengono attribuite in base ai titoli (in entrambe le lingue) */
      let corrente = "atrio";
      const titoloDi = (tit) => Object.keys(IMMAGINI).find(x => tit && (tit === TESTI.it.viste[x].titolo || tit === TESTI.en.viste[x].titolo));
      diario.forEach(e => {
        if (!e.stanza) {
          const k = titoloDi(e.titolo) || (e.img && e.img.src === "atrio.webp" ? "atrio" : null);
          if (k) corrente = k;
          e.stanza = corrente;
        } else corrente = e.stanza;
      });
    })();

    /* Mostra solo il diario della stanza in cui ci si trova; quello delle altre stanze resta salvato e riappare al ritorno */
    function mostraStanza(id) {
      elDiario.replaceChildren();
      gruppo = null; tendinaAperta = null;
      ridisegno = true;
      try { diario.filter(e => e.stanza === id).forEach(disegna); } finally { ridisegno = false; }
      elDiario.scrollTop = 0; /* si parte dalla testa della pagina */
    }

    let ridisegno = false; /* durante il ridisegno della stanza niente scorrimento automatico */
    /* suggerimenti tolti dal diario (restano solo nella barra di scrittura): nascosti anche nei salvataggi vecchi */
    const NOTE_TOLTE = [TESTI.it.ui.notaInizio, TESTI.en.ui.notaInizio, TESTI.it.esterno.notaForesta, TESTI.en.esterno.notaForesta, TESTI.it.esterno.notaLuce, TESTI.en.esterno.notaLuce];
    let gruppo = null, tendinaAperta = null; /* ogni azione del giocatore è una tendina che contiene ciò che è successo */
    function disegna(v) {
      if (v.tipo === "giocatore") {
        if (tendinaAperta) tendinaAperta.open = false; /* le azioni precedenti si richiudono */
        const det = document.createElement("details");
        det.className = "voce giocatore" + (v.dlg ? " t-dlg" : ""); det.open = true;
        const sm = document.createElement("summary"); sm.textContent = (v.righe || []).join(" ");
        const corpo = document.createElement("div"); corpo.className = "corpo";
        det.append(sm, corpo); elDiario.append(det);
        gruppo = corpo; tendinaAperta = det;
        if (!ridisegno && !vistaFissa) det.scrollIntoView({ block: "nearest" });
        return;
      }
      const el = document.createElement("div");
      if (v.box === "sblocco") v = { ...v, box: "cap" }; /* vecchi salvataggi */
      el.className = "voce " + (v.tipo || "narra") + (v.pg ? " pg" : "") + (v.box ? " riquadro " + v.box : "") + (v.tipo === "missioni" ? " riquadro mis" : "");
      if (v.img && v.img.src === "atrio.webp") { v = { ...v, img: { ...v.img, src: IMMAGINI.atrio }, titolo: v.titolo || TX.viste.atrio.titolo }; } /* vecchi salvataggi */
      if (v.img && IMMAGINI[v.stanza] && v.img.src !== IMMAGINI[v.stanza]) v = { ...v, img: { ...v.img, src: IMMAGINI[v.stanza] } }; /* salvataggi con il vecchio percorso immagini/ */
      if (v.titolo && v.tipo !== "prova") {
        const h = document.createElement("h2"); h.className = "luogo"; h.textContent = v.titolo; el.append(h);
      }
      if (v.img) {
        const img = document.createElement("img");
        const dim = DIM_IMMAGINI[v.stanza] || [1536, 1024];
        img.className = "scena" + (v.stanza === "buio" ? " nera" : v.anim === "esce" ? " esce" : "") + (ridisegno ? " subito" : ""); img.src = v.img.src; img.alt = v.img.alt; img.width = dim[0]; img.height = dim[1];
        const cornice = document.createElement("div"); cornice.className = "cornice"; cornice.append(img);
        img.addEventListener("error", () => cornice.remove()); /* immagine non ancora caricata: niente icona rotta */
        el.append(cornice);
        if (v.stanza === "cucina") portaCucina(cornice);
      }
      const p = (t, c) => { const e = document.createElement("p"); e.textContent = t; if (c) e.className = c; el.append(e); };
      if (v.tipo === "prova") {
        p(v.titolo, "prova-titolo");
        if (v.azione) p(v.azione, "prova-azione");
        const dati = document.createElement("div"); dati.className = "prova-dati";
        (v.dati || []).forEach(d => { const sp = document.createElement("span"); sp.textContent = d; dati.append(sp); });
        el.append(dati);
      }
      if (v.esito) p(v.esito, "esito-prova");
      if (v.tipo === "missioni") { riempiProposte(el, v.ids || []); }
      if (v.tipo === "dialogo") {
        let etichetta = false, dest = el, box = null; const seq = [];
        const riga = (t, c) => { const e = document.createElement("p"); e.textContent = t; e.className = c; dest.append(e); return e; };
        if (v.fuori && v.tuttoBox) { box = dest = document.createElement("div"); dest.className = "dlg-box"; el.append(dest); } /* risposta di un personaggio: anche le descrizioni stanno nel riquadro */
        (v.righe || []).forEach(t => {
          const parla = t.startsWith("«");
          if (parla && !etichetta && v.chi) {
            if (v.fuori && !box) { box = dest = document.createElement("div"); dest.className = "dlg-box"; el.append(dest); seq.push({ el: riga(v.chi, "chi"), box }); }
            else seq.push({ el: riga(v.chi, "chi") });
            etichetta = true;
          }
          seq.push({ el: riga(t, parla ? "battuta" : "descr"), parla, t });
        });
        if (box && seq.length && !seq.some(x => x.box)) seq[0].box = box; /* il riquadro compare con la prima riga */
        if (box && v.macchina && !ridisegno) box.hidden = true;
        if (v.macchina && !ridisegno) { /* le righe compaiono una dopo l'altra; le parole si battono una lettera alla volta */
          seq.forEach(x => { x.el.hidden = true; if (x.parla) x.el.textContent = ""; });
          scrittura = scrittura.then(() => aMacchina(seq));
        }
      } else
      (v.righe || []).forEach(t => p(t, (t.startsWith("«") || t.startsWith("“")) ? "lettera" : ""));
      if (v.banner) p(v.banner, "banner");
      if (v.nota && !NOTE_TOLTE.includes(v.nota)) p(v.nota, "nota");
      (v.fuori ? elDiario : (gruppo || elDiario)).append(el); /* i messaggi dei pulsanti stanno fuori dalla tendina dell'azione */
      /* esito di una prova di abilità: la tendina dell'azione diventa verde o rossa (anche nei salvataggi vecchi) */
      if (!v.fuori && gruppo && tendinaAperta && v.box && (v.prova || /difficolt|difficulty/i.test(v.esito || ""))) tendinaAperta.classList.add(v.box === "ok" ? "t-ok" : "t-ko");
      /* entrando in una stanza la vista si ferma sul titolo e sull'immagine; i messaggi che seguono nella stessa mossa non la spostano */
      if (!ridisegno && v.titolo && v.img) { el.scrollIntoView({ block: "start" }); vistaFissa = true; }
      else if (!ridisegno && !vistaFissa) el.scrollIntoView({ block: v.tipo === "narra" ? "start" : "nearest" });
    }

    /* Cucina: il giocatore entra e può agire liberamente (prove comprese). 5 secondi dopo la sua PRIMA azione in cucina
       parte il suono della porta (audio/apertura_porta.mp3) e l'immagine passa a Guendalina, la governante
       (una volta sola; poi in cucina si vede sempre lei). Se in quel momento c'è un tiro in sospeso, si aspetta che finisca. */
    const SUONO_PORTA_CUCINA = "audio/apertura_porta.mp3";
    const SUONO_CHIUSURA_CUCINA = "audio/chiusura_porta.mp3";
    const PAUSA_CHIUSURA = 500; /* millisecondi tra la fine dell'apertura e la chiusura della porta (massimo 1000) */
    const VOLUME_PORTA = 0.9; /* da 0 a 1 */
    function mostraGuendalina(img) {
      const [w, h] = DIM_IMMAGINI.guendalina;
      img.src = IMMAGINI.guendalina; img.alt = TX.viste.cucina.altGuendalina; img.width = w; img.height = h;
    }
    function suonaPorta() {
      try {
        const muto = typeof Volume !== "undefined" && (Volume.muto || Volume.livello === 0);
        if (muto) return;
        const vol = Math.min(1, VOLUME_PORTA * (typeof Volume !== "undefined" ? Volume.livello : 1));
        const a = new Audio(SUONO_PORTA_CUCINA), c = new Audio(SUONO_CHIUSURA_CUCINA);
        a.volume = vol; c.volume = vol; c.preload = "auto";
        a.addEventListener("ended", () => setTimeout(() => c.play().catch(() => {}), PAUSA_CHIUSURA), { once: true }); /* la porta si richiude */
        a.play().catch(() => {});
      } catch (e) {}
    }
    function portaCucina(cornice) {
      if (usate.portaCucina === "aperta") mostraGuendalina(cornice.querySelector("img.scena")); /* Guendalina è già arrivata */
    }
    let attesaGuendalina = null;
    function programmaGuendalina() {
      if (attesaGuendalina || usate.portaCucina === "aperta") return;
      const prova = (ms) => {
        attesaGuendalina = setTimeout(() => {
          attesaGuendalina = null;
          if (luogo !== "cucina" || usate.portaCucina === "aperta") return; /* uscito prima: arriverà dopo la prima azione al ritorno */
          if (occupato || !elAzioni.hidden) return prova(1000);             /* tiro o risposta in corso: si aspetta */
          arrivoGuendalina();
        }, ms);
      };
      prova(5000);
    }
    function arrivoGuendalina() {
      suonaPorta();
      usate.portaCucina = "aperta"; salvaUsate();
      const imgs = [...elDiario.querySelectorAll("img.scena")].filter(i => i.src.includes(IMMAGINI.cucina));
      imgs.forEach(mostraGuendalina);
      vistaFissa = false;
      if (imgs[0]) { imgs[0].closest(".voce").scrollIntoView({ block: "start", behavior: "smooth" }); vistaFissa = true; }
      avviaDialogo("guendalina");
      const narrazione = elDiario.lastElementChild && elDiario.lastElementChild.previousElementSibling; /* la descrizione dell'arrivo */
      setTimeout(() => { vistaFissa = false; if (narrazione && narrazione.isConnected) narrazione.scrollIntoView({ block: "start", behavior: "smooth" }); }, 2500);
    }

    /* =====================================================================
       DIALOGHI
       Ogni dialogo è un insieme di nodi (DIALOGHI[lingua][id].nodi). Un nodo ha:
         narra:    righe di narrazione (stile normale), facoltative
         battute:  frasi del personaggio, scritte a macchina una lettera alla volta
         risposte: pulsanti del giocatore { testo, vai: nodo successivo }; senza risposte il dialogo finisce
       Il punto raggiunto si salva in usate["dialogo_" + id]: uscendo e rientrando si riprende da lì.
       Un clic sul testo che si sta scrivendo lo completa subito.
       ===================================================================== */
    let scrittura = Promise.resolve(), saltaScrittura = false;
    const VELOCITA_MACCHINA = 28; /* millisecondi per lettera */
    const PAUSA_NARRAZIONE = 6000; /* attesa massima dopo una descrizione, prima della riga successiva */
    async function aMacchina(seq) {
      saltaScrittura = false;
      const salta = () => { saltaScrittura = true; };
      elDiario.addEventListener("click", salta);
      const attendi = (ms) => new Promise(r => setTimeout(r, saltaScrittura ? 0 : ms));
      for (const x of seq) {
        x.el.hidden = false; if (x.box) x.box.hidden = false;
        if (x.parla) {
          x.el.classList.add("scrive");
          for (let n = 1; n <= x.t.length && !saltaScrittura; n++) {
            x.el.textContent = x.t.slice(0, n);
            await attendi(/[.,;:!?…]/.test(x.t[n - 1]) ? VELOCITA_MACCHINA * 6 : VELOCITA_MACCHINA);
          }
          x.el.textContent = x.t; x.el.classList.remove("scrive");
          await attendi(500);
        } else if (x.t) {
          if (!vistaFissa) x.el.scrollIntoView({ block: "nearest" });
          await attendi(Math.min(PAUSA_NARRAZIONE, 600 + x.t.length * 12)); /* il tempo di leggere la descrizione */
        }
        if (!vistaFissa) x.el.scrollIntoView({ block: "nearest" });
      }
      elDiario.removeEventListener("click", salta);
    }
    const DLG = () => DIALOGHI[LINGUA] || DIALOGHI.it;
    const chiaveDlg = (id, k) => "dialogo_" + id + (k ? "_" + k : "");
    function testoDlg(x, id) { /* sceglie la variante per l'atteggiamento e mette il nome del personaggio */
      if (!x) return null;
      const lista = Array.isArray(x) ? x : (x[usate[chiaveDlg(id, "tono")]] || x.gentile || []);
      return lista.map(t => t.replace(/\{nome\}/g, pg.nome));
    }
    function avviaDialogo(id) { nodoDialogo(id, "inizio"); }
    function nodoDialogo(id, nodo, soloRisposte) {
      const d = DLG()[id];
      if (!d.nodi[nodo]) { nodo = "inizio"; soloRisposte = true; } /* salvataggio di una versione precedente del dialogo */
      const n = d.nodi[nodo];
      const conRisposte = n.poi || (n.risposte && n.risposte.length);
      usate[chiaveDlg(id)] = conRisposte ? (n.poi || nodo) : "fine"; salvaUsate();
      if (!soloRisposte) {
        const testo = testoDlg(n.testo, id);
        if (testo) aggiungi({ tipo: "dialogo", fuori: nodo === "inizio", tuttoBox: nodo !== "inizio", chi: d.nome, macchina: true, righe: testo });
        if (n.alla_fine) scrittura.then(() => FINE_DIALOGO[n.alla_fine]()); /* cosa succede quando il nodo finisce */
      }
      if (n.poi) { if (!soloRisposte) scrittura.then(() => mostraRisposte(id, n.poi)); else mostraRisposte(id, n.poi); return; }
      if (conRisposte) scrittura.then(() => mostraRisposte(id, nodo)); /* i pulsanti compaiono quando la frase è finita */
    }
    function mostraRisposte(id, nodo) {
      const d = DLG()[id], n = d.nodi[nodo];
      if (luogo !== d.stanza || !n.risposte) return;
      const fatte = usate[chiaveDlg(id, "fatte")] || [];
      const lista = n.risposte.filter(r => !(r.una && fatte.includes(r.vai)));
      scelte(lista.map(r => {
        const frase = r.testo.replace(/\{nome\}/g, pg.nome);
        return { testo: (r.abilita ? "(" + N("abilita", r.abilita) + ") " : "") + frase, fn: () => {
          chiudiScelte();
          vistaFissa = false;
          if (r.tono) usate[chiaveDlg(id, "tono")] = r.tono;
          if (r.imposta) Object.assign(usate, r.imposta);
          if (r.una) usate[chiaveDlg(id, "fatte")] = [...fatte, r.vai];
          aggiungi({ tipo: "giocatore", dlg: true, righe: ["«" + frase + "»"] }); /* tendina viola: dentro andrà la risposta */
          nodoDialogo(id, r.vai);
        } };
      }));
    }
    /* rientrando nella stanza (o riaprendo la partita) un dialogo lasciato a metà riprende dalle risposte */
    function riprendiDialoghi() {
      for (const id in DIALOGHI.it) {
        const st = usate["dialogo_" + id];
        if (st && st !== "fine" && DIALOGHI.it[id].stanza === luogo) nodoDialogo(id, st, true);
      }
    }

    /* ---------- Fine dei dialoghi: sblocchi e missioni ---------- */
    const sblocco = (righe, tipo) => aggiungi({ tipo: "sistema", box: tipo || "cap", fuori: true, righe }); /* cap = capacità (ambra), mis = missioni (verde acqua) */
    /* spostamento automatico (fuga, ritorno con la scaletta): i testi della stanza restano fuori dalle tendine */
    const vaiDaSolo = (id) => { if (luogo !== "cantina") return; vistaFissa = false; fuoriTendina = true; try { vai(id); } finally { fuoriTendina = false; } };
    const FINE_DIALOGO = {
      guendalina() {
        usate.riposo = "sbloccato"; salvaUsate();
        sblocco(Q.sblocco.riposo, "cap"); disegnaMissioni();
        offriMissioni(1500);
      },
      quest1_proposta() {
        if (!usate.q1 || usate.q1 === "rimandata") { usate.q1 = "proposta"; salvaUsate(); }
        proponiMissioni(["q1"]);
      },
      quest1_completata() {
        if (usate.q1 !== "scaletta") return;
        zaino = zaino.filter(x => x.id !== "scaletta");
        aggiungiZaino({ id: "unguento", nome: "Unguento della Rosa di Cenere", tipo: "consumabile", usi: 1, effetto: "cura" });
        usate.q1 = "completata"; usate.laboratorio = "sbloccato"; salvaUsate();
        sblocco(Q.sblocco.completata, "mis"); sblocco(Q.sblocco.laboratorio, "cap"); disegnaMissioni();
      }
    };

    /* Riquadro «Missioni sbloccate»: il giocatore accetta o rifiuta quando vuole, intanto può continuare a muoversi */
    const proponiMissioni = (ids) => aggiungi({ tipo: "missioni", fuori: true, ids });
    /* approccio gentile: tutte le missioni; approccio brusco: solo quella della scaletta */
    const missioniDisponibili = () => (usate.dialogo_guendalina_tono === "brusco" ? ["q1"] : ["q1", "q3", "q2"]);
    /* propone le missioni di Guendalina non ancora accettate né completate */
    function offriMissioni(ritardo) {
      missioniDisponibili().forEach(id => { if (!usate[id] || usate[id] === "rimandata") usate[id] = "proposta"; });
      salvaUsate();
      const ids = missioniDisponibili().filter(id => ["proposta", "rifiutata"].includes(usate[id]));
      if (!ids.length) return false;
      const fai = () => { if (luogo === "cucina") { vistaFissa = false; proponiMissioni(ids); } };
      if (ritardo) setTimeout(fai, ritardo); else fai();
      return true;
    }
    const statoMissione = (id) => (usate[id] === "rimandata" ? "rifiutata" : usate[id]);
    function riempiProposte(el, ids) {
      const P = Q.proposte;
      el.replaceChildren();
      const t = document.createElement("p"); t.textContent = P.titolo; el.append(t);
      ids.forEach(id => {
        const M = Q.missioni[id], st = statoMissione(id), k = "prop-" + id;
        /* tendina: il titolo della missione (con lo stato) apre la descrizione */
        const det = document.createElement("details"); det.className = "proposta"; det.open = aperti.has(k);
        det.addEventListener("toggle", () => { if (det.open) aperti.add(k); else aperti.delete(k); });
        const sm = document.createElement("summary");
        const n = document.createElement("span"); n.className = "p-nome"; n.textContent = P.missione(M.nome); sm.append(n);
        const decisa = st && st !== "proposta";
        const badge = document.createElement("span"); badge.className = "p-badge" + (decisa ? " deciso" : "");
        badge.textContent = st === "completata" ? P.stati.completata : st === "rifiutata" ? P.stati.rifiutataBreve : decisa ? P.stati.accettata : P.daDecidere;
        sm.append(badge);
        const corpo = document.createElement("div"); corpo.className = "p-corpo";
        const da = document.createElement("p"); da.className = "p-da"; da.textContent = M.da; corpo.append(da);
        /* il testo della missione: descrizioni normali, parole di Guendalina in corsivo */
        let nome = false;
        (M.testo || [M.riassunto]).forEach(x => {
          const parla = x.startsWith("«");
          if (parla && !nome) { const c = document.createElement("p"); c.className = "p-chi"; c.textContent = "Guendalina"; corpo.append(c); nome = true; }
          const r = document.createElement("p"); r.textContent = x; if (parla) r.className = "p-parla"; corpo.append(r);
        });
        if (!decisa) {
          const bb = document.createElement("div"); bb.className = "p-btn";
          const si = document.createElement("button"); si.type = "button"; si.className = "si"; si.textContent = P.accetta;
          const no = document.createElement("button"); no.type = "button"; no.textContent = P.rifiuta;
          si.addEventListener("click", clic(() => { aperti.delete(k); decidiMissione(id, true); riempiProposte(el, ids); }));
          no.addEventListener("click", clic(() => { aperti.delete(k); decidiMissione(id, false); riempiProposte(el, ids); }));
          bb.append(si, no); corpo.append(bb);
        } else {
          const s2 = document.createElement("p"); s2.className = "p-stato";
          s2.textContent = st === "completata" ? P.stati.completata : st === "rifiutata" ? P.stati.rifiutata : P.stati.accettata;
          corpo.append(s2);
        }
        det.append(sm, corpo); el.append(det);
      });
      if (ids.some(id => !statoMissione(id) || statoMissione(id) === "proposta")) {
        const nota = document.createElement("p"); nota.className = "p-nota"; nota.textContent = P.poiNota; el.append(nota);
      }
    }
    function decidiMissione(id, accetta) {
      vistaFissa = false;
      usate[id] = accetta ? "accettata" : "rifiutata"; salvaUsate();
      if (id === "q1") {
        if (luogo === "cucina" && usate.portaCucina === "aperta") nodoDialogo("quest1", accetta ? "accetta" : "rimanda"); /* risponde Guendalina */
      }
      disegnaMissioni();
    }
    /* «parlo con Guendalina» scritto dal giocatore: la tendina diventa viola come i dialoghi */
    function tendinaDialogo() {
      if (fuoriTendina || !tendinaAperta) return;
      tendinaAperta.classList.add("t-dlg");
      const g = [...diario].reverse().find(e => e.tipo === "giocatore"); if (g) g.dlg = true;
    }

    function parlaGuendalina() {
      if (usate.portaCucina !== "aperta") return aggiungi({ tipo: "narra", righe: Q.parla.assente });
      tendinaDialogo();
      const st = usate.dialogo_guendalina;
      if (st && st !== "fine") return nodoDialogo("guendalina", st, true);  /* dialogo lasciato a metà */
      if (usate.q1 === "scaletta") return avviaDialogo("quest1_fine");
      if (missioniDisponibili().some(id => !usate[id] || ["proposta", "rifiutata", "rimandata"].includes(usate[id]))) {
        aggiungi({ tipo: "narra", righe: Q.parla.riofferta });
        missioniDisponibili().forEach(id => { if (usate[id] === "rifiutata") usate[id] = "proposta"; });
        return offriMissioni();
      }
      if (usate.q1 === "accettata") return aggiungi({ tipo: "dialogo", chi: "Guendalina", righe: Q.parla.attesa });
      return aggiungi({ tipo: "dialogo", chi: "Guendalina", righe: Q.parla.dopo });
    }

    function entraCantina() {
      if (usate.q1 === "accettata" || usate.q1 === "scaletta" || usate.q1 === "completata") return vai("cantina");
      return aggiungi({ tipo: "narra", righe: [LINGUA === "en"
        ? "In a corner of the kitchen there is a small dark door: beyond it, a stone staircase descends into the dark. Without a precise reason, you would rather not venture down there."
        : "In un angolo della cucina c'è una piccola porta scura: oltre, una scala di pietra scende nel buio. Senza un motivo preciso, preferisci non avventurarti laggiù."] });
    }

    function dannoFisicoSubito(d) {
      const max = Number(pg.puntiVita ?? pg.saluteFisica) || 0, prima = Math.max(0, max - (pg.dannoFisico || 0));
      pg.dannoFisico = Math.min(max, (pg.dannoFisico || 0) + d);
      disegnaVitali(); scuotiScheda(); modificato();
      return Q.cantina.danno(d, prima, Math.max(0, max - pg.dannoFisico));
    }
    /* i guardiani ti sentono: danni fisici (1d4 o 1d6) e fuga in cucina */
    function guardiani(dado, conTesto) {
      sist(dannoFisicoSubito(tira(dado)) + " — " + Q.cantina.fuga);
      setTimeout(() => vaiDaSolo("cucina"), 1200);
    }
    function prendiScaletta() {
      usate.q1 = "scaletta"; delete usate.cantina_avanza; delete usate.cantina_libera; salvaUsate();
      aggiungiZaino({ id: "scaletta", nome: "Scaletta di legno massiccio", tipo: "missione" });
      sist(U.zainoAgg(nomeOg({ id: "scaletta" })));
      disegnaMissioni();
      setTimeout(() => vaiDaSolo("cucina"), 1200);
    }

    /* Missione 3: il blasone (per ora disperso in casa: prendiBlasone() si chiamerà dal luogo in cui verrà nascosto) */
    function prendiBlasone() {
      usate.q3 = "blasone"; salvaUsate();
      aggiungiZaino({ id: "blasone", nome: "Blasone d'Argento dei Vespera", tipo: "missione" });
      sist(U.zainoAgg(nomeOg({ id: "blasone" })));
      disegnaMissioni();
    }
    function inserisciBlasone() {
      zaino = zaino.filter(x => x.id !== "blasone");
      aggiungiZaino({ id: "lacrima", nome: "La Lacrima della Regina", tipo: "reperto" });
      usate.q3 = "completata"; salvaUsate();
      aggiungi({ tipo: "narra", righe: Q.q3.inserisci });
      sblocco(Q.sblocco.completata3, "mis"); disegnaMissioni();
    }

    function riposa() {
      const caldo = FUOCHI_CALDI.includes(luogo);
      if (!caldo) return aggiungi({ tipo: "narra", righe: Q.riposo.noFuoco });
      const eterno = luogo === "cucina"; /* il focolare di Guendalina non si spegne mai */
      if (!eterno && usate["fuoco_" + luogo] === "spento") return aggiungi({ tipo: "narra", righe: Q.riposo.spento });
      if (usate.riposo !== "sbloccato") return aggiungi({ tipo: "narra", righe: Q.riposo.bloccato });
      if (!(pg.dannoMentale > 0)) return aggiungi({ tipo: "narra", righe: Q.riposo.inutile });
      const max = maxMentali(), prima = Math.max(0, max - pg.dannoMentale), tiro = tira(6);
      pg.dannoMentale = Math.max(0, pg.dannoMentale - tiro);
      if (!eterno) usate["fuoco_" + luogo] = "spento";
      salvaUsate(); aggiornaMentali();
      aggiungi({ tipo: "narra", box: "ok", esito: Q.riposo.esito(tiro, prima, Math.max(0, max - pg.dannoMentale)), righe: [...Q.riposo.dorme, ...(eterno ? Q.riposo.svegliaCucina : Q.riposo.sveglia)] });
      disegnaMissioni();
    }

    /* Scheda: missioni e capacità sbloccate */
    function disegnaMissioni() {
      const M = Q.missioni;
      const mb = document.getElementById("missioniBox"), cb = document.getElementById("capacitaBox");
      if (!mb || !cb) return;
      mb.querySelector("summary").textContent = M.titoloSez; cb.querySelector("summary").textContent = M.capacitaSez;
      const box = document.getElementById("missioni"); box.replaceChildren();
      const fattiDi = {
        q1: (q) => [q === "scaletta" || q === "completata" || diario.some(e => e.stanza === "cantina"), q === "scaletta" || q === "completata", q === "completata"],
        q2: (q) => M.q2.obiettivi.map(() => q === "completata"), /* le fasi verranno spuntate quando l'Ala Est sarà giocabile */
        q3: (q) => [q === "blasone" || q === "completata", q === "completata"]
      };
      let visibili = 0;
      ["q1", "q3", "q2"].forEach(id => {
        const q = ["accettata", "scaletta", "blasone", "completata"].includes(usate[id]) ? usate[id] : null; /* nella scheda solo le missioni accettate */
        if (!q) return;
        visibili++;
        const og = document.createElement("div"); og.className = "missione";
        const h = document.createElement("p"); h.className = "m-nome"; h.textContent = M[id].nome;
        const st = document.createElement("span"); st.className = "m-stato" + (q === "completata" ? " fatta" : ""); st.textContent = q === "completata" ? M.completata : M.inCorso; h.append(" ", st);
        const da = document.createElement("p"); da.className = "m-da"; da.textContent = M[id].da;
        const ul = document.createElement("ul");
        const fatti = fattiDi[id](q);
        M[id].obiettivi.forEach((o, i) => { const li = document.createElement("li"); li.textContent = (fatti[i] ? "✓ " : "○ ") + o; if (fatti[i]) li.className = "fatto"; ul.append(li); });
        og.append(h, da, ul);
        if (M[id].consiglio && q !== "completata") { const c = document.createElement("p"); c.className = "m-da"; c.textContent = M[id].consiglio; og.append(c); }
        box.append(og);
      });
      mb.hidden = !visibili;
      const cap = document.getElementById("capacita"); cap.replaceChildren();
      /* ogni capacità: nome (si apre la descrizione a scomparsa) ed eventuale pulsante */
      const capacita = (k, nome, desc, extra, btn) => {
        const og = document.createElement("div"); og.className = "missione";
        const testa = document.createElement("div"); testa.className = "testa";
        const aperto = aperti.has(k);
        const testo = document.createElement("div"); testo.className = "testo"; testo.id = k; testo.hidden = !aperto;
        const pd = document.createElement("p"); pd.style.margin = "0"; pd.textContent = desc; testo.append(pd);
        if (extra) testo.append(extra);
        const b = document.createElement("button"); b.type = "button"; b.className = "nome-btn"; b.textContent = nome;
        b.setAttribute("aria-expanded", String(aperto)); b.setAttribute("aria-controls", k);
        b.addEventListener("click", () => { const apri = testo.hidden; testo.hidden = !apri; if (apri) aperti.add(k); else aperti.delete(k); b.setAttribute("aria-expanded", String(apri)); });
        testa.append(b); if (btn) testa.append(btn);
        og.append(testa, testo); cap.append(og);
      };
      if (usate.riposo === "sbloccato") {
        const b = document.createElement("button"); b.type = "button"; b.className = "mini"; b.textContent = M.riposo.btn;
        b.addEventListener("click", clic(riposa));
        capacita("cap-riposo", M.riposo.nome, M.riposo.desc, null, b);
      }
      if (usate.laboratorio === "sbloccato") {
        const ul = document.createElement("ul"); M.laboratorio.preparati.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.append(li); });
        capacita("cap-laboratorio", M.laboratorio.nome, M.laboratorio.desc + ":", ul);
      }
      cb.hidden = !cap.children.length;
    }

    let fuoriTendina = false;
    let vistaFissa = false; /* si libera alla mossa successiva del giocatore */
    const clic = (fn) => () => { vistaFissa = false; fuoriTendina = true; try { fn(); } finally { fuoriTendina = false; } };
    function aggiungi(v) {
      if (!v.stanza) v.stanza = luogo;
      if (fuoriTendina) v.fuori = true;
      diario.push(v);
      disegna(v);
      modificato();
    }
    const sist = (testo) => aggiungi({ tipo: "sistema", righe: [testo] });

    function salvaPartita() {
      const conta = {}, tenute = [];
      for (let i = diario.length - 1; i >= 0; i--) { const k = diario[i].stanza || "atrio"; conta[k] = (conta[k] || 0) + 1; if (conta[k] <= 80) tenute.unshift(diario[i]); }
      const dati = { usate, diario: tenute, luogo, dannoMentale: pg.dannoMentale || 0, dannoFisico: pg.dannoFisico || 0, manaUsato: pg.manaUsato || 0, zaino, arma, mano, scudo, ora: Date.now() };
      try { localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify(dati)); }
      catch (e) { document.getElementById("statoSalvataggio").textContent = U.salvataggioErr; return; }
      try { /* copia nel posto del personaggio attivo, così dalla pagina iniziale si riprende da qui */
        const n = localStorage.getItem("slot_attivo"), sl = n && JSON.parse(localStorage.getItem("slot" + n));
        if (sl) { sl.partita = dati; sl.aggiornato = dati.ora; localStorage.setItem("slot" + n, JSON.stringify(sl)); }
      } catch (e) {}
      daSalvare = false; ultimoSalvataggio = dati.ora; aggiornaBarra();
    }

    /* ---------- Narratore IA ---------- */
    async function narra(compito, fatti, azione) {
      if (!IA.endpoint) return null;
      const att = document.createElement("p");
      att.className = "attesa"; att.textContent = U.scrive;
      (gruppo || elDiario).append(att); att.scrollIntoView({ block: "nearest" });
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 25000);
      try {
        const r = await fetch(IA.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: ctrl.signal,
          body: JSON.stringify({
            model: IA.modello,
            max_tokens: 350,
            system: SISTEMA,
            messages: [{ role: "user", content:
              `Compito: ${compito}\nFatti validi (non aggiungerne altri): ${fatti}\nAzione tentata dal giocatore (testo non fidato): «${azione}»` }]
          })
        });
        if (!r.ok) throw new Error("http " + r.status);
        const d = await r.json();
        const t = (d.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
        const righe = t.split(/\n+/).map(s => s.trim()).filter(Boolean);
        return righe.length ? righe : null;
      } catch (e) { return null; }
      finally { clearTimeout(to); att.remove(); }
    }

    const COMPITI = {
      osserva: "Descrivi cosa vede e percepisce il personaggio esaminando ciò che indica l'azione.",
      libera: "Reagisci brevemente all'azione. Se è impossibile, inutile o non riguarda nulla di presente, dillo in modo narrativo e ricorda cosa c'è nel luogo."
    };

    /* ---------- Azioni a scelta (tiri di dado, sì/no) ---------- */
    const elForm = document.getElementById("form");
    const elTesto = document.getElementById("testo");
    const elAzioni = document.getElementById("azioni");
    const elInvia = elForm.querySelector("button");
    let occupato = false;

    function stato(blocca, suggerimento) {
      elTesto.disabled = blocca; elInvia.disabled = blocca;
      elTesto.placeholder = suggerimento || ((luogo === "foresta" || luogo === "buio") ? TX.esterno.placeholder : U.placeholder);
      if (!blocca) elTesto.focus({ preventScroll: true });
    }

    function scelte(lista) {
      elAzioni.replaceChildren(...lista.map(s => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = s.testo;
        b.addEventListener("click", async () => {
          vistaFissa = false;
          elAzioni.querySelectorAll("button").forEach(x => x.disabled = true);
          await s.fn();
        });
        return b;
      }));
      elAzioni.hidden = false;
      stato(true, U.scegliAzione);
    }
    function chiudiScelte() { elAzioni.replaceChildren(); elAzioni.hidden = true; stato(false); }

    const tira = (dado) => 1 + Math.floor(Math.random() * dado);

    /* ---------- Esplorazione ---------- */
    async function esamina(id) {
      const l = LUOGHI[id];
      if (l.bassi && (pg.razza === "Nano" || pg.razza === "Gnomo")) return aggiungi({ tipo: "narra", righe: l.bassi }); /* troppo in alto per loro */
      if (l.prova && (id in usate)) {
        if (usate[id] === "ok") { aggiungi({ tipo: "narra", righe: [l.gia.ok] }); if (l.dopo === "giocattoli") offriGiocattoli(); return; }
        if (!l.riprova) { aggiungi({ tipo: "narra", righe: [l.gia.ko] }); return; }
      }
      const riprovando = !!(l.prova && l.riprova && usate[id] === "ko");
      const righe = riprovando ? l.ancora : (l.fisso || (await narra(COMPITI.osserva, l.fatti, ultimoTesto)) || l.fallback);
      if (righe && righe.length) aggiungi({ tipo: "narra", righe });
      if (l.prova) proponiProva(id, l);
    }

    function proponiProva(id, l) {
      const p = l.prova;
      let m = 0, nota = "", nome;
      if (p.attributo) {
        nome = N("attributi", p.attributo);
        m = mod(Number(pg.statistiche && pg.statistiche[p.attributo]) || 10);
      } else {
        nome = N("abilita", p.abilita);
        m = valoreAbilita(p.abilita);
        nota = addestrata(p.abilita) ? "" : U.nonAddestrata;
      }
      /* Riquadro che mostra al giocatore cosa sta facendo e come funziona la prova */
      aggiungi({ tipo: "prova", titolo: U.prova(nome), azione: l.azione || "", dati: [U.difficolta(p.cd), `d${p.dado}`, U.modificatore(fmtN(m))], righe: [U.istruzioni(p.dado, p.cd) + nota] });
      scelte([
        { testo: U.lancia(p.dado), fn: () => {
          const tiro = tira(p.dado), tot = tiro + m, ok = tot >= p.cd;
          const dopoFallimento = usate[id] === "ko";
          usate[id] = ok ? "ok" : "ko"; salvaUsate();
          chiudiScelte();
          const testoEsito = ok ? ((dopoFallimento && l.successoDopoFallimento) || l.successo) : l.fallimento;
          const fitta = [];
          if (!ok) { /* prova fallita: una fitta alla mente, −1 salute mentale (come nel tutorial) */
            const prima = Math.max(0, maxMentali() - (pg.dannoMentale || 0));
            if (prima > 0) pg.dannoMentale = (pg.dannoMentale || 0) + 1;
            salvaPg(); aggiornaMentali(); scuotiScheda();
            const fitte = l.fitte || U.fitte;
            if (!l.fittaNelTesto) fitta.push(fitte[Math.floor(Math.random() * fitte.length)]);
            fitta.push(U.dannoMentale(prima, Math.max(0, maxMentali() - pg.dannoMentale)));
          }
          aggiungi({ tipo: "narra", prova: true, box: ok ? "ok" : "ko", esito: U.esito(tiro, m, tot, p.cd, ok), righe: [...testoEsito, ...fitta] });
          if (ok && l.apre) sist(l.apre);
          if (ok && l.zaino) {
            aggiungiZaino({ id: id, nome: l.zaino.nome, tipo: "nota", testo: TX.foglietto });
            sist(U.zainoAgg(N("oggetti", l.zaino.nome)));
          }
          if (ok && l.dopo === "giocattoli") offriGiocattoli();
          if (l.stanza) controllaDannoStanza(l.stanza);
          if (l.poi) l.poi(ok);
        } },
        { testo: U.lasciaPerdere, fn: () => { chiudiScelte(); aggiungi({ tipo: "narra", righe: [l.lascia] }); } }
      ]);
    }

    /* Tutte le prove della stanza fallite: danni mentali (1d4), da tirare una sola volta */
    function controllaDannoStanza(stanzaId) {
      const cfg = DANNO_STANZA[stanzaId];
      if (!cfg || cfg.chiave in usate) return;
      if (!cfg.ids.every(i => usate[i] === "ko")) return;
      aggiungi({ tipo: "narra", righe: [U.dannoStanza(cfg.dado)] });
      scelte([{ testo: U.lancia(cfg.dado), fn: () => {
        const d = tira(cfg.dado);
        pg.dannoMentale = (pg.dannoMentale || 0) + d; salvaPg(); aggiornaMentali();
        usate[cfg.chiave] = "ok"; salvaUsate();
        chiudiScelte();
        aggiungi({ tipo: "narra", box: "ko", esito: U.dannoSubito(d), righe: [U.dannoStanzaEsito] });
      } }]);
    }

    /* =====================================================================
       ZAINO, EQUIPAGGIAMENTO E OGGETTI
       Mani: un'arma a due mani occupa entrambe le mani; lo scudo ne occupa una.
       Arma a due mani e scudo non vanno insieme; con lo scudo non si tiene la torcia.
       ===================================================================== */
    const impugnabile = (it) => !!(it && (it.impugnabile || it.nome === "Torcia"));
    const duemani = () => !!(arma && arma.nome !== "—" && maniArma(arma) === 2);
    const campiArma = (o) => ({ nome: o.nome, bonus: o.bonus || 0, alias: o.alias || [], desc: o.desc, danno: o.danno, tipoDanno: o.tipoDanno, mani: o.mani });
    const nuovoId = () => "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const aperti = new Set(); /* descrizioni aperte nello zaino: restano aperte quando la lista si ridisegna */

    /* Voce dell'equipaggiamento: il nome si apre e mostra le caratteristiche (niente descrizione) */
    function voceEquip(dl, etichetta, nome, sommario, chiave) {
      const dt = document.createElement("dt"); dt.textContent = etichetta;
      const dd = document.createElement("dd");
      if (!sommario || !sommario.length) { dd.textContent = nome; dl.append(dt, dd); return; }
      const k = "eq-" + chiave, aperto = aperti.has(k);
      const extra = document.createElement("dd"); extra.className = "extra"; extra.id = k; extra.hidden = !aperto;
      /* riquadro a scomparsa come nello zaino: una riga per attributo */
      const d = document.createElement("p"); d.className = "testo";
      [].concat(sommario).forEach((r, i) => { if (i) d.append(document.createElement("br")); d.append(r); });
      extra.append(d);
      const b = document.createElement("button");
      b.type = "button"; b.className = "nome-btn"; b.textContent = nome;
      b.setAttribute("aria-expanded", String(aperto)); b.setAttribute("aria-controls", k);
      b.addEventListener("click", () => {
        const apri = extra.hidden;
        extra.hidden = !apri;
        if (apri) aperti.add(k); else aperti.delete(k);
        b.setAttribute("aria-expanded", String(apri));
      });
      dd.append(b);
      dl.append(dt, dd, extra);
    }

    function disegnaEquip() {
      const dl = document.getElementById("equip");
      dl.replaceChildren();
      const eq = eqPg();
      const haArma = arma.nome !== "—";
      const dettArma = haArma ? [testoDanno(arma), arma.tipoDanno ? N("danni", arma.tipoDanno) : null, arma.mani ? U.mani(maniArma(arma)) : null].filter(Boolean) : [];
      /* 1. mano primaria: l'arma impugnata (dettagli a scomparsa) */
      voceEquip(dl, U.manoPrimaria, haArma ? nomeOg(arma) : "—", dettArma, "arma");
      /* 2. mano secondaria: arma a due mani, scudo o oggetto impugnato; vuota = trattino */
      if (duemani()) voceEquip(dl, U.manoSecondaria, "—"); /* l'arma a due mani è già in mano primaria */
      else if (scudo) voceEquip(dl, U.manoSecondaria, nomeOg(scudo), [U.caBonus(Number(scudo.ca) || 0), Number(scudo.malus) ? U.malusAg(Number(scudo.malus)) : U.noMalus], "scudo");
      else voceEquip(dl, U.manoSecondaria, mano ? nomeOg(mano) + (mano.usi != null ? ` ×${mano.usi}` : "") : "—", "", "mano");
      /* 3. armatura (dettagli a scomparsa) */
      const malus = Number(eq.malusAgilita) || 0;
      voceEquip(dl, U.armatura, eq.armatura ? N("oggetti", eq.armatura) : "—",
        eq.armatura ? [eq.armaturaCA != null ? U.caBonus(Number(eq.armaturaCA)) : null, malus > 0 ? U.malusAg(malus) : U.noMalus].filter(Boolean) : [], "armatura");
      const az = document.getElementById("equipAzioni");
      az.replaceChildren();
      const bott = (etichetta, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "mini"; b.textContent = etichetta; b.addEventListener("click", clic(fn)); az.append(b); };
      if (haArma) bott(U.riponiBtn(nomeOg(arma)), riponiArma);
      if (scudo) bott(U.riponiBtn(nomeOg(scudo)), riponiScudo);
      if (mano && mano.usi != null) bott(U.usaBtn(nomeOg(mano)), () => usa(mano.id));
      if (mano) bott(U.riponiBtn(nomeOg(mano)), riponi);
    }

    function aggiornaZaino() {
      const box = document.getElementById("zaino");
      box.replaceChildren();
      if (!zaino.length) {
        const p = document.createElement("p"); p.className = "vuoto"; p.textContent = U.zainoVuoto; box.append(p);
        return;
      }
      zaino.forEach(it => {
        const nome = nomeOg(it) + (it.usi != null ? ` ×${it.usi}` : "");
        const og = document.createElement("div"); og.className = "oggetto";
        const testa = document.createElement("div"); testa.className = "testa";
        const info = document.createElement("div");
        const armaOScudo = it.tipo === "arma" || it.tipo === "scudo";
        const descrizione = armaOScudo ? null : testoOggetto(it); /* armi e scudo: solo gli attributi */
        let testo = null;
        if (descrizione) { /* descrizione a scomparsa: si apre cliccando sul nome */
          const aperto = aperti.has(it.id);
          testo = document.createElement("p");
          testo.className = "testo" + (it.tipo === "nota" ? " lettera" : "");
          testo.id = "testo-" + it.id; testo.textContent = descrizione; testo.hidden = !aperto;
          const b = document.createElement("button");
          b.type = "button"; b.className = "nome-btn"; b.textContent = nome;
          b.setAttribute("aria-expanded", String(aperto)); b.setAttribute("aria-controls", testo.id);
          b.addEventListener("click", () => {
            const apri = testo.hidden;
            testo.hidden = !apri;
            if (apri) aperti.add(it.id); else aperti.delete(it.id);
            b.setAttribute("aria-expanded", String(apri));
          });
          info.append(b);
        } else {
          const n = document.createElement("div"); n.textContent = nome; info.append(n);
        }
        const riepilogo = it.tipo === "arma" ? [testoDanno(it), dettaglioArma(it)].filter(Boolean).join(" · ") : it.tipo === "scudo" ? infoScudo(it) : null;
        if (riepilogo) { const ds = document.createElement("div"); ds.className = "desc"; ds.textContent = riepilogo; info.append(ds); }
        testa.append(info);
        const az = document.createElement("div"); az.className = "azioni-og";
        const bottone = (etichetta, fn) => {
          const b = document.createElement("button"); b.type = "button"; b.className = "mini"; b.textContent = etichetta;
          b.addEventListener("click", fn); az.append(b);
        };
        if (it.tipo === "arma") bottone(U.equipaggia, clic(() => equipaggia(it.id)));
        else if (it.tipo === "scudo") bottone(U.equipaggia, clic(() => imbracciaScudo(it.id)));
        else if (impugnabile(it)) bottone(U.equipaggia, clic(() => impugna(it.id)));
        else if (it.usi != null) bottone(U.usa, clic(() => usa(it.id)));
        if (az.children.length) testa.append(az);
        og.append(testa);
        if (testo) og.append(testo);
        box.append(og);
      });
    }

    function aggiornaEquip() { disegnaVitali(); disegnaAbilita(); disegnaEquip(); aggiornaZaino(); }

    function aggiungiZaino(it) {
      if (!zaino.some(x => x.id === it.id)) zaino.push(it);
      aggiornaZaino(); modificato();
    }

    /* L'arma in uso viene sostituita; quella di prima torna nello zaino, così non si perde */
    /* Liberare le mani: ciò che le occupa torna nello zaino e il messaggio lo dice */
    function via_arma() { if (!arma || arma.nome === "—") return ""; const n = nomeOg(arma); zaino.push({ id: nuovoId(), ...campiArma(arma), tipo: "arma" }); arma = { nome: "—" }; return U.tornaZaino(n); }
    function via_scudo() { if (!scudo) return ""; const n = nomeOg(scudo); zaino.push(scudo); scudo = null; return U.tornaZaino(n); }
    function via_mano() { if (!mano) return ""; const n = nomeOg(mano); zaino.push(mano); mano = null; return U.tornaZaino(n); }
    /* per tenere qualcosa nella mano secondaria: via l'arma a due mani, lo scudo e l'oggetto già impugnato */
    function liberaSecondaria() { return (duemani() ? via_arma() : "") + via_scudo() + via_mano(); }

    /* L'arma in uso viene sostituita; quella di prima torna nello zaino, così non si perde */
    function equipaggia(id) {
      const i = zaino.findIndex(x => x.id === id);
      if (i < 0) return;
      const nuova = zaino.splice(i, 1)[0];
      let extra = via_arma();
      if (maniArma(nuova) === 2) extra += via_scudo() + via_mano(); /* l'arma a due mani occupa anche la mano secondaria */
      arma = campiArma(nuova);
      let msg = U.equipaggi(nomeOg(arma));
      if (maniArma(arma) === 2) msg += U.notaDueMani;
      aggiornaEquip();
      sist(msg + extra);
    }

    function riponiArma() {
      if (!arma || arma.nome === "—") return;
      const n = nomeOg(arma);
      zaino.push({ id: nuovoId(), ...campiArma(arma), tipo: "arma" });
      arma = { nome: "—" };
      aggiornaEquip();
      sist(U.riponiArma(n));
    }

    /* Scudo: va nella mano secondaria */
    function imbracciaScudo(id) {
      const it = zaino.find(x => x.id === id);
      if (!it) return;
      zaino = zaino.filter(x => x !== it);
      const extra = liberaSecondaria();
      scudo = it;
      aggiornaEquip();
      sist(U.imbracci(nomeOg(it)) + extra);
    }

    function riponiScudo() {
      if (!scudo) return;
      const n = nomeOg(scudo);
      zaino.push(scudo); scudo = null;
      aggiornaEquip();
      sist(U.riponiScudo(n));
    }

    /* Oggetti da tenere in mano (la torcia): vanno nella mano secondaria */
    function impugna(id) {
      const it = zaino.find(x => x.id === id);
      if (!it) return;
      zaino = zaino.filter(x => x !== it);
      const extra = liberaSecondaria();
      mano = it;
      aggiornaEquip();
      sist(U.equipaggi(nomeOg(it)) + extra);
    }

    function riponi() {
      if (!mano) return;
      const n = nomeOg(mano);
      zaino.push(mano); mano = null;
      aggiornaEquip();
      sist(U.riponi(n));
    }

    function usa(id) {
      let inMano = !!(mano && mano.id === id);
      const it = inMano ? mano : zaino.find(x => x.id === id);
      if (!it || it.usi == null) return;
      let pre = "";
      if (impugnabile(it) && !inMano) { /* va prima in mano secondaria, poi si usa: tutto in un'azione */
        zaino = zaino.filter(x => x !== it);
        pre = U.equipaggi(nomeOg(it)) + liberaSecondaria() + " ";
        mano = it; inMano = true;
      }
      it.usi -= 1;
      if (it.effetto === "cura") { /* unguento: 1d4 + livello di salute fisica */
        const max = Number(pg.puntiVita ?? pg.saluteFisica) || 0, prima = Math.max(0, max - (pg.dannoFisico || 0));
        const d = tira(4) + (Number(pg.livello) || 1);
        pg.dannoFisico = Math.max(0, (pg.dannoFisico || 0) - d);
        disegnaVitali();
        sist(Q.oggetti.cura(d, prima, Math.max(0, max - pg.dannoFisico)));
      }
      let msg = pre + U.usi(nomeOg(it), it.usi);
      if (it.usi <= 0) {
        if (inMano) mano = null; else zaino = zaino.filter(x => x !== it);
        msg = pre + U.esaurito(nomeOg(it), inMano);
      }
      aggiornaEquip();
      sist(msg);
    }

    /* "Usa" ed "equipaggia" portano alla stessa azione: quella giusta per l'oggetto.
       soloPrendere: il giocatore ha scritto "prendo"/"afferro", quindi niente consumo di utilizzi. */
    function azioneOggetto(it, soloPrendere) {
      if (it === scudo) return sist(U.giaScudo(nomeOg(it)));
      if (it.tipo === "arma") return equipaggia(it.id);
      if (it.tipo === "scudo") return imbracciaScudo(it.id);
      if (impugnabile(it) && it !== mano) return (soloPrendere || it.usi == null) ? impugna(it.id) : usa(it.id);
      if (it === mano && soloPrendere) return sist(U.giaInMano(nomeOg(it)));
      if (it.usi != null) return usa(it.id);
      if (it.tipo === "nota") return aggiungi({ tipo: "narra", righe: [U.rileggi(nomeOg(it)), testoOggetto(it)] });
      return aggiungi({ tipo: "narra", righe: [U.nienteDaFare(nomeOg(it))] });
    }

    /* Riconoscimento di un oggetto nel testo del giocatore (prime 4 lettere di ogni parola del nome, in entrambe le lingue) */
    const ESCLUSE = ["della", "delle", "dello", "degli", "fire", "fuoc", "with"]; /* radici troppo generiche: "accendo il fuoco" non è l'ampolla */
    const radici = (it) => [...Lingua.nomi(it.nome), ...(it.alias || [])].flatMap(s => norm(s).split(/[^a-z0-9]+/))
      .filter(w => w.length >= 4).map(w => w.slice(0, 4)).filter(r => !ESCLUSE.includes(r));
    const citato = (it, t) => radici(it).some(r => new RegExp("\\b" + r).test(t));
    const trovaOggetti = (t, filtro) => [...zaino, ...(mano ? [mano] : []), ...(scudo ? [scudo] : [])].filter(it => filtro(it) && citato(it, t));

    /* ---------- I giocattoli di legno (sala da conversazione, dopo la prova di Indagare) ---------- */
    const GIOCATTOLI = TX.giocattoli;
    function offriGiocattoli() {
      if (usate.giocattoli === "presi") return;
      aggiungi({ tipo: "narra", righe: [GIOCATTOLI.domanda] });
      scelte([
        { testo: GIOCATTOLI.si_btn, fn: () => {
          usate.giocattoli = "presi"; salvaUsate(); chiudiScelte();
          aggiungi({ tipo: "narra", righe: GIOCATTOLI.presi });
          aggiungiZaino({ id: "giocattoli", nome: "Giocattoli di legno", tipo: "oggetto", testo: GIOCATTOLI.desc, alias: ["giocattoli", "figurine", "toys"] });
          sist(U.zainoAgg(GIOCATTOLI.nome));
        } },
        { testo: GIOCATTOLI.no_btn, fn: () => { usate.giocattoli = "lasciati"; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", righe: GIOCATTOLI.lasciati }); } }
      ]);
    }
    /* «prendo i giocattoli»: possibile solo dopo averli trovati, anche se prima si era detto di no */
    function giocattoli() {
      if (usate.giocattoli === "presi") return aggiungi({ tipo: "narra", righe: [GIOCATTOLI.giaPresi] });
      if (usate.divani === "ok" || usate.conv_indagare === "ok") return offriGiocattoli();
      aggiungi({ tipo: "narra", righe: [GIOCATTOLI.nonVisti] });
    }

    /* ---------- Porta sinistra dell'atrio: chiusa a chiave (per ora) ----------
       Si chiede se provare ad aprirla; se sì, una frase a caso che fa sentire in gabbia e −1 salute mentale. */
    function portaChiusa(soloDomanda) {
      const P = TX.esterno.portaDx;
      aggiungi({ tipo: "narra", righe: soloDomanda ? [P.domanda] : [...LUOGHI.porta_sx.fisso, P.domanda] });
      scelte([
        { testo: P.si_btn, fn: () => {
          chiudiScelte();
          const prima = Math.max(0, maxMentali() - (pg.dannoMentale || 0));
          if (prima > 0) pg.dannoMentale = (pg.dannoMentale || 0) + 1;
          salvaPg(); aggiornaMentali(); scuotiScheda();
          aggiungi({ tipo: "narra", box: "ko", righe: [P.gabbia[Math.floor(Math.random() * P.gabbia.length)], U.dannoMentale(prima, Math.max(0, maxMentali() - pg.dannoMentale))] });
        } },
        { testo: P.no_btn, fn: () => { chiudiScelte(); aggiungi({ tipo: "narra", righe: [P.no] }); } }
      ]);
    }

    /* ---------- Il tesoro: la spada ---------- */
    const SPADA = { ...TX.spada, oggetto: { id: "retaggio", nome: "Retaggio del Padrone", tipo: "arma", alias: ["spada", "sword", "lama", "blade"], desc: "Spada magica", danno: "1d10", tipoDanno: "Tagliente", mani: 1 } };

    function offriSpada() {
      aggiungi({ tipo: "narra", righe: SPADA.offerta });
      scelte([
        { testo: SPADA.si_btn, fn: () => {
          usate.spada = "presa"; salvaUsate(); chiudiScelte();
          aggiungi({ tipo: "narra", righe: SPADA.presa });
          aggiungiZaino({ ...SPADA.oggetto });
          sist(U.zainoSpada(nomeOg(SPADA.oggetto)));
        } },
        { testo: SPADA.no_btn, fn: () => { usate.spada = "lasciata"; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", righe: SPADA.lasciata }); } }
      ]);
    }

    /* "prendo la spada": si può riprovare anche dopo aver rifiutato, ma solo se l'armatura ha ceduto */
    function spada() {
      if (usate.spada === "presa") return aggiungi({ tipo: "narra", righe: [SPADA.giaPresa] });
      if (usate.scale === "ok") return offriSpada();
      aggiungi({ tipo: "narra", righe: [SPADA.lontana] });
    }

    function scale() {
      if ("scale" in usate) { aggiungi({ tipo: "narra", righe: [SCALE.gia + (usate.scale === "ok" && usate.spada !== "presa" ? " " + SPADA.ancoraLi : "")] }); return; }
      if (spirito() >= SCALE.soglia) {
        aggiungi({ tipo: "narra", righe: [...SCALE.testo, SCALE.domanda] });
        scelte([
          { testo: SCALE.si_btn, fn: () => { usate.scale = "ok"; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", box: "ok", righe: SCALE.si, banner: SCALE.banner }); offriSpada(); } },
          { testo: SCALE.no_btn, fn: () => { usate.scale = ""; salvaUsate(); chiudiScelte(); aggiungi({ tipo: "narra", righe: SCALE.no }); } }
        ]);
      } else {
        aggiungi({ tipo: "narra", righe: [...SCALE.testo, SCALE.respinge(SCALE.dannoDado)] });
        scelte([{ testo: U.lancia(SCALE.dannoDado), fn: () => {
          const d = tira(SCALE.dannoDado);
          pg.dannoMentale = (pg.dannoMentale || 0) + d; salvaPg(); aggiornaMentali();
          usate.scale = "ko"; salvaUsate();
          chiudiScelte();
          aggiungi({ tipo: "narra", box: "ko", esito: U.dannoSubito(d), righe: SCALE.respinto });
        } }]);
      }
    }

    /* =====================================================================
       FORESTA E BUIO DELLA GROTTA
       Entrando nel dungeon l'immagine si spegne fino al nero. Si arriva all'atrio solo accendendo
       una torcia o lanciando l'incantesimo Luce. Senza nessuno dei due si può uscire all'accampamento
       e prepararsi una torcia improvvisata (un solo utilizzo, una sola volta per partita).
       ===================================================================== */
    const EST = TX.esterno;
    const torciaUtile = () => [...(mano ? [mano] : []), ...zaino].find(it => it.nome === "Torcia" && Number(it.usi) > 0) || null;
    /* incantesimi scelti in creazione (Sapiente e Accolito): si cerca «Luce» / «Light», per nome o come stringa */
    const incantesimoLuce = () => listaIncantesimi().find(s => s.id === "luce" || nomiInc(s).some(n => /^(luce|light)$/.test(norm(n).trim()))) || null;
    const notaBuio = () => (torciaUtile() || incantesimoLuce()) ? undefined : EST.notaEsci;
    const buio = () => aggiungi({ tipo: "narra", righe: [EST.buio[Math.floor(Math.random() * EST.buio.length)]], nota: notaBuio() });

    function entraBuio() {
      chiudiScelte();
      luogo = "buio";
      const tornato = diario.some(e => e.stanza === "buio");
      mostraStanza("buio");
      Suono.aggiorna();
      aggiungi({ tipo: "narra", ...vista("buio"), righe: tornato ? STANZE.buio.ritorno : STANZE.buio.intro, nota: notaBuio() });
    }

    function prendiTorcia() {
      if (usate.torcia_campo) return aggiungi({ tipo: "narra", righe: [EST.torciaGia] });
      usate.torcia_campo = "presa"; salvaUsate();
      aggiungi({ tipo: "narra", righe: EST.torciaPresa });
      const gia = [...(mano ? [mano] : []), ...zaino].find(it => it.nome === "Torcia"); /* torce già possedute: si aggiunge un utilizzo */
      if (gia) { gia.usi = (Number(gia.usi) || 0) + 1; aggiornaEquip(); modificato(); return sist(EST.torciaAggiunta(gia.usi)); }
      aggiungiZaino({ id: "torcia_campo", nome: "Torcia", tipo: "dotazione", usi: 1, impugnabile: true });
      sist(U.zainoAgg(nomeOg({ nome: "Torcia" })));
    }

    /* La luce rivela l'atrio: la descrizione dell'atrio è preceduta da una frase di passaggio */
    /* torciaSpenta: la torcia accesa si spegne appena entrati nell'atrio */
    function luceNelBuio(passaggio, msg, torciaSpenta) {
      chiudiScelte();
      usate.luce = "ok"; salvaUsate();
      luogo = "atrio";
      mostraStanza("atrio");
      Suono.aggiorna();
      const righe = [...passaggio, ...TX.intro, EST.portone];
      if (torciaSpenta) righe.push(EST.torciaSpenta);
      aggiungi({ tipo: "narra", ...vista("atrio"), righe });
      if (msg) sist(msg);
    }

    function accendiTorcia() {
      const it = torciaUtile();
      if (!it) return aggiungi({ tipo: "narra", righe: [EST.nessunaTorcia], nota: notaBuio() });
      /* per accenderla serve la mano secondaria: arma a due mani, scudo o altro oggetto tornano nello zaino
