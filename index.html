<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il Trono di Cenere</title>
  <script src="lib/purify.min.js"></script>
  <script src="sicuro.js"></script>
  <script src="lingua.js"></script>
  <script>
    /* Volume di partenza: 10%. Vale solo finché il giocatore non lo cambia (la scelta resta salvata). */
    try { if (localStorage.getItem("audio_volume") === null) localStorage.setItem("audio_volume", "0.1"); } catch (e) {}
  </script>
  <script src="volume.js"></script>
  <script src="lib/howler.core.min.js"></script>
  <script src="audio.js"></script>
  <script src="cloud.js"></script>
  <link rel="stylesheet" href="tema.css">
  <style>
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--f-testo);
      text-align: center;
    }

    .sfondo {
      position: fixed; inset: 0; z-index: -2;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 40%;
      background: var(--bg);
    }
    .velo {
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(7,9,13,0) 30%, rgba(7,9,13,0.55) 100%),
        linear-gradient(to bottom, rgba(7,9,13,0.75) 0%, rgba(7,9,13,0) 28%, rgba(7,9,13,0) 52%, rgba(7,9,13,0.92) 100%);
    }

    main {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      padding: clamp(2rem, 7vh, 4rem) 1.5rem calc(clamp(2rem, 8vh, 4.5rem) + 2.25rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6.5vw, 4.25rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.8);
    }
    h1::after {
      content: ""; display: block; width: 6rem; height: 1px; margin: 1.1rem auto 0;
      background: linear-gradient(to right, transparent, var(--muted), transparent);
    }

    .domanda { max-width: 36rem; }
    h2 {
      margin: 0 0 1.75rem;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 400;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    .scelte { display: flex; gap: 1rem; justify-content: center; }
    button {
      font: inherit;
      font-size: 1.2rem;
      min-width: 8rem;
      padding: 0.7rem 2.25rem;
      border-radius: 0.5rem;
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    #si { background: var(--accent); color: var(--accent-text); }
    #si:hover { background: var(--text); border-color: var(--text); transform: translateY(-1px); }
    #no { background: rgba(7,9,13,0.55); color: var(--muted); border-color: var(--muted); backdrop-filter: blur(4px); }
    #no:hover { background: rgba(7,9,13,0.8); color: var(--text); }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    /* ---------- Accesso alla sala d'allenamento (tutorial) ---------- */
    .allenamento {
      display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 1.4rem;
      color: var(--muted); text-decoration: none; font-size: 1.02rem; font-style: italic;
      padding: 0.45rem 1.1rem; border: 1px solid rgba(180,180,180,0.3); border-radius: 0.5rem;
      background: rgba(7,9,13,0.55); backdrop-filter: blur(4px); text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .allenamento:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }
    .allenamento:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    .allenamento .fatto { font-style: normal; font-size: 0.85rem; color: var(--ok); }
    .personaggi .allenamento { display: flex; justify-content: center; margin: 1rem auto 0; width: fit-content; }
    .allenamento.regolamento { display: flex; width: fit-content; margin: 0.6rem auto 0; } /* sotto la sala d'allenamento */
    #risposta { margin: 1.75rem 0 0; font-size: 1.4rem; min-height: 2rem; font-style: italic; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }


    /* ---------- Scelta del personaggio (stile piattaforma di streaming) ---------- */
    .personaggi { width: min(100%, 36rem); text-align: left; }
    .personaggi[hidden] { display: none; }
    .personaggi h2 { text-align: center; margin-bottom: 1.25rem; }
    .lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .riga { display: flex; align-items: stretch; gap: 0.5rem; }
    .scheda {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 1.1rem;
      padding: 0.7rem 1rem; text-align: left; color: var(--text);
      background: rgba(7,9,13,0.72); border: 2px solid rgba(180,180,180,0.28); border-radius: 0.75rem;
      backdrop-filter: blur(6px);
    }
    .scheda:hover:not(:disabled) { border-color: var(--accent); background: rgba(13,17,23,0.88); transform: translateY(-1px); }
    .scheda:disabled { opacity: 0.55; cursor: not-allowed; }
    .token {
      flex: none; width: 4.75rem; height: 4.75rem; border-radius: 50%; overflow: hidden;
      border: 2px solid var(--accent); background: #11161d; color: var(--muted);
      display: grid; place-items: center; font-size: 2rem;
    }
    .token img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
    .dettagli { min-width: 0; }
    .nome { display: block; font-family: var(--f-titoli); font-size: 1.3rem; font-weight: 600; letter-spacing: 0.05em; overflow-wrap: anywhere; }
    .info { display: block; color: var(--muted); font-size: 1.02rem; }
    .salvato { display: block; color: var(--muted); font-size: 0.85rem; font-style: italic; margin-top: 0.15rem; }
    .elimina {
      min-width: 0; padding: 0 1rem; font-size: 0.95rem; color: var(--muted);
      background: rgba(7,9,13,0.72); border: 2px solid rgba(180,180,180,0.28); border-radius: 0.75rem;
    }
    .elimina:hover, .elimina[data-conferma] { color: #ffb4b4; border-color: #d96b6b; }
    .nuova .token { border-style: dashed; border-color: var(--muted); color: var(--text); font-size: 2.4rem; }
    .avviso { margin: 0.9rem 0 0; text-align: center; color: var(--muted); font-style: italic; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    @media (max-width: 480px) { .token { width: 3.75rem; height: 3.75rem; font-size: 1.6rem; } .scheda { gap: 0.8rem; } .nome { font-size: 1.15rem; } }

    /* ---------- Scelta della lingua (in fondo, al centro) ---------- */
    .lingue {
      position: fixed; left: 50%; bottom: 1.1rem; transform: translateX(-50%); z-index: 2;
      display: flex; gap: 0.65rem;
    }
    .lingue .bandiera {
      min-width: 0; width: 2.25rem; height: 1.5rem; padding: 0; overflow: hidden;
      border-radius: 0.25rem; border: 1px solid rgba(180,180,180,0.45); background: none;
      opacity: 0.5; box-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }
    .lingue .bandiera svg { display: block; width: 100%; height: 100%; }
    .lingue .bandiera:hover { opacity: 0.85; transform: translateY(-1px); }
    .lingue .bandiera[aria-pressed="true"] {
      opacity: 1; border-color: rgba(232,237,243,0.9);
      box-shadow: 0 0 0 1px rgba(232,237,243,0.35), 0 2px 8px rgba(0,0,0,0.65);
    }

    /* ---------- Musica: pulsante in basso a destra ---------- */
    #audio {
      position: fixed; right: 1.1rem; bottom: 1rem; z-index: 3;
      min-width: 0; padding: 0.45rem 0.65rem; font-size: 1.05rem; line-height: 1;
      color: var(--text); background: rgba(7,9,13,0.6); border: 1px solid rgba(180,180,180,0.45);
      backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }
    #audio:hover { border-color: var(--accent); }

    /* ---------- Pannello del volume (volume.js): verticale, sopra il pulsante ---------- */
    body .volume { position: fixed; right: 1.1rem; bottom: 1rem; z-index: 3; }
    body .volume #audio { position: static; display: inline-flex; align-items: center; }
    body .volume-pannello {
      top: auto; bottom: calc(100% + 0.5rem); right: 0; width: auto;
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
      padding: 0.7rem 0.55rem; background: rgba(7,9,13,0.85); backdrop-filter: blur(6px);
    }
    body .volume-pannello[hidden] { display: none; }
    body .volume-riga b { display: none; }
    body .volume-valore { min-width: 0; text-align: center; font-size: 0.85rem; }
    body .volume-cursore {
      writing-mode: vertical-lr; direction: rtl; /* cursore verticale: in alto = più forte */
      width: 0.4rem; height: 8rem; margin: 0.2rem 0;
      background: linear-gradient(to top, var(--accent) var(--pieno, 10%), var(--line) var(--pieno, 10%));
    }
    body .volume-muto {
      min-width: 0; width: auto; padding: 0.3rem 0.55rem; font-size: 0.78rem; line-height: 1.2;
      border-width: 1px; transition: none;
    }

    /* ---------- Account cloud: in basso a sinistra, speculare al volume ---------- */
    .account { position: fixed; left: 1.1rem; bottom: 1rem; z-index: 3; }
    .account[hidden] { display: none; }
    .account button {
      min-width: 0; padding: 0.45rem 0.8rem; font-size: 0.92rem; line-height: 1.2;
      color: var(--text); background: rgba(7,9,13,0.6); border: 1px solid rgba(180,180,180,0.45);
      backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.65);
      max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .account button:hover { border-color: var(--accent); }
    .account button[data-conferma] { color: #ffb4b4; border-color: #d96b6b; }
    @media (max-width: 480px) { .lingue { left: auto; right: 4.6rem; transform: none; } }

    /* ---------- Conflitti di salvataggio tra dispositivi ---------- */
    .conflitti:empty { display: none; }
    .conflitti { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
    .conflitto { padding: 0.9rem 1rem; border: 2px solid #d9a441; border-radius: 0.75rem; background: rgba(7,9,13,0.82); backdrop-filter: blur(6px); }
    .conflitto .c-tit { margin: 0; font-weight: 600; color: #f0c674; }
    .conflitto .c-info { margin: 0.3rem 0 0.75rem; color: var(--muted); font-size: 0.95rem; }
    .conflitto .c-scelte { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    @media (max-width: 480px) { .conflitto .c-scelte { grid-template-columns: 1fr; } }
    .conflitto .c-scelta {
      min-width: 0; padding: 0.6rem 0.8rem; font-size: 0.95rem; text-align: left; color: var(--text);
      background: rgba(13,17,23,0.9); border: 1px solid rgba(180,180,180,0.35); display: flex; flex-direction: column; gap: 0.15rem;
    }
    .conflitto .c-scelta:hover:not(:disabled) { border-color: var(--accent); }
    .conflitto .c-scelta b { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .conflitto .c-scelta span { color: var(--muted); font-size: 0.9rem; }

    @media (prefers-reduced-motion: no-preference) {
      .personaggi { animation: appari 0.8s ease-out both; }
      h1, .domanda { animation: appari 1.6s ease-out both; }
      .domanda { animation-delay: 0.8s; }
      .lingue { animation: appariLingue 1.6s ease-out 1.2s both; }
      @keyframes appari { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes appariLingue { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <video class="sfondo" id="sfondo" src="immagini/Video_login.mp4" poster="immagini/Trono_di_Cenere.webp" autoplay loop muted playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
  <div class="velo" aria-hidden="true"></div>

  <main>
    <h1 id="titolo">Il Trono di Cenere</h1>
    <section class="domanda">
      <h2 id="domanda">Te la senti di entrare nel dungeon?</h2>
      <div class="scelte">
        <button id="si" type="button">Sì</button>
        <button id="no" type="button">No</button>
      </div>
      <p id="risposta" aria-live="polite"></p>
      <a class="allenamento" id="allenamento" href="tutorial.html"></a>
      <a class="allenamento regolamento" id="regolamento" href="regolamento.html"></a>
    </section>

    <section class="personaggi" id="personaggi" hidden aria-labelledby="titoloPersonaggi">
      <h2 id="titoloPersonaggi">Chi entra nel dungeon?</h2>
      <div class="conflitti" id="conflitti" aria-live="polite"></div>
      <ul class="lista" id="lista"></ul>
      <p class="avviso" id="avviso" aria-live="polite"></p>
      <a class="allenamento" id="allenamento2" href="tutorial.html"></a>
      <a class="allenamento regolamento" id="regolamento2" href="regolamento.html"></a>
    </section>
  </main>

  <div class="account" id="account" hidden><button type="button" id="accedi"></button></div>
  <button type="button" id="audio" aria-pressed="true" title="Musica">🔊</button>

  <nav class="lingue" aria-label="Lingua / Language">
    <button type="button" class="bandiera" data-lingua="it" aria-label="Italiano" title="Italiano">
      <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
        <rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#f4f5f0"/><rect x="2" width="1" height="2" fill="#ce2b37"/>
      </svg>
    </button>
    <button type="button" class="bandiera" data-lingua="en" aria-label="English" title="English">
      <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
        <clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
        <g clip-path="url(#uk-s)">
          <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
        </g>
      </svg>
    </button>
  </nav>

  <script>
    /* ---------- Testi della pagina nelle due lingue ---------- */
    const T = {
      it: {
        titolo: "Il Trono di Cenere", domanda: "Te la senti di entrare nel dungeon?", si: "Sì", no: "No",
        rispSi: "Bene. Allora vai e preparati a soffrire.", rispNo: "Beh. Chi potrebbe biasimarti?",
        chi: "Chi entra nel dungeon?", erroreMemoria: "Impossibile caricare il personaggio: memoria del browser non disponibile.",
        eliminato: "Personaggio eliminato.", senzaNome: "Senza nome", livello: "Livello",
        ultimo: "Ultimo salvataggio: ", nessunSalvataggio: "Nessun salvataggio: si riparte dall'inizio",
        elimina: "Elimina", conferma: "Confermi?", eliminaPg: "Elimina il personaggio ",
        nuova: "Nuova partita", pieno: "Hai già tre personaggi", crea: "Crea un nuovo personaggio",
        avvisoPieno: "Per iniziare una nuova partita elimina uno dei tre personaggi.",
        allenamento: "⚔ Sala d'allenamento: impara a combattere", allenamentoFatto: "✓ completato", regolamento: "📜 Regolamento",
        accedi: "☁ Accedi con Google", esci: "Esci dall'account?", accessoKo: "Accesso non riuscito. Riprova.",
        syncKo: "Cloud non raggiungibile: uso i salvataggi di questo dispositivo.",
        conflitto: (n) => `Posto ${n}: due versioni diverse`,
        conflittoInfo: "Hai giocato su due dispositivi senza sincronizzare. Scegli quale versione tenere: l'altra verrà sostituita.",
        questo: "Questo dispositivo", cloud: (d) => d ? `Cloud · salvato dal ${d}` : "Cloud",
        disp: { telefono: "telefono", computer: "computer" }, vuoto: "Nessun personaggio (eliminato)", risolviKo: "Non riesco a raggiungere il cloud. Riprova."
      },
      en: {
        titolo: "The Throne of Ashes", domanda: "Do you dare to enter the dungeon?", si: "Yes", no: "No",
        rispSi: "Good. Then go, and prepare to suffer.", rispNo: "Well. Who could blame you?",
        chi: "Who enters the dungeon?", erroreMemoria: "Unable to load the character: browser storage is not available.",
        eliminato: "Character deleted.", senzaNome: "Nameless", livello: "Level",
        ultimo: "Last saved: ", nessunSalvataggio: "No save yet: you will start from the beginning",
        elimina: "Delete", conferma: "Confirm?", eliminaPg: "Delete the character ",
        nuova: "New game", pieno: "You already have three characters", crea: "Create a new character",
        avvisoPieno: "To start a new game, delete one of your three characters.",
        allenamento: "⚔ Training hall: learn to fight", allenamentoFatto: "✓ completed", regolamento: "📜 Rules",
        accedi: "☁ Sign in with Google", esci: "Sign out?", accessoKo: "Sign-in failed. Try again.",
        syncKo: "Cloud unreachable: using the saves on this device.",
        conflitto: (n) => `Slot ${n}: two different versions`,
        conflittoInfo: "You played on two devices without syncing. Choose which version to keep: the other one will be replaced.",
        questo: "This device", cloud: (d) => d ? `Cloud · saved from the ${d}` : "Cloud",
        disp: { telefono: "phone", computer: "computer" }, vuoto: "No character (deleted)", risolviKo: "Cannot reach the cloud. Try again."
      }
    };
    const tx = () => T[Lingua.get()];
    let rispostaChiave = null; /* risposta mostrata sotto i pulsanti, da ritradurre se cambia la lingua */

    /* Sfondo video: muto e in ripetizione infinita. Con "riduci animazioni" resta fermo sull'immagine statica. */
    const sfondo = document.getElementById("sfondo");
    sfondo.muted = true;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      sfondo.removeAttribute("autoplay");
      sfondo.pause();
    } else {
      sfondo.play().catch(() => {}); /* se il browser blocca l'avvio, resta l'immagine statica */
    }

    /* ---------- Musica di sottofondo (audio/intro.mp3) ----------
       Parte da sola se il browser lo permette, altrimenti al primo clic, tocco o tasto. Ripete all'infinito.
       Il pulsante 🔊 la spegne e la riaccende (con volume.js la scelta vale anche per il gioco).
       Uscendo dalla pagina (Sì / scelta del personaggio) sfuma. */
    const VOLUME_MUSICA = 0.6; /* da 0 a 1; il cursore del volume lo scala (audio.js) */
    const musica = Sonoro.traccia("audio/intro.mp3", { loop: true, volume: VOLUME_MUSICA }), btnAudio = document.getElementById("audio");
    const conVolume = typeof Volume !== "undefined";
    let mutoLocale = false;
    const muto = () => (conVolume ? (Volume.muto || Volume.livello === 0) : mutoLocale);
    function aggiornaMusica() {
      if (muto()) musica.ferma(); else musica.suona(); /* bloccata: riparte da sola al primo gesto */
      if (!conVolume) { btnAudio.textContent = mutoLocale ? "🔇" : "🔊"; btnAudio.setAttribute("aria-pressed", String(!mutoLocale)); }
    }
    const sfumaMusica = (ms) => musica.ferma(ms);
    if (conVolume) { Volume.monta(btnAudio); Volume.onCambio(aggiornaMusica); }
    else btnAudio.addEventListener("click", () => { mutoLocale = !mutoLocale; aggiornaMusica(); });
    aggiornaMusica();
    const GESTI = ["pointerdown", "keydown", "touchstart"];
    const sblocca = (e) => {
      if (e.target === btnAudio) return; /* il clic sul pulsante lo gestisce il pulsante */
      if (!muto() && musica.inPausa()) aggiornaMusica();
      if (!musica.inPausa()) GESTI.forEach(g => document.removeEventListener(g, sblocca, true));
    };
    GESTI.forEach(g => document.addEventListener(g, sblocca, true));
    document.addEventListener("visibilitychange", () => { if (document.hidden) musica.ferma(); else if (!muto()) musica.suona(); });

    /* ---------- Personaggi salvati (massimo tre) ----------
       Ogni posto è salvato in localStorage come "slot1", "slot2", "slot3": { pg, partita, aggiornato }.
       "personaggio" e "partita" restano le chiavi usate dal gioco: scegliendo un posto vengono riempite con i suoi dati. */
    const POSTI = [1, 2, 3];
    const leggi = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
    const togli = (...chiavi) => { try { chiavi.forEach(k => localStorage.removeItem(k)); } catch (e) {} };

    function leggiPosti() {
      let posti = POSTI.map(n => leggi("slot" + n));
      if (!posti.some(Boolean) && !localStorage.getItem("slot_migrati")) { /* chi giocava già prima: il suo personaggio diventa il primo posto (una volta sola) */
        try { localStorage.setItem("slot_migrati", "1"); } catch (e) {}
        const pg = leggi("personaggio"), partita = leggi("partita");
        if (pg && pg.nome && pg.classe) {
          const sl = { pg, partita: partita || null, aggiornato: (partita && partita.ora) || Date.now() };
          try { localStorage.setItem("slot1", JSON.stringify(sl)); localStorage.setItem("slot_attivo", "1"); posti[0] = sl; } catch (e) {}
        }
      }
      return posti;
    }

    function continua(n, sl) {
      try {
        localStorage.setItem("personaggio", JSON.stringify(sl.pg));
        if (sl.partita) localStorage.setItem("partita", JSON.stringify(sl.partita)); else localStorage.removeItem("partita");
        togli("scena", "usate", "diario", "luogo", "slot_nuovo");
        localStorage.setItem("slot_attivo", String(n));
      } catch (e) { document.getElementById("avviso").textContent = tx().erroreMemoria; return; }
      sfumaMusica(600);
      setTimeout(() => { window.location.href = "gioco.html"; }, 600);
    }

    function nuovaPartita() {
      const libero = POSTI.find(n => !leggi("slot" + n));
      if (!libero) return;
      try { localStorage.setItem("slot_nuovo", String(libero)); } catch (e) {}
      togli("personaggio", "partita", "scena", "usate", "diario", "luogo", "slot_attivo"); /* i personaggi salvati restano nei loro posti */
      sfumaMusica(600);
      setTimeout(() => { window.location.href = "creazione.html"; }, 600);
    }

    function elimina(n) {
      togli("slot" + n);
      if (window.Cloud) Cloud.eliminaSlot(n);
      if (localStorage.getItem("slot_attivo") === String(n)) togli("slot_attivo", "personaggio", "partita");
      disegnaLista(leggiPosti(), tx().eliminato);
    }

    const el = (tag, classe, testo) => { const e = document.createElement(tag); if (classe) e.className = classe; if (testo != null) e.textContent = testo; return e; };

    function token(pg) {
      const t = el("span", "token");
      t.setAttribute("aria-hidden", "true");
      const src = pg && pg.immagine && Sicuro.immagine(pg.immagine); /* solo immagini locali (anche per i salvataggi scaricati dal cloud) */
      if (src) {
        const img = el("img"); img.src = src; img.alt = ""; /* vecchi salvataggi: ritratti spostati in immagini/pg/ */
        img.addEventListener("error", () => { img.remove(); t.textContent = (pg.nome || "?").charAt(0).toUpperCase(); });
        t.append(img);
      } else t.textContent = (pg && pg.nome ? pg.nome.charAt(0).toUpperCase() : "?");
      return t;
    }

    function disegnaLista(posti, messaggio) {
      const t = tx();
      disegnaConflitti();
      const lista = document.getElementById("lista");
      lista.replaceChildren();
      posti.forEach((sl, i) => {
        if (!sl || !sl.pg) return;
        const pg = sl.pg, n = i + 1;
        const li = el("li", "riga");
        const b = el("button", "scheda"); b.type = "button";
        const d = el("span", "dettagli");
        d.append(
          el("span", "nome", pg.nome || t.senzaNome),
          el("span", "info", [pg.razza && Lingua.nome("razze", pg.razza), pg.classe && Lingua.nome("classi", pg.classe)].filter(Boolean).join(" — ")),
          el("span", "info", t.livello + " " + ((sl.partita && sl.partita.livello) || pg.livello || 1))
        );
        const quando = (sl.partita && sl.partita.ora) ? new Date(Number(sl.partita.ora)) : null;
        d.append(el("span", "salvato", quando && !isNaN(quando)
          ? t.ultimo + quando.toLocaleString(Lingua.locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
          : t.nessunSalvataggio));
        b.append(token(pg), d);
        b.addEventListener("click", () => continua(n, sl));
        const x = el("button", "elimina", t.elimina); x.type = "button";
        x.setAttribute("aria-label", t.eliminaPg + (pg.nome || n));
        x.addEventListener("click", () => {
          if (!x.dataset.conferma) { /* primo clic: chiede conferma; senza un secondo clic entro 3 secondi non succede nulla */
            x.dataset.conferma = "1"; x.textContent = tx().conferma;
            setTimeout(() => { if (x.isConnected) { delete x.dataset.conferma; x.textContent = tx().elimina; } }, 3000);
            return;
          }
          elimina(n);
        });
        li.append(b, x); lista.append(li);
      });

      const pieno = posti.filter(s => s && s.pg).length >= POSTI.length;
      const li = el("li", "riga nuova");
      const b = el("button", "scheda"); b.type = "button"; b.disabled = pieno;
      const d = el("span", "dettagli");
      d.append(el("span", "nome", t.nuova), el("span", "info", pieno ? t.pieno : t.crea));
      const plus = el("span", "token", "+"); plus.setAttribute("aria-hidden", "true");
      b.append(plus, d);
      b.addEventListener("click", nuovaPartita);
      li.append(b); lista.append(li);
      document.getElementById("avviso").textContent = messaggio || (pieno ? t.avvisoPieno : "");
    }

    function mostraPersonaggi(posti, messaggio) {
      document.querySelector(".domanda").hidden = true;
      document.getElementById("personaggi").hidden = false;
      disegnaLista(posti, messaggio);
      const primo = document.querySelector("#lista .scheda:not(:disabled)");
      if (primo) primo.focus({ preventScroll: true });
    }

    /* ---------- Lingua ---------- */
    function applicaLingua() {
      const t = tx();
      document.title = t.titolo;
      document.getElementById("titolo").textContent = t.titolo;
      document.getElementById("domanda").textContent = t.domanda;
      document.getElementById("si").textContent = t.si;
      document.getElementById("no").textContent = t.no;
      document.getElementById("risposta").textContent = rispostaChiave ? t[rispostaChiave] : "";
      document.getElementById("titoloPersonaggi").textContent = t.chi;
      let fatto = false; try { fatto = localStorage.getItem("tutorial_completato") === "1"; } catch (e) {}
      ["allenamento", "allenamento2"].forEach(id => {
        const a = document.getElementById(id);
        a.textContent = t.allenamento;
        if (fatto) a.append(el("span", "fatto", t.allenamentoFatto));
      });
      ["regolamento", "regolamento2"].forEach(id => { document.getElementById(id).textContent = t.regolamento; });
      document.querySelectorAll(".bandiera").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lingua === Lingua.get())));
      if (typeof disegnaAccount === "function" && window.Cloud && Cloud.attivo) disegnaAccount();
      if (!document.getElementById("personaggi").hidden) disegnaLista(leggiPosti());
    }
    document.querySelectorAll(".bandiera").forEach(b => b.addEventListener("click", () => { Lingua.set(b.dataset.lingua); applicaLingua(); }));

    const risposta = document.getElementById("risposta");
    document.getElementById("si").addEventListener("click", () => {
      document.getElementById("si").disabled = true; document.getElementById("no").disabled = true;
      rispostaChiave = "rispSi"; risposta.textContent = tx().rispSi;
      const attesa = new Promise(r => setTimeout(r, 1500));
      Promise.all([attesa, sincronizzaOra()]).then(([, esito]) => {
        const posti = leggiPosti();
        if (posti.some(Boolean) || conflitti.length) mostraPersonaggi(posti, esito === false ? tx().syncKo : ""); /* ci sono personaggi salvati: si sceglie quale usare */
        else nuovaPartita();
      });
    });
    document.getElementById("no").addEventListener("click", () => {
      rispostaChiave = "rispNo"; risposta.textContent = tx().rispNo;
    });

    /* ---------- Salvataggi nel cloud (cloud.js) ----------
       Senza configurazione Firebase il pulsante non compare e tutto resta locale come prima. */
    let conflitti = [], sync = null;
    const elAccedi = document.getElementById("accedi");
    /* restituisce true (sincronizzato), false (cloud irraggiungibile) o null (cloud non attivo o accesso non fatto) */
    function sincronizzaOra() {
      if (!window.Cloud || !Cloud.attivo) return Promise.resolve(null);
      if (sync) return sync;
      sync = Promise.race([
        Cloud.avvia().then(() => Cloud.utente() ? Cloud.sincronizza().then(r => { conflitti = r.conflitti || []; return !!r.ok; }) : null),
        new Promise(r => setTimeout(() => r(false), 8000))
      ]).catch(() => false).finally(() => { setTimeout(() => { sync = null; }, 0); });
      return sync;
    }
    function ridisegna(messaggio) { if (!document.getElementById("personaggi").hidden) disegnaLista(leggiPosti(), messaggio); }
    function disegnaAccount() {
      const box = document.getElementById("account");
      if (!window.Cloud || !Cloud.attivo) { box.hidden = true; return; }
      box.hidden = !Cloud.pronto;
      const u = Cloud.utente();
      delete elAccedi.dataset.conferma;
      elAccedi.textContent = u ? "☁ " + (u.nome || u.email) : tx().accedi;
      elAccedi.title = u ? u.email : "";
    }
    elAccedi.addEventListener("click", async () => {
      const t = tx();
      if (Cloud.utente()) { /* già dentro: secondo clic entro 3 secondi per uscire */
        if (!elAccedi.dataset.conferma) {
          elAccedi.dataset.conferma = "1"; elAccedi.textContent = t.esci;
          setTimeout(() => { if (elAccedi.dataset.conferma) disegnaAccount(); }, 3000);
          return;
        }
        await Cloud.esci(); conflitti = []; disegnaAccount(); ridisegna(); return;
      }
      let entrato = false;
      try { entrato = await Cloud.accedi(); }
      catch (e) { if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") ridisegna(t.accessoKo + " (" + ((e && (e.code || e.message)) || "?") + ")"); return; }
      if (!entrato) { /* Firebase non si è caricato, oppure è partito il redirect */
        const err = Cloud.erroreAvvio && Cloud.erroreAvvio();
        if (err) ridisegna(t.accessoKo + " (" + err + ")");
        return;
      }
      disegnaAccount();
      const esito = await sincronizzaOra();
      ridisegna(esito === false ? t.syncKo : "");
      applicaLingua(); /* il tutorial può risultare completato su un altro dispositivo */
    });
    function riepilogo(sl) {
      const t = tx();
      if (!sl || !sl.pg) return [t.vuoto];
      const pg = sl.pg, p = sl.partita || {};
      const luogo = p.luogo ? String(p.luogo).replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : null;
      const quando = p.ora ? new Date(Number(p.ora)).toLocaleString(Lingua.locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : t.nessunSalvataggio;
      return [[pg.nome || t.senzaNome, t.livello + " " + (p.livello || pg.livello || 1), luogo].filter(Boolean).join(" · "), quando];
    }
    function disegnaConflitti() {
      const box = document.getElementById("conflitti"), t = tx();
      box.replaceChildren();
      conflitti.forEach(c => {
        const card = el("div", "conflitto");
        card.append(el("p", "c-tit", t.conflitto(c.n)), el("p", "c-info", t.conflittoInfo));
        const scelte = el("div", "c-scelte");
        [["locale", t.questo, c.locale], ["remoto", t.cloud(t.disp[c.remotoDisp]), c.remoto]].forEach(([k, titolo, sl]) => {
          const b = el("button", "c-scelta"); b.type = "button";
          b.append(el("b", null, titolo), ...riepilogo(sl).map(r => el("span", null, r)));
          b.addEventListener("click", async () => {
            scelte.querySelectorAll("button").forEach(x => x.disabled = true);
            let ok = false; try { ok = await Cloud.risolvi(c.n, k); } catch (e) {}
            if (ok) conflitti = conflitti.filter(x => x !== c);
            else scelte.querySelectorAll("button").forEach(x => x.disabled = false);
            ridisegna(ok ? "" : tx().risolviKo);
          });
          scelte.append(b);
        });
        card.append(scelte); box.append(card);
      });
    }
    if (window.Cloud && Cloud.attivo) {
      Cloud.onStato(disegnaAccount);
      Cloud.avvia().then(() => { const e = Cloud.erroreAccesso(); if (e) ridisegna(tx().accessoKo + " (" + e + ")"); }); /* carica Firebase subito: quando il giocatore preme «Sì» è già pronto */
    }

    applicaLingua();
    disegnaAccount();
  </script>
</body>
</html>
