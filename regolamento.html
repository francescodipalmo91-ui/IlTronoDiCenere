<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regolamento</title>
  <script src="lib/purify.min.js"></script>
  <script src="js/sicuro.js"></script>
  <script src="js/regole.js"></script>
  <script src="js/lingua.js"></script>
  <script src="js/tecniche.js"></script>
  <script src="js/magia.js"></script>
  <link rel="stylesheet" href="tema.css">
  <style>
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; background: transparent; color: var(--text); font-family: var(--f-testo); line-height: 1.55; padding: 2rem 16px 3rem; }
    /* 30/10: immagine statica a contorno; sfuma nel fondo dietro la colonna di testo, così la lettura non ne risente */
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        linear-gradient(to right, color-mix(in srgb, var(--bg) 35%, transparent) 0%, var(--bg) 30%, var(--bg) 70%, color-mix(in srgb, var(--bg) 35%, transparent) 100%),
        url("immagini/regolamento_sfondo.webp") center / cover no-repeat; }
    @media (max-width: 900px) { body::before { background: linear-gradient(color-mix(in srgb, var(--bg) 70%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)), url("immagini/regolamento_sfondo_mobile.webp") center / cover no-repeat; } } /* telefono: immagine ruotata di 90° antiorario, in verticale */
    main { max-width: 46rem; margin: 0 auto; }
    .torna { color: var(--muted); text-decoration: none; font-size: 0.95rem; display: inline-block; padding: 0.6rem 0; } /* 29/10: più facile da toccare sul telefono */
    .torna:hover { color: var(--accent); }
    body.dentro .torna { display: none; } /* aperto dal gioco: si chiude con la ✕ della finestra */
    h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); margin: 0.8rem 0 0.3rem; font-weight: 600; text-align: center; }
    .sotto { text-align: center; color: var(--muted); font-style: italic; margin: 0 0 2rem; }
    details { border: 1px solid var(--line); border-radius: 0.6rem; margin: 0 0 0.75rem; background: color-mix(in srgb, var(--bg) 92%, var(--text)); }
    summary { cursor: pointer; padding: 0.85rem 1.1rem; font-size: 1.12rem; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    summary::-webkit-details-marker { display: none; }
    summary, .corpo h3 { font-family: var(--f-titoli); letter-spacing: 0.05em; }
    summary::after { content: "▸"; color: var(--muted); transition: transform 0.2s; }
    details[open] > summary::after { transform: rotate(90deg); }
    summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 0.6rem; }
    .corpo { padding: 0 1.1rem 1rem; }
    .corpo h3 { font-size: 1rem; margin: 1.1rem 0 0.35rem; font-weight: 600; }
    .corpo p, .corpo li { margin: 0.35rem 0; }
    .corpo ul, .corpo ol { padding-left: 1.2rem; margin: 0.35rem 0; }
    /* indice a tendine, come l'indice di un libro: Parte › Capitolo › voci (rami, scuole, vie), con i puntini di guida */
    summary { align-items: baseline; }
    .punti { flex: 1; min-width: 1rem; margin: 0 0.1rem 0.3em; border-bottom: 1px dotted var(--muted); opacity: 0.8; }
    summary:hover .tt { color: var(--accent); }
    details.parte { border: 0; border-radius: 0; background: none; margin: 0 0 1.5rem; }
    details.parte > summary { padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--line); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.14em; }
    details.parte > .corpo { padding: 0.35rem 0 0; }
    .corpo details.cap, .corpo details.sub { border: 0; border-radius: 0; background: none; margin: 0; }
    .corpo details.cap > summary { font-size: 1rem; padding: 0.55rem 0.2rem; }
    .corpo details.sub > summary { font-size: 0.93rem; padding: 0.4rem 0.2rem; font-weight: 500; }
    .corpo details.cap > .corpo, .corpo details.sub > .corpo { margin-left: 0.45rem; padding: 0.15rem 0 0.7rem 0.85rem; border-left: 1px solid var(--line); }
    @media (max-width: 560px) {
      body { padding-inline: 10px; }
      .corpo details.cap > .corpo, .corpo details.sub > .corpo { margin-left: 0.15rem; padding-left: 0.5rem; }
      th, td { padding: 0.35rem 0.3rem; }
      .scroll td:last-child { min-width: 11rem; }
    }
    .azioni { display: flex; justify-content: center; gap: 0.6rem; margin: 0 0 1.4rem; }
    .azioni button { font: inherit; font-size: 0.88rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 0.4rem; padding: 0.3rem 0.9rem; cursor: pointer; }
    .azioni button:hover { color: var(--accent); border-color: var(--accent); }
    .formula { display: block; margin: 0.5rem 0; padding: 0.45rem 0.8rem; border-left: 3px solid var(--tip-line); background: var(--tip-bg); border-radius: 0 0.4rem 0.4rem 0; font-variant-numeric: tabular-nums; }
    .esempio { color: var(--muted); font-style: italic; font-size: 0.93rem; }
    .avviso { margin: 0.5rem 0; padding: 0.5rem 0.8rem; border: 1px dashed var(--line); border-radius: 0.4rem; color: var(--muted); font-size: 0.93rem; }
    .turno { margin: 0.5rem 0; padding: 0.4rem 0.8rem; border-left: 3px solid var(--line); font-size: 0.95rem; }
    .turno b { font-family: var(--f-titoli); letter-spacing: 0.04em; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.93rem; margin: 0.4rem 0; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 400; }
    td.n { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tendine { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
    .tendine span { padding: 0.25rem 0.7rem; border-radius: 0.4rem; border: 1px solid var(--line); font-size: 0.9rem; }
    .tendine span { background: var(--tip-bg); border-left-width: 3px !important; }
    .t-azz { border-left-color: var(--accent) !important; }
    .t-ok { border-left-color: var(--ok) !important; color: var(--ok); }
    .t-ko { border-left-color: var(--ko) !important; color: var(--ko); }
  </style>
</head>
<body>
  <main>
    <a class="torna" id="torna" href="index.html"></a>
    <h1 id="titolo"></h1>
    <p class="sotto" id="sotto"></p>
    <div class="azioni"><button type="button" id="apriTutto"></button><button type="button" id="chiudiTutto"></button></div>
    <div id="sezioni"></div>
  </main>

  <script>
    /* Regolamento del giocatore: solo meccaniche, niente dinamiche di trama (niente nemici, luoghi o oggetti specifici).
       I numeri vengono da regole.js, le tecniche da tecniche.js e gli incantesimi da magia.js: gli stessi file del gioco. */
    if (new URLSearchParams(location.search).has("dentro")) document.body.classList.add("dentro");
    const R = window.Regole, EN = Lingua.get() === "en", L = EN ? "en" : "it";
    const N = (cat, k) => Lingua.nome(cat, k);
    const segno = (n) => (n < 0 ? "−" : "+") + Math.abs(n);
    const per = (o) => Object.entries(o).map(([k, v]) => `${segno(v)} ${N("attributi", k)}`).join(", ");
    const TEC = window.TECNICHE || [], MG = window.MAGIA;
    /* posti delle tecniche e degli incantesimi per livello (2, 4, 5, 6, 7), ricavati da regole.js */
    const posti = () => R.TECNICHE_PER_LIVELLO.map((_, i) => R.TECNICHE_PER_LIVELLO.slice(0, i + 1).reduce((a, b) => a + b, 0)).map((n, i) => `${n} (${EN ? "level" : "livello"} ${i + 1})`).join(", ");
    /* recupero in combattimento per livello (1/1/2/2/3), uguale per tutte le classi */
    const recupero = () => [[1, 2], [3, 4], [5]].map(ls => `+${R.IRA_PER_COLPO[ls[0] - 1]} ${EN ? (ls.length > 1 ? "at levels" : "at level") : (ls.length > 1 ? "ai livelli" : "al livello")} ${ls.join("-")}`).join(", ");
    const tetti = Object.entries(R.TETTO_AGILITA).map(([a, t]) => `${N("oggetti", a)} ${t ? "+" + t : (EN ? "none" : "nessuno")}`).join(" · ");
    const soglie = R.SOGLIE_PE.slice(1).map((s, i) => `<tr><td>${i + 2}</td><td>${s - R.SOGLIE_PE[i]}</td><td>${s}</td></tr>`).join("");
    const risorse = { it: { mana: "Mana", fede: "Punti fede", ira: "Punti ira", natura: "Punti natura" }, en: { mana: "Mana", fede: "Faith points", ira: "Rage points", natura: "Nature points" } }[L];
    const armatureClasse = (c) => (R.ARMATURE_CLASSI[c] || ["Armatura leggera", "Armatura media", "Armatura pesante"]).map(a => N("oggetti", a)).join(", ");
    const righeClassi = Object.entries(R.CLASSI).map(([c, d]) => `<tr><td>${N("classi", c)}</td><td>d${d.dado}</td><td>${risorse[d.risorsa]} (${N("attributi", d.attrRisorsa)})</td><td>${armatureClasse(c)}</td></tr>`).join("");
    const righeRazze = Object.entries(R.RAZZE).map(([r, d]) => `<tr><td>${N("razze", r)}</td><td>${d.punti ? (EN ? `+${d.punti} free points` : `+${d.punti} punti liberi`) : per(d.bonus)}</td></tr>`).join("");
    const righeAbilita = R.ABILITA.map(([a, at]) => `<tr><td>${N("abilita", a)}</td><td>${N("attributi", at)}</td></tr>`).join("");

    /* ---------- capitolo Abilità: descrizioni da regole.js (le stesse della creazione), esempi qui ---------- */
    const ESEMPI_ABILITA = {
      Atletica: { it: ["spostare qualcosa di pesante", "arrampicarsi", "forzare un passaggio"], en: ["moving something heavy", "climbing", "forcing a way through"] },
      Sopravvivenza: { it: ["seguire una traccia", "capire da dove è passato qualcuno", "orientarsi all'aperto"], en: ["following a trail", "working out where someone went", "finding your way outdoors"] },
      "Furtività": { it: ["avvicinarsi senza farsi sentire", "nascondersi", "agire senza lasciare segni"], en: ["creeping up unheard", "hiding", "acting without leaving a trace"] },
      Acrobazia: { it: ["mantenere l'equilibrio", "saltare un ostacolo", "divincolarsi"], en: ["keeping your balance", "leaping an obstacle", "wriggling free"] },
      Indagare: { it: ["frugare in un mobile", "spostare un oggetto per vedere cosa nasconde", "capire come si apre un meccanismo"], en: ["searching a piece of furniture", "moving something to see what it hides", "working out how a mechanism opens"] },
      Percezione: { it: ["ascoltare dietro una porta", "notare un dettaglio fuori posto", "accorgersi di un pericolo"], en: ["listening at a door", "spotting something out of place", "sensing danger"] },
      Sapienza: { it: ["riconoscere un simbolo o un rituale", "capire un fenomeno magico", "valutare una ferita o un rimedio"], en: ["recognising a symbol or a ritual", "understanding a magical effect", "judging a wound or a remedy"] },
      "Socialità": { it: ["convincere qualcuno con le buone", "imporsi con le cattive", "ottenere un favore"], en: ["winning someone over kindly", "imposing yourself harshly", "getting a favour"] },
      Intuizione: { it: ["capire se qualcuno mente", "cogliere ciò che non viene detto", "intuire cosa vuole davvero"], en: ["telling whether someone is lying", "catching what goes unsaid", "sensing what they really want"] }
    };
    const VECCHI_NOMI = { it: [["Investigazione", "Indagare o Percezione: il gioco ti chiede quale"], ["Arcano, Misticismo, Medicina", "Sapienza"], ["Persuasione, Intimidire", "Socialità"]],
                          en: [["Investigation and Perception", "the game asks which one"], ["Arcana, Mysticism, Medicine", "Lore"], ["Persuasion, Intimidation", "Influence"]] }[L];
    const abilitaDi = (attr) => `<ul>${R.ABILITA.filter(x => x[1] === attr).map(([a, , d]) =>
      `<li><b>${N("abilita", a)}</b>: ${d[L]}<br><span class="esempio">${EN ? "When it helps" : "Quando serve"}: ${ESEMPI_ABILITA[a][L].join(", ")}. ${EN ? "To call it" : "Per chiederla"}: «${EN ? "I use " : "uso "}${N("abilita", a).toLowerCase()}».</span></li>`).join("")}</ul>`;
    const elenco = (v) => v.length > 1 ? v.slice(0, -1).join(", ") + (EN ? " and " : " e ") + v[v.length - 1] : v.join("");
    const titoloAttr = (attr) => `${N("attributi", attr)}: ${elenco(R.ABILITA.filter(x => x[1] === attr).map(x => N("abilita", x[0])))}`;
    const malusAbilita = Object.entries(R.MALUS_AGILITA).map(([o, m]) => `<tr><td>${N("oggetti", o)}</td><td>${m ? "−" + m : (EN ? "none" : "nessuno")}</td></tr>`).join("");
    const sezioneAbilita = () => EN ? `
            <p>Skills are what your character is good at outside combat: they come into play in every check. There are nine: two for each attribute, three for Mind.</p>
            <h3>How they work</h3>
            <span class="formula">Skill value = attribute modifier (+ your level, if you chose the skill)</span>
            <p>At creation you choose ${R.MAX_ABILITA}: those are your strengths, and they grow by 1 at every level. You can still attempt every other skill, with the attribute modifier alone.</p>
            <p class="esempio">Example: Mind 14 (+2), level 2. Perception, chosen: +2 + 2 = +4. Lore, not chosen: +2.</p>
            <p>Armor and shield weigh you down: Agility skills (${N("abilita", "Furtività")} and ${N("abilita", "Acrobazia")}) take a penalty. The shield only counts while it is strapped on. The character sheet already shows the value with the penalty included.</p>
            <div class="scroll"><table><tr><th>Gear</th><th>Agility skill penalty</th></tr>${malusAbilita}</table></div>
            <h3>${titoloAttr("Vigore")}</h3>${abilitaDi("Vigore")}
            <h3>${titoloAttr("Agilità")}</h3>${abilitaDi("Agilità")}
            <h3>${titoloAttr("Mente")}</h3>${abilitaDi("Mente")}
            <h3>${titoloAttr("Spirito")}</h3>${abilitaDi("Spirito")}
            <h3>Which skill to use</h3>
            <ul>
              <li>Most of the time you don't need to name a skill: write what you do and the game picks the right check.</li>
              <li><b>Investigation or Perception?</b> Investigation is searching with your hands (rummaging, moving, touching); Perception is using your senses (sight, hearing, smell). If you write “I investigate” without saying how, the game asks which.</li>
              <li><b>Influence</b>: first you choose the approach, kind or harsh, then you roll. The approach decides how the other person reacts; the roll decides whether you succeed.</li>
              <li><b>Insight</b> and Influence work together: one reads the other person, the other acts on them.</li>
            </ul>
            <p>The game still recognises the old skill names:</p>
            <div class="scroll"><table><tr><th>If you write</th><th>It counts as</th></tr>${VECCHI_NOMI.map(([v, n]) => `<tr><td>${v}</td><td>${n}</td></tr>`).join("")}</table></div>` : `
            <p>Le abilità sono ciò in cui il tuo personaggio è bravo fuori dal combattimento: entrano in gioco in ogni prova. Sono nove: due per attributo, tre per la Mente.</p>
            <h3>Come funzionano</h3>
            <span class="formula">Valore dell'abilità = modificatore dell'attributo (+ il tuo livello, se l'hai scelta)</span>
            <p>In creazione ne scegli ${R.MAX_ABILITA}: sono i tuoi punti di forza, e a ogni livello crescono di 1. Tutte le altre puoi tentarle comunque, con il solo modificatore dell'attributo.</p>
            <p class="esempio">Esempio: Mente 14 (+2), livello 2. Percezione, scelta: +2 + 2 = +4. Sapienza, non scelta: +2.</p>
            <p>Armatura e scudo appesantiscono: le abilità di Agilità (Furtività e Acrobazia) subiscono un malus. Lo scudo conta solo se è imbracciato. La scheda del personaggio mostra già il valore con il malus compreso.</p>
            <div class="scroll"><table><tr><th>Equipaggiamento</th><th>Malus alle abilità di Agilità</th></tr>${malusAbilita}</table></div>
            <h3>${titoloAttr("Vigore")}</h3>${abilitaDi("Vigore")}
            <h3>${titoloAttr("Agilità")}</h3>${abilitaDi("Agilità")}
            <h3>${titoloAttr("Mente")}</h3>${abilitaDi("Mente")}
            <h3>${titoloAttr("Spirito")}</h3>${abilitaDi("Spirito")}
            <h3>Quale abilità usare</h3>
            <ul>
              <li>Quasi sempre non serve nominare l'abilità: scrivi cosa fai e il gioco sceglie la prova giusta.</li>
              <li><b>Indagare o Percezione?</b> Indagare è cercare con le mani (frugare, spostare, toccare); Percezione è usare i sensi (vista, udito, olfatto). Se scrivi «investigo» senza dire come, il gioco ti chiede quale delle due.</li>
              <li><b>Socialità</b>: prima scegli l'approccio, gentile o duro, poi tiri. L'approccio decide come reagisce l'altro, il tiro se ci riesci.</li>
              <li><b>Intuizione</b> e Socialità lavorano insieme: una legge l'altro, l'altra agisce su di lui.</li>
            </ul>
            <p>Il gioco riconosce ancora i vecchi nomi delle abilità:</p>
            <div class="scroll"><table><tr><th>Se scrivi</th><th>Vale come</th></tr>${VECCHI_NOMI.map(([v, n]) => `<tr><td>${v}</td><td>${n}</td></tr>`).join("")}</table></div>`;

    /* ---------- tabelle di tecniche e incantesimi ---------- */
    const H = EN ? ["Lv", "Name", "Cost", "Effect"] : ["Liv", "Nome", "Costo", "Effetto"];
    const tabella = (voci) => `<div class="scroll"><table><tr>${H.map(h => `<th>${h}</th>`).join("")}</tr>${voci.slice().sort((a, b) => a.liv - b.liv).map(v =>
      `<tr><td class="n">${v.liv}</td><td>${v.nome[L]}</td><td class="n">${v.costo}</td><td>${(v.effetto && v.effetto[L]) || ""}</td></tr>`).join("")}</table></div>`;
    const sommario = (titolo) => `<summary><span class="tt">${titolo}</span><span class="punti"></span></summary>`;
    const tendina = (titolo, html) => `<details class="sub">${sommario(titolo)}<div class="corpo">${html}</div></details>`;

    /* Guerriero: un ramo per tipo d'arma e lo scudo, con le due vie (nomi opposti, senza i PNG che le insegnano) */
    const RAMI = [
      ["Tagliente", { it: "Armi da taglio", en: "Slashing weapons" }, { aldo: { it: "Lama", en: "Blade" }, guendalina: { it: "Guardia", en: "Guard" } }],
      ["Contundente", { it: "Armi contundenti", en: "Bludgeoning weapons" }, { aldo: { it: "Martello", en: "Hammer" }, guendalina: { it: "Incudine", en: "Anvil" } }],
      ["Perforante", { it: "Armi perforanti", en: "Piercing weapons" }, { aldo: { it: "Punta", en: "Point" }, guendalina: { it: "Mira", en: "Aim" } }],
      ["Scudo", { it: "Scudo", en: "Shield" }, { aldo: { it: "Marea", en: "Tide" }, guendalina: { it: "Scoglio", en: "Reef" } }]
    ];
    const viaTit = (n) => (EN ? "Path of the " : "Via ") + (EN ? n.en : ({ Lama: "della Lama", Guardia: "della Guardia", Martello: "del Martello", Incudine: "dell'Incudine", Punta: "della Punta", Mira: "della Mira", Marea: "della Marea", Scoglio: "dello Scoglio", Frattura: "della Frattura", Sutura: "della Sutura", Cenere: "della Cenere", Brace: "della Brace" }[n.it] || n.it));
    const ramiGuerriero = RAMI.map(([tipo, nome, vie]) => {
      const base = TEC.filter(t => t.tipo === tipo && !t.via);
      const via = (k) => TEC.filter(t => t.tipo === tipo && t.via === k);
      return tendina(nome[L], tabella(base) + ["aldo", "guendalina"].filter(k => via(k).length).map(k => tendina(viaTit(vie[k]), tabella(via(k)))).join(""));
    }).join("");
    const utilitaGuerriero = TEC.filter(t => t.tipo === "Utilita");
    /* Sciamano: le 15 tecniche della natura e le due vie (con la passiva) */
    const natura = TEC.filter(t => t.classe === "Forestiero");
    const vieSciamano = [["aldo", { it: "Signore delle Spore Putride", en: "Lord of the Rotting Spores" }], ["guendalina", { it: "Custode dei Boschi Sacri", en: "Keeper of the Sacred Woods" }]]
      .map(([k, n]) => {
        const voci = natura.filter(t => t.via === k), pass = voci.find(t => t.passiva);
        return tendina(n[L], (pass ? `<p><b>${EN ? "Passive" : "Passiva"} — ${pass.nome[L]}</b>: ${pass.effetto[L]}</p>` : "") + tabella(voci.filter(t => !t.passiva)));
      }).join("");
    const tecnicheSciamano = tendina(EN ? "Nature techniques" : "Tecniche della natura", tabella(natura.filter(t => !t.via))) + tendina(EN ? "Prestige paths" : "Vie di prestigio", vieSciamano);

    /* incantatori: una tendina per scuola e per via */
    const scuola = (s) => MG ? MG.INCANTESIMI.filter(i => i.scuola === s) : [];
    const vieClasse = (c) => MG ? ["aldo", "guendalina"].map(k => tendina(viaTit(MG.NOMI_VIE[c][k]), tabella(MG.VIE.filter(v => v.via === k && MG.CLASSI[c].includes(v.scuola))))).join("") : "";
    const tendineScuole = (c) => MG ? MG.CLASSI[c].map(s => tendina(MG.NOMI_SCUOLE[s][L], tabella(scuola(s)))).join("") + tendina(EN ? "Prestige paths" : "Vie di prestigio", vieClasse(c)) : "";
    const capacita = (c) => MG ? `<b>${MG.CAPACITA[c].nome[L]}</b> (${MG.CAPACITA[c].costo})` : "";

    const T = {
      it: {
        torna: "← Pagina iniziale", titolo: "Regolamento", sotto: "Le regole del gioco, da consultare quando vuoi.",
        parte: "Parte", capitolo: "Capitolo", apri: "Apri tutto", chiudi: "Comprimi",
        parti: [["Il personaggio", [0, 13, 10]], ["Le classi", [4, 5, 6, 7]], ["Giocare", [2, 1, 9, 11, 12]], ["Combattimento", [3, 8]]],
        sezioni: [
          ["Il personaggio", `
            <h3>Attributi</h3>
            <p>Ogni attributo parte da ${R.VALORE_MINIMO}; in creazione distribuisci ${R.PUNTI_BASE} punti. Nessun attributo può superare ${R.VALORE_MASSIMO}, bonus della razza compreso.</p>
            <span class="formula">Modificatore = (valore − 10) ÷ 2, arrotondato per difetto</span>
            <p class="esempio">Esempio: 12 → +1, 14 → +2, 17 → +3.</p>
            <ul>
              <li><b>Vigore</b>: forza in combattimento, salute fisica, Atletica e Sopravvivenza, risorsa del Guerriero.</li>
              <li><b>Agilità</b>: iniziativa, difesa (Classe armatura), Furtività e Acrobazia.</li>
              <li><b>Mente</b>: sensi e logica, Indagare, Percezione e Sapienza, magia dell'Arcanista.</li>
              <li><b>Spirito</b>: salute mentale e volontà, Socialità e Intuizione, magia del Monaco e risorsa dello Sciamano.</li>
            </ul>
            <h3>Razze</h3><div class="scroll"><table><tr><th>Razza</th><th>Bonus</th></tr>${righeRazze}</table></div>
            <h3>Classi</h3><div class="scroll"><table><tr><th>Classe</th><th>Dado vita</th><th>Risorsa</th><th>Armature</th></tr>${righeClassi}</table></div>
            <p>Le armi «da battaglia» sono riservate al Guerriero. Ogni classe ha la sua sezione in questo regolamento, con tutte le tecniche o gli incantesimi.</p>
            <h3>Salute e risorse</h3>
            <span class="formula">Salute fisica = ${R.SALUTE_BASE} + massimo del dado vita + mod. Vigore</span>
            <span class="formula">Salute mentale = ${R.SALUTE_BASE} + massimo del dado vita + mod. Spirito</span>
            <span class="formula">Mana, punti fede, ira, natura = ${R.RISORSA_BASE} + modificatore dell'attributo della classe</span>
            <h3>Abilità</h3>
            <p>Ne scegli ${R.MAX_ABILITA} in creazione. Cosa fa ciascuna, come si calcola il valore e il malus dell'armatura sono spiegati nel capitolo «Abilità».</p>
            <div class="scroll"><table><tr><th>Abilità</th><th>Attributo</th></tr>${righeAbilita}</table></div>`],
          ["Prove di abilità", `
            <p>Scrivi ciò che fa il tuo personaggio («esamino l'arazzo», «uso investigazione»). Quando l'esito è incerto il gioco ti chiede una prova e ti mostra difficoltà, dado e modificatore.</p>
            <span class="formula">d20 + valore dell'abilità ≥ difficoltà (CD) → prova superata</span>
            <p class="esempio">Esempio: Furtività +3 contro CD 13. Tiri 11: 11 + 3 = 14, che è almeno 13, quindi la prova è superata. Con un 9 avresti totalizzato 12 e la prova sarebbe fallita.</p>
            <p>Il <b>valore dell'abilità</b> è il modificatore dell'attributo; se hai scelto quell'abilità in creazione si aggiunge anche il tuo livello. La difficoltà (CD) dipende dalla situazione: più è alta, più è difficile riuscire.</p>
            <p>Puoi anche dichiarare una prova a parole, nominando l'abilità: «faccio una prova di percezione», «uso furtività», «cerco tracce». Se in quel luogo l'abilità non serve, il gioco ti risponde con una breve descrizione e nessun tiro.</p>
            <p>Alcune prove richiedono un <b>20 naturale</b>: conta solo il numero uscito sul dado, il modificatore non si somma. Alcuni oggetti danno <b>vantaggio</b>: tiri due dadi e tieni il risultato migliore.</p>
            <p>Ci sono due modi di esplorare: <b>Indagare</b>, cioè cercare attivamente (frugare, spostare, toccare), e <b>Percezione</b>, cioè usare i sensi (vista, udito, olfatto). Se scrivi «investigo» o «faccio una prova di investigazione» il gioco ti chiede quale delle due; se nomini un oggetto («indago sull'arazzo») la prova riguarda quell'oggetto.</p>
            <p><b>Ogni prova fallita costa ${R.COSTO_PROVA_FALLITA} punto di salute mentale.</b> Scegli con cura quando tentare. Alcune prove, segnalate dal gioco, non fanno perdere salute mentale.</p>
            <p><b>Mente incrollabile</b> (Guerriero e Sciamano): dopo una prova fallita puoi spendere 1 punto ira o natura per un tiro salvezza (d20 + modificatore di Vigore per il Guerriero o di Spirito per lo Sciamano + livello, CD ${R.CD_INCROLLABILE}). Se lo superi, non perdi salute mentale.</p>
            <p><b>Una prova fallita non si può ripetere finché non riposi.</b> Quella prova resta bloccata: il gioco te lo ricorda ogni volta che provi a ripeterla, e ti avvisa prima del tiro. Dopo un riposo la prova torna disponibile. Le prove superate restano superate. Fanno eccezione le prove che il gioco indica come ripetibili.</p>
            <p>Il colore della tendina della tua azione ti dice cosa è successo:</p>
            <div class="tendine"><span class="t-azz">azzurra: nessuna prova</span><span class="t-ok">verde: prova superata</span><span class="t-ko">rossa: prova fallita</span></div>
            <p>Nei dialoghi conta anche l'approccio che scegli, gentile o duro: ogni interlocutore reagisce a modo suo.</p>
            <h3>Enigmi</h3>
            <p>Alcuni luoghi nascondono un enigma. Di solito una prova ti dà un indizio, poi la soluzione la scegli tu. Una scelta sbagliata costa ${R.COSTO_PROVA_FALLITA} punto di salute mentale, come una prova fallita. Se non ottieni l'indizio, qualcuno nella casa potrebbe dartelo.</p>`],
          ["Muoversi ed esplorare", `
            <p>Il gioco si controlla scrivendo ciò che fa il tuo personaggio, con parole tue. Non servono formule precise: il gioco riconosce i verbi più comuni.</p>
            <ul>
              <li><b>Muoversi</b>: «vado in cucina», «scendo in cantina», «torno indietro». Puoi andare solo nelle stanze vicine: se la stanza è lontana, il gioco ti dice da dove passare.</li>
              <li><b>Guardare</b>: «guardo il camino», «esamino la stanza», «ascolto». Descrizioni e dettagli non costano nulla.</li>
              <li><b>Agire</b>: «prendo la spada», «apro la porta», «parlo con Guendalina».</li>
              <li><b>Oggetti</b>: «bevo la pozione di cura», «impugno la torcia», «indosso l'armatura». Lo zaino e la scheda mostrano ciò che porti e come usarlo.</li>
            </ul>
            <p class="esempio">Esempio: in una stanza nuova scrivi «guardo il tavolo». Se c'è qualcosa da scoprire, il gioco ti propone una prova.</p>
            <p>Quando il gioco ti offre dei pulsanti (una scelta, un tiro, «lascia perdere») usali al posto del testo. Le missioni accettate compaiono nella scheda, con obiettivi e consigli.</p>`],
          ["Combattimento", `
            <p><b>Iniziativa</b>: agisce per primo chi ha più Agilità (a parità, un d20 a testa).</p>
            <p>A ogni turno hai un'azione: attaccare, usare una tecnica, lanciare un incantesimo o usare un oggetto. Prendere in mano la torcia o imbracciare lo scudo non consuma l'azione. L'attacco con l'arma è sempre gratuito.</p>
            <span class="formula">Attacco con l'arma: d20 + mod. Vigore, colpisce se supera la Classe armatura del bersaglio</span>
            <span class="formula">Attacco magico: d20 + mod. Mente (Arcanista) o Spirito (Monaco), colpisce se supera la Classe armatura</span>
            <span class="formula">Danno dell'attacco magico = dadi dell'incantesimo + mod. Mente o Spirito, come le armi aggiungono il Vigore</span>
            <span class="formula">Danno dell'arma: dado dell'arma + mod. Vigore (torcia 1d4, a mani nude 1d2)</span>
            <p><b>Colpo critico</b>: un 20 sul dado colpisce sempre e tira il doppio dei dadi di danno. Vale anche per i nemici. Alcuni effetti allargano il critico a 19-20 o 18-20 (mai oltre).</p>
            <p><b>Tiro salvezza del nemico</b>: quando un effetto gli concede di resistere, il nemico tira d20 + il suo modificatore contro la tua difficoltà.</p>
            <span class="formula">CD = 8 + modificatore dell'attributo della tua classe + livello</span>
            <p>In combattimento scrivi l'azione («attacco», «lancio un incantesimo», «bevo la pozione di cura») oppure usa i pulsanti che compaiono. Gli esempi completi sono nella sezione «Esempi di combattimento».</p>
            <h3>Classe armatura</h3>
            <span class="formula">CA = ${R.CA_BASE} + armatura + mod. Agilità (fino al tetto dell'armatura) + scudo</span>
            <p>Tetto del bonus di Agilità: ${tetti}.</p>
            <p>Le armi a due mani non lasciano libera la mano per torcia o scudo: devi prima riporre l'arma.</p>
            <h3>Risorse in combattimento</h3>
            <p>Ogni classe ha una risorsa (ira, natura, mana, fede) che si ricarica riposando. Durante lo scontro ne recuperi un po', ognuno a modo suo, con la stessa tabella: ${recupero()}, il doppio nel caso migliore. Il dettaglio è nella sezione di ogni classe.</p>
            <h3>Stati</h3>
            <div class="scroll"><table><tr><th>Stato</th><th>Effetto</th></tr>
              <tr><td>Indebolito</td><td>−2 per colpire · 2 turni</td></tr>
              <tr><td>Sbilanciato</td><td>−2 alla Classe armatura</td></tr>
              <tr><td>Frastornato</td><td>−4 per colpire, niente critici</td></tr>
              <tr><td>Stordito</td><td>salta il prossimo turno</td></tr>
              <tr><td>Inibito</td><td>non può usare i suoi attacchi speciali</td></tr>
              <tr><td>Sanguinamento</td><td>1d4 danni a ogni suo turno (Emorragia: 1d6) · 3 turni</td></tr>
              <tr><td>Esposto</td><td>i tuoi attacchi fanno critico con un numero in meno, mai sotto 18</td></tr>
              <tr><td>Accecato</td><td>tira 2d20 per colpire e tiene il peggiore · 2 turni</td></tr>
              <tr><td>Avvizzito</td><td>1d4 danni necrotici a ogni suo turno (1d6 dove indicato); si somma al Sanguinamento</td></tr>
              <tr><td>Avvelenato</td><td>1d4 danni da veleno a ogni suo turno (Tossina: 1d6); si somma a Sanguinamento e Avvizzito · 3 turni</td></tr>
              <tr><td>Ustionato</td><td>1d4 danni da fuoco a ogni suo turno (1d6 se potenziato) · 3 turni</td></tr>
              <tr><td>Impaurito</td><td>−2 alla Classe armatura · 2 turni</td></tr>
            </table></div>
            <p>Gli effetti non si sommano: uno nuovo dello stesso tipo rinnova la durata. Le eccezioni (Incrinatura, Sigilli) sono spiegate nelle classi.</p>
            <p><b>Sei stati valgono allo stesso modo per te e per i nemici</b>: Ustionato, Sanguinamento e Avvelenato (1d4 a turno per 3 turni, 1d6 nella versione potenziata), Indebolito, Impaurito e Accecato (2 turni). Stati diversi si sommano. Finiscono con lo scontro. Le creature di cenere non sanguinano; quelle di fuoco non si ustionano.</p>
            <p><b>Elisir.</b> Gli elisir comuni (con le parti degli animali e le erbe) curano uno stato. Gli elisir rari (con la sola parte di una creatura di cenere) rendono immuni a quello stato per tutto lo scontro, bevuti prima o durante. Un nemico che vede fallire il suo stato contro l'immunità non ci riprova. Ne porti al massimo 2 per stato.</p>
            <p><b>Abilità dei nemici.</b> Anche i nemici hanno punti abilità: ogni abilità che infligge uno stato costa punti (2 per uno stato, 3 per uno potenziato o per due stati, 4 per un controllo come Stordito o Bloccato). Finiti i punti, solo attacchi normali.</p>
            <p><b>Fuga.</b> Scrivi «fuggo»: prova di Atletica o Acrobazia contro CD 10 + livello del nemico. Riesci e torni nella stanza da cui sei arrivato; fallisci e il nemico ti colpisce con vantaggio. Non si fugge dai guardiani.</p>
            <p><b>Agguati.</b> Dopo il fermaglio di bronzo, fuori casa può tenderti un agguato chi è entrato nella grotta da altri ingressi: goblin e orchi, da soli o in banda (un gruppo combatte come una creatura sola), oppure uno di cinque avventurieri che crescono con te. A un terzo della salute un avventuriero si arrende: puoi finirlo o risparmiarlo. Finire chi chiede pietà o cerca di scappare costa 1 punto di salute mentale, e può ucciderti: è la casa che ti cambia. Chi risparmi torna una volta, dopo un riposo, più forte, e quella volta combatte fino alla fine. Le armi trovate addosso a loro hanno il bonus del livello a cui le trovi.</p>
            <p><b>Il fermaglio.</b> Il fermaglio dei guardiani occupa un posto nell'equipaggiamento e, fuori dal combattimento, puoi nasconderlo o appuntarlo («nascondo il fermaglio», «appunto il fermaglio»). Appuntato, il tuo grado si legge sotto il ritratto e i mastini riconoscono su di te l'odore del maggiordomo (+2 a Furtività quando ti seguono), ma fuori casa sei una preda di valore e gli agguati sono più frequenti. Nascosto, il contrario.</p>
            <h3>Avversari temibili</h3>
            <p>Gli avversari più temibili non subiscono gli effetti che tolgono azioni o attacchi (Frastornato, Stordito, Inibito); al loro posto molte tecniche e incantesimi hanno un effetto di ripiego, indicato tra parentesi. Su di loro gli altri effetti durano al massimo 2 turni (Avvizzito 3), e cariche e Sigilli arrivano al massimo a 2.</p>
            <h3>Debolezze e resistenze</h3>
            <p>Alcuni nemici sono vulnerabili a un tipo di danno: taglio, contundente, perforante, arcano, forza, luce (radiante) oppure ombra (necrotico). Contro di loro quel danno ha un dado in più, oppure un effetto dura un turno in più. Altri resistono a un tipo di danno e ne subiscono metà. Esplorando e parlando puoi scoprire le debolezze degli avversari.</p>`],
          ["Guerriero", `
            <p>Combatte con l'arma e prepara <b>tecniche speciali</b>, che costano punti ira.</p>
            <h3>Regole della classe</h3>
            <ul>
              <li><b>Punti ira</b>: partono da ${R.RISORSA_BASE} + mod. Vigore e a ogni livello aumentano di mod. Vigore + il nuovo livello. Una tecnica che manca il bersaglio costa comunque.</li>
              <li><b>Recupero</b>: a ogni colpo subito guadagni ${recupero()}, il doppio se è un colpo critico. Un attacco che ti manca o che pari non dà ira. Anche un tuo colpo critico ti dà 2 punti ira.</li>
              <li><b>Posti</b>: ${posti()}. Il tipo d'arma che impugni (taglio, contundente, perforante) decide tra quali tecniche scegli; con lo scudo imbracciato hai un posto in più, di qualsiasi livello, tra le tecniche dello scudo. Si scelgono in creazione e si cambiano riposando.</li>
              <li>Una tecnica di un tipo d'arma diverso da quella che impugni resta preparata, ma non si può usare. Se cambi arma, le tecniche del nuovo tipo arrivano dal livello successivo.</li>
              <li>${utilitaGuerriero.map(t => `<b>${t.nome.it}</b>`).join(", ")} e Mente incrollabile appartengono alla classe e non occupano posti.</li>
              <li>Dal livello 3 scegli una <b>via di prestigio</b>: tre abilità, una ai livelli 3, 4 e 5, sempre pronte e senza occupare posti. Cambiano con il tipo d'arma; anche lo scudo ha le sue, e quando riposi scegli quale serie preparare. La scelta della via è definitiva.</li>
              <li>Alcune tecniche si usano una sola volta tra un riposo e l'altro.</li>
            </ul>
            <h3>Effetti dei rami</h3>
            <ul>
              <li><b>Taglio</b>: Sanguinamento ed Emorragia.</li>
              <li><b>Contundente</b>. <b>Incrinatura</b>: −1 alla Classe armatura del nemico per carica, fino a 3, per tutto lo scontro; è l'unico effetto che si somma. <b>Frattura</b>: il nemico subisce 1d4 danni ogni volta che attacca.</li>
              <li><b>Perforante</b>. <b>Esposto</b>: vedi Stati.</li>
              <li><b>Scudo</b>. <b>Carica Cinetica</b>: si guadagna quando lo scudo assorbe un colpo, al massimo 3, e dura tutto lo scontro; alcune tecniche la spendono per colpire senza tiro. Assorbire significa subire metà danni (dà l'ira normale) oppure 0 danni (non dà ira). Le tecniche di scudo che consumano l'azione non si possono usare due turni di fila.</li>
            </ul>
            <h3>Tecniche</h3>
            ${tendina("Capacità di classe", tabella(utilitaGuerriero))}
            ${ramiGuerriero}`],
          ["Sciamano", `
            <p>Combatte con l'arma e la forza della natura: veleni, trappole, radici e spore. Le tecniche costano <b>punti natura</b>.</p>
            <h3>Regole della classe</h3>
            <ul>
              <li><b>Punti natura</b>: partono da ${R.RISORSA_BASE} + mod. Spirito e a ogni livello aumentano di mod. Spirito + il nuovo livello. Una tecnica che manca il bersaglio costa comunque.</li>
              <li><b>Attacco</b>: d20 + mod. Vigore, come il Guerriero. <b>Tiro salvezza del nemico</b>: sempre sul corpo, d20 + il suo Vigore contro 8 + il tuo Vigore + livello.</li>
              <li><b>Recupero</b>: la natura torna quando la natura colpisce, non l'arma. Danni da veleno, Tossina, acido e bulbo, un tiro salvezza fallito contro una tua tecnica, una trappola che scatta e lo Scudo di Corteccia (quando lo crei o quando assorbe) ti danno ${recupero()}, al massimo una volta per turno del nemico; il doppio se il nemico ha la Tossina.</li>
              <li><b>Posti</b>: ${posti()}. Le tecniche della natura funzionano con qualsiasi arma. Si scelgono in creazione e si cambiano riposando.</li>
              <li><b>Rivestimento</b>: un attacco che riveste l'arma per 3 turni; ogni colpo a segno (anche gli attacchi normali) ne porta l'effetto. Uno solo alla volta.</li>
              <li><b>Trappola</b>: un attacco e, nello stesso turno, una trappola che scatta al prossimo attacco del nemico, prima del suo tiro. Una sola alla volta.</li>
              <li><b>Avvelenato</b>: 1d4 danni a ogni turno del nemico (<b>Tossina</b>: 1d6); si rinnova, non si somma, e si somma a Sanguinamento e Avvizzito. Alcuni avversari resistono al veleno e ne subiscono metà.</li>
              <li><b>Scudo di Corteccia</b>: salute temporanea che assorbe i danni prima della salute fisica, al massimo 5 + livello, per tutto lo scontro.</li>
              <li><b>Borsa dei veleni</b> (dotazione dello Sciamano): 3 dosi da 1d4 + livello punti natura. Vuota, si riempie con gli ingredienti giusti, che si trovano nella foresta.</li>
              <li>Mente incrollabile appartiene alla classe. Dal livello 3 scegli una via di prestigio: una passiva e tre abilità (livelli 3, 4 e 5), sempre pronte e senza occupare posti. La scelta è definitiva.</li>
            </ul>
            <h3>Tecniche</h3>
            ${tecnicheSciamano}`],
          ["Arcanista", `
            <p>Plasma la magia di due scuole: l'<b>Arcano</b> incide Sigilli sul nemico, la <b>Forza</b> li fa esplodere. Gli incantesimi costano mana.</p>

              <li><b>Scuola principale</b>: si sceglie in creazione, come il Guerriero sceglie l'arma. I posti sono ${posti()}, tra gli incantesimi sbloccati della scuola principale, più ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} posto dell'altra scuola, di qualsiasi livello. Se cambi scuola principale, vale dal livello successivo. Gli incantesimi si cambiano riposando.</li>
              <li><b>Sigilli</b>: gli incantesimi d'Arcano incidono Sigilli sul nemico, al massimo ${MG ? MG.SIGILLI_MAX : 3} (${MG ? MG.SIGILLI_MAX_BOSS : 2} sugli avversari temibili). Durano tutto lo scontro. Il critico di un incantesimo di Forza incide anche 1 Sigillo.</li>
              <li><b>Detonazione</b>: gli incantesimi di Forza che la indicano consumano tutti i Sigilli e fanno +1d6 di danno per Sigillo. Senza Sigilli non c'è niente da far esplodere: niente danno in più e niente mana.</li>
              <li><b>Recupero</b>: ogni Detonazione ti restituisce ${recupero()} mana, il doppio se fa esplodere il massimo dei Sigilli.</li>

            <h3>Incantesimi</h3>
            ${tendineScuole("Sapiente")}`],
          ["Monaco", `
            <p>Prega due forze opposte: la <b>Luce</b> protegge e cura, l'<b>Ombra</b> ferisce di più ma chiede un prezzo alla mente. Gli incantesimi costano punti fede.</p>
            <h3>Regole della classe</h3>
            <ul>

              <li><b>Scuola principale</b>: come per l'Arcanista. Posti ${posti()} della scuola principale, più ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} posto dell'altra.</li>
              <li><b>Bilancia</b>: va da Ombra ${MG ? MG.BILANCIA_MAX : 3} a Luce ${MG ? MG.BILANCIA_MAX : 3} e parte da 0 a ogni scontro. Ogni incantesimo di Luce la sposta di 1 verso la Luce, ogni incantesimo d'Ombra di 1 verso l'Ombra.</li>
            </ul>
            <div class="scroll"><table><tr><th>Posizione</th><th>Effetto</th></tr>
              <tr><td>Luce 2-3 · Aureola</td><td>Le tue cure +2, +1 ai tuoi tiri salvezza</td></tr>
              <tr><td>Luce 3 · Zenit</td><td>Il prossimo incantesimo d'Ombra è un Crepuscolo</td></tr>
              <tr><td>Ombra 2-3 · Velo</td><td>Gli incantesimi d'Ombra hanno +1 dado di danno</td></tr>
              <tr><td>Ombra 3 · Nadir</td><td>Ogni incantesimo d'Ombra costa anche 1 punto di salute mentale (non letale); il prossimo incantesimo di Luce è un Crepuscolo</td></tr>
              <tr><td>Crepuscolo</td><td>L'incantesimo ha +1 dado (danno o cura) e ti restituisce ${recupero()} punti fede, il doppio se parti da Nadir; poi la Bilancia torna a 0</td></tr>

            <ul>
              <li>${capacita("Accolito")}: capacità di classe, non occupa posti. Illumina il buio al posto della torcia.</li>
              <li><b>Via di prestigio</b> (dal livello 3): la Cenere o la Brace, tre abilità sempre pronte (livelli 3, 4 e 5). La scelta è definitiva.</li>
            </ul>
            <h3>Incantesimi</h3>
            ${tendineScuole("Accolito")}`],
          ["Esempi di combattimento", `
            <h3>Guerriero con la spada corta</h3>
            <p class="esempio">Livello 1, Vigore 16 (+3), 13 punti ira. Contro un nemico con Classe armatura 12.</p>
            <div class="turno"><b>Turno 1.</b> Usi Morso dell'Acciaio (3 ira, ne restano 10). Tiri 12: 12 + 3 = 15, più di 12, colpisci. Danno 1d6 + 3: esce 4, fai 7. Il nemico sanguina: 1d4 per 2 turni.</div>
            <div class="turno"><b>Turno del nemico.</b> Sanguina e perde 2. Ti attacca e ti colpisce: perdi 5 salute, ma guadagni 1 ira (11).</div>
            <div class="turno"><b>Turno 2.</b> Per risparmiare ira attacchi con l'arma, gratis. Tiri 20: critico! Colpisci di sicuro e tiri 2d6 + 3: fai 10. Il critico ti dà anche 2 ira (13).</div>
            <p class="esempio">L'ira sale quando ti colpiscono: il Guerriero non teme di prendere colpi, teme di restare a secco.</p>
            <h3>Arcanista d'Arcano, con un posto di Forza</h3>
            <p class="esempio">Livello 1, Mente 16 (+3), 13 mana. Contro lo stesso nemico.</p>
            <div class="turno"><b>Turno 1.</b> Dardo Arcano (2 mana, restano 11). Tiri 11: 11 + 3 = 14, colpisci. 1d8 + 3: fai 5 + 3 = 8, e incidi 1 Sigillo.</div>
            <div class="turno"><b>Turno 2.</b> Scopri Carte (1 mana, restano 10). Vedi la scheda del nemico e incidi il secondo Sigillo, senza tiro.</div>
            <div class="turno"><b>Turno 3.</b> Pugno di Forza (2 mana, restano 8). Tiri 14: 17, colpisci. 1d10 + 3 fa 6 + 3, e la Detonazione consuma i 2 Sigilli: +2d6, esce 7. Totale 16 danni. La Detonazione ti restituisce 1 mana (9). Con 3 Sigilli sarebbero stati 2.</div>
            <p class="esempio">L'Arcanista prepara e poi colpisce: più aspetti, più fa male, ma il nemico intanto attacca.</p>
            <h3>Monaco d'Ombra, con un posto di Luce</h3>
            <p class="esempio">Livello 2, Spirito 16 (+3), 18 punti fede. La Bilancia parte da 0.</p>
            <div class="turno"><b>Turno 1.</b> Avvizzire (3 fede, restano 15). Il nemico fallisce il tiro salvezza: è Avvizzito per 3 turni. Bilancia: Ombra 1.</div>
            <div class="turno"><b>Turno 2.</b> Sete di Tenebra (4 fede, restano 11). Colpisci; la Bilancia passa a Ombra 2 e scatta il Velo: 3d6 invece di 2d6. Recuperi 1 fede (12).</div>
            <div class="turno"><b>Turno 3.</b> Tocco Avvizzente (2 fede, restano 10): Bilancia a Ombra 3, sei a Nadir. Il prossimo incantesimo d'Ombra ti costerebbe 1 punto di salute mentale.</div>
            <div class="turno"><b>Turno 4.</b> Ti curi con Tocco Lenitivo (2 fede, restano 8). È un Crepuscolo: cura con 2d8 + 3 invece di 1d8 + 3, e partendo da Nadir recuperi il doppio, 2 fede (10). La Bilancia torna a 0.</div>
            <p class="esempio">Il Monaco d'Ombra spinge fino al limite, poi usa la Luce per tornare in equilibrio prima che la mente ceda.</p>`],
          ["Riposo e razioni", `
            <p>Si riposa solo accanto a un fuoco caldo, dalle fiamme arancioni, in un luogo di cui ti fidi. Alcuni fuochi si consumano dopo un riposo.</p>
            <p><b>Riposare ti porta al giorno successivo.</b> Il gioco tiene il conto dei giorni passati nella casa: lo trovi in cima alla scheda del personaggio. Quando riposi:</p>
            <ul>
              <li>consumi fino a 1d4 razioni;</li>
              <li>recuperi 1d4 + livello su salute fisica, salute mentale e sulla tua risorsa (mana, fede, ira o natura);</li>
              <li>ogni giorno ricevi ${R.RAZIONI_AL_GIORNO} razioni nuove (scorta massima ${R.RAZIONI_MAX});</li>
              <li>puoi cambiare tecniche e incantesimi preparati.</li>
            </ul>
            <p>Senza razioni la fame non ti fa dormire, tranne in un luogo particolarmente accogliente, dove recuperi comunque 1 punto.</p>
            <p class="esempio">Esempio: sei al livello 2 e hai perso 6 punti di salute fisica. Riposando tiri 1d4 e ottieni 3: recuperi 3 + 2 = 5 punti su salute fisica, salute mentale e risorsa di classe.</p>
            <p><b>Riposare sblocca anche le prove fallite.</b></p>
            <p>Se sei già in piena forma, non c'è bisogno di dormire: il gioco non consuma il fuoco né le razioni.</p>
            <p>La pozione di cura recupera 1d6 + livello di salute fisica; la pozione di essenza recupera 1d6 + livello nella risorsa della tua classe.</p>`],
          ["Livelli ed esperienza", `
            <p>Guadagni punti esperienza sconfiggendo i nemici e completando missioni. Il livello massimo è ${R.LIVELLO_MAX}.</p>
            <div class="scroll"><table><tr><th>Livello</th><th>PE necessari</th><th>PE totali</th></tr>${soglie}</table></div>
            <p>A ogni livello:</p>
            <ul>
              <li>salute fisica + (metà del dado vita + 1 + mod. Vigore), un valore fisso: Guerriero 6, Sciamano 5, Arcanista e Monaco 4, più il modificatore;</li>
              <li>salute mentale + (metà del dado vita + 1 + mod. Spirito);</li>
              <li>risorsa della classe + (modificatore del suo attributo + nuovo livello), senza dado;</li>
              <li>le abilità scelte crescono di 1 e si sbloccano nuove tecniche o incantesimi.</li>
            </ul>
            <p>Ogni aumento vale almeno 1.</p>`],
          ["Morte e salute mentale", `
            <p><b>Contro i guardiani non si muore:</b> se la salute fisica arriva a 0, la casa ti riporta indietro, con la salute piena ma 1d4 punti di salute mentale in meno.</p>
            <p><b>Contro animali, prede delle cacce e mastini si muore:</b> a 0 salute fisica diventi parte di Casa Vespera. Lo stesso accade se la salute mentale arriva a 0. Gli stati alterati, durante lo scontro, possono ucciderti.</p>
            <p><b>Modalità</b> (si sceglie in creazione): in <b>facile</b> dopo la morte riparti dall'ultimo salvataggio e salvi quando vuoi; in <b>difficile</b> la morte è permanente e c'è un solo salvataggio, automatico. Puoi passare da difficile a facile, mai il contrario.</p>
            <p><b>Se la salute mentale arriva a 0, la partita finisce.</b> Tienila d'occhio: prove fallite, enigmi sbagliati, sconfitte, certi incantesimi e certi luoghi la consumano.</p>
            <p><b>Le sconfitte contro gli avversari più temibili lasciano un segno:</b> ognuna toglie 1 punto alla salute mentale massima, fino a un massimo di 3 punti in tutto. Il punto torna quando quell'avversario viene sconfitto o risparmiato.</p>
            <p>Anche certe scoperte sulla casa feriscono la mente (da 1 a 4 punti, solo la prima volta), ma da sole non la portano mai a 0: lasciano sempre almeno 1 punto.</p>`],
          ["Salvataggi", `
            <p>Puoi tenere fino a tre personaggi. Salva con il pulsante in alto nella pagina di gioco.</p>
            <p>Accedendo con Google dalla pagina iniziale, i salvataggi sono condivisi tra computer e telefono.</p>`],
          ["Abilità", sezioneAbilita()]
        ]
      },
      en: {
        torna: "← Home page", titolo: "Rules", sotto: "The rules of the game, to look up whenever you like.",
        parte: "Part", capitolo: "Chapter", apri: "Expand all", chiudi: "Collapse",
        parti: [["The character", [0, 13, 10]], ["The classes", [4, 5, 6, 7]], ["Playing", [2, 1, 9, 11, 12]], ["Combat", [3, 8]]],
        sezioni: [
          ["Your character", `
            <h3>Attributes</h3>
            <p>Each attribute starts at ${R.VALORE_MINIMO}; at creation you spread ${R.PUNTI_BASE} points. No attribute can go above ${R.VALORE_MASSIMO}, race bonus included.</p>
            <span class="formula">Modifier = (score − 10) ÷ 2, rounded down</span>
            <p class="esempio">Example: 12 → +1, 14 → +2, 17 → +3.</p>
            <ul>
              <li><b>Vigour</b>: fighting strength, physical health, Athletics and Survival, the Warrior's resource.</li>
              <li><b>Agility</b>: initiative, defence (Armor class), Stealth and Acrobatics.</li>
              <li><b>Mind</b>: senses and logic, Investigation, Perception and Lore, the Arcanist's magic.</li>
              <li><b>Spirit</b>: mental health and willpower, Influence and Insight, the Monk's magic and the Shaman's resource.</li>
            </ul>
            <h3>Races</h3><div class="scroll"><table><tr><th>Race</th><th>Bonus</th></tr>${righeRazze}</table></div>
            <h3>Classes</h3><div class="scroll"><table><tr><th>Class</th><th>Hit die</th><th>Resource</th><th>Armor</th></tr>${righeClassi}</table></div>
            <p>“Battle” weapons are reserved for the Warrior. Each class has its own section in these rules, with all its techniques or spells.</p>
            <h3>Health and resources</h3>
            <span class="formula">Physical health = ${R.SALUTE_BASE} + maximum of the hit die + Vigour mod.</span>
            <span class="formula">Mental health = ${R.SALUTE_BASE} + maximum of the hit die + Spirit mod.</span>
            <span class="formula">Mana, faith, rage, nature points = ${R.RISORSA_BASE} + modifier of the class attribute</span>
            <h3>Skills</h3>
            <p>You choose ${R.MAX_ABILITA} at creation. What each one does, how its value is worked out and the armor penalty are explained in the «Skills» chapter.</p>
            <div class="scroll"><table><tr><th>Skill</th><th>Attribute</th></tr>${righeAbilita}</table></div>`],
          ["Skill checks", `
            <p>Write what your character does (“I examine the tapestry”, “I use investigation”). When the outcome is uncertain the game asks for a check and shows you difficulty, die and modifier.</p>
            <span class="formula">d20 + skill value ≥ difficulty (DC) → check passed</span>
            <p class="esempio">Example: Stealth +3 against DC 13. You roll 11: 11 + 3 = 14, which is at least 13, so the check is passed. With a 9 you would have totalled 12 and the check would have failed.</p>
            <p>The <b>skill value</b> is the attribute modifier; if you chose that skill at creation your level is added too. The difficulty (DC) depends on the situation: the higher it is, the harder to succeed.</p>
            <p>You can also declare a check in words, naming the skill: “I make a perception check”, “I use stealth”, “I look for tracks”. If the skill is of no use in that place, the game answers with a short description and no roll.</p>
            <p>Some checks require a <b>natural 20</b>: only the number on the die counts, the modifier is not added. Some items give <b>advantage</b>: you roll two dice and keep the better result.</p>
            <p>There are two ways of exploring: <b>Investigation</b>, searching actively (rummaging, moving, touching), and <b>Perception</b>, using your senses (sight, hearing, smell). If you write “I investigate” without saying how, the game asks which; if you name an object (“I investigate the tapestry”) the check is about that object.</p>
            <p><b>Every failed check costs ${R.COSTO_PROVA_FALLITA} point of mental health.</b> Choose carefully when to try. Some checks, flagged by the game, cost no mental health.</p>
            <p><b>Unshakeable Mind</b> (Warrior and Shaman): after a failed check you may spend 1 rage or nature point on a saving throw (d20 + Vigour modifier for the Warrior or Spirit for the Shaman + level, DC ${R.CD_INCROLLABILE}). On a success you lose no mental health.</p>
            <p><b>A failed check cannot be repeated until you rest.</b> That check stays locked: the game reminds you each time you try again, and warns you before the roll. After a rest it is available again. Passed checks stay passed. The exceptions are checks the game marks as repeatable.</p>
            <p>The colour of your action's drop-down tells you what happened:</p>
            <div class="tendine"><span class="t-azz">blue: no check</span><span class="t-ok">green: check passed</span><span class="t-ko">red: check failed</span></div>
            <p>In conversations the approach you choose, kind or harsh, matters too: everyone reacts in their own way.</p>
            <h3>Riddles</h3>
            <p>Some places hide a riddle. Usually a check gives you a clue, then you choose the solution yourself. A wrong choice costs ${R.COSTO_PROVA_FALLITA} point of mental health, like a failed check. If you miss the clue, someone in the house might give it to you.</p>`],
          ["Moving and exploring", `
            <p>You control the game by writing what your character does, in your own words. No exact formulas are needed: the game recognises the most common verbs.</p>
            <ul>
              <li><b>Moving</b>: “I go to the kitchen”, “I go down to the cellar”, “I go back”. You can only reach neighbouring rooms: if a room is far away, the game tells you which way to go.</li>
              <li><b>Looking</b>: “I look at the fireplace”, “I examine the room”, “I listen”. Descriptions and details cost nothing.</li>
              <li><b>Acting</b>: “I take the sword”, “I open the door”, “I talk to Guendalina”.</li>
              <li><b>Items</b>: “I drink the healing potion”, “I wield the torch”, “I wear the armor”. The backpack and the sheet show what you carry and how to use it.</li>
            </ul>
            <p class="esempio">Example: in a new room you write “I look at the table”. If there is something to discover, the game offers you a check.</p>
            <p>When the game offers you buttons (a choice, a roll, “let it go”) use them instead of typing. Accepted quests appear on the sheet, with objectives and hints.</p>`],
          ["Combat", `
            <p><b>Initiative</b>: whoever has more Agility acts first (on a tie, a d20 each).</p>
            <p>Each turn you have one action: attack, use a technique, cast a spell or use an item. Taking up the torch or the shield does not use your action. A weapon attack is always free.</p>
            <span class="formula">Weapon attack: d20 + Vigour mod., hits if it beats the target's Armor class</span>
            <span class="formula">Spell attack: d20 + Mind (Arcanist) or Spirit (Monk) mod., hits if it beats the Armor class</span>
            <span class="formula">Spell attack damage = the spell's dice + Mind or Spirit mod., just as weapons add Vigour</span>
            <span class="formula">Weapon damage: weapon die + Vigour mod. (torch 1d4, bare hands 1d2)</span>
            <p><b>Critical hit</b>: a 20 on the die always hits and rolls double the damage dice. Enemies too. Some effects widen the critical to 19-20 or 18-20 (never further).</p>
            <p><b>Enemy saving throw</b>: when an effect lets the enemy resist, it rolls d20 + its modifier against your difficulty.</p>
            <span class="formula">DC = 8 + your class attribute modifier + level</span>
            <p>In combat write your action (“I attack”, “I cast a spell”, “I drink the healing potion”) or use the buttons that appear. Full examples are in the “Combat examples” section.</p>
            <h3>Armor class</h3>
            <span class="formula">AC = ${R.CA_BASE} + armor + Agility mod. (up to the armor's cap) + shield</span>
            <p>Agility bonus cap: ${tetti}.</p>
            <p>Two-handed weapons leave no hand free for torch or shield: put the weapon away first.</p>
            <h3>Resources in combat</h3>
            <p>Every class has a resource (rage, nature, mana, faith) that recharges by resting. During a fight you recover some, each class in its own way, with the same table: ${recupero()}, double in the best case. Details are in each class section.</p>
            <h3>Conditions</h3>
            <div class="scroll"><table><tr><th>Condition</th><th>Effect</th></tr>
              <tr><td>Weakened</td><td>−2 to hit · 2 turns</td></tr>
              <tr><td>Off-balance</td><td>−2 Armor class</td></tr>
              <tr><td>Dazed</td><td>−4 to hit, no criticals</td></tr>
              <tr><td>Stunned</td><td>skips its next turn</td></tr>
              <tr><td>Inhibited</td><td>cannot use its special attacks</td></tr>
              <tr><td>Bleeding</td><td>1d4 damage each of its turns (Haemorrhage: 1d6) · 3 turns</td></tr>
              <tr><td>Exposed</td><td>your attacks crit on one number lower, never below 18</td></tr>
              <tr><td>Blinded</td><td>rolls 2d20 to hit and keeps the worse · 2 turns</td></tr>
              <tr><td>Withered</td><td>1d4 necrotic damage each of its turns (1d6 where stated); stacks with Bleeding</td></tr>
              <tr><td>Poisoned</td><td>1d4 poison damage each of its turns (Toxin: 1d6); stacks with Bleeding and Withered · 3 turns</td></tr>
              <tr><td>Burned</td><td>1d4 fire damage each of its turns (1d6 if empowered) · 3 turns</td></tr>
              <tr><td>Frightened</td><td>−2 Armor class · 2 turns</td></tr>
            </table></div>
            <p>Effects do not stack: a new one of the same kind renews the duration. The exceptions (Cracked, Seals) are explained in the classes.</p>
            <p><b>Six conditions work the same for you and for enemies</b>: Burned, Bleeding and Poisoned (1d4 per turn for 3 turns, 1d6 when empowered), Weakened, Frightened and Blinded (2 turns). Different conditions stack. They end with the fight. Ash creatures do not bleed; fire creatures do not burn.</p>
            <p><b>Elixirs.</b> Common elixirs (made with animal parts and herbs) cure one condition. Rare elixirs (made with the part of an ash creature alone) make you immune to that condition for the whole fight, drunk before or during it. An enemy that sees its condition fail against the immunity does not try again. You carry at most 2 per condition.</p>
            <p><b>Enemy abilities.</b> Enemies have ability points too: every ability that inflicts a condition costs points (2 for a condition, 3 for an empowered one or for two conditions, 4 for a control like Stunned or Held). Out of points, only normal attacks.</p>
            <p><b>Fleeing.</b> Write “I flee”: Athletics or Acrobatics check against DC 10 + the enemy's level. Succeed and you return to the room you came from; fail and the enemy strikes you with advantage. You cannot flee from guardians.</p>
            <p><b>Ambushes.</b> After the bronze clasp, outside the house you may be ambushed by those who entered the cave by other ways: goblins and orcs, alone or in gangs (a group fights as a single creature), or one of five adventurers who grow with you. At a third of their health an adventurer surrenders: you can finish them or spare them. Finishing someone who begs for mercy or tries to run costs 1 point of mental health, and it can kill you: it is the house changing you. Whoever you spare comes back once, after a rest, stronger, and that time fights to the end. Weapons taken from them carry the bonus of the level at which you find them.</p>
            <p><b>The clasp.</b> The guardians' clasp takes a slot in your equipment and, outside combat, you can hide it or pin it on (“I hide the clasp”, “I pin the clasp”). Pinned, your rank shows under the portrait and the hounds smell the butler on you (+2 to Stealth when they stalk you), but outside the house you are valuable prey and ambushes are more frequent. Hidden, the opposite.</p>
            <h3>Fearsome foes</h3>
            <p>The most fearsome foes are immune to effects that take away actions or attacks (Dazed, Stunned, Inhibited); against them many techniques and spells have a fallback effect, shown in brackets. On them other effects last at most 2 turns (Withered 3), and charges and Seals reach at most 2.</p>
            <h3>Weaknesses and resistances</h3>
            <p>Some enemies are vulnerable to a damage type: slashing, bludgeoning, piercing, arcane, force, light (radiant) or shadow (necrotic). Against them that damage gets one extra die, or an effect lasts one turn longer. Others resist a damage type and take half. Exploring and talking you can discover your foes' weaknesses.</p>`],
          ["Warrior", `
            <p>Fights with the weapon and prepares <b>special techniques</b>, which cost rage points.</p>
            <h3>Class rules</h3>
            <ul>
              <li><b>Rage points</b>: start at ${R.RISORSA_BASE} + Vigour mod. and grow at every level by Vigour mod. + the new level. A technique that misses still costs.</li>
              <li><b>Recovery</b>: for every hit you take you gain ${recupero()}, double on a critical hit. An attack that misses you or that you parry gives no rage. Your own critical hits also give you 2 rage points.</li>
              <li><b>Slots</b>: ${posti()}. The weapon type you hold (slashing, bludgeoning, piercing) decides which techniques you choose from; with the shield on your arm you get one extra slot, of any level, among the shield techniques. Chosen at creation and changed by resting.</li>
              <li>A technique for a different weapon type than the one you hold stays prepared but cannot be used. If you change weapon, the new type's techniques arrive from the next level.</li>
              <li>${utilitaGuerriero.map(t => `<b>${t.nome.en}</b>`).join(", ")} and Unshakeable Mind belong to the class and take no slots.</li>
              <li>From level 3 you choose a <b>prestige path</b>: three abilities, one at levels 3, 4 and 5, always ready and taking no slots. They change with the weapon type; the shield has its own too, and when you rest you choose which set to prepare. The choice of path is final.</li>
              <li>Some techniques can be used only once between one rest and the next.</li>
            </ul>
            <h3>Branch effects</h3>
            <ul>
              <li><b>Slashing</b>: Bleeding and Haemorrhage.</li>
              <li><b>Bludgeoning</b>. <b>Cracked</b>: −1 to the enemy's Armor class per charge, up to 3, for the whole fight; it is the only effect that stacks. <b>Fractured</b>: the enemy takes 1d4 damage every time it attacks.</li>
              <li><b>Piercing</b>. <b>Exposed</b>: see Conditions.</li>
              <li><b>Shield</b>. <b>Kinetic Charge</b>: gained when the shield absorbs a blow, up to 3, lasting the whole fight; some techniques spend it to strike with no roll. Absorbing means taking half damage (normal rage) or 0 damage (no rage). Shield techniques that use your action cannot be used two turns in a row.</li>
            </ul>
            <h3>Techniques</h3>
            ${tendina("Class abilities", tabella(utilitaGuerriero))}
            ${ramiGuerriero}`],
          ["Shaman", `
            <p>Fights with the weapon and the strength of nature: poisons, traps, roots and spores. Techniques cost <b>nature points</b>.</p>
            <h3>Class rules</h3>
            <ul>
              <li><b>Nature points</b>: start at ${R.RISORSA_BASE} + Spirit mod. and at each level grow by Spirit mod. + the new level. A technique that misses still costs.</li>
              <li><b>Attack</b>: d20 + Vigour mod., like the Warrior. <b>Enemy saving throw</b>: always on the body, d20 + its Vigour against 8 + your Vigour + level.</li>
              <li><b>Recovery</b>: nature returns when nature strikes, not the weapon. Poison, Toxin, acid and bulb damage, a failed saving throw against one of your techniques, a trap springing and the Bark Shield (when you create it or when it absorbs) give you ${recupero()}, at most once per enemy turn; double if the enemy has Toxin.</li>
              <li><b>Slots</b>: ${posti()}. Nature techniques work with any weapon. They are chosen at creation and changed when you rest.</li>
              <li><b>Coating</b>: an attack that coats your weapon for 3 turns; every hit (normal attacks too) carries its effect. Only one at a time.</li>
              <li><b>Trap</b>: an attack and, in the same turn, a trap that springs at the enemy's next attack, before its roll. Only one at a time.</li>
              <li><b>Poisoned</b>: 1d4 damage each enemy turn (<b>Toxin</b>: 1d6); it renews rather than stacking, and stacks with Bleeding and Withered. Some foes resist poison and take half.</li>
              <li><b>Bark Shield</b>: temporary health that absorbs damage before physical health, at most 5 + level, for the whole fight.</li>
              <li><b>Poison pouch</b> (Shaman gear): 3 doses of 1d4 + level nature points. When empty, it is refilled with the right ingredients, found in the forest.</li>
              <li>Unshakeable Mind belongs to the class. From level 3 you choose a prestige path: one passive and three abilities (levels 3, 4 and 5), always ready and taking no slots. The choice is final.</li>
            </ul>
            <h3>Techniques</h3>
            ${tecnicheSciamano}`],
          ["Arcanist", `
            <p>Shapes the magic of two schools: <b>Arcane</b> carves Seals on the enemy, <b>Force</b> makes them explode. Spells cost mana.</p>
            <h3>Class rules</h3>
            <ul>
              <li><b>Mana</b>: starts at ${R.RISORSA_BASE} + Mind mod. and grows at every level by Mind mod. + the new level.</li>
              <li><b>Main school</b>: chosen at creation, as the Warrior chooses a weapon. Slots are ${posti()}, among the unlocked spells of the main school, plus ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} slot from the other school, of any level. If you change main school, it applies from the next level. Spells are changed by resting.</li>
              <li><b>Seals</b>: Arcane spells carve Seals on the enemy, up to ${MG ? MG.SIGILLI_MAX : 3} (${MG ? MG.SIGILLI_MAX_BOSS : 2} on fearsome foes). They last the whole fight. A Force spell's critical also carves 1 Seal.</li>
              <li><b>Detonation</b>: Force spells that show it spend all Seals and deal +1d6 damage per Seal. With no Seals there is nothing to burst: no extra damage and no mana.</li>
              <li><b>Recovery</b>: each Detonation gives you back ${recupero()} mana, double if it detonates the maximum number of Seals.</li>
              <li>${capacita("Sapiente")}: class ability, takes no slot. Lights the dark instead of a torch.</li>
              <li><b>Prestige path</b> (from level 3): Fracture or Suture, three abilities always ready (levels 3, 4 and 5). The choice is final.</li>
              <li>Some spells can be used only once between rests; those that “use your action” cannot be used two turns in a row.</li>
            </ul>
            <h3>Spells</h3>
            ${tendineScuole("Sapiente")}`],
          ["Monk", `
            <p>Prays to two opposing forces: <b>Light</b> protects and heals, <b>Shadow</b> hurts more but asks a price of the mind. Spells cost faith points.</p>
            <h3>Class rules</h3>
            <ul>
              <li><b>Faith points</b>: start at ${R.RISORSA_BASE} + Spirit mod. and grow at every level by Spirit mod. + the new level.</li>
              <li><b>Main school</b>: as for the Arcanist. Slots ${posti()} from the main school, plus ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} slot from the other.</li>
              <li><b>Balance</b>: runs from Shadow ${MG ? MG.BILANCIA_MAX : 3} to Light ${MG ? MG.BILANCIA_MAX : 3} and starts at 0 every fight. Each Light spell moves it 1 towards Light, each Shadow spell 1 towards Shadow.</li>
            </ul>
            <div class="scroll"><table><tr><th>Position</th><th>Effect</th></tr>
              <tr><td>Light 2-3 · Halo</td><td>Your healing +2, +1 to your saving throws</td></tr>
              <tr><td>Light 3 · Zenith</td><td>Your next Shadow spell is a Twilight</td></tr>
              <tr><td>Shadow 2-3 · Veil</td><td>Shadow spells have +1 damage die</td></tr>
              <tr><td>Shadow 3 · Nadir</td><td>Every Shadow spell also costs 1 point of mental health (never lethal); your next Light spell is a Twilight</td></tr>
              <tr><td>Twilight</td><td>The spell has +1 die (damage or healing) and gives you back ${recupero()} faith points, double if you start from Nadir; then the Balance returns to 0</td></tr>
            </table></div>
            <ul>
              <li>${capacita("Accolito")}: class ability, takes no slot. Lights the dark instead of a torch.</li>
              <li><b>Prestige path</b> (from level 3): Ash or Ember, three abilities always ready (levels 3, 4 and 5). The choice is final.</li>
            </ul>
            <h3>Spells</h3>
            ${tendineScuole("Accolito")}`],
          ["Combat examples", `
            <h3>Warrior with a shortsword</h3>
            <p class="esempio">Level 1, Vigour 16 (+3), 13 rage points. Against an enemy with Armor class 12.</p>
            <div class="turno"><b>Turn 1.</b> You use Steel Bite (3 rage, 10 left). You roll 12: 12 + 3 = 15, more than 12, you hit. Damage 1d6 + 3: you roll 4, dealing 7. The enemy bleeds: 1d4 for 2 turns.</div>
            <div class="turno"><b>Enemy turn.</b> It bleeds and loses 2. It attacks and hits you: you lose 5 health, but gain 1 rage (11).</div>
            <div class="turno"><b>Turn 2.</b> To save rage you attack with your weapon, for free. You roll 20: critical! You hit for sure and roll 2d6 + 3: you deal 10. The critical also gives you 2 rage (13).</div>
            <p class="esempio">Rage rises when you are hit: the Warrior does not fear taking blows, he fears running dry.</p>
            <h3>Arcane Arcanist, with one Force slot</h3>
            <p class="esempio">Level 1, Mind 16 (+3), 13 mana. Against the same enemy.</p>
            <div class="turno"><b>Turn 1.</b> Arcane Bolt (2 mana, 11 left). You roll 11: 11 + 3 = 14, you hit. 1d8 + 3: you deal 5 + 3 = 8, and carve 1 Seal.</div>
            <div class="turno"><b>Turn 2.</b> Reveal Cards (1 mana, 10 left). You see the enemy's sheet and carve the second Seal, with no roll.</div>
            <div class="turno"><b>Turn 3.</b> Force Fist (2 mana, 8 left). You roll 14: 17, you hit. 1d10 + 3 gives 6 + 3, and the Detonation spends the 2 Seals: +2d6, you roll 7. Total 16 damage. The Detonation gives you back 1 mana (9). With 3 Seals it would have been 2.</div>
            <p class="esempio">The Arcanist prepares, then strikes: the longer you wait, the more it hurts, but meanwhile the enemy attacks.</p>
            <h3>Shadow Monk, with one Light slot</h3>
            <p class="esempio">Level 2, Spirit 16 (+3), 18 faith points. The Balance starts at 0.</p>
            <div class="turno"><b>Turn 1.</b> Wither (3 faith, 15 left). The enemy fails its saving throw: it is Withered for 3 turns. Balance: Shadow 1.</div>
            <div class="turno"><b>Turn 2.</b> Thirst of Darkness (4 faith, 11 left). You hit; the Balance moves to Shadow 2 and the Veil kicks in: 3d6 instead of 2d6. You recover 1 faith (12).</div>
            <div class="turno"><b>Turn 3.</b> Withering Touch (2 faith, 10 left): Balance at Shadow 3, you are at Nadir. Your next Shadow spell would cost you 1 point of mental health.</div>
            <div class="turno"><b>Turn 4.</b> You heal with Soothing Touch (2 faith, 8 left). It is a Twilight: it heals 2d8 + 3 instead of 1d8 + 3, and starting from Nadir you recover double, 2 faith (10). The Balance returns to 0.</div>
            <p class="esempio">The Shadow Monk pushes to the limit, then uses Light to find balance again before the mind gives way.</p>`],
          ["Rest and rations", `
            <p>You can only rest by a warm fire, one with orange flames, in a place you trust. Some fires are spent after one rest.</p>
            <p><b>Resting takes you to the next day.</b> The game keeps count of the days spent in the house: you will find it at the top of your character sheet. When you rest:</p>
            <ul>
              <li>you eat up to 1d4 rations;</li>
              <li>you recover 1d4 + level on physical health, mental health and your resource (mana, faith, rage or nature);</li>
              <li>each day you receive ${R.RAZIONI_AL_GIORNO} new rations (up to ${R.RAZIONI_MAX} in store);</li>
              <li>you can change your prepared techniques and spells.</li>
            </ul>
            <p>Without rations hunger keeps you awake, except in a particularly welcoming place, where you still recover 1 point.</p>
            <p class="esempio">Example: you are level 2 and have lost 6 points of physical health. Resting you roll 1d4 and get 3: you recover 3 + 2 = 5 points on physical health, mental health and class resource.</p>
            <p><b>Resting also unlocks failed checks.</b></p>
            <p>If you are already in top shape there is no need to sleep: the game consumes neither the fire nor the rations.</p>
            <p>The healing potion restores 1d6 + level physical health; the essence potion restores 1d6 + level of your class resource.</p>`],
          ["Levels and experience", `
            <p>You earn experience points by defeating enemies and completing quests. The maximum level is ${R.LIVELLO_MAX}.</p>
            <div class="scroll"><table><tr><th>Level</th><th>XP needed</th><th>Total XP</th></tr>${soglie}</table></div>
            <p>At each level:</p>
            <ul>
              <li>physical health + (half the hit die + 1 + Vigour mod.), a fixed amount: Warrior 6, Shaman 5, Arcanist and Monk 4, plus the modifier;</li>
              <li>mental health + (half the hit die + 1 + Spirit mod.);</li>
              <li>class resource + (its attribute modifier + the new level), no die;</li>
              <li>your chosen skills grow by 1 and new techniques or spells unlock.</li>
            </ul>
            <p>Each increase is at least 1.</p>`],
          ["Death and mental health", `
            <p><b>You cannot die against guardians:</b> if your physical health reaches 0, the house brings you back, at full health but with 1d4 fewer points of mental health.</p>
            <p><b>Against animals, hunt prey and hounds you die:</b> at 0 physical health you become part of House Vespera. The same happens if your mental health reaches 0. Conditions can kill you during a fight.</p>
            <p><b>Mode</b> (chosen at creation): in <b>easy</b> after death you start again from your last save and save whenever you like; in <b>hard</b> death is permanent and there is a single, automatic save. You can switch from hard to easy, never back.</p>
            <p><b>If your mental health reaches 0, the game is over.</b> Keep an eye on it: failed checks, wrong riddle answers, defeats, certain spells and certain places wear it down.</p>
            <p><b>Defeats against the most fearsome foes leave a mark:</b> each one takes 1 point from your maximum mental health, up to 3 points in all. The point comes back once that foe has been beaten or spared.</p>
            <p>Some discoveries about the house also wound the mind (1 to 4 points, only the first time), but on their own they never bring it to 0: they always leave at least 1 point.</p>`],
          ["Saving", `
            <p>You can keep up to three characters. Save with the button at the top of the game page.</p>
            <p>If you sign in with Google on the home page, your saves are shared between computer and phone.</p>`],
          ["Skills", sezioneAbilita()]
        ]
      }
    }[L];

    document.title = T.titolo;
    document.getElementById("torna").textContent = T.torna;
    document.getElementById("titolo").textContent = T.titolo;
    document.getElementById("sotto").textContent = T.sotto;
    /* dentro ogni capitolo, ogni titoletto (h3) di primo livello diventa una tendina; il testo prima del primo resta in vista */
    const dividi = (html) => {
      const tp = document.createElement("template"); tp.innerHTML = html;
      let out = "", voce = null, buf = "";
      const chiudi = () => { out += voce === null ? buf : `<details class="sub">${sommario(voce)}<div class="corpo">${buf}</div></details>`; buf = ""; };
      for (const n of tp.content.childNodes) {
        if (n.nodeName === "H3") { chiudi(); voce = n.textContent; }
        else if (n.nodeType === 1) buf += n.outerHTML;
      }
      chiudi(); return out;
    };
    let numCap = 0;
    Sicuro.html(document.getElementById("sezioni"), T.parti.map(([titolo, idx], p) =>
      `<details class="parte" open><summary><span class="tt">${T.parte} ${p + 1} · ${titolo}</span></summary><div class="corpo">${idx.map(i => {
        const [t, c] = T.sezioni[i]; numCap++;
        return `<details class="cap"><summary><span class="tt">${T.capitolo} ${numCap}: ${t}</span><span class="punti"></span></summary><div class="corpo">${dividi(c)}</div></details>`;
      }).join("")}</div></details>`).join(""));
    const tutte = (aperte) => document.querySelectorAll("#sezioni details").forEach(d => { d.open = aperte || d.classList.contains("parte"); });
    document.getElementById("apriTutto").textContent = T.apri;
    document.getElementById("chiudiTutto").textContent = T.chiudi;
    document.getElementById("apriTutto").onclick = () => tutte(true);
    document.getElementById("chiudiTutto").onclick = () => tutte(false);
  </script>
</body>
</html>
