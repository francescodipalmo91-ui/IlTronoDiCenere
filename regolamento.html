            <p>Condition elixirs are drunk with the quick action. A <b>common</b> elixir cures the mild condition of its family; a <b>rare</b> one also cures the severe form and makes you immune for 3 turns. You carry at most 2 per family.</p>`],
          /* 13 */ ["Foes", `
            <h3>Vulnerabilities and resistances</h3>
            <div class="scroll"><table><tr><th>Symbol</th><th>Effect</th></tr>
              <tr><td>✓ vulnerable (green)</td><td>+50% damage</td></tr>
              <tr><td>✗ resistant (orange)</td><td>−50% damage</td></tr>
              <tr><td>⛔ immune (red)</td><td>no damage</td></tr>
              <tr><td>· neutral (white)</td><td>full damage</td></tr>
            </table></div>
            <p>It also applies to damage over time of the same type. Holy fire, found only in items and scrolls, ignores defences against fire. Outside the house nature resists but is never immune; inside, the curse is complete.</p>
            <p>Every guardian has weak points: discovering them before the fight, by exploring, talking to the people of the house and reading what others left behind, makes a great difference.</p>
            <h3>Enemy powers</h3>
            <p>Enemies follow your own logic: at-will, encounter and daily powers that inflict and worsen conditions.</p>
            <h3>Guardians and the sovereign</h3>
            <ul>
              <li><b>Warning</b>: their strongest blows are announced in the log one turn early, with an icon (a quivering sword). You have a turn to defend yourself or break the charge.</li>
              <li><b>Phases</b>: they change how they fight at health thresholds; they leave a phase only after playing its whole sequence, and an announced blow still lands.</li>
              <li>Their dailies are not chosen: they are moments of the fight.</li>
              <li>Some have conditions of their own, which the log explains when they use them.</li>
            </ul>`],
          /* 14 */ ["Hunts, ambushes and the clasp", `
            <h3>Ambushes</h3>
            <p>Outside the house you may be ambushed by a <b>hollow</b>: an adventurer the house consumed before you. The hollow never surrender and always leave a diary.</p>
            <ul>
              <li>You notice the ambush with an opposed check: your Perception or Insight (depending on how the hollow acts) against its Stealth.</li>
              <li><b>You notice it</b>: the fight starts on even terms.</li>
              <li><b>It surprises you</b>: it acts first and in the first turn your Armor class drops by 2.</li>
            </ul>
            <h3>Common hunts</h3>
            <p>After each clasp Aldo posts two hunts in the hunting hall, one at a time, from one to three golden stars. The prey you defeat does not leave its weapon: your reward is a gift from Aldo.</p>
            <ul>
              <li><b>One and two stars</b>: Aldo tells you what the prey is vulnerable to and what it resists (you find it again in Quests).</li>
              <li><b>Three stars</b>: nobody knows anything about it. Before attacking you can <b>observe</b> it (Perception), <b>recall</b> what it is (Lore) and <b>creep up</b> on it (Stealth against its Perception). Each action can be done once.</li>
            </ul>
            <span class="formula">Observe and recall: d20 + skill against DC 12 (+ the growth with level): DC → one entry, DC + 5 → two, DC + 10 → three</span>
            <h3>The clasp</h3>
            <p>The guardians' clasp takes a slot in your equipment. Outside combat you can hide it or pin it on (“I hide the clasp”, “I pin the clasp”).</p>
            <ul>
              <li><b>Pinned</b>: your rank shows under your portrait and the hounds smell the butler on you, but outside the house you are valuable prey and ambushes come more often.</li>
              <li><b>Hidden</b>: the opposite.</li>
            </ul>`],
          /* 15 */ ["Combat example", `
            <h3>Berserker Warrior with a sword</h3>
            <p class="esempio">Level 1, Vigour 16 (+3), sword 1d6. Against an enemy with Armor class 12.</p>
            <div class="turno"><b>Turn 1.</b> Trade Blow (at will): you roll 12, 12 + 3 = 15, more than 12, you hit. Only the weapon die: 4 damage. The sword cuts: the enemy makes a Vigour saving throw and fails it, it is Bleeding for 3 turns.</div>
            <div class="turno"><b>Enemy's turn.</b> It bleeds and loses 1d4. It hits you: you lose 6 health.</div>
            <div class="turno"><b>Turn 2.</b> Quick action: you drink the healing potion. Action: Cruel Blow (encounter), an attack with one more damage die. You roll 9: 9 + 3 = 12, it does not beat 12, you miss. The power is spent anyway.</div>
            <div class="turno"><b>Turn 3.</b> Mighty Blow (at will): you roll 20, critical! Double dice, 2d6 + 3, and +2 because the enemy already has a condition.</div>
            <p class="esempio">At-will powers set up, encounter and daily powers cash in: you reach the big blow with the condition already on the enemy.</p>`],
          /* 16 */ ["Rules shared by the classes", `
            <p>Each class has two <b>specializations</b>, one offensive and one defensive. You choose it at creation and never change it: it gives you all your powers.</p>
            <h3>Powers by level</h3>
            <p>Each specialization has 11 powers: 3 at will, 4 encounter, 4 daily. You will know 9: at every level you choose on screen, and the choice is final.</p>
            <div class="scroll"><table><tr><th>Level</th><th>At will</th><th>Encounter</th><th>Daily</th><th>What arrives</th></tr>
              <tr><td class="n">1</td><td class="n">2 of 3</td><td class="n">1 of 3</td><td class="n">1 of 2</td><td>specialization; class feature I</td></tr>
              <tr><td class="n">2</td><td class="n">3</td><td class="n">1</td><td class="n">1</td><td>the third at-will power; the prestige path</td></tr>
              <tr><td class="n">3</td><td class="n">3</td><td class="n">2</td><td class="n">2</td><td>class feature II; new encounter and daily powers</td></tr>
              <tr><td class="n">4</td><td class="n">3</td><td class="n">3</td><td class="n">2</td><td>another encounter power</td></tr>
              <tr><td class="n">5</td><td class="n">3</td><td class="n">3</td><td class="n">3</td><td>class feature III; the final daily</td></tr>
            </table></div>
            <h3>Prestige paths</h3>
            <p>At level 2 you choose a path, from Aldo or from Guendalina. It gives three passive powers, at levels 2, 3 and 4: they take no slots and cost no action.</p>
            <div class="scroll"><table><tr><th>Level</th><th>Aldo's path: the hunt</th><th>Guendalina's path: the hearth</th></tr>
              <tr><td class="n">2</td><td><b>Hunter's Eye</b>: the first damaging power of the fight rolls double dice; outside combat +2 to Stealth against the guardians</td><td><b>The Lantern</b>: immune to Frightened, +2 to all saving throws, rest gives 3 mental points</td></tr>
              <tr><td class="n">3</td><td><b>Scent of Blood</b>: against Staggered foes your at-will powers roll one more damage die</td><td><b>Healing Hands</b>: potions and health elixirs heal 50% more</td></tr>
              <tr><td class="n">4</td><td><b>No Escape</b>: the first time the enemy becomes Staggered, a free attack with an at-will power (no conditions)</td><td><b>The Threshold of Home</b>: once per fight, the blow that would make you Staggered deals half damage, and for 2 turns you have +2 AC</td></tr>
            </table></div>`],
          /* 17 */ ["Warrior", `
            <p>Fights with <b>Vigour</b>, a d10 hit die and every armor; he can strap on a shield. The weapon colours each of his powers: the blade wears down, the hammer stuns, the point finds the weak spots.</p>
            <h3>Class features</h3>
            <ul><li><b>Fury</b> (level 1): while Staggered, +2 damage.</li><li><b>Unshakeable Mind</b> (level 3): once a day you cancel the mental damage of a failed check.</li><li><b>Second Wind</b> (level 5, encounter): costs your action, heals a quarter of your maximum health.</li></ul>
            <h3>Specializations</h3>
            <ul><li><b>Berserker</b> (offensive): wears foes down with the weapon's condition and finishes off the Staggered.</li><li><b>Paladin</b> (defensive): takes the blows, strikes back and robs the enemy of its best attacks; with a shield his guard rises to +4 AC.</li></ul>`],
          /* 18 */ ["Shaman", `
            <p>Fights with <b>Agility</b>, a d8 hit die, light and medium armor and the focus (Axis of the World or Fetish Shield). His powers keep their damage type whatever weapon he holds.</p>
            <h3>Class features</h3>
            <ul><li><b>Deep Roots</b> (level 1): if the target has a condition, your attacks deal +1d4.</li><li><b>Bond of the Undergrowth</b> (level 3): the conditions you inflict last 4 turns; one more herb when you gather.</li><li><b>Infusion</b> (level 5, daily): when you rest, with herbs, you brew a health elixir (at most 2); drinking it is a quick action.</li></ul>
            <h3>Specializations</h3>
            <ul><li><b>Fungi</b> (offensive): the poison that kills; poison becomes damage.</li><li><b>Wood</b> (defensive): bark soaks up damage with health shields (one at a time; the one lasting several turns regains 2 points each of your turns) and strikes with bludgeoning. No healing.</li></ul>`],
          /* 19 */ ["Arcanist", `
            <p>Fights with <b>Mind</b>, a d6 hit die, light armor only and the focus (Arcane Tome or Runic Buckler). It is the frailest class: items, scrolls and potions support it.</p>
            <h3>Class features</h3>
            <ul><li><b>Last Spark</b> (level 1): once per fight, when you become Staggered, you recover an encounter power already used.</li><li><b>Arcane Well</b> (level 3): the first time each enemy turn you are hit, you recover 1 health (2 from level 4).</li><li><b>Clot</b> (level 5, encounter): costs your action, heals a quarter of your maximum health, +1d6 if the enemy has a condition.</li></ul>
            <h3>Specializations</h3>
            <ul><li><b>Reality</b> (offensive): force damage that inflicts Exposed; <i>Fracture</i>: your powers deal +2 damage to an Exposed or Laid bare target.</li><li><b>Illusion</b> (defensive): psychic damage and <i>Copies</i> (at most 3): a blow aimed at you hits a Copy, you take half damage, the Copy vanishes and whoever struck it is Weakened. In the end, Copies become damage.</li></ul>`],
          /* 20 */ ["Monk", `
            <p>Fights with <b>Spirit</b>, a d8 hit die, light and medium armor and the focus (Phylactery or Divine Aegis).</p>
            <h3>Class features</h3>
            <ul><li><b>Legacy of the Tomb</b> (level 1): after a daily power, until your next turn you halve the damage you take.</li><li><b>Last Service</b> (level 3): once a day, at 0 physical health you stay at 1 and heal 1d6 + Spirit.</li><li><b>Soothing Touch</b> (level 5, encounter): costs your action, heals a quarter of your maximum health and removes a condition.</li></ul>
            <h3>Specializations</h3>
            <ul><li><b>Blood</b> (offensive): darts and lances of blood; <i>Spilled Blood</i>: above half health, once per turn, you pay 10% of your maximum health for one more damage die; while Staggered the die is free. No healing.</li><li><b>Bone</b> (defensive): <i>bone plates</i> over your armor (at most 3): a blow you take breaks one and reduces the damage by 3, +1 per level above the first; some powers spend them as weapons.</li></ul>`],
        ]
      }
    }[L];

    document.title = T.titolo;
    document.getElementById("torna").textContent = T.torna;
    document.getElementById("titolo").textContent = T.titolo;
    document.getElementById("sotto").textContent = T.sotto;
    /* 03/11: indice da manuale. Parte: numero romano e titolo; capitolo: numero, titolo e riga di contenuto; il testo si legge di seguito */
    const ROMANI = ["I", "II", "III", "IV", "V", "VI"];
    let numCap = 0;
    Sicuro.html(document.getElementById("sezioni"), T.parti.map(([titolo, idx], p) =>
      `<details class="parte" open><summary><span class="romano" aria-hidden="true">${ROMANI[p]}</span><h2 class="parte-tt"><span class="sr">${T.parte} ${p + 1}: </span>${titolo}</h2></summary><div class="corpo">${idx.map(i => {
        const [tt, c] = T.sezioni[i]; numCap++;
        return `<details class="cap"><summary><span class="cap-n" aria-hidden="true">${numCap}</span><h3 class="tt cap-tt"><span class="sr">${T.capitolo} ${numCap}: </span>${tt}</h3><span class="apri" aria-hidden="true"></span><span class="cap-desc">${T.desc[i]}</span></summary><div class="testo">${c.replace(/<(\/?)h3>/g, "<$1h4>")}</div></details>`;
      }).join("")}</div></details>`).join(""));
    const tutte = (aperte) => document.querySelectorAll("#sezioni details").forEach(d => { d.open = aperte || d.classList.contains("parte"); });
    document.getElementById("apriTutto").textContent = T.apri;
    document.getElementById("chiudiTutto").textContent = T.chiudi;
    document.getElementById("apriTutto").onclick = () => tutte(true);
    document.getElementById("chiudiTutto").onclick = () => tutte(false);
  </script>
</body>
</html>
