<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regolamento</title>
  <script src="lib/purify.min.js"></script>
  <script src="js/sicuro.js"></script>
  <script src="js/regole.js"></script>
  <script src="js/lingua.js"></script>
  <link rel="stylesheet" href="tema.css">
  <style>
    /* 03/11: impaginazione da manuale stampato. Cinzel solo per il titolo e le parti; capitoli e testo in Lora.
       Un solo livello di tendine per leggere (il capitolo); restano a tendina solo le tabelle lunghe di tecniche e incantesimi. */
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; background: transparent; color: var(--text); font-family: var(--f-testo); font-size: 1.0625rem; line-height: 1.7; padding: 2.5rem 16px 4rem; }
    /* immagine a contorno (30/10): ai lati, sfumata nel fondo dietro la colonna di testo */
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        linear-gradient(to right, color-mix(in srgb, var(--bg) 55%, transparent) 0%, var(--bg) 24%, var(--bg) 76%, color-mix(in srgb, var(--bg) 55%, transparent) 100%),
        url("immagini/regolamento_sfondo.webp") center / cover no-repeat; }
    @media (max-width: 900px) { body::before { background: linear-gradient(color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 96%, transparent)), url("immagini/regolamento_sfondo_mobile.webp") center / cover no-repeat; } }
    main { max-width: 44rem; margin: 0 auto; }
    p, li { text-wrap: pretty; }
    .torna { color: var(--muted); text-decoration: none; font-size: 0.95rem; display: inline-block; padding: 0.6rem 0; }
    .torna:hover { color: var(--gold); }
    body.dentro .torna { display: none; } /* aperto dal gioco: si chiude con la ✕ della finestra */

    /* frontespizio */
    header.fronte { text-align: center; margin: 1.5rem 0 2.75rem; }
    h1 { font-family: var(--f-titoli); font-weight: 600; font-size: clamp(2.2rem, 7vw, 3.1rem); letter-spacing: 0.05em; line-height: 1.1; margin: 0; }
    .sotto { color: var(--muted); font-style: italic; margin: 0.6rem 0 0; }
    .azioni { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.4rem; }
    .azioni button { font: inherit; font-size: 0.92rem; color: var(--muted); background: none; border: 0; border-bottom: 1px solid transparent; padding: 0.35rem 0.1rem; cursor: pointer; }
    .azioni button:hover { color: var(--gold); border-bottom-color: var(--line); }
    button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

    /* parti: numero romano grande e titolo in Cinzel */
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } /* per i lettori di schermo: «Parte 1», «Capitolo 3» */
    details.parte { margin: 0 0 2.5rem; }
    details.parte > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 0.9rem; padding: 0 0 0.7rem; border-bottom: 1px solid var(--line); }
    details.parte > summary::-webkit-details-marker { display: none; }
    .romano { font-family: var(--f-titoli); font-size: 2.1rem; line-height: 1; color: var(--muted); min-width: 2.6rem; }
    .parte-tt { margin: 0; font-family: var(--f-titoli); font-weight: 600; font-size: 1.35rem; letter-spacing: 0.04em; }

    /* capitoli: numero in cifre antiche nel margine, titolo e riga di contenuto */
    details.cap { border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
    details.cap > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 2.6rem 1fr 1.2rem; grid-template-areas: "n tt ap" ". desc ap"; column-gap: 0.9rem; align-items: baseline; padding: 0.95rem 0; }
    .cap-n { grid-area: n; } .cap-tt { grid-area: tt; } .cap-desc { grid-area: desc; } details.cap > summary .apri { grid-area: ap; }
    details.cap > summary::-webkit-details-marker { display: none; }
    .cap-n { font-size: 1.25rem; color: var(--muted); text-align: right; font-variant-numeric: oldstyle-nums; }
    .cap-tt { display: block; margin: 0; font-family: var(--f-testo); font-weight: 600; font-size: 1.12rem; line-height: 1.35; letter-spacing: 0; text-wrap: balance; }
    .cap-desc { display: block; color: var(--muted); font-size: 0.95rem; line-height: 1.45; margin-top: 0.15rem; }
    details.cap > summary:hover .cap-tt { color: var(--gold); }
    .apri { width: 0.55rem; height: 0.55rem; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); align-self: center; justify-self: center; transition: transform 0.2s ease; }
    details[open] > summary .apri { transform: rotate(-135deg); }
    @media (prefers-reduced-motion: reduce) { .apri { transition: none; } }
    details.cap > .testo { padding: 0 0 1.8rem 3.5rem; }

    /* testo del capitolo, letto di seguito */
    .testo p, .testo li { margin: 0.45rem 0; }
    .testo ul, .testo ol { padding-left: 1.25rem; margin: 0.5rem 0; }
    .testo li::marker { color: var(--muted); }
    .testo h4 { font-family: var(--f-testo); font-weight: 700; font-size: 1.14rem; letter-spacing: 0.01em; color: var(--gold); margin: 2rem 0 0.35rem; text-wrap: balance; }
    .testo > h4:first-child { margin-top: 0.3rem; }
    .formula { display: block; margin: 0.7rem 0; padding: 0.55rem 0.9rem; border-left: 2px solid var(--accent); background: color-mix(in srgb, var(--bg) 88%, var(--text)); font-size: 0.97rem; font-variant-numeric: tabular-nums; }
    .esempio { color: var(--muted); font-style: italic; }
    .nota { margin: 0.8rem 0; padding: 0.1rem 0 0.1rem 0.9rem; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
    .turno { margin: 0.55rem 0; padding: 0.15rem 0 0.15rem 0.9rem; border-left: 2px solid var(--line); }
    .turno b { font-weight: 600; color: var(--gold); }

    /* scheda della classe */
    dl.scheda { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 1rem; margin: 1rem 0 0.4rem; padding: 0.6rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    dl.scheda dt { color: var(--muted); font-size: 0.85rem; font-style: italic; }
    dl.scheda dd { margin: 0; font-size: 0.98rem; line-height: 1.4; }

    /* tabelle */
    .scroll { overflow-x: auto; margin: 0.6rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: 0.95rem; line-height: 1.5; }
    th, td { text-align: left; padding: 0.45rem 0.6rem 0.45rem 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); vertical-align: top; }
    th { color: var(--muted); font-weight: 400; font-style: italic; border-bottom-color: var(--line); }
    td.n { white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* tabelle lunghe (tecniche, incantesimi, vie): l'unico livello di tendina dentro un capitolo */
    details.sub { margin: 0.3rem 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
    details.sub > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; font-weight: 600; }
    details.sub > summary::-webkit-details-marker { display: none; }
    details.sub > summary:hover { color: var(--gold); }
    details.sub > .corpo { padding: 0 0 0.6rem; }
    details.sub details.sub { margin-left: 1rem; }

    /* colori delle tendine del gioco: solo come significato */
    .tendine { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0; }
    .tendine span { padding: 0.2rem 0.7rem; border-left: 3px solid var(--line); background: var(--tip-bg); font-size: 0.95rem; }
    .t-azz { border-left-color: var(--accent) !important; }
    .t-ok { border-left-color: var(--ok) !important; color: var(--ok); }
    .t-ko { border-left-color: var(--ko) !important; color: var(--ko); }

    @media (max-width: 560px) {
      body { padding: 1.5rem 16px 3rem; }
      details.cap > summary { grid-template-columns: 1.7rem 1fr 1rem; column-gap: 0.6rem; }
      details.cap > .testo { padding-left: 0; }
      .romano { font-size: 1.7rem; min-width: 2rem; }
      dl.scheda { grid-template-columns: repeat(2, 1fr); gap: 0.5rem 1rem; }
      .scroll td:last-child { min-width: 11rem; }
    }
  </style>
</head>
<body>
  <main>
    <a class="torna" id="torna" href="index.html"></a>
    <header class="fronte">
      <h1 id="titolo"></h1>
      <p class="sotto" id="sotto"></p>
      <div class="azioni"><button type="button" id="apriTutto"></button><button type="button" id="chiudiTutto"></button></div>
    </header>
    <div id="sezioni"></div>
  </main>

  <script>
    /* Regolamento del giocatore: solo meccaniche, niente dinamiche di trama (niente nemici, luoghi o oggetti specifici).
       I numeri vengono da regole.js, gli stessi file del gioco. 20/11: riscritto sul motore nuovo (poteri a volontà / per scontro / giornalieri),
       20/11 (Francesco): niente più regole facoltative, Fame e Peso dei giorni valgono sempre (capitolo «Riposo e giorni»). */
    if (new URLSearchParams(location.search).has("dentro")) document.body.classList.add("dentro");
    const R = window.Regole, EN = Lingua.get() === "en", L = EN ? "en" : "it";
    const N = (cat, k) => Lingua.nome(cat, k);
    const segno = (n) => (n < 0 ? "−" : "+") + Math.abs(n);
    const per = (o) => Object.entries(o).map(([k, v]) => `${segno(v)} ${N("attributi", k)}`).join(", ");
    const tetti = Object.entries(R.TETTO_AGILITA).map(([a, t]) => `${N("oggetti", a)} ${t ? "+" + t : (EN ? "none" : "nessuno")}`).join(" · ");
    const soglie = R.SOGLIE_PE.slice(1).map((s, i) => `<tr><td>${i + 2}</td><td>${s - R.SOGLIE_PE[i]}</td><td>${s}</td></tr>`).join("");
    const armatureClasse = (c) => (R.ARMATURE_CLASSI[c] || ["Armatura leggera", "Armatura media", "Armatura pesante"]).map(a => N("oggetti", a)).join(", ");
    const SECONDARIA = { Soldato: { it: "scudo (facoltativo)", en: "shield (optional)" }, Forestiero: { it: "focus a due forme", en: "two-form focus" }, Sapiente: { it: "focus a due forme", en: "two-form focus" }, Accolito: { it: "focus a due forme", en: "two-form focus" } };
    const righeClassi = Object.entries(R.CLASSI).map(([c, d]) => `<tr><td>${N("classi", c)}</td><td>d${d.dado}</td><td>${N("attributi", d.attrClasse)}</td><td>${armatureClasse(c)}</td><td>${SECONDARIA[c][L]}</td></tr>`).join("");
    const righeRazze = Object.entries(R.RAZZE).map(([r, d]) => `<tr><td>${N("razze", r)}</td><td>${d.punti ? (EN ? `+${d.punti} free points` : `+${d.punti} punti liberi`) : per(d.bonus)}</td></tr>`).join("");

    /* ---------- capitolo Abilità: descrizioni da regole.js (le stesse della creazione), esempi qui ---------- */
    const ESEMPI_ABILITA = {
      Atletica: { it: ["spostare qualcosa di pesante", "arrampicarsi", "forzare un passaggio"], en: ["moving something heavy", "climbing", "forcing a way through"] },
      Sopravvivenza: { it: ["seguire una traccia", "capire da dove è passato qualcuno", "orientarsi all'aperto"], en: ["following a trail", "working out where someone went", "finding your way outdoors"] },
      "Furtività": { it: ["avvicinarsi senza farsi sentire", "nascondersi", "agire senza lasciare segni"], en: ["creeping up unheard", "hiding", "acting without leaving a trace"] },
      Acrobazia: { it: ["mantenere l'equilibrio", "saltare un ostacolo", "divincolarsi"], en: ["keeping your balance", "leaping an obstacle", "wriggling free"] },
      Indagare: { it: ["frugare in un mobile", "spostare un oggetto per vedere cosa nasconde", "capire come si apre un meccanismo"], en: ["searching a piece of furniture", "moving something to see what it hides", "working out how a mechanism opens"] },
      Percezione: { it: ["ascoltare dietro una porta", "notare un dettaglio fuori posto", "accorgersi di un pericolo"], en: ["listening at a door", "spotting something out of place", "sensing danger"] },
      Sapienza: { it: ["riconoscere un simbolo o un rituale", "capire un fenomeno magico", "valutare una ferita o un rimedio"], en: ["recognising a symbol or a ritual", "understanding a magical effect", "judging a wound or a remedy"] },
      "Socialità": { it: ["convincere qualcuno con le buone", "imporsi con le cattive", "ottenere un favore"], en: ["winning someone over kindly", "imposing yourself harshly", "getting a favour"] },
      Intuizione: { it: ["capire se qualcuno mente", "cogliere ciò che non viene detto", "intuire cosa vuole davvero"], en: ["telling whether someone is lying", "catching what goes unsaid", "sensing what they really want"] }
    };
    const VECCHI_NOMI = { it: [["Investigazione", "Indagare o Percezione: il gioco ti chiede quale"], ["Arcano, Misticismo, Medicina", "Sapienza"], ["Persuasione, Intimidire", "Socialità"]],
                          en: [["Investigation and Perception", "the game asks which one"], ["Arcana, Mysticism, Medicine", "Lore"], ["Persuasion, Intimidation", "Influence"]] }[L];
    const abilitaDi = (attr) => `<ul>${R.ABILITA.filter(x => x[1] === attr).map(([a, , d]) =>
      `<li><b>${N("abilita", a)}</b>: ${d[L]}<br><span class="esempio">${EN ? "When it helps" : "Quando serve"}: ${ESEMPI_ABILITA[a][L].join(", ")}. ${EN ? "To call it" : "Per chiederla"}: «${EN ? "I use " : "uso "}${N("abilita", a).toLowerCase()}».</span></li>`).join("")}</ul>`;
    const elenco = (v) => v.length > 1 ? v.slice(0, -1).join(", ") + (EN ? " and " : " e ") + v[v.length - 1] : v.join("");
    const titoloAttr = (attr) => `${N("attributi", attr)}: ${elenco(R.ABILITA.filter(x => x[1] === attr).map(x => N("abilita", x[0])))}`;
    const malusAbilita = Object.entries(R.MALUS_AGILITA).map(([o, m]) => `<tr><td>${N("oggetti", o)}</td><td>${m ? "−" + m : (EN ? "none" : "nessuno")}</td></tr>`).join("");
    const sezioneAbilita = () => EN ? `
            <p>Skills are what your character is good at outside combat: they come into play in every check. There are nine: two for each attribute, three for Mind.</p>
            <h3>How they work</h3>
            <span class="formula">Skill value = attribute modifier (+ your level, if you chose the skill)</span>
            <p>At creation you choose ${R.MAX_ABILITA}: those are your strengths, and they grow by 1 at every level. You can still attempt every other skill, with the attribute modifier alone.</p>
            <p class="esempio">Example: Mind 14 (+2), level 2. Perception, chosen: +2 + 2 = +4. Lore, not chosen: +2.</p>
            <p>Heavy armor and the shield weigh you down: Agility skills (${N("abilita", "Furtività")} and ${N("abilita", "Acrobazia")}) take a penalty. The shield only counts while it is strapped on; a focus in shield form gives no penalty. The character sheet already shows the value with the penalty included.</p>
            <div class="scroll"><table><tr><th>Gear</th><th>Agility skill penalty</th></tr>${malusAbilita}</table></div>
            <h3>${titoloAttr("Vigore")}</h3>${abilitaDi("Vigore")}
            <h3>${titoloAttr("Agilità")}</h3>${abilitaDi("Agilità")}
            <h3>${titoloAttr("Mente")}</h3>${abilitaDi("Mente")}
            <h3>${titoloAttr("Spirito")}</h3>${abilitaDi("Spirito")}
            <h3>Which skill to use</h3>
            <ul>
              <li>Most of the time you don't need to name a skill: write what you do and the game picks the right check.</li>
              <li><b>Investigation or Perception?</b> Investigation is searching with your hands (rummaging, moving, touching); Perception is using your senses (sight, hearing, smell). If you write “I investigate” without saying how, the game asks which.</li>
              <li><b>Influence</b>: first you choose the approach, kind or harsh, then you roll. The approach decides how the other person reacts; the roll decides whether you succeed.</li>
              <li><b>Insight</b> and Influence work together: one reads the other person, the other acts on them.</li>
            </ul>
            <p>The game still recognises the old skill names:</p>
            <div class="scroll"><table><tr><th>If you write</th><th>It counts as</th></tr>${VECCHI_NOMI.map(([v, n]) => `<tr><td>${v}</td><td>${n}</td></tr>`).join("")}</table></div>` : `
            <p>Le abilità sono ciò in cui il tuo personaggio è bravo fuori dal combattimento: entrano in gioco in ogni prova. Sono nove: due per attributo, tre per la Mente.</p>
            <h3>Come funzionano</h3>
            <span class="formula">Valore dell'abilità = modificatore dell'attributo (+ il tuo livello, se l'hai scelta)</span>
            <p>In creazione ne scegli ${R.MAX_ABILITA}: sono i tuoi punti di forza, e a ogni livello crescono di 1. Tutte le altre puoi tentarle comunque, con il solo modificatore dell'attributo.</p>
            <p class="esempio">Esempio: Mente 14 (+2), livello 2. Percezione, scelta: +2 + 2 = +4. Sapienza, non scelta: +2.</p>
            <p>L'armatura pesante e lo scudo appesantiscono: le abilità di Agilità (Furtività e Acrobazia) subiscono un malus. Lo scudo conta solo se è imbracciato; il focus in forma scudo non dà malus. La scheda del personaggio mostra già il valore con il malus compreso.</p>
            <div class="scroll"><table><tr><th>Equipaggiamento</th><th>Malus alle abilità di Agilità</th></tr>${malusAbilita}</table></div>
            <h3>${titoloAttr("Vigore")}</h3>${abilitaDi("Vigore")}
            <h3>${titoloAttr("Agilità")}</h3>${abilitaDi("Agilità")}
            <h3>${titoloAttr("Mente")}</h3>${abilitaDi("Mente")}
            <h3>${titoloAttr("Spirito")}</h3>${abilitaDi("Spirito")}
            <h3>Quale abilità usare</h3>
            <ul>
              <li>Quasi sempre non serve nominare l'abilità: scrivi cosa fai e il gioco sceglie la prova giusta.</li>
              <li><b>Indagare o Percezione?</b> Indagare è cercare con le mani (frugare, spostare, toccare); Percezione è usare i sensi (vista, udito, olfatto). Se scrivi «investigo» senza dire come, il gioco ti chiede quale delle due.</li>
              <li><b>Socialità</b>: prima scegli l'approccio, gentile o duro, poi tiri. L'approccio decide come reagisce l'altro, il tiro se ci riesci.</li>
              <li><b>Intuizione</b> e Socialità lavorano insieme: una legge l'altro, l'altra agisce su di lui.</li>
            </ul>
            <p>Il gioco riconosce ancora i vecchi nomi delle abilità:</p>
            <div class="scroll"><table><tr><th>Se scrivi</th><th>Vale come</th></tr>${VECCHI_NOMI.map(([v, n]) => `<tr><td>${v}</td><td>${n}</td></tr>`).join("")}</table></div>`;

    const sommario = (titolo) => `<summary><span class="tt">${titolo}</span><span class="apri" aria-hidden="true"></span></summary>`;

    const T = {
      it: {
        torna: "← Pagina iniziale", titolo: "Regolamento", sotto: "Le regole del gioco, da consultare quando vuoi.",
        parte: "Parte", capitolo: "Capitolo", apri: "Apri tutto", chiudi: "Comprimi",
        desc: ["Come dare ordini al personaggio e leggere le risposte del gioco.", "Il tiro del d20, la difficoltà e cosa costa fallire.", "Le nove abilità, come si calcolano e quando servono.", "Il fuoco, il sonno e il conto dei giorni.", "Cosa succede a zero salute e cosa logora la mente.", "Tre posti, condivisi tra computer e telefono.",
          "Le quattro caratteristiche e quella con cui combatti.", "Bonus di razza, dado vita e salute al primo livello.", "Armi, focus, scudo, armature, dotazione e rarità.", "Esperienza, soglie e cosa guadagni a ogni livello.",
          "Chi agisce per primo, l'azione e l'azione rapida.", "Tiro per colpire, danno, critico e colpi multipli.", "Gli effetti che durano qualche turno, i tiri salvezza e gli elisir.", "Vulnerabilità, annunci e fasi degli avversari più temibili.", "Fuori dalle stanze: le cacce di Aldo, gli agguati, il fermaglio.", "Un combattimento turno per turno.",
          "Poteri, privilegi e vie di prestigio: le regole uguali per tutti.", "Vigore, armi e scudo.", "Agilità, veleno e corteccia.", "Mente, forza e illusioni.", "Spirito, sangue e ossa."],
        parti: [["Come si gioca", [0, 1, 2, 3, 4, 5]], ["Il personaggio", [6, 7, 8, 9]], ["Combattimento", [10, 11, 12, 13, 14, 15]], ["Le classi", [16, 17, 18, 19, 20]]],
        sezioni: [
          /* 0 */ ["Scrivere le azioni ed esplorare", `
            <p>Il gioco si controlla scrivendo ciò che fa il tuo personaggio, con parole tue. Non servono formule precise: il gioco riconosce i verbi più comuni.</p>
            <ul>
              <li><b>Muoversi</b>: «vado in cucina», «scendo in cantina», «torno indietro». Si va solo nelle stanze vicine: se la stanza è lontana, il gioco ti dice da dove passare. All'aperto ci si muove anche per punti cardinali («vado a nord»).</li>
              <li><b>Guardare</b>: «guardo il camino», «esamino la stanza», «ascolto». Guardare e ascoltare non costano mai nulla.</li>
              <li><b>Agire</b>: «prendo la spada», «apro la porta», «parlo con…».</li>
              <li><b>Oggetti</b>: «bevo la pozione di cura», «impugno la torcia», «indosso l'armatura». Lo zaino e la scheda mostrano ciò che porti e come usarlo.</li>
            </ul>
            <p class="esempio">Esempio: in una stanza nuova scrivi «guardo il tavolo». Se c'è qualcosa da scoprire, il gioco ti propone una prova.</p>
            <p>Quando il gioco ti offre dei pulsanti (una scelta, un tiro, «lascia perdere») usali al posto del testo. Le missioni accettate compaiono nella scheda, con obiettivi e consigli.</p>
            <h3>Il colore delle tendine</h3>
            <p>Ogni tua azione compare in una tendina colorata, che ti dice subito com'è andata:</p>
            <div class="tendine"><span class="t-azz">azzurra: nessuna prova</span><span class="t-ok">verde: prova superata</span><span class="t-ko">rossa: prova fallita</span></div>
            <p>I dialoghi hanno un colore proprio. Nei dialoghi conta l'approccio che scegli, gentile o duro: ogni interlocutore reagisce a modo suo. Parlare, anche durante uno scontro, non costa l'azione.</p>`],
          /* 1 */ ["Prove di abilità", `
            <p>Quando l'esito di un'azione è incerto, il gioco ti propone una prova e ti mostra difficoltà, dado e modificatore. Puoi sempre rinunciare.</p>
            <span class="formula">d20 + valore dell'abilità ≥ difficoltà (CD) → prova superata</span>
            <p class="esempio">Esempio: Furtività +3 contro CD 13. Tiri 11: 11 + 3 = 14, che è almeno 13, quindi la prova è superata. Con un 9 avresti fatto 12 e la prova sarebbe fallita.</p>
            <h3>Le regole delle prove</h3>
            <ul>
              <li><b>Osservare è gratis, forzare costa.</b> Guardare, ascoltare ed esaminare non costano nulla. Una prova serve quando vuoi <i>forzare</i> i sensi o le mani: cercare a fondo, origliare attraverso un muro, scassinare.</li>
              <li><b>Ogni prova fallita costa ${R.COSTO_PROVA_FALLITA} punto di salute mentale</b>, salvo le prove che il gioco segnala come innocue. Il gioco te lo dice prima del tiro.</li>
              <li><b>Una prova fallita non si ripete fino al riposo.</b> Le prove superate restano superate. Fanno eccezione le prove indicate come ripetibili.</li>
              <li><b>Le CD crescono con te</b>: +${R.CD_PER_LIVELLO} per ogni livello sopra il primo. Crescere ti rende più forte, ma la casa diventa più esigente.</li>
              <li><b>20 naturale</b>: alcune prove lo richiedono. Conta solo il numero uscito sul dado.</li>
              <li><b>Dotazione</b>: se porti l'oggetto adatto (la corda su una trave, la lente per cercare), la prova ha <b>+2</b>. Capitolo «Equipaggiamento».</li>
            </ul>
            <h3>Chiedere una prova</h3>
            <p>Di solito basta scrivere cosa fai. Puoi anche nominare l'abilità: «faccio una prova di percezione», «uso furtività», «cerco tracce». Se in quel luogo l'abilità non serve, il gioco risponde con una breve descrizione e nessun tiro.</p>
            <h3>Enigmi</h3>
            <p>Alcuni luoghi nascondono un enigma. Di solito una prova ti dà un indizio, poi la soluzione la scegli tu. Una scelta sbagliata costa ${R.COSTO_PROVA_FALLITA} punto di salute mentale, come una prova fallita (il gesso della dotazione ti risparmia il primo errore). Se non ottieni l'indizio, qualcuno nella casa potrebbe dartelo.</p>`],
          /* 2 */ ["Abilità", sezioneAbilita()],
          /* 3 */ ["Riposo e giorni", `
            <p>Si riposa solo accanto a un fuoco caldo, dalle fiamme arancioni, in un luogo di cui ti fidi. Alcuni fuochi si consumano dopo un riposo; il focolare della cucina non si spegne mai.</p>
            <h3>Cosa succede quando riposi</h3>
            <ul>
              <li>recuperi <b>2 punti di salute mentale</b> (3 con La lanterna, la via di Guendalina);</li>
              <li>il corpo <b>non</b> guarisce: per la salute fisica servono cibo o pozioni (vedi «Il corpo» qui sotto);</li>
              <li>i poteri giornalieri tornano disponibili;</li>
              <li>il riposo scaccia gli stati alterati;</li>
              <li>le prove fallite tornano disponibili;</li>
              <li>passi al giorno successivo, e Guendalina cucina per la dispensa;</li>
              <li>se hai raggiunto un nuovo livello, lo applichi (capitolo «Livelli ed esperienza»).</li>
            </ul>
            <p>Se sei già in piena forma e non hai nulla da ricaricare, non c'è bisogno di dormire: il gioco non consuma il fuoco.</p>
            <h3>Il corpo</h3>
            <p><b>Dormire cura solo la salute mentale.</b> Per curare la salute fisica hai bisogno di cibo o di pozioni, che troverai in gioco.</p>
            <ul>
              <li>Le <b>razioni di Adele</b> curano un quarto della salute fisica massima ciascuna. Le mangi quando vuoi, fuori dallo scontro: dallo zaino («Mangia») o scrivendo «mangio una razione». Il riposo non le consuma.</li>
              <li>Guendalina ne cucina ${R.RAZIONI_AL_GIORNO} al giorno; la dispensa ne tiene al massimo ${R.RAZIONI_MAX}. Il contatore è sempre nella scheda.</li>
              <li>Con la via di Guendalina, Mani che curano vale anche per le razioni.</li>
            </ul>
            <h3>La mente</h3>
            <p>La salute mentale si recupera solo così: con il riposo, alla fontana del giardino, con le lacrime e con gli elisir. Proteggila.</p>
            <h3>I giorni</h3>
            <p>Il gioco tiene il conto dei giorni passati nella casa: lo trovi in cima alla scheda. Il conto conta per il finale.</p>
            <p><b>Il peso dei giorni</b>: ogni 10 giorni passati nella casa perdi 1 punto di salute mentale <b>massima</b>, e il riposo te lo segnala. La fontana del giardino e alcuni reperti importanti della casa ne restituiscono 1, solo tra quelli persi così.</p>
            <h3>Pozioni</h3>
            <p>La pozione di cura recupera 1d6 + livello di salute fisica. Berla, in combattimento, è un'azione rapida. Gli elisir sono nel capitolo «Stati, tiri salvezza ed elisir».</p>`],
          /* 4 */ ["Morte e salute mentale", `
            <p>Hai due salute: quella <b>fisica</b>, che perdi in combattimento, e quella <b>mentale</b>, che la casa consuma. Se la salute mentale arriva a 0, la partita finisce.</p>
            <h3>Quando si muore</h3>
            <ul>
              <li><b>Contro i guardiani non si muore</b>: a 0 salute fisica la casa ti riporta indietro, e la sconfitta pesa sulla mente.</li>
              <li><b>Contro il sovrano si muore.</b> Prima dell'ultima porta il gioco ti mostra cosa porti e salva la partita.</li>
              <li><b>Contro animali, vuoti, prede delle cacce e mastini si muore</b>: a 0 salute fisica diventi parte di Casa Vespera. Gli stati alterati, durante lo scontro, possono ucciderti.</li>
            </ul>
            <h3>Cosa consuma la mente</h3>
            <ul>
              <li>prove fallite e scelte sbagliate negli enigmi (1 punto);</li>
              <li>le sconfitte contro gli avversari più temibili: ognuna toglie 1 punto alla salute mentale <b>massima</b>, fino a 3 in tutto; il punto torna quando quell'avversario viene sconfitto o risparmiato;</li>
              <li>certe scoperte sulla casa (da 1 a 4 punti, solo la prima volta): da sole non ti portano mai a 0;</li>
              <li>alcuni luoghi e il peso dei giorni.</li>
            </ul>
            <h3>Modalità</h3>
            <p>Si sceglie in creazione. In <b>facile</b> dopo la morte riparti dall'ultimo salvataggio (contro il sovrano, dalla soglia della sala del trono) e salvi quando vuoi; in <b>difficile</b> la morte è permanente e niente si salva da solo: hai <b>un solo salvataggio in tutta la partita</b> e decidi tu quando usarlo, quindi sii furbo. Puoi passare da difficile a facile, mai il contrario.</p>`],
          /* 5 */ ["Salvataggi", `
            <p>Puoi tenere fino a tre personaggi. Salva con il pulsante in alto nella pagina di gioco (in modalità difficile, una sola volta in tutta la partita).</p>
            <p>Accedendo con Google dalla pagina iniziale, i salvataggi sono condivisi tra computer e telefono.</p>`],
          /* 6 */ ["Attributi e caratteristica di classe", `
            <p>Ogni attributo parte da ${R.VALORE_MINIMO}; in creazione distribuisci ${R.PUNTI_BASE} punti. Nessun attributo può superare ${R.VALORE_MASSIMO}, bonus della razza compreso.</p>
            <span class="formula">Modificatore = (valore − 10) ÷ 2, arrotondato per difetto</span>
            <p class="esempio">Esempio: 12 → +1, 14 → +2, 17 → +3.</p>
            <div class="scroll"><table><tr><th>Attributo</th><th>A cosa serve</th><th>Classe</th></tr>
              <tr><td><b>Vigore</b></td><td>salute fisica, Atletica e Sopravvivenza</td><td>Guerriero</td></tr>
              <tr><td><b>Agilità</b></td><td>difesa (Classe armatura), iniziativa, Furtività e Acrobazia</td><td>Sciamano</td></tr>
              <tr><td><b>Mente</b></td><td>sensi e logica: Indagare, Percezione e Sapienza</td><td>Arcanista</td></tr>
              <tr><td><b>Spirito</b></td><td>salute mentale e volontà: Socialità e Intuizione</td><td>Monaco</td></tr>
            </table></div>
            <h3>Caratteristica di classe</h3>
            <p>Ogni classe combatte con un attributo, indicato nell'ultima colonna. Lo usa per il tiro per colpire e il danno di <b>tutti</b> i suoi attacchi e poteri (una volta per attacco), e per la difficoltà degli stati che infligge.</p>
            <ul>
              <li><b>Guerriero, Vigore</b>: temprato da mille battaglie, mette tutta la sua forza in ogni colpo.</li>
              <li><b>Sciamano, Agilità</b>: una vita da eremita gli ha insegnato che a volte è meglio essere agili e scaltri che forti.</li>
              <li><b>Arcanista, Mente</b>: studia l'avversario e colpisce i punti vulnerabili.</li>
              <li><b>Monaco, Spirito</b>: la sua fede lo guida e rende più potenti i suoi colpi.</li>
            </ul>`],
          /* 7 */ ["Razze, classi e salute", `
            <h3>Razze</h3><div class="scroll"><table><tr><th>Razza</th><th>Bonus</th></tr>${righeRazze}</table></div>
            <h3>Classi</h3><div class="scroll"><table><tr><th>Classe</th><th>Dado vita</th><th>Caratteristica</th><th>Armature</th><th>Mano secondaria</th></tr>${righeClassi}</table></div>
            <p>Ogni classe ha il suo capitolo nella parte «Le classi».</p>
            <h3>Salute al livello 1</h3>
            <span class="formula">Salute fisica = ${R.SALUTE_BASE} + massimo del dado vita + mod. Vigore</span>
            <span class="formula">Salute mentale = ${R.SALUTE_BASE} + massimo del dado vita + mod. Spirito</span>
            <p>Il dado non si tira: al livello 1 vale il massimo. Come cresce con i livelli è nel capitolo «Livelli ed esperienza».</p>`],
          /* 8 */ ["Equipaggiamento", `
            <h3>Armi</h3>
            <p>Le armi comuni sono sei, due per tipo di danno: una a una mano (1d6) e una a due mani (1d8).</p>
            <div class="scroll"><table><tr><th>Tipo</th><th>Una mano (1d6)</th><th>Due mani (1d8)</th><th>Stato dei poteri</th></tr>
              <tr><td>Taglio</td><td>Spada</td><td>Spadone</td><td>Sanguinante</td></tr>
              <tr><td>Contundente</td><td>Mazza ferrata</td><td>Maglio</td><td>Stordito</td></tr>
              <tr><td>Perforante</td><td>Pugnale</td><td>Tridente</td><td>Esposto (critico con 19-20)</td></tr>
            </table></div>
            <p>Porti al massimo <b>due armi</b>; cambiarle in combattimento costa l'azione rapida. Un'arma a due mani occupa anche la mano secondaria: niente scudo né focus.</p>
            <h3>Focus (Sciamano, Arcanista, Monaco)</h3>
            <p>Gli incantatori tengono nella mano secondaria un <b>focus</b>: un solo oggetto, in due forme da scegliere in creazione. Per questo usano solo armi a una mano.</p>
            <div class="scroll"><table><tr><th>Classe</th><th>Forma normale (1d8)</th><th>Forma scudo (1d6, +1 CA)</th></tr>
              <tr><td>Sciamano</td><td>Asse del mondo</td><td>Scudo Feticcio</td></tr>
              <tr><td>Arcanista</td><td>Libro arcano</td><td>Brocchiere Runico</td></tr>
              <tr><td>Monaco</td><td>Filatterio</td><td>Aegis Divina</td></tr>
            </table></div>
            <p>Il dado del focus è quello dei tuoi poteri offensivi che tirano «il dado dell'arma». La forma scudo ha un dado in meno ma dà +1 alla Classe armatura, senza malus di Agilità. Il bonus dell'oggetto (+1, +2, +3) è lo stesso nelle due forme.</p>
            <h3>Scudo (Guerriero)</h3>
            <p>Lo scudo dà +1 alla Classe armatura, −1 alle abilità di Agilità, e potenzia alcuni poteri difensivi. Occupa la mano secondaria e conta solo se è imbracciato.</p>
            <h3>Armature</h3>
            <span class="formula">CA = ${R.CA_BASE} + armatura + mod. Agilità (fino al tetto dell'armatura) + scudo o focus scudo</span>
            <p>Armatura leggera +${R.ARMATURA_CA["Armatura leggera"]}, media +${R.ARMATURA_CA["Armatura media"]}, pesante +${R.ARMATURA_CA["Armatura pesante"]}. Tetto del bonus di Agilità: ${tetti}. La leggera premia chi è agile, la media è il giusto mezzo, la pesante protegge di più chi non lo è ma dà −1 alle abilità di Agilità. Le armature che una classe non può indossare non le compaiono in creazione.</p>
            <h3>Rarità</h3>
            <div class="scroll"><table><tr><th>Rarità</th><th>Bonus</th><th>Poteri</th></tr>
              <tr><td>Comune</td><td>+0</td><td>nessuno</td></tr>
              <tr><td>Non comune</td><td>+1</td><td>nessuno</td></tr>
              <tr><td>Raro</td><td>+2</td><td>un potere per scontro</td></tr>
              <tr><td>Leggendario</td><td>+3</td><td>un potere giornaliero</td></tr>
            </table></div>
            <p>Il bonus va a colpire e ai danni per armi e focus, alla Classe armatura per armature e scudi; elmo, guanti, stivali, mantello e accessori danno il bonus a un'abilità o a un tiro salvezza. I poteri degli oggetti si usano con l'azione rapida. Ogni classe usa solo ciò che il suo elenco permette: il resto si baratta con Aldo, alla pari, con un oggetto della stessa rarità.</p>
            <h3>Dotazione</h3>
            <p>Tutti partono con la stessa dotazione, pensata per le prove dei luoghi e mai per il combattimento. L'oggetto adatto dà <b>+2</b> alla prova.</p>
            <ul>
              <li><b>Sempre con te</b>: piede di porco (Atletica dove si fa leva), corda (Acrobazia e Atletica su travi e dislivelli), lente (Indagare e Percezione per cercare ciò che è nascosto).</li>
              <li><b>Si consumano</b>: pozione di cura (1), torcia (2 usi), gesso (3: il primo errore in un enigma a scelta non costa punti mentali), quaderno e carboncino (2 fogli: un tentativo in più a una prova di Sapienza).</li>
            </ul>`],
          /* 9 */ ["Livelli ed esperienza", `
            <p>Guadagni punti esperienza sconfiggendo i nemici e completando missioni. Il livello massimo, per ora, è ${R.LIVELLO_MAX}.</p>
            <div class="scroll"><table><tr><th>Livello</th><th>PE necessari</th><th>PE totali</th></tr>${soglie}</table></div>
            <p><b>Il livello si raggiunge con i punti esperienza, ma si applica al primo riposo utile</b>: finché non riposi, salute, poteri e difficoltà restano quelli del livello precedente. Se nel frattempo raggiungi più livelli, al riposo li applichi tutti, uno dopo l'altro.</p>
            <h3>Cosa guadagni a ogni livello</h3>
            <ul>
              <li><b>${R.PUNTI_PER_LIVELLO} punti attributo</b> da distribuire liberamente, anche entrambi sullo stesso (massimo ${R.VALORE_MASSIMO});</li>
              <li>salute fisica + metà del dado vita + 1 + mod. Vigore (Guerriero 6, Sciamano e Monaco 5, Arcanista 4, più il modificatore);</li>
              <li>salute mentale + metà del dado vita + 1 + mod. Spirito;</li>
              <li>le abilità scelte crescono di 1;</li>
              <li>i nuovi poteri, i privilegi e la via di prestigio (capitolo «Regole comuni alle classi»).</li>
            </ul>
            <p>Ogni aumento vale almeno 1. Le difficoltà delle prove salgono di ${R.CD_PER_LIVELLO}.</p>`],
          /* 10 */ ["Il turno di combattimento", `
            <h3>Chi agisce per primo</h3>
            <p>Agisce per primo chi ha più Agilità (a parità, un d20 a testa).</p>
            <p><b>Avvicinarsi furtivi.</b> Alcuni avversari ti aspettano in luoghi precisi. Puoi avvicinarti di soppiatto («scendo furtivo»): tiri d20 + Furtività contro d20 + Percezione dell'avversario.</p>
            <ul>
              <li><b>Resti nascosto</b>: agisci per primo e nel primo turno la sua Classe armatura scende di 2.</li>
              <li><b>Ti scopre</b>: agisce lui per primo e nel primo turno è la tua a scendere di 2.</li>
            </ul>
            <h3>Azione e azione rapida</h3>
            <p>A ogni turno hai <b>un'azione</b> e <b>un'azione rapida</b>.</p>
            <ul>
              <li><b>Azione</b>: un attacco con l'arma, un potere, oppure difenderti. Alcuni poteri dicono «costa l'azione».</li>
              <li><b>Azione rapida</b>: bere una pozione o un elisir, cambiare o equipaggiare un oggetto (arma, scudo, focus), usare il potere di un oggetto. Una per turno.</li>
              <li><b>Parlare</b> non costa nulla.</li>
            </ul>
            <p><b>Niente reazioni.</b> Tutto si dichiara nel tuo turno: le difese valgono «fino al tuo prossimo turno»; certi poteri restano «carichi» e scattano da soli al primo momento utile.</p>
            <h3>I poteri</h3>
            <ul>
              <li><b>A volontà</b>: si usano ogni turno.</li>
              <li><b>Per scontro</b>: una volta per scontro; tornano a fine scontro.</li>
              <li><b>Giornalieri</b>: una volta; tornano al riposo.</li>
            </ul>
            <p>Un potere per scontro o giornaliero si consuma quando lo dichiari, anche se l'attacco manca.</p>
            <h3>Fuga</h3>
            <p>Scrivi «fuggo»: prova di Atletica o Acrobazia contro CD 10 + livello del nemico. Riesci e torni nella stanza da cui sei arrivato; fallisci e il nemico ti colpisce. Non si fugge dai guardiani né dal sovrano.</p>`],
          /* 11 */ ["Colpire e ferire", `
            <span class="formula">Attacco: d20 + mod. della caratteristica di classe + bonus dell'arma, colpisce se supera la Classe armatura</span>
            <span class="formula">Danno: dado dell'arma (o del focus) + mod. della caratteristica di classe + bonus dell'arma</span>
            <ul>
              <li><b>La caratteristica si somma una volta per attacco</b>, mai per dado. Un potere «con un dado di danno in più» aggiunge solo il dado.</li>
              <li><b>Critico</b>: un 20 sul dado colpisce sempre e tira il doppio dei dadi di danno. Le armi perforanti fanno critico con 19-20. Vale anche per i nemici.</li>
              <li><b>Più attacchi</b> («due attacchi»): un d20 per ogni attacco; ognuno può mancare per conto suo.</li>
              <li><b>Colpo gratuito</b>: va a segno da solo, solo con il dado dell'arma, senza bonus né critico, e parte solo se il colpo principale colpisce.</li>
              <li>Un potere <b>senza tiro per colpire</b> non può mancare.</li>
            </ul>
            <h3>L'arma colora i poteri</h3>
            <p>L'attacco base con l'arma non applica stati: li applicano solo i poteri. Per il Guerriero, e per l'attacco base di tutti, è l'arma in mano a decidere il tipo di danno e lo stato. Gli incantatori, Sciamano compreso, mantengono il tipo di danno dei loro poteri (veleno, forza, psichico, sangue, ossa; il Legno il contundente): dall'arma prendono solo dado e bonus.</p>
            <h3>Vacillante</h3>
            <p>Sotto metà della salute si è <b>Vacillanti</b>. Non fa danni da sé, ma attiva molti poteri e i cambi di fase degli avversari.</p>`],
          /* 12 */ ["Stati, tiri salvezza ed elisir", `
            <p>Gli stati durano <b>3 turni</b> (Impaurito 2) e valgono per te come per i nemici. Ognuno ha una forma lieve e una grave.</p>
            <div class="scroll"><table class="stati"><tr><th>Lieve</th><th>Effetto</th><th>Grave</th><th>Effetto</th></tr>
              <tr><td>Sanguinante</td><td>1d4 a ogni turno</td><td>Emorragia</td><td>1d6 a ogni turno</td></tr>
              <tr><td>Scottato</td><td>1d4 di fuoco a ogni turno</td><td>Ustionato</td><td>1d6 a ogni turno</td></tr>
              <tr><td>Intossicato</td><td>1d4 di veleno a ogni turno</td><td>Avvelenato</td><td>1d6 a ogni turno</td></tr>
              <tr><td>Stordito</td><td>perde l'intero turno; poi immune per 2 turni</td><td>Commosso</td><td>Indebolito per 3 turni</td></tr>
              <tr><td>Esposto</td><td>−2 alla Classe armatura</td><td>Scoperto</td><td>−4 alla Classe armatura, critico con 19-20</td></tr>
              <tr><td>Indebolito</td><td>−2 per colpire</td><td>—</td><td></td></tr>
              <tr><td>Impaurito</td><td>solo poteri a volontà (2 turni)</td><td>—</td><td></td></tr>
            </table></div>
            <h3>Applica e aggrava</h3>
            <ul>
              <li><b>Applica</b> mette lo stato lieve (se c'è già, rinnova la durata). <b>Aggrava</b> porta il lieve al grave: serve che il lieve ci sia già, altrimenti lo mette soltanto.</li>
              <li>I poteri a volontà applicano; i per scontro applicano e aggravano; i giornalieri aggravano.</li>
              <li>Stati diversi si sommano; lo stesso stato non si somma, rinnova la durata. Tutti finiscono con lo scontro.</li>
              <li>Sugli avversari più temibili lo Stordito diventa Indebolito.</li>
            </ul>
            <h3>Tiri salvezza</h3>
            <p>Quando uno stato viene applicato, chi lo subisce tira un tiro salvezza; se lo supera, lo stato non entra. Aggravare è automatico. La regola vale uguale per te e per i nemici.</p>
            <span class="formula">Tiro salvezza: d20 + mod. della caratteristica ≥ CD → resiste</span>
            <span class="formula">CD = 8 + mod. della caratteristica di classe + livello di chi infligge lo stato</span>
            <div class="scroll"><table><tr><th>Caratteristica</th><th>Resiste a</th></tr>
              <tr><td>Vigore</td><td>Sanguinante, Intossicato, Stordito, Indebolito</td></tr>
              <tr><td>Agilità</td><td>Scottato, Esposto, Scoperto</td></tr>
              <tr><td>Spirito</td><td>Impaurito e gli stati che logorano la volontà</td></tr>
              <tr><td>Mente</td><td>gli stati che spengono i poteri</td></tr>
            </table></div>
            <h3>Elisir</h3>
            <p>Gli elisir di stato si bevono con l'azione rapida. Il <b>comune</b> cura lo stato lieve della sua famiglia; il <b>raro</b> cura anche il grave e rende immuni per 3 turni. Ne porti al massimo 2 per famiglia.</p>`],
          /* 13 */ ["Avversari", `
            <h3>Vulnerabilità e resistenze</h3>
            <div class="scroll"><table><tr><th>Simbolo</th><th>Effetto</th></tr>
              <tr><td>✓ vulnerabile (verde)</td><td>+50% del danno</td></tr>
              <tr><td>✗ resistente (arancione)</td><td>−50% del danno</td></tr>
              <tr><td>⛔ immune (rosso)</td><td>nessun danno</td></tr>
              <tr><td>· neutro (bianco)</td><td>danno pieno</td></tr>
            </table></div>
            <p>Vale anche per i danni a ogni turno dello stesso tipo. Il fuoco sacro, che si trova solo in oggetti e pergamene, ignora le difese contro il fuoco. Fuori dalla casa la natura resiste ma non è mai immune; dentro, la maledizione è piena.</p>
            <p>Ogni guardiano ha punti deboli: scoprirli prima dello scontro, esplorando, parlando con gli abitanti della casa e leggendo ciò che altri hanno lasciato, fa una grande differenza.</p>
            <h3>Poteri dei nemici</h3>
            <p>I nemici usano la tua stessa logica: poteri a volontà, per scontro e giornalieri, che applicano e aggravano gli stati.</p>
            <h3>Guardiani e sovrano</h3>
            <ul>
              <li><b>Annuncio</b>: i loro colpi più forti si annunciano nel registro un turno prima, con un'icona (spada che vibra). Hai un turno per difenderti o per spezzare la carica.</li>
              <li><b>Fasi</b>: cambiano modo di combattere a soglie di salute; da una fase escono solo dopo averne giocato la sequenza, e il colpo annunciato arriva comunque.</li>
              <li>I loro giornalieri non si scelgono: sono momenti dello scontro.</li>
              <li>Alcuni hanno stati propri, che il registro spiega quando li usano.</li>
            </ul>`],
          /* 14 */ ["Cacce, agguati e fermaglio", `
            <h3>Agguati</h3>
            <p>Fuori dalla casa può tenderti un agguato un <b>vuoto</b>: un avventuriero che la casa ha consumato prima di te. I vuoti non si arrendono e lasciano sempre un diario.</p>
            <ul>
              <li>Ti accorgi dell'agguato con una prova contrapposta: la tua Percezione o Intuizione (dipende da come agisce il vuoto) contro la sua Furtività.</li>
              <li><b>Te ne accorgi</b>: lo scontro comincia alla pari.</li>
              <li><b>Ti sorprende</b>: agisce per primo e nel primo turno la tua Classe armatura scende di 2.</li>
            </ul>
            <h3>Cacce comuni</h3>
            <p>Dopo ogni fermaglio Aldo affigge in sala della caccia due cacce, una sola alla volta, da una a tre stelle d'oro. La preda vinta non lascia la sua arma: il premio è un regalo di Aldo.</p>
            <ul>
              <li><b>Una e due stelle</b>: Aldo ti dice a cosa la preda è vulnerabile e cosa resiste (lo ritrovi in Missioni).</li>
              <li><b>Tre stelle</b>: nessuno ne sa nulla. Prima di attaccare puoi <b>osservarla</b> (Percezione), <b>ricordare</b> cosa sia (Sapienza) e <b>avvicinarti</b> di nascosto (Furtività contro la sua Percezione). Ogni azione si fa una volta sola.</li>
            </ul>
            <span class="formula">Osservare e ricordare: d20 + abilità contro CD 12 (+ la crescita col livello): CD → una voce, CD + 5 → due, CD + 10 → tre</span>
            <h3>Il fermaglio</h3>
            <p>Il fermaglio dei guardiani occupa un posto nell'equipaggiamento. Fuori dal combattimento puoi nasconderlo o appuntarlo («nascondo il fermaglio», «appunto il fermaglio»).</p>
            <ul>
              <li><b>Appuntato</b>: il tuo grado si legge sotto il ritratto e i mastini riconoscono su di te l'odore del maggiordomo, ma fuori casa sei una preda di valore e gli agguati sono più frequenti.</li>
              <li><b>Nascosto</b>: il contrario.</li>
            </ul>`],
          /* 15 */ ["Esempio di combattimento", `
            <h3>Guerriero Berserker con la spada</h3>
            <p class="esempio">Livello 1, Vigore 16 (+3), spada 1d6. Contro un nemico con Classe armatura 12.</p>
            <div class="turno"><b>Turno 1.</b> Colpo di mestiere (a volontà): tiri 12, 12 + 3 = 15, più di 12, colpisci. Solo il dado dell'arma: 4 danni. La spada taglia: il nemico tira il tiro salvezza su Vigore e lo fallisce, è Sanguinante per 3 turni.</div>
            <div class="turno"><b>Turno del nemico.</b> Sanguina e perde 1d4. Ti colpisce: perdi 6 salute.</div>
            <div class="turno"><b>Turno 2.</b> Azione rapida: bevi la pozione di cura. Azione: Colpo crudele (per scontro), un attacco con un dado di danno in più. Tiri 9: 9 + 3 = 12, non supera 12, manchi. Il potere è comunque consumato.</div>
            <div class="turno"><b>Turno 3.</b> Colpo poderoso (a volontà): tiri 20, critico! Il doppio dei dadi, 2d6 + 3, e +2 perché il nemico ha già uno stato.</div>
            <p class="esempio">Gli a volontà preparano, i per scontro e i giornalieri raccolgono: si arriva al colpo grosso con lo stato già addosso al nemico.</p>`],
          /* 16 */ ["Regole comuni alle classi", `
            <p>Ogni classe ha due <b>specializzazioni</b>, una offensiva e una difensiva. La scegli in creazione e non la cambi più: dà tutti i tuoi poteri.</p>
            <h3>Poteri per livello</h3>
            <p>Ogni specializzazione ha 11 poteri: 3 a volontà, 4 per scontro, 4 giornalieri. Ne conoscerai 9: a ogni livello scegli a video, e la scelta è definitiva.</p>
            <div class="scroll"><table><tr><th>Livello</th><th>A volontà</th><th>Per scontro</th><th>Giornalieri</th><th>Cosa arriva</th></tr>
              <tr><td class="n">1</td><td class="n">2 su 3</td><td class="n">1 su 3</td><td class="n">1 su 2</td><td>specializzazione; privilegio di classe I</td></tr>
              <tr><td class="n">2</td><td class="n">3</td><td class="n">1</td><td class="n">1</td><td>il terzo a volontà; la via di prestigio</td></tr>
              <tr><td class="n">3</td><td class="n">3</td><td class="n">2</td><td class="n">2</td><td>privilegio di classe II; nuovi per scontro e giornaliero</td></tr>
              <tr><td class="n">4</td><td class="n">3</td><td class="n">3</td><td class="n">2</td><td>un altro per scontro</td></tr>
              <tr><td class="n">5</td><td class="n">3</td><td class="n">3</td><td class="n">3</td><td>privilegio di classe III; il giornaliero finale</td></tr>
            </table></div>
            <h3>Vie di prestigio</h3>
            <p>Al livello 2 scegli una via, da Aldo o da Guendalina. Dà tre poteri passivi, ai livelli 2, 3 e 4: non occupano posti e non costano l'azione.</p>
            <div class="scroll"><table><tr><th>Livello</th><th>Via di Aldo: la caccia</th><th>Via di Guendalina: il focolare</th></tr>
              <tr><td class="n">2</td><td><b>Occhio del cacciatore</b>: il primo potere che fa danno nello scontro tira il doppio dei dadi; fuori dallo scontro +2 alla Furtività contro i guardiani</td><td><b>La lanterna</b>: immune a Impaurito, +2 a tutti i tiri salvezza, il riposo dà 3 punti mentali</td></tr>
              <tr><td class="n">3</td><td><b>Odore del sangue</b>: contro i Vacillanti i tuoi poteri a volontà fanno un dado di danno in più</td><td><b>Mani che curano</b>: pozioni ed elisir di salute curano il 50% in più</td></tr>
              <tr><td class="n">4</td><td><b>Senza scampo</b>: la prima volta che il nemico diventa Vacillante, un attacco gratuito con un potere a volontà (senza stati)</td><td><b>La soglia di casa</b>: una volta per scontro, il colpo che ti renderebbe Vacillante fa metà danno, e per 2 turni hai +2 CA</td></tr>
            </table></div>`],
          /* 17 */ ["Guerriero", `
            <p>Combatte con il <b>Vigore</b>, il dado vita d10 e tutte le armature; può imbracciare lo scudo. L'arma colora ogni suo potere: la lama logora, il martello stordisce, la punta scopre i punti deboli.</p>
            <h3>Privilegi</h3>
            <ul><li><b>Furia</b> (livello 1): da Vacillante +2 ai danni.</li><li><b>Mente incrollabile</b> (livello 3): una volta al giorno annulli il danno mentale di una prova fallita.</li><li><b>Secondo vento</b> (livello 5, per scontro): costa l'azione, cura un quarto della salute massima.</li></ul>
            <h3>Specializzazioni</h3>
            <ul><li><b>Berserker</b> (offensiva): logora con lo stato dell'arma e finisce i nemici Vacillanti.</li><li><b>Paladino</b> (difensiva): incassa, contrattacca e toglie al nemico i suoi colpi migliori; con lo scudo la sua guardia sale a +4 CA.</li></ul>`],
          /* 18 */ ["Sciamano", `
            <p>Combatte con l'<b>Agilità</b>, il dado vita d8, armature leggere e medie e il focus (Asse del mondo o Scudo Feticcio). I suoi poteri tengono il loro tipo di danno qualunque arma impugni.</p>
            <h3>Privilegi</h3>
            <ul><li><b>Radici profonde</b> (livello 1): se il bersaglio ha uno stato, i tuoi attacchi fanno +1d4.</li><li><b>Legame del sottobosco</b> (livello 3): gli stati che applichi durano 4 turni; un'erba in più quando raccogli.</li><li><b>Infuso</b> (livello 5, giornaliero): al riposo, con le erbe, prepari un elisir di salute (al massimo 2); berlo è un'azione rapida.</li></ul>
            <h3>Specializzazioni</h3>
            <ul><li><b>Funghi</b> (offensiva): il veleno che uccide; il veleno diventa danno.</li><li><b>Legno</b> (difensiva): la corteccia assorbe il danno con scudi di punti salute (uno alla volta; quello che dura più turni recupera 2 punti a ogni tuo turno) e colpisce con il contundente. Niente cure.</li></ul>`],
          /* 19 */ ["Arcanista", `
            <p>Combatte con la <b>Mente</b>, il dado vita d6, solo l'armatura leggera e il focus (Libro arcano o Brocchiere Runico). È la classe più fragile: oggetti, pergamene e pozioni la sostengono.</p>
            <h3>Privilegi</h3>
            <ul><li><b>Ultima scintilla</b> (livello 1): una volta per scontro, quando diventi Vacillante, recuperi un potere per scontro già usato.</li><li><b>Pozzo arcano</b> (livello 3): la prima volta per turno nemico che vieni colpito recuperi 1 salute (2 dal livello 4).</li><li><b>Coagulo</b> (livello 5, per scontro): costa l'azione, cura un quarto della salute massima, +1d6 se il nemico ha uno stato.</li></ul>
            <h3>Specializzazioni</h3>
            <ul><li><b>Realtà</b> (offensiva): danno di forza che applica Esposto; <i>Frattura</i>: i tuoi poteri fanno +2 danni a un bersaglio Esposto o Scoperto.</li><li><b>Illusione</b> (difensiva): danno psichico e <i>Copie</i> (al massimo 3): un colpo su di te colpisce una Copia, subisci metà danno, la Copia svanisce e chi l'ha colpita è Indebolito. Le Copie, alla fine, diventano danno.</li></ul>`],
          /* 20 */ ["Monaco", `
            <p>Combatte con lo <b>Spirito</b>, il dado vita d8, armature leggere e medie e il focus (Filatterio o Aegis Divina).</p>
            <h3>Privilegi</h3>
            <ul><li><b>Eredità del sepolcro</b> (livello 1): dopo un potere giornaliero, fino al tuo turno successivo dimezzi i danni che subisci.</li><li><b>Ultimo servizio</b> (livello 3): una volta al giorno, a 0 salute fisica resti a 1 e ti curi 1d6 + Spirito.</li><li><b>Tocco lenitivo</b> (livello 5, per scontro): costa l'azione, cura un quarto della salute massima e toglie uno stato.</li></ul>
            <h3>Specializzazioni</h3>
            <ul><li><b>Sangue</b> (offensiva): dardi e lance di sangue; <i>Sangue versato</i>: sopra metà della salute, una volta per turno, paghi il 10% della salute massima per un dado di danno in più; da Vacillante il dado è gratis. Niente cure.</li><li><b>Ossa</b> (difensiva): <i>placche d'ossa</i> sull'armatura (al massimo 3): un colpo subito ne spezza una e riduce il danno di 3, +1 per livello oltre il primo; alcuni poteri le spendono come armi.</li></ul>`],
        ]
      },
      en: {
        torna: "← Home page", titolo: "Rulebook", sotto: "The rules of the game, to look up whenever you like.",
        parte: "Part", capitolo: "Chapter", apri: "Expand all", chiudi: "Collapse",
        desc: ["How to give orders to your character and read the game's answers.", "The d20 roll, the difficulty and what failing costs.", "The nine skills, how they are worked out and when they help.", "The fire, sleep and the count of days.", "What happens at zero health and what wears down the mind.", "Three slots, shared between computer and phone.",
          "The four attributes and the one you fight with.", "Race bonuses, hit die and health at first level.", "Weapons, focus, shield, armor, gear and rarity.", "Experience, thresholds and what you gain at each level.",
          "Who acts first, the action and the quick action.", "Attack roll, damage, critical hits and multiple attacks.", "Effects that last a few turns, saving throws and elixirs.", "Vulnerabilities, warnings and phases of the most fearsome foes.", "Beyond the rooms: Aldo's hunts, ambushes, the clasp.", "A fight, turn by turn.",
          "Powers, features and prestige paths: the rules shared by everyone.", "Vigour, weapons and shield.", "Agility, poison and bark.", "Mind, force and illusions.", "Spirit, blood and bone."],
        parti: [["How to play", [0, 1, 2, 3, 4, 5]], ["Your character", [6, 7, 8, 9]], ["Combat", [10, 11, 12, 13, 14, 15]], ["The classes", [16, 17, 18, 19, 20]]],
        sezioni: [
          /* 0 */ ["Writing actions and exploring", `
            <p>You control the game by writing what your character does, in your own words. You don't need exact phrases: the game understands the most common verbs.</p>
            <ul>
              <li><b>Moving</b>: “I go to the kitchen”, “I go down to the cellar”, “I go back”. You can only go to nearby rooms: if a room is far away, the game tells you which way to go. Outdoors you can also move by compass points (“I go north”).</li>
              <li><b>Looking</b>: “I look at the fireplace”, “I examine the room”, “I listen”. Looking and listening never cost anything.</li>
              <li><b>Acting</b>: “I take the sword”, “I open the door”, “I talk to…”.</li>
              <li><b>Items</b>: “I drink the healing potion”, “I hold the torch”, “I put on the armor”. The pack and the sheet show what you carry and how to use it.</li>
            </ul>
            <p class="esempio">Example: in a new room you write “I look at the table”. If there is something to discover, the game offers you a check.</p>
            <p>When the game offers you buttons (a choice, a roll, “never mind”) use them instead of typing. Accepted quests appear on the sheet, with goals and hints.</p>
            <h3>The colour of the panels</h3>
            <p>Each of your actions appears in a coloured panel that tells you at once how it went:</p>
            <div class="tendine"><span class="t-azz">blue: no check</span><span class="t-ok">green: check passed</span><span class="t-ko">red: check failed</span></div>
            <p>Dialogues have a colour of their own. In dialogues the approach you choose matters, kind or harsh: each person reacts in their own way. Talking, even during a fight, does not cost your action.</p>`],
          /* 1 */ ["Skill checks", `
            <p>When the outcome of an action is uncertain, the game offers you a check and shows you the difficulty, the die and the modifier. You can always decline.</p>
            <span class="formula">d20 + skill value ≥ difficulty class (DC) → check passed</span>
            <p class="esempio">Example: Stealth +3 against DC 13. You roll 11: 11 + 3 = 14, which is at least 13, so the check is passed. With a 9 you would have made 12 and failed.</p>
            <h3>The rules of checks</h3>
            <ul>
              <li><b>Observing is free, forcing costs.</b> Looking, listening and examining cost nothing. A check is needed when you want to <i>force</i> your senses or your hands: searching thoroughly, listening through a wall, picking a lock.</li>
              <li><b>Every failed check costs ${R.COSTO_PROVA_FALLITA} point of mental health</b>, except checks the game marks as harmless. The game tells you before the roll.</li>
              <li><b>A failed check cannot be repeated until you rest.</b> Passed checks stay passed. Checks marked as repeatable are the exception.</li>
              <li><b>DCs grow with you</b>: +${R.CD_PER_LIVELLO} for each level above the first. Growing makes you stronger, but the house becomes more demanding.</li>
              <li><b>Natural 20</b>: some checks require it. Only the number on the die counts.</li>
              <li><b>Gear</b>: if you carry the fitting item (the rope on a beam, the glass for searching), the check gets <b>+2</b>. See the chapter “Equipment”.</li>
            </ul>
            <h3>Asking for a check</h3>
            <p>Usually it is enough to write what you do. You can also name the skill: “I make a perception check”, “I use stealth”, “I look for tracks”. If the skill is no use in that place, the game answers with a short description and no roll.</p>
            <h3>Riddles</h3>
            <p>Some places hide a riddle. Usually a check gives you a clue, then you choose the solution. A wrong choice costs ${R.COSTO_PROVA_FALLITA} point of mental health, like a failed check (the chalk in your gear spares you the first mistake). If you don't get the clue, someone in the house might give it to you.</p>`],
          /* 2 */ ["Skills", sezioneAbilita()],
          /* 3 */ ["Rest and days", `
            <p>You can only rest beside a warm fire, with orange flames, in a place you trust. Some fires burn out after a rest; the kitchen hearth never goes out.</p>
            <h3>What happens when you rest</h3>
            <ul>
              <li>you recover <b>2 points of mental health</b> (3 with The Lantern, Guendalina's path);</li>
              <li>your body does <b>not</b> heal: physical health needs food or potions (see “The body” below);</li>
              <li>daily powers become available again;</li>
              <li>rest clears all conditions;</li>
              <li>failed checks become available again;</li>
              <li>you move on to the next day, and Guendalina cooks for the larder;</li>
              <li>if you have reached a new level, you apply it (chapter “Levels and experience”).</li>
            </ul>
            <p>If you are already in full shape and have nothing to recharge, there is no need to sleep: the game does not use up the fire.</p>
            <h3>The body</h3>
            <p><b>Sleeping heals only your mental health.</b> To heal your physical health you need food or potions, which you will find in the game.</p>
            <ul>
              <li><b>Adele's rations</b> heal a quarter of your maximum physical health each. You eat them whenever you like, outside a fight: from the pack (“Eat”) or by typing “I eat a ration”. Resting does not use them up.</li>
              <li>Guendalina cooks ${R.RAZIONI_AL_GIORNO} a day; the larder holds at most ${R.RAZIONI_MAX}. The counter is always on the sheet.</li>
              <li>With Guendalina's path, Healing Hands also works on rations.</li>
            </ul>
            <h3>The mind</h3>
            <p>Mental health only comes back this way: by resting, at the garden fountain, with the tears and with elixirs. Guard it.</p>
            <h3>Days</h3>
            <p>The game counts the days spent in the house: you find the count at the top of the sheet. It matters for the ending.</p>
            <p><b>The weight of days</b>: every 10 days spent in the house you lose 1 point of <b>maximum</b> mental health, and resting tells you so. The garden fountain and some important relics of the house give 1 back, only among those lost this way.</p>
            <h3>Potions</h3>
            <p>The healing potion restores 1d6 + level of physical health. Drinking it in combat is a quick action. Elixirs are in the chapter “Conditions, saving throws and elixirs”.</p>`],
          /* 4 */ ["Death and mental health", `
            <p>You have two kinds of health: <b>physical</b>, which you lose in combat, and <b>mental</b>, which the house wears down. If your mental health reaches 0, the game is over.</p>
            <h3>When you die</h3>
            <ul>
              <li><b>Against the guardians you do not die</b>: at 0 physical health the house brings you back, and the defeat weighs on your mind.</li>
              <li><b>Against the sovereign you die.</b> Before the last door the game shows you what you carry and saves the game.</li>
              <li><b>Against animals, the hollow, hunted prey and hounds you die</b>: at 0 physical health you become part of House Vespera. Conditions can kill you during a fight.</li>
            </ul>
            <h3>What wears down the mind</h3>
            <ul>
              <li>failed checks and wrong choices in riddles (1 point);</li>
              <li>defeats against the most fearsome foes: each takes 1 point from your <b>maximum</b> mental health, up to 3 in all; the point comes back when that foe is defeated or spared;</li>
              <li>certain discoveries about the house (1 to 4 points, the first time only): on their own they never bring you to 0;</li>
              <li>some places and the weight of days.</li>
            </ul>
            <h3>Mode</h3>
            <p>Chosen at creation. In <b>easy</b> mode after death you start again from your last save (against the sovereign, from the threshold of the throne room) and you save whenever you like; in <b>hard</b> mode death is permanent and nothing is saved automatically: you have <b>a single save for the whole game</b> and you decide when to use it, so be smart about it. You can switch from hard to easy, never the other way.</p>`],
          /* 5 */ ["Saves", `
            <p>You can keep up to three characters. Save with the button at the top of the game page (in hard mode, only once in the whole game).</p>
            <p>If you sign in with Google from the home page, your saves are shared between computer and phone.</p>`],
          /* 6 */ ["Attributes and class attribute", `
            <p>Every attribute starts at ${R.VALORE_MINIMO}; at creation you spread ${R.PUNTI_BASE} points. No attribute can exceed ${R.VALORE_MASSIMO}, race bonus included.</p>
            <span class="formula">Modifier = (value − 10) ÷ 2, rounded down</span>
            <p class="esempio">Example: 12 → +1, 14 → +2, 17 → +3.</p>
            <div class="scroll"><table><tr><th>Attribute</th><th>What it is for</th><th>Class</th></tr>
              <tr><td><b>Vigour</b></td><td>physical health, Athletics and Survival</td><td>Warrior</td></tr>
              <tr><td><b>Agility</b></td><td>defence (Armor class), initiative, Stealth and Acrobatics</td><td>Shaman</td></tr>
              <tr><td><b>Mind</b></td><td>senses and logic: Investigation, Perception and Lore</td><td>Arcanist</td></tr>
              <tr><td><b>Spirit</b></td><td>mental health and willpower: Influence and Insight</td><td>Monk</td></tr>
            </table></div>
            <h3>Class attribute</h3>
            <p>Each class fights with one attribute, shown in the last column. It uses it for the attack and damage rolls of <b>all</b> its attacks and powers (once per attack), and for the difficulty of the conditions it inflicts.</p>
            <ul>
              <li><b>Warrior, Vigour</b>: tempered by a thousand battles, he puts all his strength into every blow.</li>
              <li><b>Shaman, Agility</b>: a hermit's life taught him that being quick and cunning is sometimes better than being strong.</li>
              <li><b>Arcanist, Mind</b>: he studies his foe and strikes the weak points.</li>
              <li><b>Monk, Spirit</b>: his faith guides him and makes his blows mightier.</li>
            </ul>`],
          /* 7 */ ["Races, classes and health", `
            <h3>Races</h3><div class="scroll"><table><tr><th>Race</th><th>Bonus</th></tr>${righeRazze}</table></div>
            <h3>Classes</h3><div class="scroll"><table><tr><th>Class</th><th>Hit die</th><th>Attribute</th><th>Armor</th><th>Off hand</th></tr>${righeClassi}</table></div>
            <p>Each class has its own chapter in the part “The classes”.</p>
            <h3>Health at level 1</h3>
            <span class="formula">Physical health = ${R.SALUTE_BASE} + maximum of the hit die + Vigour mod.</span>
            <span class="formula">Mental health = ${R.SALUTE_BASE} + maximum of the hit die + Spirit mod.</span>
            <p>The die is not rolled: at level 1 it counts as its maximum. How it grows with levels is in the chapter “Levels and experience”.</p>`],
          /* 8 */ ["Equipment", `
            <h3>Weapons</h3>
            <p>There are six common weapons, two for each damage type: one-handed (1d6) and two-handed (1d8).</p>
            <div class="scroll"><table><tr><th>Type</th><th>One hand (1d6)</th><th>Two hands (1d8)</th><th>Condition of powers</th></tr>
              <tr><td>Slashing</td><td>Sword</td><td>Greatsword</td><td>Bleeding</td></tr>
              <tr><td>Bludgeoning</td><td>Flanged mace</td><td>Maul</td><td>Stunned</td></tr>
              <tr><td>Piercing</td><td>Dagger</td><td>Trident</td><td>Exposed (critical on 19-20)</td></tr>
            </table></div>
            <p>You carry at most <b>two weapons</b>; switching them in combat costs your quick action. A two-handed weapon also takes your off hand: no shield and no focus.</p>
            <h3>Focus (Shaman, Arcanist, Monk)</h3>
            <p>Spellcasters hold a <b>focus</b> in their off hand: a single item with two forms, chosen at creation. That is why they only use one-handed weapons.</p>
            <div class="scroll"><table><tr><th>Class</th><th>Normal form (1d8)</th><th>Shield form (1d6, +1 AC)</th></tr>
              <tr><td>Shaman</td><td>Axis of the World</td><td>Fetish Shield</td></tr>
              <tr><td>Arcanist</td><td>Arcane Tome</td><td>Runic Buckler</td></tr>
              <tr><td>Monk</td><td>Phylactery</td><td>Divine Aegis</td></tr>
            </table></div>
            <p>The focus die is the die of your offensive powers that roll “the weapon die”. The shield form has a smaller die but gives +1 Armor class, with no Agility penalty. The item's bonus (+1, +2, +3) is the same in both forms.</p>
            <h3>Shield (Warrior)</h3>
            <p>The shield gives +1 Armor class, −1 to Agility skills, and strengthens some defensive powers. It takes the off hand and only counts while strapped on.</p>
            <h3>Armor</h3>
            <span class="formula">AC = ${R.CA_BASE} + armor + Agility mod. (up to the armor's cap) + shield or shield focus</span>
            <p>Light armor +${R.ARMATURA_CA["Armatura leggera"]}, medium +${R.ARMATURA_CA["Armatura media"]}, heavy +${R.ARMATURA_CA["Armatura pesante"]}. Agility bonus cap: ${tetti}. Light armor rewards the agile, medium armor is the middle way, heavy armor protects best those who are not agile but gives −1 to Agility skills. Armor a class cannot wear does not appear at creation.</p>
            <h3>Rarity</h3>
            <div class="scroll"><table><tr><th>Rarity</th><th>Bonus</th><th>Powers</th></tr>
              <tr><td>Common</td><td>+0</td><td>none</td></tr>
              <tr><td>Uncommon</td><td>+1</td><td>none</td></tr>
              <tr><td>Rare</td><td>+2</td><td>one encounter power</td></tr>
              <tr><td>Legendary</td><td>+3</td><td>one daily power</td></tr>
            </table></div>
            <p>The bonus goes to hit and to damage for weapons and focuses, to Armor class for armor and shields; helmets, gloves, boots, cloaks and accessories give it to a skill or a saving throw. Item powers are used with the quick action. Each class only uses what its list allows: the rest can be traded with Aldo, like for like, for an item of the same rarity.</p>
            <h3>Gear</h3>
            <p>Everyone starts with the same gear, meant for checks around the house and never for combat. The fitting item gives <b>+2</b> to the check.</p>
            <ul>
              <li><b>Always with you</b>: crowbar (Athletics where you can get leverage), rope (Acrobatics and Athletics on beams and drops), magnifying glass (Investigation and Perception to find what is hidden).</li>
              <li><b>Used up</b>: healing potion (1), torch (2 uses), chalk (3: your first mistake in a multiple-choice riddle costs no mental points), notebook and charcoal (2 pages: one more attempt at a Lore check).</li>
            </ul>`],
          /* 9 */ ["Levels and experience", `
            <p>You earn experience points by defeating enemies and completing quests. The highest level, for now, is ${R.LIVELLO_MAX}.</p>
            <div class="scroll"><table><tr><th>Level</th><th>XP needed</th><th>Total XP</th></tr>${soglie}</table></div>
            <p><b>You reach a level with experience points, but you apply it at your next rest</b>: until you rest, health, powers and difficulties stay those of the previous level. If you reach several levels meanwhile, you apply them all at the rest, one after the other.</p>
            <h3>What you gain at each level</h3>
            <ul>
              <li><b>${R.PUNTI_PER_LIVELLO} attribute points</b> to spread freely, even both on the same one (maximum ${R.VALORE_MASSIMO});</li>
              <li>physical health + half the hit die + 1 + Vigour mod. (Warrior 6, Shaman and Monk 5, Arcanist 4, plus the modifier);</li>
              <li>mental health + half the hit die + 1 + Spirit mod.;</li>
              <li>your chosen skills grow by 1;</li>
              <li>new powers, class features and the prestige path (chapter “Rules shared by the classes”).</li>
            </ul>
            <p>Every increase is at least 1. Check difficulties rise by ${R.CD_PER_LIVELLO}.</p>`],
          /* 10 */ ["The combat turn", `
            <h3>Who acts first</h3>
            <p>Whoever has the higher Agility acts first (on a tie, a d20 each).</p>
            <p><b>Sneaking up.</b> Some foes wait for you in particular places. You can creep up on them (“I sneak down”): you roll d20 + Stealth against d20 + the foe's Perception.</p>
            <ul>
              <li><b>You stay hidden</b>: you act first and in the first turn its Armor class drops by 2.</li>
              <li><b>It spots you</b>: it acts first and in the first turn yours drops by 2.</li>
            </ul>
            <h3>Action and quick action</h3>
            <p>Each turn you have <b>one action</b> and <b>one quick action</b>.</p>
            <ul>
              <li><b>Action</b>: a weapon attack, a power, or defending yourself. Some powers say “costs your action”.</li>
              <li><b>Quick action</b>: drinking a potion or an elixir, switching or equipping an item (weapon, shield, focus), using an item's power. One per turn.</li>
              <li><b>Talking</b> costs nothing.</li>
            </ul>
            <p><b>No reactions.</b> Everything is declared on your turn: defences last “until your next turn”; some powers stay “charged” and go off by themselves at the first useful moment.</p>
            <h3>Powers</h3>
            <ul>
              <li><b>At will</b>: usable every turn.</li>
              <li><b>Encounter</b>: once per fight; they come back when the fight ends.</li>
              <li><b>Daily</b>: once; they come back when you rest.</li>
            </ul>
            <p>An encounter or daily power is spent when you declare it, even if the attack misses.</p>
            <h3>Fleeing</h3>
            <p>Write “I flee”: an Athletics or Acrobatics check against DC 10 + the enemy's level. If you succeed you return to the room you came from; if you fail the enemy strikes you. You cannot flee from the guardians or the sovereign.</p>`],
          /* 11 */ ["Hitting and wounding", `
            <span class="formula">Attack: d20 + class attribute mod. + weapon bonus, hits if it beats the Armor class</span>
            <span class="formula">Damage: weapon (or focus) die + class attribute mod. + weapon bonus</span>
            <ul>
              <li><b>The attribute is added once per attack</b>, never per die. A power “with one more damage die” only adds the die.</li>
              <li><b>Critical hit</b>: a 20 on the die always hits and rolls double damage dice. Piercing weapons crit on 19-20. It works for enemies too.</li>
              <li><b>Several attacks</b> (“two attacks”): a d20 for each attack; each can miss on its own.</li>
              <li><b>Free strike</b>: it hits by itself, with the weapon die only, no bonus and no critical, and only if the main blow hits.</li>
              <li>A power <b>without an attack roll</b> cannot miss.</li>
            </ul>
            <h3>The weapon colours the powers</h3>
            <p>A basic weapon attack never inflicts conditions: only powers do. For the Warrior, and for everyone's basic attack, the weapon in hand decides the damage type and the condition. Spellcasters, the Shaman included, keep their powers' damage type (poison, force, psychic, blood, bone; Wood is bludgeoning): from the weapon they only take die and bonus.</p>
            <h3>Staggered</h3>
            <p>Below half health you are <b>Staggered</b>. It does no damage by itself, but it triggers many powers and the phase changes of your foes.</p>`],
          /* 12 */ ["Conditions, saving throws and elixirs", `
            <p>Conditions last <b>3 turns</b> (Frightened 2) and apply to you as to your enemies. Each has a mild and a severe form. In brackets, the name you read in the combat log.</p>
            <div class="scroll"><table class="stati"><tr><th>Mild</th><th>Effect</th><th>Severe</th><th>Effect</th></tr>
              <tr><td>Bleeding <i>(Sanguinante)</i></td><td>1d4 each turn</td><td>Haemorrhage <i>(Emorragia)</i></td><td>1d6 each turn</td></tr>
              <tr><td>Scorched <i>(Scottato)</i></td><td>1d4 fire each turn</td><td>Burned <i>(Ustionato)</i></td><td>1d6 each turn</td></tr>
              <tr><td>Intoxicated <i>(Intossicato)</i></td><td>1d4 poison each turn</td><td>Poisoned <i>(Avvelenato)</i></td><td>1d6 each turn</td></tr>
              <tr><td>Stunned <i>(Stordito)</i></td><td>loses the whole turn; then immune for 2 turns</td><td>Shaken <i>(Commosso)</i></td><td>Weakened for 3 turns</td></tr>
              <tr><td>Exposed <i>(Esposto)</i></td><td>−2 Armor class</td><td>Laid bare <i>(Scoperto)</i></td><td>−4 Armor class, critical on 19-20</td></tr>
              <tr><td>Weakened <i>(Indebolito)</i></td><td>−2 to hit</td><td>—</td><td></td></tr>
              <tr><td>Frightened <i>(Impaurito)</i></td><td>at-will powers only (2 turns)</td><td>—</td><td></td></tr>
            </table></div>
            <h3>Inflict and worsen</h3>
            <ul>
              <li><b>Inflict</b> puts on the mild condition (if it is already there, its duration renews). <b>Worsen</b> turns the mild into the severe: the mild must already be there, otherwise it only inflicts it.</li>
              <li>At-will powers inflict; encounter powers inflict and worsen; dailies worsen.</li>
              <li>Different conditions stack; the same condition does not stack, it renews. All of them end with the fight.</li>
              <li>On the most fearsome foes Stunned becomes Weakened.</li>
            </ul>
            <h3>Saving throws</h3>
            <p>When a condition is inflicted, whoever suffers it makes a saving throw; if it succeeds, the condition does not take hold. Worsening is automatic. The rule is the same for you and for enemies.</p>
            <span class="formula">Saving throw: d20 + attribute mod. ≥ DC → resists</span>
            <span class="formula">DC = 8 + class attribute mod. + level of whoever inflicts the condition</span>
            <div class="scroll"><table><tr><th>Attribute</th><th>Resists</th></tr>
              <tr><td>Vigour</td><td>Bleeding, Intoxicated, Stunned, Weakened</td></tr>
              <tr><td>Agility</td><td>Scorched, Exposed, Laid bare</td></tr>
              <tr><td>Spirit</td><td>Frightened and conditions that wear down the will</td></tr>
              <tr><td>Mind</td><td>conditions that shut down powers</td></tr>
            </table></div>
            <h3>Elixirs</h3>
