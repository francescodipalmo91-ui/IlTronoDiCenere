              <li>risorsa + mod. della caratteristica di classe + il nuovo livello;</li>
              <li>le abilità scelte crescono di 1;</li>
              <li>nuove tecniche o incantesimi, il tratto di classe ai livelli 2 e 4, la via di prestigio dal livello 3 (capitolo «Regole comuni alle classi»).</li>
            </ul>
            <p>Ogni aumento vale almeno 1. Le difficoltà delle prove salgono di ${R.CD_PER_LIVELLO}.</p>`],
          /* 9 */ ["Il turno di combattimento", `
            <h3>Chi agisce per primo</h3>
            <p>Agisce per primo chi ha più Agilità (a parità, un d20 a testa).</p>
            <p><b>Avvicinarsi furtivi.</b> Alcuni avversari ti aspettano in luoghi precisi. Se ti avvicini di soppiatto («scendo furtivo»), tiri d20 + Furtività contro d20 + Percezione dell'avversario, che ti scopre solo se fa più di te. Se resti nascosto agisci per primo e nel primo turno la sua Classe armatura scende di 2; se ti scopre agisce lui per primo e nel primo turno è la tua a scendere di 2. Qualcuno, abituato a cacciare, si accorge di te più facilmente.</p>
            <h3>La tua azione</h3>
            <p>A ogni turno hai un'azione: attaccare, usare una tecnica, lanciare un incantesimo o usare un oggetto. Prendere in mano la torcia o imbracciare lo scudo non consuma l'azione. L'attacco con l'arma è sempre gratuito. Scrivi l'azione («attacco», «lancio…», «bevo la pozione di cura») oppure usa i pulsanti che compaiono.</p>
            <h3>Colpire e ferire</h3>
            <span class="formula">Attacco (arma, tecnica o incantesimo): d20 + mod. della caratteristica di classe, colpisce se supera la Classe armatura</span>
            <span class="formula">Danno: dadi dell'arma o dell'incantesimo + mod. della caratteristica di classe (torcia 1d4, a mani nude 1d2)</span>
            <p><b>Colpo critico</b>: un 20 sul dado colpisce sempre e tira il doppio dei dadi di danno. Vale anche per i nemici. Alcuni effetti allargano il critico a 19-20 o 18-20, mai oltre.</p>
            <h3>Classe armatura</h3>
            <span class="formula">CA = ${R.CA_BASE} + armatura + mod. Agilità (fino al tetto dell'armatura) + scudo</span>
            <p>Tetto del bonus di Agilità: ${tetti}.</p>
            <p>Le armi a due mani non lasciano libera la mano per torcia o scudo: devi prima riporre l'arma.</p>`],
          /* 10 */ ["Tiri salvezza e difficoltà", `
            <p>Molte tecniche e molti incantesimi danno al nemico la possibilità di resistere con un tiro salvezza.</p>
            <span class="formula">Tiro salvezza del nemico: d20 + caratteristica + livello del nemico ≥ CD → resiste</span>
            <span class="formula">La tua CD = 8 + mod. della caratteristica di classe + il tuo livello</span>
            <p>La caratteristica con cui il nemico resiste dipende dall'effetto:</p>
            <div class="scroll"><table><tr><th>Caratteristica</th><th>Resiste a</th></tr>
              <tr><td>Vigore</td><td>veleni, sanguinamento, colpi fisici</td></tr>
              <tr><td>Agilità</td><td>effetti che sbilanciano o immobilizzano</td></tr>
              <tr><td>Mente</td><td>incantesimi di Forza e d'Arcano, finte</td></tr>
              <tr><td>Spirito</td><td>incantesimi di Vita e di Negromanzia, paura</td></tr>
            </table></div>`],
          /* 11 */ ["Stati", `
            <p>Gli stati sono effetti che durano qualche turno. Quelli segnati con ● possono colpire anche te.</p>
            <div class="scroll"><table class="stati"><tr><th>Stato</th><th>Effetto</th><th>Versione maggiore</th><th>Turni</th></tr>
              <tr><td>Indebolito ●</td><td>−2 per colpire</td><td>—</td><td class="n">2</td></tr>
              <tr><td>Impaurito ●</td><td>−2 alla Classe armatura</td><td>—</td><td class="n">2</td></tr>
              <tr><td>Accecato ●</td><td>tira 2d20 per colpire e tiene il peggiore</td><td>—</td><td class="n">2</td></tr>
              <tr><td>Sanguinamento ●</td><td>1d4 danni a ogni suo turno</td><td>Emorragia: 1d6</td><td class="n">3</td></tr>
              <tr><td>Avvelenato ●</td><td>1d4 danni da veleno a ogni suo turno</td><td>Tossina: 1d6</td><td class="n">3</td></tr>
              <tr><td>Ustionato ●</td><td>1d4 danni da fuoco a ogni suo turno</td><td>Potenziato: 1d6</td><td class="n">3</td></tr>
              <tr><td>Avvizzito</td><td>1d4 danni necrotici a ogni suo turno</td><td>1d6 dove indicato</td><td>secondo l'effetto</td></tr>
              <tr><td>Sbilanciato ●</td><td>−2 alla Classe armatura</td><td>—</td><td>secondo l'effetto</td></tr>
              <tr><td>Frastornato ●</td><td>−4 per colpire, niente critici</td><td>—</td><td>secondo l'effetto</td></tr>
              <tr><td>Stordito ●</td><td>salta il turno</td><td>—</td><td>1-2</td></tr>
              <tr><td>Inibito ●</td><td>niente attacchi speciali, tecniche né incantesimi: solo attacchi normali</td><td>—</td><td>secondo l'effetto</td></tr>
              <tr><td>Esposto</td><td>i tuoi attacchi fanno critico con un numero in meno, mai sotto 18</td><td>—</td><td>secondo l'effetto</td></tr>
            </table></div>
            <p class="esempio">Su di te, Sbilanciato, Frastornato, Stordito e Inibito arrivano solo da alcune prede delle cacce, per 2 turni.</p>
            <h3>Durata e cumulo</h3>
            <ul>
              <li>Uno stato nuovo dello stesso tipo <b>rinnova la durata</b>, non si somma. Stati diversi si sommano: Sanguinamento, Avvelenato e Avvizzito fanno danno insieme. Le eccezioni (Incrinatura, Sigilli, Cariche) sono spiegate nelle classi.</li>
              <li>Gli stati che infliggi al nemico contano <b>i suoi turni</b>. I potenziamenti delle tue azioni (Runa sull'Arma, Voto di Vita, Occhio del Tomo…) contano <b>i tuoi turni</b> dopo il lancio: «per 3 turni» vuol dire i tuoi prossimi 3 turni.</li>
              <li>Tutti gli stati finiscono con lo scontro.</li>
              <li>Le creature di cenere non sanguinano; quelle di fuoco non si ustionano.</li>
            </ul>
            <h3>Elisir</h3>
            <p>Gli elisir comuni (con le parti degli animali e le erbe) curano uno stato. Gli elisir rari (con la sola parte di una creatura di cenere) rendono immuni a quello stato per tutto lo scontro, bevuti prima o durante: un nemico che vede fallire il suo stato non ci riprova. Ne porti al massimo 2 per stato.</p>`],
          /* 12 */ ["Avversari", `
            <h3>Avversari temibili</h3>
            <p>Gli avversari più temibili (i guardiani e pochi altri) non subiscono gli effetti che tolgono azioni o attacchi: Frastornato, Stordito, Inibito. Al loro posto molte tecniche e incantesimi hanno un <b>ripiego</b>, indicato tra parentesi nel testo. Su di loro gli altri stati durano al massimo 2 turni (Avvizzito 3), e cariche e Sigilli arrivano al massimo a 2.</p>
            <h3>Vulnerabilità e resistenze</h3>
            <p>Molti nemici sono vulnerabili a un tipo di danno: taglio, contundente, perforante, arcano, forza, vita, negromanzia, veleno o fuoco. Contro di loro quel danno ha <b>un dado in più</b>, oppure un effetto dura un turno in più. Altri resistono a un tipo di danno e ne subiscono metà.</p>
            <p>Ogni guardiano ha un punto debole per ogni classe: un tipo d'arma per il Guerriero, una scuola per l'Arcanista e una per il Monaco, e a volte il sottobosco dello Sciamano. Scoprirlo prima dello scontro e prepararsi (arma, incantesimi preparati) fa una grande differenza. Esplorando e parlando con gli abitanti della casa puoi saperne di più.</p>
            <h3>Abilità dei nemici</h3>
            <p>Anche i nemici hanno punti abilità: ogni abilità che infligge uno stato costa punti (2 per uno stato, 3 per uno potenziato o per due stati, 4 per un controllo come Stordito). Finiti i punti, solo attacchi normali.</p>
            <h3>Fuga</h3>
            <p>Scrivi «fuggo»: prova di Atletica o Acrobazia contro CD 10 + livello del nemico. Riesci e torni nella stanza da cui sei arrivato; fallisci e il nemico ti colpisce con vantaggio. Non si fugge dai guardiani.</p>`],
          /* 13 */ ["Cacce, agguati e fermaglio", `
            <h3>Cacce comuni</h3>
            <p>Dopo l'udienza del fermaglio di bronzo, il maggiordomo affigge in sala della caccia le cacce comuni: due dopo ogni fermaglio, una sola alla volta, da una a tre stelle d'oro.</p>
            <ul>
              <li><b>Una e due stelle</b>: il maggiordomo ti dice a cosa la preda è vulnerabile e cosa resiste (lo ritrovi in Missioni).</li>
              <li><b>Tre stelle</b>: la preda è appena entrata nei confini e nessuno ne sa nulla. Prima di attaccare puoi <b>osservarla</b> (Percezione: arma e armatura, caratteristica principale, tipo di danno), <b>ricordare</b> cosa sia (Sapienza: vulnerabilità, resistenze, stato che infligge) e <b>avvicinarti</b> di nascosto (Furtività contro la sua Percezione). Ogni azione si fa una volta sola.</li>
            </ul>
            <span class="formula">Osservare e ricordare: d20 + abilità contro CD 12 (+ la crescita col livello): CD → una voce, CD + 5 → due, CD + 10 → tre</span>
            <p>Avvicinarti bene ti dà vantaggio sulla prova successiva, e con un 20 naturale scopri tutta la scheda della preda; allo scontro agisci per primo e la preda ha −2 alla Classe armatura nel primo turno. Se ti scopre agisce lei per prima e nel primo turno la tua Classe armatura scende di 2. Osservare e ricordare falliti costano 1 punto di salute mentale, come ogni prova; l'avvicinamento no.</p>
            <h3>Agguati</h3>
            <p>Dopo il fermaglio di bronzo, fuori casa può tenderti un agguato chi è entrato da altri ingressi: goblin e orchi, da soli o in banda (un gruppo combatte come una creatura sola), oppure uno di cinque avventurieri che crescono con te.</p>
            <ul>
              <li>A un terzo della salute un avventuriero si arrende: puoi finirlo o risparmiarlo.</li>
              <li>Finire chi chiede pietà o cerca di scappare costa 1 punto di salute mentale, e può ucciderti: è la casa che ti cambia.</li>
              <li>Chi risparmi torna una volta, dopo un riposo, più forte, e quella volta combatte fino alla fine.</li>
              <li>Le armi trovate addosso a loro hanno il bonus del livello a cui le trovi.</li>
            </ul>
            <h3>Il fermaglio</h3>
            <p>Il fermaglio dei guardiani occupa un posto nell'equipaggiamento. Fuori dal combattimento puoi nasconderlo o appuntarlo («nascondo il fermaglio», «appunto il fermaglio»).</p>
            <ul>
              <li><b>Appuntato</b>: il tuo grado si legge sotto il ritratto e i mastini riconoscono su di te l'odore del maggiordomo (+2 a Furtività quando ti seguono), ma fuori casa sei una preda di valore e gli agguati sono più frequenti.</li>
              <li><b>Nascosto</b>: il contrario.</li>
            </ul>`],
          /* 14 */ ["Esempi di combattimento", `
            <h3>Guerriero con la spada corta</h3>
            <p class="esempio">Livello 1, Vigore 16 (+3), 13 punti furia. Contro un nemico con Classe armatura 12.</p>
            <div class="turno"><b>Turno 1.</b> Usi Morso dell'Acciaio (3 furia, ne restano 10). Tiri 12: 12 + 3 = 15, più di 12, colpisci. Danno 1d6 + 3: esce 4, fai 7. Il nemico sanguina: 1d4 per 3 turni.</div>
            <div class="turno"><b>Turno del nemico.</b> Sanguina e perde 2. Ti attacca e ti colpisce: perdi 5 salute, ma guadagni 1 furia (11).</div>
            <div class="turno"><b>Turno 2.</b> Per risparmiare furia attacchi con l'arma, gratis. Tiri 20: critico! Colpisci di sicuro e tiri 2d6 + 3: fai 10. Il critico ti dà anche 2 furia (13).</div>
            <p class="esempio">La furia sale quando ti colpiscono: il Guerriero non teme di prendere colpi, teme di restare a secco.</p>
            <h3>Arcanista d'Arcano, con un posto di Forza</h3>
            <p class="esempio">Livello 1, Mente 16 (+3), 13 mana. Contro lo stesso nemico.</p>
            <div class="turno"><b>Turno 1.</b> Dardo Arcano (2 mana, restano 11). Tiri 11: 11 + 3 = 14, colpisci. 1d8 + 3: fai 5 + 3 = 8, e incidi 1 Sigillo ◆◇◇.</div>
            <div class="turno"><b>Turno 2.</b> Scopri Carte (1 mana, restano 10). Vedi la scheda del nemico e incidi il secondo Sigillo, senza tiro ◆◆◇.</div>
            <div class="turno"><b>Turno 3.</b> Pugno di Forza (2 mana, restano 8). Tiri 14: 17, colpisci. 1d8 + 3 fa 6 + 3, e la Detonazione consuma i 2 Sigilli: +2d6, esce 7. Totale 16 danni, e ti restituisce 2 mana, uno per Sigillo (10).</div>
            <p class="esempio">L'Arcanista prepara e poi colpisce: più Sigilli incide, più fa male e più mana recupera, ma il nemico intanto attacca.</p>
            <h3>Monaco di Negromanzia, con un posto di Vita</h3>
            <p class="esempio">Livello 2, Spirito 16 (+3), 18 punti fede. La Bilancia parte da 0.</p>
            <div class="turno"><b>Turno 1.</b> Avvizzire (3 fede, restano 15). Il nemico fallisce il tiro salvezza: è Avvizzito per 3 turni. Bilancia: Negromanzia 1.</div>
            <div class="turno"><b>Turno 2.</b> Sete del Sepolcro (4 fede, restano 11). Colpisci; la Bilancia passa a Negromanzia 2 e scatta il Coro: 3d6 invece di 2d6. Recuperi 1 fede (12).</div>
            <div class="turno"><b>Turno 3.</b> Tocco Avvizzente (2 fede, restano 10): Bilancia a Negromanzia 3, sei a Nadir. Il prossimo incantesimo di Negromanzia ti costerebbe 1 punto di salute mentale.</div>
            <div class="turno"><b>Turno 4.</b> Ti curi con Tocco Lenitivo (2 fede, restano 8). È un Crepuscolo: cura con 2d8 + 3 invece di 1d8 + 3, e partendo da Nadir recuperi il doppio, 2 fede (10). La Bilancia torna a 0.</div>
            <p class="esempio">Il Monaco di Negromanzia spinge fino al limite, poi usa la Vita per tornare in equilibrio prima che la mente ceda.</p>`],
          /* 15 */ ["Regole comuni alle classi", `
            <p>Queste regole valgono per tutte le classi. Nei capitoli di ogni classe trovi solo ciò che la rende diversa.</p>
            <h3>Risorsa</h3>
            <p>Ogni classe ha una risorsa: <b>furia</b> (Guerriero), <b>natura</b> (Sciamano), <b>mana</b> (Arcanista), <b>fede</b> (Monaco). Tecniche e incantesimi la consumano; l'attacco con l'arma è sempre gratuito, così quando la risorsa finisce si combatte comunque. Una tecnica o un incantesimo che manca il bersaglio costa lo stesso.</p>
            <ul>
              <li>Al livello 1: ${R.RISORSA_BASE} + mod. della caratteristica di classe; a ogni livello + mod. + il nuovo livello.</li>
              <li>Si ricarica riposando (1d4 + livello) e, durante lo scontro, ognuna a modo suo. La tabella base del recupero è ${recupero()}: la usano furia, natura e fede; il mana si recupera con i Sigilli.</li>
            </ul>
            <h3>Tecniche e incantesimi preparati</h3>
            <ul>
              <li><b>Posti</b>: ${posti()}. Si scelgono in creazione e si cambiano riposando.</li>
              <li>Ogni livello sblocca tre tecniche o incantesimi nuovi per ramo o scuola, tra cui scegliere.</li>
              <li>Alcune si usano <b>una sola volta tra un riposo e l'altro</b>, altre una volta per scontro: è scritto nel testo.</li>
              <li>Quelle che <b>consumano l'azione</b> per difenderti non si usano due turni di fila.</li>
            </ul>
            <h3>Capacità di classe</h3>
            <p>Ogni classe ha qualcosa che non occupa posti: Mente incrollabile per Guerriero e Sciamano, la Luce (o il Lume Arcano) per gli incantatori, che illumina il buio al posto della torcia.</p>
            <p><b>Mente incrollabile</b> (Guerriero e Sciamano): dopo una prova fallita puoi spendere 1 punto furia o natura per un tiro salvezza: d20 + mod. di Vigore (Guerriero) o di Spirito (Sciamano) + livello, CD ${R.CD_INCROLLABILE}. Se lo superi, non perdi salute mentale.</p>
            <h3>Tratto di classe</h3>
            <p>Una capacità passiva che cresce in tre gradi, ai livelli <b>1, 2 e 4</b>. È diverso per ogni classe: più forte per le classi fragili, più leggero per le altre.</p>
            <h3>Via di prestigio</h3>
            <p>Dal livello 3 scegli una delle due vie della tua classe: tre abilità, una ai livelli 3, 4 e 5, sempre pronte e senza occupare posti. Le due vie sono opposte (una più violenta, una più paziente). <b>La scelta è definitiva.</b></p>`],
          /* 16 */ ["Guerriero", `
            <p>Il combattente addestrato: picchia con l'arma e apre ogni scontro con tecniche che logorano, stordiscono o spezzano il nemico.</p>
            <p class="esempio">Vigore · punti furia · dado vita d10 · tutte le armature e le armi da battaglia</p>
            <h3>Come combatte</h3>
            <p>Il tipo d'arma che impugni decide le tecniche, e ogni ramo ha un modo suo di battere il nemico:</p>
            <ul>
              <li><b>Taglio</b>, logora: Sanguinamento ed Emorragia, Indebolito, Inibito (sui temibili diventa Indebolito).</li>
              <li><b>Contundente</b>, stordisce: Stordito, Frastornato, Sbilanciato (sui temibili diventa Sbilanciato). In più l'<b>Incrinatura</b>, −1 alla Classe armatura del nemico per carica fino a 3, per tutto lo scontro (l'unico effetto che si somma), e la <b>Frattura</b>, 1d4 danni al nemico ogni volta che attacca.</li>
              <li><b>Perforante</b>, cerca il punto debole: Esposto (critico con un numero in meno) e Sbilanciato; alcune tecniche allargano il critico, mai oltre 18-20. Sui temibili il ripiego è Esposto.</li>
              <li><b>Scudo</b>, difende e controlla: Stordito e Sbilanciato. Quando lo scudo assorbe un colpo (metà danni, oppure 0 danni senza furia) guadagni una <b>Carica Cinetica</b>, fino a 3, che alcune tecniche spendono per colpire senza tiro.</li>
            </ul>
            <h3>Risorsa e recupero</h3>
            <p>La furia sale quando ti colpiscono: a ogni colpo subito guadagni ${recupero()}, il doppio se è un critico. Un attacco che ti manca o che pari non dà furia. Anche un tuo critico ti dà 2 furia. Il Guerriero non teme di prendere colpi: teme di restare a secco.</p>
            <h3>Preparazione</h3>
            <ul>
              <li>Scegli tra le tecniche del tipo d'arma che impugni. Con lo scudo imbracciato hai <b>un posto in più</b>, di qualsiasi livello, tra le tecniche dello scudo.</li>
              <li>Una tecnica di un altro tipo d'arma resta preparata ma non si usa. Se cambi arma, le tecniche del nuovo tipo arrivano dal livello successivo.</li>
            </ul>
            <h3>Tratto di classe: Tempra del Soldato</h3>
            <div class="scroll"><table><tr><th>Livello</th><th>Effetto</th></tr>
              <tr><td class="n">1</td><td>Mente incrollabile</td></tr>
              <tr><td class="n">2</td><td>Furore inarrestabile (tecnica di classe, fuori dai posti)</td></tr>
              <tr><td class="n">4</td><td><b>Ultimo a cadere</b>: una volta per riposo, un colpo che ti porterebbe a 0 ti lascia a 1 salute e ti dà 3 furia</td></tr>
            </table></div>
            <h3>Vie di prestigio</h3>
            <p>Cambiano con il tipo d'arma: ogni ramo, scudo compreso, ha le sue due vie. Con arma e scudo, quando riposi scegli quale serie preparare.</p>
            <h3>Tecniche</h3>
            ${tendina("Capacità di classe", tabella(utilitaGuerriero))}
            ${ramiGuerriero}`],
          /* 17 */ ["Sciamano", `
            <p>L'eremita dei boschi: combatte con l'arma e con la natura, avvelenando, intrappolando e consumando il nemico un turno dopo l'altro.</p>
            <p class="esempio">Agilità · punti natura · dado vita d8 · armature leggere e medie</p>
            <h3>Come combatte</h3>
            <ul>
              <li><b>Veleno</b>: Avvelenato fa 1d4 a ogni turno del nemico (Tossina 1d6). Si rinnova, non si somma, ma si somma a Sanguinamento e Avvizzito. Alcuni avversari resistono al veleno e ne subiscono metà.</li>
              <li><b>Rivestimento</b>: un attacco che riveste l'arma per 3 turni; ogni colpo a segno, anche gli attacchi normali, ne porta l'effetto. Uno alla volta.</li>
              <li><b>Trappola</b>: un attacco e, nello stesso turno, una trappola che scatta al prossimo attacco del nemico, prima del suo tiro. Una alla volta.</li>
              <li><b>Scudo di Corteccia</b>: salute temporanea che assorbe i danni prima della salute fisica, al massimo 5 + livello, per tutto lo scontro.</li>
              <li><b>Borsa dei veleni</b>: 3 dosi da 1d4 + livello punti natura. Vuota, si riempie con gli ingredienti giusti, che si trovano nella foresta.</li>
            </ul>
            <p>Il tiro salvezza del nemico contro le tecniche dello Sciamano è sempre sul corpo: d20 + il suo Vigore + il suo livello.</p>
            <h3>Risorsa e recupero</h3>
            <p>La natura torna quando la natura colpisce, non l'arma. Ti danno ${recupero()}, al massimo una volta per turno del nemico, il doppio se il nemico ha la Tossina:</p>
            <ul>
              <li>i danni da veleno, Tossina, acido e bulbo;</li>
              <li>un tiro salvezza fallito contro una tua tecnica;</li>
              <li>una trappola che scatta;</li>
              <li>lo Scudo di Corteccia, quando lo crei o quando assorbe.</li>
            </ul>
            <h3>Preparazione</h3>
            <p>Le tecniche della natura funzionano con qualsiasi arma.</p>
            <h3>Tratto di classe: Legame del Sottobosco</h3>
            <div class="scroll"><table><tr><th>Livello</th><th>Effetto</th></tr>
              <tr><td class="n">1</td><td>Mente incrollabile</td></tr>
              <tr><td class="n">2</td><td><b>Sangue del Sottobosco</b>: +2 ai tiri salvezza contro Avvelenato, la Borsa dei veleni tiene 4 dosi</td></tr>
              <tr><td class="n">4</td><td><b>Linfa che ritorna</b>: all'inizio di ogni tuo turno, se il nemico è Avvelenato, ti curi di 1</td></tr>
            </table></div>
            <h3>Vie di prestigio</h3>
            <p>Ognuna delle due vie ha una passiva, sempre attiva, e tre abilità.</p>
            <h3>Tecniche</h3>
            ${tecnicheSciamano}`],
          /* 18 */ ["Arcanista", `
            <p>Lo studioso: legge l'avversario e lo smonta con due scuole che lavorano in coppia. L'<b>Arcano</b> incide Sigilli sul nemico, la <b>Forza</b> li fa esplodere.</p>
            <p class="esempio">Mente · mana · dado vita d6 · armature leggere</p>
            <h3>Come combatte: Sigilli e Detonazione</h3>
            <ol>
              <li><b>Incidi</b>: gli incantesimi d'Arcano lasciano Sigilli sul nemico (◆). Durano tutto lo scontro, al massimo ${MG ? MG.SIGILLI_MAX : 3} (${MG ? MG.SIGILLI_MAX_BOSS : 2} sugli avversari temibili), uno in più dal livello 4. Il critico di un incantesimo di Forza incide anche 1 Sigillo.</li>
              <li><b>Fai esplodere</b>: gli incantesimi di Forza con la scritta <i>Detonazione</i> consumano tutti i Sigilli, +1d6 di danno per Sigillo.</li>
              <li><b>Recupera</b>: ogni Detonazione ti restituisce <b>1 mana per Sigillo</b> (Singolarità 2). Senza Sigilli non c'è niente da far esplodere: niente danno in più e niente mana.</li>
            </ol>
            <p>Sotto ogni incantesimo il gioco ti dice cosa fa per la combinazione («Incide Sigilli», «Detona») e, durante lo scontro, quando è pronta («Combo pronta: Sigilli al massimo»).</p>
            <p class="esempio">Consiglio: se scegli l'Arcano come scuola principale, usa il posto della Forza per un incantesimo che detona. Chi prepara una sola scuola funziona lo stesso, ma rende meno.</p>
            <h3>Risorsa e recupero</h3>
            <p>Il mana si recupera solo facendo esplodere i Sigilli (e con il Pozzo Arcano, sotto). È il cuore della classe: chi incide e poi detona spende molto meno.</p>
            <h3>Preparazione: scuola principale</h3>
            <p>In creazione scegli la scuola principale, come il Guerriero sceglie l'arma: i posti vanno agli incantesimi sbloccati di quella scuola, più ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} posto dell'altra, di qualsiasi livello. Se cambi scuola principale, vale dal livello successivo.</p>
            <h3>Tratto di classe: Pozzo Arcano</h3>
            <div class="scroll"><table><tr><th>Livello</th><th>Effetto</th></tr>
              <tr><td class="n">1</td><td>se in un tuo turno non lanci incantesimi, al turno dopo recuperi 1 mana</td></tr>
              <tr><td class="n">2</td><td>Specchio di Rune e Barriera Cinetica costano 1 in meno</td></tr>
              <tr><td class="n">4</td><td>il primo incantesimo di ogni scontro non costa mana</td></tr>
            </table></div>
            <h3>Vie di prestigio</h3>
            <p>La Frattura spinge la Forza e le esplosioni, la Sutura l'Arcano e il controllo.</p>
            <h3>Incantesimi</h3>
            ${tendineScuole("Sapiente")}`],
          /* 19 */ ["Monaco", `
            <p>L'uomo di fede: prega due forze opposte. La <b>Vita</b> protegge e cura, la <b>Negromanzia</b> evoca i morti e ferisce di più, ma chiede un prezzo alla mente.</p>
            <p class="esempio">Spirito · punti fede · dado vita d8 · armature leggere e medie</p>
            <h3>Come combatte: la Bilancia</h3>
            <p>La Bilancia va da Negromanzia ${MG ? MG.BILANCIA_MAX : 3} a Vita ${MG ? MG.BILANCIA_MAX : 3} e parte da 0 a ogni scontro. Ogni incantesimo di Vita la sposta di 1 verso la Vita, ogni incantesimo di Negromanzia di 1 verso la Negromanzia.</p>
            <div class="scroll"><table><tr><th>Posizione</th><th>Effetto</th></tr>
              <tr><td>Vita 2-3 · Aureola</td><td>le tue cure +2, +1 ai tuoi tiri salvezza</td></tr>
              <tr><td>Vita 3 · Zenit</td><td>il prossimo incantesimo di Negromanzia è un Crepuscolo</td></tr>
              <tr><td>Negromanzia 2-3 · Coro</td><td>gli incantesimi di Negromanzia hanno +1 dado di danno: gli spiriti ti seguono</td></tr>
              <tr><td>Negromanzia 3 · Nadir</td><td>ogni incantesimo di Negromanzia costa anche 1 punto di salute mentale (non letale); il prossimo incantesimo di Vita è un Crepuscolo</td></tr>
              <tr><td>Crepuscolo</td><td>l'incantesimo ha +1 dado (danno o cura) e ti restituisce punti fede; poi la Bilancia torna a 0</td></tr>
            </table></div>
            <p>Il gioco del Monaco è spingere la Bilancia verso un estremo e poi tornare indietro con un Crepuscolo: chi alterna le scuole spende meno. Sotto ogni incantesimo il gioco ti dice dove la sposta e quando la combinazione è pronta.</p>
            <ul>
              <li><b>Rigenerazione</b> (da alcuni incantesimi di Vita): cura 1d4 all'inizio dei tuoi 3 turni successivi. Non si somma, si rinnova.</li>
              <li><b>Spirito Servitore</b> (Negromanzia): per 3 turni uno spirito evocato colpisce da solo all'inizio del tuo turno.</li>
            </ul>
            <h3>Risorsa e recupero</h3>
            <p>La fede torna con il Crepuscolo: ${recupero()}, il doppio se parti da Nadir. Alcuni incantesimi di Negromanzia ne restituiscono altra.</p>
            <h3>Preparazione: scuola principale</h3>
            <p>Come per l'Arcanista: i posti vanno alla scuola principale, più ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} posto dell'altra. Tenere almeno un incantesimo dell'altra scuola serve a chiudere il Crepuscolo.</p>
            <h3>Tratto di classe: Respiro dell'Equilibrio</h3>
            <div class="scroll"><table><tr><th>Livello</th><th>Effetto</th></tr>
              <tr><td class="n">1</td><td>con la Bilancia in Vita i colpi che subisci fanno 1 danno in meno (minimo 1); in Negromanzia i tuoi attacchi con l'arma fanno 1 danno in più</td></tr>
              <tr><td class="n">2</td><td>quando la Bilancia raggiunge Zenit o Nadir ti curi di 1d4 + livello</td></tr>
              <tr><td class="n">4</td><td>una volta per scontro, la prima volta che scendi sotto metà salute: con la Brace la Bilancia torna a 0 e ti curi di 1d6 + mod. Spirito; con la Cenere il tuo prossimo incantesimo di Negromanzia ti cura di tutto il danno che infligge</td></tr>
            </table></div>
            <h3>Vie di prestigio</h3>
            <p>La Cenere spinge la Negromanzia e il rancore, la Brace la Vita e le cure.</p>
            <h3>Incantesimi</h3>
            ${tendineScuole("Accolito")}`]
        ]
      },
      en: {
        torna: "← Home page", titolo: "Rules", sotto: "The rules of the game, to look up whenever you like.",
        parte: "Part", capitolo: "Chapter", apri: "Expand all", chiudi: "Collapse",
        parti: [["How to play", [0, 1, 2, 3, 4, 5]], ["Your character", [6, 7, 8]], ["Combat", [9, 10, 11, 12, 13, 14]], ["The classes", [15, 16, 17, 18, 19]]],
        sezioni: [
          /* 0 */ ["Writing actions and exploring", `
            <p>You control the game by writing what your character does, in your own words. No exact formulas are needed: the game recognises the most common verbs.</p>
            <ul>
              <li><b>Moving</b>: “I go to the kitchen”, “I go down to the cellar”, “I go back”. You can only go to nearby rooms: if the room is far away, the game tells you which way to go. Outdoors you can also move by compass points (“I go north”).</li>
              <li><b>Looking</b>: “I look at the fireplace”, “I examine the room”, “I listen”. Descriptions and details cost nothing.</li>
              <li><b>Acting</b>: “I take the sword”, “I open the door”, “I talk to…”.</li>
              <li><b>Items</b>: “I drink the healing potion”, “I hold the torch”, “I wear the armour”. The backpack and the sheet show what you carry and how to use it.</li>
            </ul>
            <p class="esempio">Example: in a new room you write “I look at the table”. If there is something to discover, the game offers you a check.</p>
            <p>When the game offers buttons (a choice, a roll, “never mind”) use them instead of typing. Accepted quests appear on your sheet, with goals and hints.</p>
            <h3>The colour of the panels</h3>
            <p>Each of your actions appears in a coloured panel that tells you at once how it went:</p>
            <div class="tendine"><span class="t-azz">blue: no check</span><span class="t-ok">green: check passed</span><span class="t-ko">red: check failed</span></div>
            <p>Dialogues have a colour of their own. In dialogues the approach you choose also matters, kind or harsh: every person reacts in their own way.</p>`],
          /* 1 */ ["Skill checks", `
            <p>When the outcome of an action is uncertain, the game asks for a check and shows you the difficulty, the die and the modifier.</p>
            <span class="formula">d20 + skill value ≥ difficulty (DC) → check passed</span>
            <p class="esempio">Example: Stealth +3 against DC 13. You roll 11: 11 + 3 = 14, at least 13, so the check is passed. With a 9 you would have made 12 and failed.</p>
            <p>The skill value is worked out as explained in the “Skills” chapter. The difficulty depends on the situation: the higher it is, the harder to succeed.</p>
            <h3>The rules of checks</h3>
            <ul>
              <li><b>DCs grow with you</b>: +${R.CD_PER_LIVELLO} for every level above the first. A DC 10 check at level 1 is DC 12 at level 3: growing makes you stronger, but the house grows more demanding.</li>
              <li><b>Every failed check costs ${R.COSTO_PROVA_FALLITA} point of mental health</b>, except checks the game marks as harmless. Choose carefully when to try. Warriors and Shamans can resist with Unshakeable Mind (chapter “Rules common to all classes”).</li>
              <li><b>A failed check cannot be repeated until you rest.</b> The game warns you before the roll and reminds you if you try again. Passed checks stay passed. Checks marked as repeatable are the exception.</li>
              <li><b>Natural 20</b>: some checks require it. Only the number on the die counts, the modifier is not added.</li>
              <li><b>Advantage</b>: some items and situations grant it. Roll two d20 and keep the better.</li>
            </ul>
            <h3>Asking for a check</h3>
            <p>Usually it is enough to write what you do. You can also name the skill: “I make a perception check”, “I use stealth”, “I look for tracks”. If the skill is of no use in that place, the game answers with a short description and no roll.</p>
            <h3>Riddles</h3>
            <p>Some places hide a riddle. Usually a check gives you a clue, then you choose the solution. A wrong choice costs ${R.COSTO_PROVA_FALLITA} point of mental health, like a failed check. If you miss the clue, someone in the house might give it to you.</p>`],
          /* 2 */ ["Skills", sezioneAbilita()],
          /* 3 */ ["Rest, days and rations", `
            <p>You can only rest beside a warm fire, with orange flames, in a place you trust. Some fires burn out after a rest.</p>
            <h3>What happens when you rest</h3>
            <ul>
              <li>you recover <b>1d4 + level</b> in physical health, mental health and your class resource;</li>
              <li>you eat up to 1d4 rations; every day you get ${R.RAZIONI_AL_GIORNO} new ones (maximum stock ${R.RAZIONI_MAX});</li>
              <li>you move on to the next day;</li>
              <li>failed checks become available again;</li>
              <li>you can change your prepared techniques and spells;</li>
              <li>if you have reached a new level, you apply it (chapter “Levels and experience”).</li>
            </ul>
            <p class="esempio">Example: you are level 2 and have lost 6 physical health. Resting you roll 1d4 and get 3: you recover 3 + 2 = 5 points in physical health, mental health and class resource.</p>
            <p>Without rations hunger keeps you awake, except in a particularly welcoming place, where you still recover 1 point. If you are already at full strength there is no need to sleep: the game does not use up the fire or the rations.</p>
            <h3>The weight of days</h3>
            <p>The game counts the days spent in the house: you find the count at the top of the sheet. Every 10 days you lose 1 point of <b>maximum</b> mental health, and the rest tells you so. The garden fountain (one sip per hunt) and some important finds in the house give 1 back, only among those lost this way.</p>
            <h3>Potions</h3>
            <p>The healing potion restores 1d6 + level physical health; the essence potion restores 1d6 + level of your class resource. Elixirs are explained in the “Conditions” chapter.</p>`],
          /* 4 */ ["Death and mental health", `
            <p>You have two kinds of health: <b>physical</b>, which you lose in combat, and <b>mental</b>, which the house wears down. If your mental health reaches 0, the game is over.</p>
            <h3>When you die</h3>
            <ul>
              <li><b>You cannot die against guardians</b>: at 0 physical health the house brings you back, at full health but with 1d4 fewer points of mental health.</li>
              <li><b>Against animals, hunt prey and hounds you die</b>: at 0 physical health you become part of House Vespera. Conditions can kill you during a fight.</li>
            </ul>
            <h3>What wears down the mind</h3>
            <ul>
              <li>failed checks and wrong riddle answers (1 point);</li>
              <li>defeats against the most fearsome foes: each takes 1 point from your <b>maximum</b> mental health, up to 3 in all; the point comes back once that foe has been beaten or spared;</li>
              <li>some discoveries about the house (1 to 4 points, only the first time): on their own they never bring you to 0, they always leave at least 1 point;</li>
              <li>certain spells, certain places and the weight of days.</li>
            </ul>
            <h3>Mode</h3>
            <p>Chosen at creation. In <b>easy</b> after death you start again from your last save and save whenever you like; in <b>hard</b> death is permanent and there is a single, automatic save. You can switch from hard to easy, never back.</p>`],
          /* 5 */ ["Saving", `
            <p>You can keep up to three characters. Save with the button at the top of the game page.</p>
            <p>If you sign in with Google on the home page, your saves are shared between computer and phone.</p>`],
          /* 6 */ ["Attributes and class attribute", `
            <p>Each attribute starts at ${R.VALORE_MINIMO}; at creation you spread ${R.PUNTI_BASE} points. No attribute can go above ${R.VALORE_MASSIMO}, race bonus included.</p>
            <span class="formula">Modifier = (score − 10) ÷ 2, rounded down</span>
            <p class="esempio">Example: 12 → +1, 14 → +2, 17 → +3.</p>
            <div class="scroll"><table><tr><th>Attribute</th><th>What it is for</th><th>Class</th></tr>
              <tr><td><b>Vigour</b></td><td>physical health, Athletics and Survival</td><td>Warrior</td></tr>
              <tr><td><b>Agility</b></td><td>defence (Armor class), initiative, Stealth and Acrobatics</td><td>Shaman</td></tr>
              <tr><td><b>Mind</b></td><td>senses and logic: Investigation, Perception and Lore</td><td>Arcanist</td></tr>
              <tr><td><b>Spirit</b></td><td>mental health and willpower: Influence and Insight</td><td>Monk</td></tr>
            </table></div>
            <h3>Class attribute</h3>
            <p>Each class fights with one attribute, shown in the last column. It uses it for:</p>
            <ul>
              <li>the attack and damage rolls of <b>all</b> its attacks: weapon, techniques and spells;</li>
              <li>the difficulty of the saving throws it imposes on enemies;</li>
              <li>the size of its resource.</li>
            </ul>
            <ul>
              <li><b>Warrior, Vigour</b>: tempered by a thousand battles, a trained fighter.</li>
              <li><b>Shaman, Agility</b>: a hermit's life taught him that being quick and cunning is sometimes better than being strong.</li>
              <li><b>Arcanist, Mind</b>: he studies his foe and strikes the weak points the armour does not cover.</li>
              <li><b>Monk, Spirit</b>: his faith guides him and makes his blows mightier.</li>
            </ul>`],
          /* 7 */ ["Races, classes, health and resources", `
            <h3>Races</h3><div class="scroll"><table><tr><th>Race</th><th>Bonus</th></tr>${righeRazze}</table></div>
            <h3>Classes</h3><div class="scroll"><table><tr><th>Class</th><th>Hit die</th><th>Resource</th><th>Armour</th></tr>${righeClassi}</table></div>
            <p>“Battle” weapons are reserved for the Warrior. Each class has its own chapter in the “The classes” part.</p>
            <h3>Health and resources at level 1</h3>
            <span class="formula">Physical health = ${R.SALUTE_BASE} + maximum of the hit die + Vigour mod.</span>
            <span class="formula">Mental health = ${R.SALUTE_BASE} + maximum of the hit die + Spirit mod.</span>
            <span class="formula">Resource (fury, nature, mana, faith) = ${R.RISORSA_BASE} + class attribute mod.</span>
            <p>How they grow with levels is in the “Levels and experience” chapter.</p>`],
          /* 8 */ ["Levels and experience", `
            <p>You earn experience points by defeating enemies and completing quests. The maximum level is ${R.LIVELLO_MAX}.</p>
            <div class="scroll"><table><tr><th>Level</th><th>XP needed</th><th>Total XP</th></tr>${soglie}</table></div>
            <p><b>You reach a level with experience points, but it applies at your next useful rest</b>: until you rest, health, resources and difficulties stay those of the previous level. If you reach more levels in the meantime, you apply them all at the rest, one after the other.</p>
            <h3>What you gain at each level</h3>
            <ul>
              <li><b>${R.PUNTI_PER_LIVELLO} attribute points</b> to distribute freely, both on the same one if you like (maximum ${R.VALORE_MASSIMO}). They count from that level on: health and resources already gained do not change;</li>
              <li>physical health + half the hit die + 1 + Vigour mod. (Warrior 6, Shaman and Monk 5, Arcanist 4, plus the modifier);</li>
              <li>mental health + half the hit die + 1 + Spirit mod.;</li>
              <li>resource + class attribute mod. + the new level;</li>
              <li>your chosen skills grow by 1;</li>
              <li>new techniques or spells, the class trait at levels 2 and 4, the prestige path from level 3 (chapter “Rules common to all classes”).</li>
            </ul>
            <p>Each increase is at least 1. Check difficulties rise by ${R.CD_PER_LIVELLO}.</p>`],
          /* 9 */ ["The combat turn", `
            <h3>Who acts first</h3>
            <p>Whoever has more Agility acts first (on a tie, a d20 each).</p>
            <p><b>Sneaking up.</b> Some foes wait for you in specific places. If you sneak up on them (“I go down stealthily”), you roll d20 + Stealth against the foe's d20 + Perception, and they spot you only if they roll higher. If you stay hidden you act first and in the first turn their Armor class drops by 2; if they spot you they act first and in the first turn yours drops by 2. Someone used to hunting notices you more easily.</p>
            <h3>Your action</h3>
            <p>Each turn you have one action: attack, use a technique, cast a spell or use an item. Picking up the torch or strapping on the shield does not use your action. Attacking with your weapon is always free. Write the action (“I attack”, “I cast…”, “I drink the healing potion”) or use the buttons that appear.</p>
            <h3>Hitting and wounding</h3>
            <span class="formula">Attack (weapon, technique or spell): d20 + class attribute mod., hits if it beats the Armor class</span>
            <span class="formula">Damage: weapon or spell dice + class attribute mod. (torch 1d4, bare hands 1d2)</span>
            <p><b>Critical hit</b>: a 20 on the die always hits and rolls double the damage dice. It applies to enemies too. Some effects widen the critical range to 19-20 or 18-20, never further.</p>
            <h3>Armor class</h3>
            <span class="formula">AC = ${R.CA_BASE} + armour + Agility mod. (up to the armour's cap) + shield</span>
            <p>Agility bonus cap: ${tetti}.</p>
            <p>Two-handed weapons leave no hand free for torch or shield: you must put the weapon away first.</p>`],
          /* 10 */ ["Saving throws and difficulty", `
            <p>Many techniques and spells give the enemy a chance to resist with a saving throw.</p>
            <span class="formula">Enemy saving throw: d20 + attribute + enemy level ≥ DC → it resists</span>
            <span class="formula">Your DC = 8 + class attribute mod. + your level</span>
            <p>The attribute the enemy resists with depends on the effect:</p>
            <div class="scroll"><table><tr><th>Attribute</th><th>Resists</th></tr>
              <tr><td>Vigour</td><td>poisons, bleeding, physical blows</td></tr>
              <tr><td>Agility</td><td>effects that unbalance or immobilise</td></tr>
              <tr><td>Mind</td><td>Force and Arcane spells, feints</td></tr>
              <tr><td>Spirit</td><td>Life and Necromancy spells, fear</td></tr>
            </table></div>`],
          /* 11 */ ["Conditions", `
            <p>Conditions are effects that last a few turns. Those marked ● can affect you too.</p>
            <div class="scroll"><table class="stati"><tr><th>Condition</th><th>Effect</th><th>Greater version</th><th>Turns</th></tr>
              <tr><td>Weakened ●</td><td>−2 to hit</td><td>—</td><td class="n">2</td></tr>
              <tr><td>Frightened ●</td><td>−2 Armor class</td><td>—</td><td class="n">2</td></tr>
              <tr><td>Blinded ●</td><td>rolls 2d20 to hit and keeps the worse</td><td>—</td><td class="n">2</td></tr>
              <tr><td>Bleeding ●</td><td>1d4 damage each of its turns</td><td>Haemorrhage: 1d6</td><td class="n">3</td></tr>
              <tr><td>Poisoned ●</td><td>1d4 poison damage each of its turns</td><td>Toxin: 1d6</td><td class="n">3</td></tr>
              <tr><td>Burned ●</td><td>1d4 fire damage each of its turns</td><td>Empowered: 1d6</td><td class="n">3</td></tr>
              <tr><td>Withered</td><td>1d4 necrotic damage each of its turns</td><td>1d6 where stated</td><td>per the effect</td></tr>
              <tr><td>Off-balance ●</td><td>−2 Armor class</td><td>—</td><td>per the effect</td></tr>
              <tr><td>Dazed ●</td><td>−4 to hit, no critical hits</td><td>—</td><td>per the effect</td></tr>
              <tr><td>Stunned ●</td><td>skips its turn</td><td>—</td><td>1-2</td></tr>
              <tr><td>Inhibited ●</td><td>no special attacks, techniques or spells: only normal attacks</td><td>—</td><td>per the effect</td></tr>
              <tr><td>Exposed</td><td>your attacks crit on one number lower, never below 18</td><td>—</td><td>per the effect</td></tr>
            </table></div>
            <p class="esempio">On you, Off-balance, Dazed, Stunned and Inhibited only come from some hunt prey, for 2 turns.</p>
            <h3>Duration and stacking</h3>
            <ul>
              <li>A new condition of the same kind <b>renews the duration</b>, it does not stack. Different conditions stack: Bleeding, Poisoned and Withered all deal damage together. The exceptions (Cracks, Seals, Charges) are explained in the classes.</li>
              <li>Conditions you inflict on the enemy count <b>its turns</b>. Boosts to your own actions (Rune on the Weapon, Vow of Life, Eye of the Tome…) count <b>your turns</b> after casting: “for 3 turns” means your next 3 turns.</li>
              <li>All conditions end with the fight.</li>
              <li>Ash creatures do not bleed; fire creatures do not burn.</li>
            </ul>
            <h3>Elixirs</h3>
            <p>Common elixirs (made with animal parts and herbs) cure one condition. Rare elixirs (made with just a part of an ash creature) make you immune to that condition for the whole fight, drunk before or during it: an enemy that sees its condition fail does not try again. You carry at most 2 per condition.</p>`],
          /* 12 */ ["Foes", `
            <h3>Fearsome foes</h3>
            <p>The most fearsome foes (the guardians and a few others) are not affected by effects that take away actions or attacks: Dazed, Stunned, Inhibited. Instead, many techniques and spells have a <b>fallback</b>, shown in brackets in the text. On them other conditions last at most 2 turns (Withered 3), and charges and Seals go up to 2 at most.</p>
            <h3>Vulnerabilities and resistances</h3>
            <p>Many enemies are vulnerable to a damage type: slashing, bludgeoning, piercing, arcane, force, life, necromancy, poison or fire. Against them that damage gets <b>one extra die</b>, or an effect lasts one turn longer. Others resist a damage type and take half.</p>
            <p>Every guardian has a weak point for every class: a weapon type for the Warrior, a school for the Arcanist and one for the Monk, and sometimes the Shaman's undergrowth. Finding it out before the fight and preparing for it (weapon, prepared spells) makes a big difference. Exploring and talking with the people of the house can tell you more.</p>
            <h3>Enemy abilities</h3>
            <p>Enemies have ability points too: every ability that inflicts a condition costs points (2 for a condition, 3 for an empowered one or for two conditions, 4 for a control effect such as Stunned). Once the points run out, only normal attacks.</p>
            <h3>Fleeing</h3>
            <p>Write “I flee”: Athletics or Acrobatics check against DC 10 + the enemy's level. Succeed and you return to the room you came from; fail and the enemy hits you with advantage. You cannot flee from guardians.</p>`],
          /* 13 */ ["Hunts, ambushes and the clasp", `
            <h3>Common hunts</h3>
            <p>After the bronze clasp audience, the butler posts the common hunts in the hunting hall: two after each clasp, one at a time, from one to three golden stars.</p>
            <ul>
              <li><b>One and two stars</b>: the butler tells you what the prey is vulnerable to and what it resists (you find it again in Quests).</li>
              <li><b>Three stars</b>: the prey has just entered the bounds and nobody knows anything about it. Before attacking you can <b>observe</b> it (Perception: weapon and armour, main attribute, damage type), <b>recall</b> what it is (Lore: vulnerabilities, resistances, the condition it inflicts) and <b>sneak up</b> on it (Stealth against its Perception). Each action can be done only once.</li>
            </ul>
            <span class="formula">Observe and recall: d20 + skill against DC 12 (+ the growth with level): DC → one entry, DC + 5 → two, DC + 10 → three</span>
            <p>Sneaking up well gives you advantage on the next check, and with a natural 20 you discover the prey's whole sheet; in the fight you act first and the prey has −2 Armor class in the first turn. If it spots you it acts first and in the first turn your Armor class drops by 2. Failed observe and recall checks cost 1 point of mental health, like every check; sneaking up does not.</p>
            <h3>Ambushes</h3>
            <p>After the bronze clasp, outside the house you can be ambushed by those who came in through other entrances: goblins and orcs, alone or in a band (a group fights as a single creature), or one of five adventurers who grow with you.</p>
            <ul>
              <li>At a third of their health an adventurer surrenders: you can finish them or spare them.</li>
              <li>Finishing someone who begs for mercy or tries to run costs 1 point of mental health, and can kill you: it is the house changing you.</li>
              <li>Whoever you spare comes back once, after a rest, stronger, and that time fights to the end.</li>
              <li>Weapons found on them carry the bonus of the level at which you find them.</li>
            </ul>
            <h3>The clasp</h3>
            <p>The guardians' clasp takes an equipment slot. Outside combat you can hide it or pin it on (“I hide the clasp”, “I pin on the clasp”).</p>
            <ul>
              <li><b>Pinned on</b>: your rank shows under the portrait and the hounds smell the butler on you (+2 Stealth when they follow you), but outside the house you are valuable prey and ambushes are more frequent.</li>
              <li><b>Hidden</b>: the opposite.</li>
            </ul>`],
          /* 14 */ ["Combat examples", `
            <h3>Warrior with a short sword</h3>
            <p class="esempio">Level 1, Vigour 16 (+3), 13 fury points. Against an enemy with Armor class 12.</p>
            <div class="turno"><b>Turn 1.</b> You use Steel Bite (3 fury, 10 left). You roll 12: 12 + 3 = 15, more than 12, you hit. Damage 1d6 + 3: you roll 4, dealing 7. The enemy bleeds: 1d4 for 3 turns.</div>
            <div class="turno"><b>Enemy turn.</b> It bleeds and loses 2. It attacks and hits you: you lose 5 health, but gain 1 fury (11).</div>
            <div class="turno"><b>Turn 2.</b> To save fury you attack with your weapon, for free. You roll 20: critical! You hit for sure and roll 2d6 + 3: 10 damage. The critical also gives you 2 fury (13).</div>
            <p class="esempio">Fury rises when you get hit: the Warrior does not fear taking blows, he fears running dry.</p>
            <h3>Arcane Arcanist, with one Force slot</h3>
            <p class="esempio">Level 1, Mind 16 (+3), 13 mana. Against the same enemy.</p>
            <div class="turno"><b>Turn 1.</b> Arcane Bolt (2 mana, 11 left). You roll 11: 11 + 3 = 14, you hit. 1d8 + 3: 5 + 3 = 8, and you carve 1 Seal ◆◇◇.</div>
            <div class="turno"><b>Turn 2.</b> Reveal Cards (1 mana, 10 left). You see the enemy's sheet and carve the second Seal, no roll ◆◆◇.</div>
            <div class="turno"><b>Turn 3.</b> Force Fist (2 mana, 8 left). You roll 14: 17, you hit. 1d8 + 3 makes 6 + 3, and the Detonation spends the 2 Seals: +2d6, you roll 7. 16 damage in all, and you get 2 mana back, one per Seal (10).</div>
            <p class="esempio">The Arcanist prepares, then strikes: the more Seals carved, the harder it hits and the more mana comes back, but the enemy keeps attacking meanwhile.</p>
            <h3>Necromancer Monk, with one Life slot</h3>
            <p class="esempio">Level 2, Spirit 16 (+3), 18 faith points. The Balance starts at 0.</p>
            <div class="turno"><b>Turn 1.</b> Wither (3 faith, 15 left). The enemy fails its saving throw: it is Withered for 3 turns. Balance: Necromancy 1.</div>
            <div class="turno"><b>Turn 2.</b> Thirst of the Grave (4 faith, 11 left). You hit; the Balance moves to Necromancy 2 and the Choir kicks in: 3d6 instead of 2d6. You recover 1 faith (12).</div>
            <div class="turno"><b>Turn 3.</b> Withering Touch (2 faith, 10 left): Balance at Necromancy 3, you are at Nadir. Your next Necromancy spell would cost you 1 point of mental health.</div>
            <div class="turno"><b>Turn 4.</b> You heal with Soothing Touch (2 faith, 8 left). It is a Twilight: it heals 2d8 + 3 instead of 1d8 + 3, and starting from Nadir you recover double, 2 faith (10). The Balance returns to 0.</div>
            <p class="esempio">The Necromancer Monk pushes to the limit, then uses Life to find balance again before the mind gives way.</p>`],
          /* 15 */ ["Rules common to all classes", `
            <p>These rules apply to every class. Each class chapter only covers what makes it different.</p>
            <h3>Resource</h3>
            <p>Every class has a resource: <b>fury</b> (Warrior), <b>nature</b> (Shaman), <b>mana</b> (Arcanist), <b>faith</b> (Monk). Techniques and spells spend it; attacking with your weapon is always free, so when the resource runs out you can still fight. A technique or spell that misses costs the same.</p>
            <ul>
              <li>At level 1: ${R.RISORSA_BASE} + class attribute mod.; at each level + mod. + the new level.</li>
              <li>It recharges with rest (1d4 + level) and, during a fight, each in its own way. The base recovery table is ${recupero()}: fury, nature and faith use it; mana comes back through Seals.</li>
            </ul>
            <h3>Prepared techniques and spells</h3>
            <ul>
              <li><b>Slots</b>: ${posti()}. You choose them at creation and change them when you rest.</li>
              <li>Every level unlocks three new techniques or spells per branch or school, to choose from.</li>
              <li>Some can be used <b>only once between rests</b>, others once per fight: the text says so.</li>
              <li>Those that <b>use your action</b> to defend you cannot be used two turns in a row.</li>
            </ul>
            <h3>Class abilities</h3>
            <p>Every class has something that takes no slot: Unshakeable Mind for Warrior and Shaman, Light (or Arcane Glow) for spellcasters, which lights the dark instead of a torch.</p>
            <p><b>Unshakeable Mind</b> (Warrior and Shaman): after a failed check you can spend 1 fury or nature point for a saving throw: d20 + Vigour (Warrior) or Spirit (Shaman) mod. + level, DC ${R.CD_INCROLLABILE}. If you pass, you lose no mental health.</p>
            <h3>Class trait</h3>
            <p>A passive ability that grows in three grades, at levels <b>1, 2 and 4</b>. It is different for each class: stronger for the frail classes, lighter for the others.</p>
            <h3>Prestige path</h3>
            <p>From level 3 you choose one of your class's two paths: three abilities, one at levels 3, 4 and 5, always ready and taking no slots. The two paths are opposites (one more violent, one more patient). <b>The choice is final.</b></p>`],
          /* 16 */ ["Warrior", `
            <p>The trained fighter: strikes with the weapon and opens every fight with techniques that wear down, stun or break the enemy.</p>
            <p class="esempio">Vigour · fury points · hit die d10 · all armour and battle weapons</p>
            <h3>How he fights</h3>
            <p>The weapon type you hold decides your techniques, and each branch has its own way of beating the enemy:</p>
            <ul>
              <li><b>Slashing</b>, wears down: Bleeding and Haemorrhage, Weakened, Inhibited (on fearsome foes it becomes Weakened).</li>
              <li><b>Bludgeoning</b>, stuns: Stunned, Dazed, Off-balance (on fearsome foes it becomes Off-balance). Plus <b>Cracks</b>, −1 to the enemy's Armor class per charge up to 3, for the whole fight (the only effect that stacks), and <b>Fracture</b>, 1d4 damage to the enemy every time it attacks.</li>
              <li><b>Piercing</b>, seeks the weak spot: Exposed (crits on one number lower) and Off-balance; some techniques widen the critical range, never beyond 18-20. On fearsome foes the fallback is Exposed.</li>
              <li><b>Shield</b>, defends and controls: Stunned and Off-balance. When the shield absorbs a blow (half damage, or 0 damage and no fury) you gain a <b>Kinetic Charge</b>, up to 3, that some techniques spend to strike with no roll.</li>
            </ul>
            <h3>Resource and recovery</h3>
            <p>Fury rises when you get hit: for every blow you take you gain ${recupero()}, double on a critical. An attack that misses you or that you parry gives no fury. Your own critical hits also give you 2 fury. The Warrior does not fear taking blows: he fears running dry.</p>
            <h3>Preparation</h3>
            <ul>
              <li>You choose among the techniques of the weapon type you hold. With a shield strapped on you get <b>one extra slot</b>, of any level, among the shield techniques.</li>
              <li>A technique of another weapon type stays prepared but cannot be used. If you change weapon, the techniques of the new type arrive from the next level.</li>
            </ul>
            <h3>Class trait: Soldier's Temper</h3>
            <div class="scroll"><table><tr><th>Level</th><th>Effect</th></tr>
              <tr><td class="n">1</td><td>Unshakeable Mind</td></tr>
              <tr><td class="n">2</td><td>Unstoppable Fury (class technique, no slot)</td></tr>
              <tr><td class="n">4</td><td><b>Last to Fall</b>: once per rest, a blow that would drop you to 0 leaves you at 1 health and gives you 3 fury</td></tr>
            </table></div>
            <h3>Prestige paths</h3>
            <p>They change with the weapon type: every branch, shield included, has its own two paths. With weapon and shield, when you rest you choose which set to prepare.</p>
            <h3>Techniques</h3>
            ${tendina("Class abilities", tabella(utilitaGuerriero))}
            ${ramiGuerriero}`],
          /* 17 */ ["Shaman", `
            <p>The hermit of the woods: fights with weapon and nature, poisoning, trapping and wearing the enemy down turn after turn.</p>
            <p class="esempio">Agility · nature points · hit die d8 · light and medium armour</p>
            <h3>How he fights</h3>
            <ul>
              <li><b>Poison</b>: Poisoned deals 1d4 each enemy turn (Toxin 1d6). It renews, does not stack, but stacks with Bleeding and Withered. Some foes resist poison and take half.</li>
              <li><b>Coating</b>: an attack that coats the weapon for 3 turns; every hit, normal attacks included, carries its effect. One at a time.</li>
              <li><b>Trap</b>: an attack and, in the same turn, a trap that springs on the enemy's next attack, before its roll. One at a time.</li>
              <li><b>Bark Shield</b>: temporary health that absorbs damage before physical health, at most 5 + level, for the whole fight.</li>
              <li><b>Poison pouch</b>: 3 doses of 1d4 + level nature points. Empty, it refills with the right ingredients, found in the forest.</li>
            </ul>
            <p>The enemy's saving throw against Shaman techniques is always on the body: d20 + its Vigour + its level.</p>
            <h3>Resource and recovery</h3>
            <p>Nature returns when nature strikes, not the weapon. These give you ${recupero()}, at most once per enemy turn, double if the enemy has Toxin:</p>
            <ul>
              <li>poison, Toxin, acid and bulb damage;</li>
              <li>a failed saving throw against one of your techniques;</li>
              <li>a trap springing;</li>
              <li>the Bark Shield, when you create it or when it absorbs.</li>
            </ul>
            <h3>Preparation</h3>
            <p>Nature techniques work with any weapon.</p>
            <h3>Class trait: Bond of the Undergrowth</h3>
            <div class="scroll"><table><tr><th>Level</th><th>Effect</th></tr>
              <tr><td class="n">1</td><td>Unshakeable Mind</td></tr>
              <tr><td class="n">2</td><td><b>Blood of the Undergrowth</b>: +2 to saving throws against Poisoned, the poison pouch holds 4 doses</td></tr>
              <tr><td class="n">4</td><td><b>Returning Sap</b>: at the start of each of your turns, if the enemy is Poisoned, you heal 1</td></tr>
            </table></div>
            <h3>Prestige paths</h3>
            <p>Each of the two paths has a passive, always active, and three abilities.</p>
            <h3>Techniques</h3>
            ${tecnicheSciamano}`],
          /* 18 */ ["Arcanist", `
            <p>The scholar: reads the foe and takes it apart with two schools that work as a pair. <b>Arcane</b> carves Seals on the enemy, <b>Force</b> makes them burst.</p>
            <p class="esempio">Mind · mana · hit die d6 · light armour</p>
            <h3>How he fights: Seals and Detonation</h3>
            <ol>
              <li><b>Carve</b>: Arcane spells leave Seals on the enemy (◆). They last the whole fight, at most ${MG ? MG.SIGILLI_MAX : 3} (${MG ? MG.SIGILLI_MAX_BOSS : 2} on fearsome foes), one more from level 4. The critical of a Force spell also carves 1 Seal.</li>
              <li><b>Burst</b>: Force spells marked <i>Detonation</i> spend all the Seals, +1d6 damage per Seal.</li>
              <li><b>Recover</b>: every Detonation gives you back <b>1 mana per Seal</b> (Singularity 2). With no Seals there is nothing to burst: no extra damage and no mana.</li>
            </ol>
            <p>Under every spell the game tells you what it does for the combo (“Carves Seals”, “Detonates”) and, during the fight, when it is ready (“Combo ready: Seals at the maximum”).</p>
            <p class="esempio">Tip: if you choose Arcane as your main school, use the Force slot for a spell that detonates. Preparing a single school still works, but yields less.</p>
            <h3>Resource and recovery</h3>
            <p>Mana comes back only by bursting Seals (and with the Arcane Well, below). It is the heart of the class: carving and then detonating costs far less.</p>
            <h3>Preparation: main school</h3>
            <p>At creation you choose your main school, as the Warrior chooses his weapon: your slots go to the unlocked spells of that school, plus ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} slot from the other, of any level. If you change main school, it applies from the next level.</p>
            <h3>Class trait: Arcane Well</h3>
            <div class="scroll"><table><tr><th>Level</th><th>Effect</th></tr>
              <tr><td class="n">1</td><td>if you cast no spell on your turn, you recover 1 mana the turn after</td></tr>
              <tr><td class="n">2</td><td>Rune Mirror and Kinetic Barrier cost 1 less</td></tr>
              <tr><td class="n">4</td><td>the first spell of every fight costs no mana</td></tr>
            </table></div>
            <h3>Prestige paths</h3>
            <p>Fracture pushes Force and explosions, Suture pushes Arcane and control.</p>
            <h3>Spells</h3>
            ${tendineScuole("Sapiente")}`],
          /* 19 */ ["Monk", `
            <p>The man of faith: prays to two opposing forces. <b>Life</b> protects and heals, <b>Necromancy</b> calls on the dead and hurts more, but asks a price of the mind.</p>
            <p class="esempio">Spirit · faith points · hit die d8 · light and medium armour</p>
            <h3>How he fights: the Balance</h3>
            <p>The Balance runs from Necromancy ${MG ? MG.BILANCIA_MAX : 3} to Life ${MG ? MG.BILANCIA_MAX : 3} and starts at 0 every fight. Each Life spell moves it 1 towards Life, each Necromancy spell 1 towards Necromancy.</p>
            <div class="scroll"><table><tr><th>Position</th><th>Effect</th></tr>
              <tr><td>Life 2-3 · Halo</td><td>your healing +2, +1 to your saving throws</td></tr>
              <tr><td>Life 3 · Zenith</td><td>your next Necromancy spell is a Twilight</td></tr>
              <tr><td>Necromancy 2-3 · Choir</td><td>Necromancy spells have +1 damage die: the spirits follow you</td></tr>
              <tr><td>Necromancy 3 · Nadir</td><td>every Necromancy spell also costs 1 point of mental health (never lethal); your next Life spell is a Twilight</td></tr>
              <tr><td>Twilight</td><td>the spell has +1 die (damage or healing) and gives you back faith points; then the Balance returns to 0</td></tr>
            </table></div>
            <p>The Monk's game is pushing the Balance to one end and then coming back with a Twilight: alternating schools costs less. Under every spell the game tells you where it moves the Balance and when the combo is ready.</p>
            <ul>
              <li><b>Regeneration</b> (from some Life spells): heals 1d4 at the start of your next 3 turns. It does not stack, it renews.</li>
              <li><b>Servant Spirit</b> (Necromancy): for 3 turns a summoned spirit strikes on its own at the start of your turn.</li>
            </ul>
            <h3>Resource and recovery</h3>
            <p>Faith returns with the Twilight: ${recupero()}, double if you start from Nadir. Some Necromancy spells give back more.</p>
            <h3>Preparation: main school</h3>
            <p>As for the Arcanist: slots go to the main school, plus ${MG ? MG.POSTI_ALTRA_SCUOLA : 1} slot from the other. Keeping at least one spell of the other school lets you close the Twilight.</p>
            <h3>Class trait: Breath of Balance</h3>
            <div class="scroll"><table><tr><th>Level</th><th>Effect</th></tr>
              <tr><td class="n">1</td><td>with the Balance on Life the blows you take deal 1 less damage (minimum 1); on Necromancy your weapon attacks deal 1 extra damage</td></tr>
              <tr><td class="n">2</td><td>when the Balance reaches Zenith or Nadir you heal 1d4 + level</td></tr>
              <tr><td class="n">4</td><td>once per fight, the first time you drop below half health: with Ember the Balance returns to 0 and you heal 1d6 + Spirit mod.; with Ash your next Necromancy spell heals you for all the damage it deals</td></tr>
            </table></div>
            <h3>Prestige paths</h3>
            <p>Ash pushes Necromancy and grudge, Ember pushes Life and healing.</p>
            <h3>Spells</h3>
            ${tendineScuole("Accolito")}`]
        ]
      }
    }[L];

    document.title = T.titolo;
    document.getElementById("torna").textContent = T.torna;
    document.getElementById("titolo").textContent = T.titolo;
    document.getElementById("sotto").textContent = T.sotto;
    /* dentro ogni capitolo, ogni titoletto (h3) di primo livello diventa una tendina; il testo prima del primo resta in vista */
    const dividi = (html) => {
      const tp = document.createElement("template"); tp.innerHTML = html;
      let out = "", voce = null, buf = "";
      const chiudi = () => { out += voce === null ? buf : `<details class="sub">${sommario(voce)}<div class="corpo">${buf}</div></details>`; buf = ""; };
      for (const n of tp.content.childNodes) {
        if (n.nodeName === "H3") { chiudi(); voce = n.textContent; }
        else if (n.nodeType === 1) buf += n.outerHTML;
      }
      chiudi(); return out;
    };
    let numCap = 0;
    Sicuro.html(document.getElementById("sezioni"), T.parti.map(([titolo, idx], p) =>
      `<details class="parte" open><summary><span class="tt">${T.parte} ${p + 1} · ${titolo}</span></summary><div class="corpo">${idx.map(i => {
        const [t, c] = T.sezioni[i]; numCap++;
        return `<details class="cap"><summary><span class="tt">${T.capitolo} ${numCap}: ${t}</span><span class="punti"></span></summary><div class="corpo">${dividi(c)}</div></details>`;
      }).join("")}</div></details>`).join(""));
    const tutte = (aperte) => document.querySelectorAll("#sezioni details").forEach(d => { d.open = aperte || d.classList.contains("parte"); });
    document.getElementById("apriTutto").textContent = T.apri;
    document.getElementById("chiudiTutto").textContent = T.chiudi;
    document.getElementById("apriTutto").onclick = () => tutte(true);
    document.getElementById("chiudiTutto").onclick = () => tutte(false);
  </script>
</body>
</html>
